# 把公开指引页发布到 GitHub Pages。
#
# 站点根 = site/（该目录里的 index.html 是落地页，images/ 是配图）。
# 只用 Actions 上传这一个目录，因此 Memoria 自己的 docs/ 与词汇库都不会随之上站。
#
# 一次性设置：仓库 Settings → Pages → Source 选「GitHub Actions」。
# 站点地址：https://<owner>.github.io/Memoria/
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
