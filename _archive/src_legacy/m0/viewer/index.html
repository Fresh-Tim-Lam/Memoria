<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria M0</title>
  <link rel="stylesheet" href="../../viewer/css/memoria.css">
  <link rel="stylesheet" href="css/m0.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="toolbar-left">
        <span class="logo">Memoria</span>
        <span class="m0-badge">M0</span>
      </div>
      <div class="toolbar-center">
        <button id="btn-open" title="打开知识库">打开</button>
        <button id="btn-refresh" title="刷新">刷新</button>
      </div>
      <div class="toolbar-right">
        <span id="kb-indicator" class="kb-indicator hidden"></span>
      </div>
    </div>

    <div id="main">
      <aside id="m0-sidebar">
        <div id="sidebar-resizer"></div>
        <div class="sidebar-toolbar">
          <span>资源管理器</span>
        </div>
        <div id="file-tree" class="m0-panel"></div>
        <div class="sidebar-toolbar m0-kp-toolbar">
          <span>知识点</span>
          <span id="kp-count" class="m0-muted"></span>
        </div>
        <div id="kp-list" class="m0-panel m0-kp-panel"></div>
      </aside>

      <div id="content">
        <div id="tab-bar">
          <div id="tabs"></div>
        </div>
        <div id="viewer">
          <div id="welcome">
            <h1>Memoria M0</h1>
            <p>snippet range · 跳转高亮 · IDE 视图</p>
            <button id="btn-welcome-open">打开知识库</button>
          </div>
          <div id="editor-wrap" class="hidden">
            <div id="editor-header">
              <span id="file-title"></span>
              <span id="file-meta" class="m0-muted"></span>
            </div>
            <div id="proposal-banner" class="hidden"></div>
            <div id="editor" class="m0-editor"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-info">就绪</span>
      <span id="status-stats"></span>
    </div>
  </div>

  <div id="assist-modal" class="m0-modal hidden">
    <div class="m0-modal-backdrop"></div>
    <div class="m0-modal-box">
      <div class="m0-modal-header">
        <span id="assist-title">定位辅助</span>
        <button id="assist-close" class="m0-icon-btn" title="关闭">×</button>
      </div>
      <div id="assist-body" class="m0-modal-body"></div>
      <div class="m0-modal-footer">
        <button id="assist-cancel">取消</button>
        <button id="assist-confirm" class="primary">配置并写入</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
