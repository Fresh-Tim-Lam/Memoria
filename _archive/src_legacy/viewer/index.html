<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria</title>
  <link rel="stylesheet" href="css/memoria.css">
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <div id="toolbar">
      <div class="toolbar-left">
        <span class="logo">Memoria</span>
      </div>
      <div class="toolbar-center">
        <button id="btn-nav-back" title="后退 (Alt+Left)" class="nav-btn">←</button>
        <button id="btn-nav-forward" title="前进 (Alt+Right)" class="nav-btn">→</button>
        <button id="btn-open" title="打开知识库">打开</button>
        <button id="btn-build" title="构建索引">构建</button>
      </div>
      <div class="toolbar-right">
        <div class="search-wrapper">
          <input id="search-box" type="text" placeholder="搜索知识点..." />
          <button id="btn-search" title="搜索">搜索</button>
        </div>
        <span id="kb-indicator" class="kb-indicator hidden"></span>
      </div>
    </div>

    <!-- 主体 -->
    <div id="main">
      <!-- 侧边栏：图谱 -->
      <div id="sidebar">
        <div id="sidebar-resizer"></div>
        <div class="sidebar-toolbar">
          <span>图谱</span>
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="2d">2D</button>
            <button class="mode-btn" data-mode="3d">3D</button>
          </div>
        </div>
        <div id="group-tabs"></div>
        <div id="graph-container">
          <div id="graph-2d"></div>
          <div id="graph-3d" class="hidden"></div>
          <div id="graph-controls">
            <button id="btn-zoom-in" title="放大">+</button>
            <button id="btn-zoom-out" title="缩小">−</button>
            <button id="btn-zoom-reset" title="重置">⟲</button>
          </div>
        </div>
      </div>

      <!-- 内容区 -->
      <div id="content">
        <!-- 标签栏 -->
        <div id="tab-bar">
          <div id="tabs"></div>
        </div>

        <!-- 渲染区 -->
        <div id="viewer">
          <!-- 欢迎页 -->
          <div id="welcome">
            <h1>Memoria</h1>
            <p>以知识点为最小单元的知识管理系统</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div id="status-bar">
      <span id="status-info">就绪</span>
      <span id="status-stats"></span>
    </div>
  </div>

  <!-- 库 -->
  <script src="lib/d3.min.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>

  <!-- 应用 -->
  <script src="js/app.js"></script>
  <script src="js/graph-2d.js"></script>
  <script src="js/graph-3d.js"></script>
</body>
</html>
