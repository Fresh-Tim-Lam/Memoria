      snippet: 1928年他把相对论引进了量子力学，建立了相对论形式的薛定谔方程，即是著名的狄拉克方程。狄拉克由此做出了存在正电子的预言，1933年获诺贝尔奖。他主要著作有《量子力学原理》。此外，他和费米各自独立发现了费米-狄拉克统计法，发表过大量有关宇宙学方面的论文，提出可能存在磁单极的预言。
