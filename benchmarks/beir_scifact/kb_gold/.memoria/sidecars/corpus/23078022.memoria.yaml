- id: '23078022'
  name: MUC1 oncoprotein activates the IκB kinase β complex and constitutive NF-κB
    signalling
  tags:
  - science
  - scifact
  description: Nuclear factor-κB (NF-κB) is constitutively activated in diverse human
    malignancies by mechanisms that are not understood. The MUC1 oncoprotein is aberrantly
    overexpressed by most human carcinomas and, similarly to NF-κB, blocks apoptosis…
  range:
    start:
      line_hint: 1
      snippet: '# MUC1 oncoprotein activates the IκB kinase β complex and constitutive
        NF-κB signalling'
    end:
      line_hint: 3
      snippet: and that overexpression of MUC1, as found in human cancers, confers
        sustained induction of the IKKβ–NF-κB p65 pathway.
