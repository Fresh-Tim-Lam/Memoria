  name: Cyclin A1 is required for meiosis in the male mouse
  tags:
  - science
  - scifact
  description: The mammalian A-type cyclin family consists of two members, cyclin
    A1 (encoded by Ccna1) and cyclin A2 (encoded by Ccna2). Cyclin A2 promotes both
    G1/S and G2/M transitions, and targeted deletion of Ccna2 in mouse is embryonic
    lethal.…
  range:
    start:
      line_hint: 1
      snippet: '# Cyclin A1 is required for meiosis in the male mouse'
    end:
      line_hint: 3
      snippet: meiotic division in male mice, a function that cannot be complemented
        by the concurrently expressed B-type cyclins.
