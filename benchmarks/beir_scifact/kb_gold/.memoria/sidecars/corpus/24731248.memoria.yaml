  name: Tet proteins can convert 5-methylcytosine to 5-formylcytosine and 5-carboxylcytosine.
  tags:
  - science
  - scifact
  description: 5-methylcytosine (5mC) in DNA plays an important role in gene expression,
    genomic imprinting, and suppression of transposable elements. 5mC can be converted
    to 5-hydroxymethylcytosine (5hmC) by the Tet (ten eleven translocation) proteins.…
  range:
    start:
      line_hint: 1
      snippet: '# Tet proteins can convert 5-methylcytosine to 5-formylcytosine and
        5-carboxylcytosine.'
    end:
      line_hint: 3
      snippet: raises the possibility that DNA demethylation may occur through Tet-catalyzed
        oxidation followed by decarboxylation.
