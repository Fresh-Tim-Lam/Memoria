  description: In S. cerevisiae, histone variant H2A.Z is deposited in euchromatin
    at the flanks of silent heterochromatin to prevent its ectopic spread. We show
    that H2A.Z nucleosomes are found at promoter regions of nearly all genes in euchromatin.…
