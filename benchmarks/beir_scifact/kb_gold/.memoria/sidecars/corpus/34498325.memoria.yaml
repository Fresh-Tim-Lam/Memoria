  description: Transfer RNAs specific for Gln, Lys, and Glu from all organisms (except
    Mycoplasma) and organelles have a 2-thiouridine derivative (xm(5)s(2)U) as wobble
    nucleoside. These tRNAs read the A- and G-ending codons in the split codon boxes…
