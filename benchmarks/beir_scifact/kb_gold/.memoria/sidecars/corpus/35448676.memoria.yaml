  description: 3'-Ends of almost all eukaryotic mRNAs are generated by endonucleolytic
    cleavage and addition of a poly(A) tail. In mammalian cells, the reaction depends
    on the sequence AAUAAA upstream of the cleavage site, a degenerate GU-rich sequence…
