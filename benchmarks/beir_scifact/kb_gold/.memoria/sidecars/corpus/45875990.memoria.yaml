  description: Cyclin A2 activates the cyclin-dependent kinases Cdk1 and Cdk2 and
    is expressed at elevated levels from S phase until early mitosis. We found that
    mutant mice that cannot elevate cyclin A2 are chromosomally unstable and tumor-prone.…
