  name: Prolonged effect of calcium supplementation on risk of colorectal adenomas
    in a randomized trial.
  tags:
  - science
  - scifact
  description: BACKGROUND Calcium supplementation has been shown to decrease the risk
    of recurrence of colorectal adenomas in randomized trials. However, the duration
    of this protective effect after cessation of active supplementation is not known.…
  range:
