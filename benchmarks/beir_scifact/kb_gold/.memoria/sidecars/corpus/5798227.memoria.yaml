  name: SOCS1/JAB is a negative regulator of LPS-induced macrophage activation.
  tags:
  - science
  - scifact
  description: Bacterial lipopolysaccharide (LPS) triggers innate immune responses
    through Toll-like receptor (TLR) 4. We show here that the suppressor of cytokine-signaling-1
    (SOCS1/JAB) is rapidly induced by LPS and negatively regulates LPS signaling.…
  range:
    start:
      line_hint: 1
      snippet: '# SOCS1/JAB is a negative regulator of LPS-induced macrophage activation.'
    end:
      line_hint: 3
      snippet: LPS-induced NF-kappaB activation. Thus, SOCS1 directly suppresses TLR4
        signaling and modulates innate immunity.
