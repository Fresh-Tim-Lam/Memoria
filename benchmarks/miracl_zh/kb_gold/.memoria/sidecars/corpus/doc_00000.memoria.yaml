- id: 70#42
  name: 天文學
  tags:
  - 天文學
  description: 從內向外，太陽系可分為內行星、小行星帶和外行星。內行星包括水星、金星、地球和火星，均為類地行星；外行星包括木星、土星、天王星和海王星，均為氣態巨行星。在八大行星以外，還有柯伊伯帶和可能延續1光年的奧爾特雲。
