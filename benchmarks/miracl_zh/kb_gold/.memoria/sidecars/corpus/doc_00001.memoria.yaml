- id: 74#27
  name: 化學
  tags:
  - 化學
  description: 化學鍵是指組成分子或材料的粒子之間互相作用的力量，其中粒子可以是原子、離子或是分子。化學鍵的物理本質來自於粒子和粒子之間的静電力，量子力學上意指原子間電子的波函數線性疊加。化學鍵是化學最重要的概念之一，物理理論本質由萊納斯·鮑林建立。化學家為能簡潔表述化學鍵並規避量子力學的複雜性，將化學鍵分類為共價鍵、離子鍵和金屬鍵，較弱的鍵結如氫鍵及较特殊的配位相互作用等。無論分類為何，其物理本質都是相同的。
  range:
    start:
