  name: 理查德·斯托曼
  tags:
  - 理查德·斯托曼
  description: 为了创建一个完全由自由软件组成的类Unix计算机操作系统，斯托曼在1983年9月推出了GNU项目。借此又发起了自由软件运动。他迄今为止一直是GNU项目的组织者，作为主要开发者的他开发了一些被广泛使用的GNU软件，其中包括GCC、GDB、GNU
    Emacs。在1985年10月他创立了自由软件基金会。
