- id: 182#68
  name: 中国历史
  tags:
  - 中国历史
  description: 220年曹操病逝，其子曹丕篡位，迫汉献帝禅让后自立為帝，史称曹魏（220年-266年），至此东汉灭亡，中国历史正式进入三国时期。次年以益州为主的刘备亦以汉室宗亲的身份称帝，国号续为汉，史称蜀汉（221年-263年）。刘备与孙权在赤壁之战后拓展势力，为了荆州问题双方多次发生纠纷与战争，最后刘备在222年的夷陵之战失败，孙权获得荆州绝大部分。刘备于223年病死，辅佐其子刘禅的诸葛亮于同年再与孙权恢复同盟。据有扬州、荆州及交州等地的孙权至229年才称帝，国号吴（229年-280年）
  range:
    start:
      line_hint: 1
      snippet: 中国历史
    end:
      line_hint: 3
      snippet: 高平陵事件後完全被司马氏一手掌控。263年司马昭为建立军功准备篡位，发动魏灭蜀之战，蜀汉亡。265年司马昭病死，其子司马炎废魏元帝自立，国号晋，史称西晋，曹魏亡。西晋于280年发动晋灭吴之战，灭亡孙吴，统一中国。至此三国时期结束，进入晋朝。
