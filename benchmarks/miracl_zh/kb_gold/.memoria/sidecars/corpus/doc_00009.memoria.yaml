  name: 上海市
  tags:
  - 上海市
  description: 目前上海拥有10所[[211工程]]重点高校，其中[[复旦大学]]、[[上海交通大学]]、[[同济大学]]、[[华东师范大学]]为[[985工程]]院校。2012年10月，中国第一所中美合作的国际化大学[[上海纽约大学]]在[[浦东]][[陆家嘴金融贸易区|陆家嘴]]成立。2013年9月，上海市与[[中国科学院]]共同建立了小规模、国际化的研究型大学[[上海科技大学]]。
