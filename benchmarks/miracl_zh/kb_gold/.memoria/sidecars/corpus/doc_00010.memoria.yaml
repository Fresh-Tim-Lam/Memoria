- id: 235#134
  name: 上海市
  tags:
  - 上海市
  description: 如今的上海已成为众多话剧、舞台剧的背景城市。例如中文话剧大师[[赖声川]]创作执导的《[[暗恋桃花源]]》，李逸导演的《[[上海滩 (1980年电视剧)|上海滩]]》，上海话剧艺术中心演出出品的大型话剧《大哥》，带有怪诞色彩的[[黑色喜剧]]《秀才与刽子手》等等。众多充满海派风情的话剧作品纷纷在包括[[上海大剧院]]、[[东方艺术中心]]、[[上海人民大舞台]]、[[艺海剧院]]、[[上海话剧艺术中心]]、[[兰心大戏院]]等在内的上海各大表演中心上演，其中亦有不少精彩的精品
  range:
    start:
      line_hint: 1
      snippet: 上海市
    end:
      line_hint: 3
      snippet: 的话剧作品纷纷在包括[[上海大剧院]]、[[东方艺术中心]]、[[上海人民大舞台]]、[[艺海剧院]]、[[上海话剧艺术中心]]、[[兰心大戏院]]等在内的上海各大表演中心上演，其中亦有不少精彩的精品走出国门，在各国巡回演出，获得好评无数。
