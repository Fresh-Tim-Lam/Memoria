      snippet: 8,000人，佔總人口1.3%）。美國中央情報局的《世界概況》則指出超過93%人口為結合中國民間宗教、大乘佛教、儒教、祖先崇拜和道教的多神論信仰者，有4.5%的人口是信奉新教和天主教的基督徒信眾，另外低於2.5%的民眾則信奉伊斯蘭教等宗教。
