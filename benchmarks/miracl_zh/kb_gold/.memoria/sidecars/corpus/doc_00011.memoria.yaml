  description: 受到臺灣移民社會的影響，使得漢族移民固有的佛教、道教傳統信仰盛行且長期發展，而西方國家常見的基督新教、天主教與伊斯蘭教等宗教也擁有不少信眾。根據2005年的人口普查，有18,718,600人（佔人口81.3%）信仰宗教，另外14%至18%人口並無宗教信仰。而政府調查所分類的26個宗教中，排行前五名者分別是佛教（8,086,000人，佔人口35.1%）、道教（7,600,000人，佔總人口33%）、一貫道（810,000人，佔總人口3.5%）、基督新教（605,000人，佔總人
