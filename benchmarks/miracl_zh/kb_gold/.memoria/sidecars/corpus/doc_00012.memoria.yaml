- id: 275#47
  name: 宗教
  tags:
  - 宗教
  description: 在宗教的發展過程中，不可避免的會與文化、藝術產生交集。历史上有许多著名科学家都有宗教信仰，如欧拉和柯西。费曼认为（在20世纪50年代）有超过半数的科学家无宗教信仰，而且科学不能论证上帝不存在。由于宗教很多的说法无法或未被证实但又被说成如同存在的「真理」，只是套套逻辑，内容并非实在而精密。
    其中基督教、伊斯蘭教和佛教常被称为世界三大宗教。印度教信教人口虽高于佛教，但它涵盖的范围一般仅在特定国家或民族之内，所以一般不列入世界三大宗教之中。清末救亡圖存的動亂中，康有為等人，試圖仿效
  range:
    start:
      line_hint: 1
      snippet: 宗教
    end:
      line_hint: 3
      snippet: 族之内，所以一般不列入世界三大宗教之中。清末救亡圖存的動亂中，康有為等人，試圖仿效西方基督教國家的國教習慣，將儒家改造成宗教，立為國教。此舉引發了孔教爭論。1917年中，「將孔教立為國教」的方案受到挫敗。另一方面，陳獨秀等反孔力量逐步做大。
