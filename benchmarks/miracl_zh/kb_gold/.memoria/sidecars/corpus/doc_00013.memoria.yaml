- id: 305#0
  name: 第二次世界大战
  tags:
  - 第二次世界大战
  description: 第二次世界大戰，簡稱二戰，是1939年（乃至1931年）至1945年爆發的全球軍事衝突。第二次世界大战涉及全球絕大多數的國家。包括所有的大國，并最終分成兩個彼此對立的軍事同盟——同盟國和軸心國。這次戰爭是人類史上規模最大的戰爭，動員1億多名軍人參與這次軍事衝突。主要的參戰國紛紛宣布進入總體戰狀態，幾乎將自身國家的全部經濟、工業、科學技術用於戰爭之上，同時將民用和軍用的資源合併以便規劃。包括有猶太人大屠殺、南京大屠殺、肅清大屠殺、卡廷大屠殺、馬尼拉大屠殺、戰爭中日軍對中國軍民進
  range:
    start:
      line_hint: 1
      snippet: 第二次世界大战
    end:
      line_hint: 3
      snippet: 多大規模民眾死亡的軍事衝突，总死亡人数达7000萬，是人類歷史上死傷人數最多的戰爭。第二次世界大战改变了世界局势，英国、法国等欧洲殖民帝国衰落，美国、苏联則取代欧洲殖民帝国的地位成了新的超级大国并在战后形成兩強格局，直到1991年蘇聯解體。
