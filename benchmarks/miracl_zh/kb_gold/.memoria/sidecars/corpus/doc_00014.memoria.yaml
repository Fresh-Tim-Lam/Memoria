- id: 305#4
  name: 第二次世界大战
  tags:
  - 第二次世界大战
  description: 一般認為戰爭是於1939年9月1日爆發，這樣的論點是以德國入侵波蘭做為起點，3天之後英國和法國便先後對德國宣戰。不過對於戰爭開始的日期仍然存有許多不同的意見，其中一些人便認為實際上戰爭早在1937年7月7日盧溝橋事變（又稱七七事變）發生，中國抗日戰爭爆發之後便已經開始。英國歷史學家安東尼·畢佛等人則認為第二次世界大戰的起源，應該從1931年9月18日日軍發動九一八事變開始計算。
