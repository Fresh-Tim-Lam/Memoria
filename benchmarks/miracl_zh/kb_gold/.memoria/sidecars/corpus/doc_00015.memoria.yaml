  name: 中国共产党
  tags:
  - 中国共产党
  description: 根據《中国共产党章程》，中國共產黨全國代表大會是中國共產黨的最高权力機構。在1969年中國共產黨第九次全國代表大會之前全國代表大會經常不定期召開，之後实行每5年舉行一次全國代表大會的制度，而每次大會將會持續數天。根據《中國共產黨章程》，除特別情況外，全國代表大會日程不得延期。《中國共產黨章程》賦予全國代表大會6項职权：在實際召開全國代表大會時，絕大部分時間與會代表很少討論重大問題；而比較具影響力的討論則是在全國代表大會召開前的準備期，将酝酿下届中央委员会委员、候补委员人选，并
  range:
    start:
      line_hint: 1
      snippet: 中国共产党
    end:
      line_hint: 3
      snippet: ，由中国共产党中央委员会领导党的全部工作，对外代表中国共产党。由中国共产党中央紀律檢查委員會負責监督、执纪、问责，维护党的章程和其他党内法规，对党员履行职责进行监督；而在全國代表大會閉會期間，中央紀律檢查委員會在中央委员会的领导下进行工作。
