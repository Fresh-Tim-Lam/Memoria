  description: 海南岛，是海南省陆地的主体，西起108°37′E的鱼鳞角，东至111°03′E的铜鼓角，北自20°10′的海南角（木兰头），南到18°10′的锦母角，总面积3.32万平方公里，占全省陆地面积的99.7％。
