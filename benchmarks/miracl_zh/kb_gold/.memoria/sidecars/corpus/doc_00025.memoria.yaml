  name: 四川省
  tags:
  - 四川省
  description: 四川是人口大省，也是教育大省，並有8所大學入選全國雙一流建設項目，成都则是中国著名的高等教育教育基地之一。拥有诸如四川大学、电子科技大学、西南交通大学、西南财经大学、成都理工大学、四川农业大学、西南石油大學、成都中醫藥大學、中國民航飛行學院等中国重点大学。截至2009年末，全省各级各类学校的总数为3.4万所，学生和教职工的人数分别为1803万和91万，教工人数中有75万为专任教师。四川的偏远地区基础教育普及率欠佳，2009年末全省新增两个县实现了基本普及九年义务教，义务教育人
  range:
    start:
      line_hint: 1
      snippet: 四川省
    end:
      line_hint: 3
      snippet: 等教育中心，其他地级市都有培养中小学教师的师范学校或学院。四川拥有92所普通高校，22所成人高校，培养研究生的机构37个，2009年还有55.5万人以自学考试的形式接受高等教育。据四川省教育厅的资料显示，全省范围高等教育的毛入学率为22%。
