- id: 449#31
  name: 云南省
  tags:
  - 云南省
  description: 云南的地形大体上可以以元江河谷为界，分为东西两大部分：云南省的东半部称为云南高原，是云贵高原的一部分，平均海拔2000米左右，总体上地形呈波涛状起伏，高原上广泛呈现的是低山、丘陵景观，在小范围内可以表现为起伏较为和缓的高原面，这类地形相对平缓的地区约占全省总面积的10%左右。云南省的西半部是著名的横断山脉或称滇西纵谷区，特征是高山、峡谷相间。
  range:
    start:
      line_hint: 1
      snippet: 云南省
    end:
      line_hint: 3
      snippet: 均海拔2000米左右，总体上地形呈波涛状起伏，高原上广泛呈现的是低山、丘陵景观，在小范围内可以表现为起伏较为和缓的高原面，这类地形相对平缓的地区约占全省总面积的10%左右。云南省的西半部是著名的横断山脉或称滇西纵谷区，特征是高山、峡谷相间。
