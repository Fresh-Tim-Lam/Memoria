- id: 451#104
  name: 浙江省
  tags:
  - 浙江省
  description: 赵孟頫是元代初期最有影响的书法家。黄公望、王蒙、吴镇是元季山水画四大家，黄公望更是四家之首。明代山阴徐渭写意花鸟画开启了明清以来水墨写意法的新途径，对后世的影响数百年来势头未衰。蓝瑛是对明清画风影响很大的武林派代表人物。陈洪绶是中国最早有名望的插图画家，对后来中国的版画艺术有很大的影响。
  range:
    start:
