  name: 新疆维吾尔自治区
  tags:
  - 新疆维吾尔自治区
  description: 新疆维吾尔自治区（），通称新疆，简称新，是中華人民共和國的一个自治区，也是中國面积第一大的省级行政区。自治區由新疆省改置，成立于1955年，首府位於乌鲁木齐。新疆总面积为1,664,897平方公里，约占中国陆地面积六分之一；陆地边境线达5690.142公里，占中国边界总长度四分之一。
