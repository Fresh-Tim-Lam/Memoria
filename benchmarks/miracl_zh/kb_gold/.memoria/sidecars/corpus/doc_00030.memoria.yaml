      snippet: 重庆市
    end:
      line_hint: 3
      snippet: 民政府名称。1983年3月3日，永川地区所属8县及华云工农区划归重庆市管辖。1983年9月9日，华云工农区仍划归南充地区管辖。1993年4月，南桐矿区更名为万盛区。1994年12月，市中区更名为渝中区，撤销江北县、巴县，设立渝北区、巴南区。
