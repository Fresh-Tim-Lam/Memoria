  name: 重庆市
  tags:
  - 重庆市
  description: 1965年2月，重庆市人民委员会决定将九龙坡区管辖的九宫庙、新山村、跃进村3个街道办事处辖区划出，单独设置大渡口区。12月，重庆市大渡口区正式成立。重庆市辖8区3县。1975年3月，国务院决定将江津地区的大足县双路公社全部、元通和土桥两公社各一部由大足县划出，成立双桥区，由重庆市管辖。重庆市辖9区3县。1976年1月，四川省革命委员会决定，江津地区的江北县划归重庆市。重庆市辖9区4县。1980年3月，重庆市及所属各区县行政领导机构陆续恢复人民政府名称。1983年3月3日，永川
  range:
    start:
