- id: 467#47
  name: 天津市
  tags:
  - 天津市
  description: 自1882年，汇丰、花旗、麦加利、华俄道胜、德华、横滨正金、东方汇理、中法工商、华义、华比等外资银行以及最早的中资银行中国通商银行相继在天津开业。1902年直隶总督袁世凯在天津创办官银号。1909年，北洋股票交通有限公司在天津开幕。在1921年2月，天津证券花纱粮食皮毛交易所成立。至1930年代中期，天津有中国的银行、钱庄103家。其中，盐业银行、金城银行、中南银行和大陆银行合称“北四行”，其中前三家的总行都设在天津。在1940年代，大法国路设有49家国内外银行；有270多家
  range:
    start:
      line_hint: 1
      snippet: 天津市
    end:
      line_hint: 3
      snippet: 长速度在多数年份曾低于全国平均水平，在全国的比重呈下降趋势。1994年，天津市成将多个大宗商品批发市场整合并引入期货合约，组建天津联合期货交易所，交易量一度达到全国第四，但也曾因违规酿成风险事件，在1998年全国整顿中被关停改组为证券公司。
