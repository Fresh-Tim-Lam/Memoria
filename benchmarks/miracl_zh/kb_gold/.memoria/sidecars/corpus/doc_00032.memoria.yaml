  name: 天津市
  tags:
  - 天津市
  description: 目前，总部或注册地位于天津的金融机构有全国性股份制商业银行渤海银行，民营银行天津金城银行以及天津银行、天津农商银行、滨海农商行、中德住房储蓄银行、企业银行、外换银行等银行和天津信托、北方国际信托，地方性证券公司渤海证券，公募资产管理规模全国第一的天弘基金等。
