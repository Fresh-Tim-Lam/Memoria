  name: 美国
  tags:
  - 美国
  description: 美国法律继承英国的判例法传统，美国法院承袭“遵循先例”原则，属于英美法系（海洋法系）的重要组成部分。19世纪中叶以前，早期的美国案件仍然经常引用当时的英国案例来应用，此后随着美国逐步发展起自己的法律制度，到如今美国的绝大多数司法引用自国内案例。
