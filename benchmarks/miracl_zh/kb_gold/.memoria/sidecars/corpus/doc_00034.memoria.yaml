- id: 481#49
  name: 美国
  tags:
  - 美国
  description: 美国宪法是最重要的法律来源，所有其他法律都源于宪法并低于宪法的效力。任何法律不得与宪法相抵触。基於憲法的最高性，如果国会通过了与宪法相冲突的法律，最高法院可判定该法违宪，任何一個美国法院都可以根据宪法来审理案件。美國最高法院於馬伯利訴麥迪遜案（1803年）中確立法院的這項權力，使得美國成为世界上第一個有違憲審查制度的國家。
