  name: 美国
  tags:
  - 美国
  description: 截止到2010年，美國人口總計已达到3.08亿，是世界上人口仅次于中国、印度的人口第三大國，人口增長率為0.59%。其中，非西班牙裔白人占64％，其余分别为拉丁裔美國人、非洲裔、亚裔等。从各州情况来看，加利福尼亚州是美国人口最多的州，为3720万；怀俄明州人口最少，只有56.4万；得克萨斯州人口绝对数量增长最多，比2000年增加430万，达到2510万。美国黑人、拉丁裔美國人和亚裔等少数族裔总人口已达到1.007亿人（截至2006年7月），美國的拉丁裔美國人人口突破5000万
  range:
    start:
      line_hint: 1
      snippet: 美国
    end:
      line_hint: 3
      snippet: 00万，占美国人口约六分之一（16.66%），继续稳居美国头号少数族裔位置。美国华裔人口约400万（截至2011年）。通用英语。其中约300万人能够说汉语。51.3％的居民信奉基督新教，其他居民信奉天主教、犹太教等，不属于任何教派的占4％。
