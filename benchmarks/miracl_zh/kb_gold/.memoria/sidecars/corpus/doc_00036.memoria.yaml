  name: 美国
  tags:
  - 美国
  description: 绝大多数美国的报纸都是私营的，广告收入是主要经济来源。影响力最大的是《纽约时报》，该报被誉为“美国社会的忠实记录”，其新闻报道的视角遍及全国各个方面，深受学者和专家们的喜爱。以商业、金融报道为主的《华尔街日报》和西部的《洛杉矶时报》的影响力也很大，但两者在新闻界的地位不及《纽约时报》。《今日美国》虽然有逾百万销量，但只关注娱乐、体育等领域的话题，缺乏主流媒体应有的严肃性，其影响力远不及上面三大报。这四种报是美国发行量最大的报纸，它们都在全美大多数城市发行。
