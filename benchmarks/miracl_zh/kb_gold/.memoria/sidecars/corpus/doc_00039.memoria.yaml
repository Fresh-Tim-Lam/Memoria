- id: 543#35
  name: 法国
  tags:
  - 法国
  description: 法国境内河流众多，纵横交错。法国的河流系统主要由四大河流组成，即卢瓦尔河、塞纳河、加龙河和罗讷河，流域覆盖62%的土地。莱茵河与默兹河有时也被纳入法国的河流系统，但它们在法国并不如在欧洲重要。其中，罗讷河于卡马格注入地中海，将中央高原与阿尔卑斯山脉隔开。巴黎的塞纳河左岸涵盖塞纳河畔一个整体的扇形区域，在巴黎市区内如果乘船由塞纳河顺流而下，船首左侧所展现的，即是塞纳河左岸风光。塞纳河左岸是巴黎建市初期的见证人，它的腹地集中巴黎创立初期的历史遗迹。
