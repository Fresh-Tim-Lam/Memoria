- id: 543#43
  name: 法国
  tags:
  - 法国
  description: 法兰西共和国是实行半总统制的单一制共和国，具有悠久的民主传统。法兰西第五共和国宪法于1958年9月28日由法国民众全体公民投票通过，决定第五共和国的国家政体运作方式。此后宪法经历多次修订，它大幅度地增强行政机关与议会的关系。所有行政机关共有两位领袖，一是共和国总统，二是总理。
