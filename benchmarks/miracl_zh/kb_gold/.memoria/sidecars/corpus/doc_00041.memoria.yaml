  name: 法国
  tags:
  - 法国
  description: 法国（尤其是巴黎）拥有众多世界知名的博物馆，其中，卢浮宫是世界上游览人数第二多的艺术博物馆，仅次于中国故宫博物院。奥赛博物馆和蓬皮杜中心亦为著名的法国博物馆，前者主要收集印象派艺术作品，后者主要收集当代艺术作品。巴黎迪士尼乐园度假区是欧洲最受欢迎的主题公园，2009年有1500万名游客游览度假区的迪士尼乐园和华特迪士尼影城。
