- id: 657#49
  name: 合肥市
  tags:
  - 合肥市
  description: 合肥是安徽省内，乃至华东地区的文化教育中心城市之一。著名的中国科学技术大学就位于合肥，国防科技大学的电子对抗学院也位于合肥，大学还有合肥工业大学、安徽大学、安徽农业大学、安徽医科大学、安徽中医药大学、安徽建筑大学，学院有安徽新华学院、安徽文达信息工程学院、合肥学院、合肥师范学院、安徽三联学院、安徽艺术职业学院等。
