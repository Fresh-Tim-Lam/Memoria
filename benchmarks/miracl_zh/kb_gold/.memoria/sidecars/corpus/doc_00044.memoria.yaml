  name: 西藏自治区
  tags:
  - 西藏自治区
  description: 古時西藏對外來往仰賴的是獸力運輸與西方的採礦建設協助，目前西藏自治区已实现县乡村全部通公路，通车里程11.88万公里。开通国际国内航线140条，通航城市66个。据《西藏自治区第七次全国人口普查主要数据公报》，截至2020年11月1日零时，西藏自治区常住人口为3,648,100人。与2010年第六次全国人口普查相比，十年间西藏常住人口增加645,934人，增长21.52%，年平均增长率为1.97%。其中城镇人口130.34万人，占总人口的35.73%；乡村人口234.47万人，
