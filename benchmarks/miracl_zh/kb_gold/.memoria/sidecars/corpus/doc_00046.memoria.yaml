  name: 臺灣
  tags:
  - 臺灣
  description: 臺灣目前總人口約人（底統計），可分為5大族群：漢族閩南人（河洛人）、漢族客家人、外省人、原住民族、新住民。在臺灣活動已有約八千年之久的原住民族（未納入平埔族血統者）約佔總人口2.36%（554,585人），其餘絕大多數為漢人。其中又分為「本省人」以及「外省人」。本省人主要為閩南人（河洛人）（65.5%－70.5%）和客家人（17.5%－23.5%）。外省人是指1945~1949年跟隨中華民國政府來臺的新移民以及其後代。由於混居及通婚，目前除了在部分地區（如眷村）外，兩者已不易
  range:
    start:
      line_hint: 1
      snippet: 臺灣
    end:
      line_hint: 3
      snippet: 而產生。「渡臺禁令」時嚴時寬，直到1788年渡臺禁令更改，不需憑證可舉家遷徙入台大量開墾移民，攜眷渡台的漢人大幅倍增。最終於1875年2月福建巡撫沈葆楨的提議廢止。另外福建與臺灣的距離比較接近，乘地利之便，閩南人因而成為臺灣人口最多的族群。
