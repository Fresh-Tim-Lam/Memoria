  name: 臺灣
  tags:
  - 臺灣
  description: 臺灣主要宗教有：臺灣民間信仰、佛教、道教、一貫道、基督新教、天主教、儒教與伊斯蘭教等。中華民國憲法保障全體國民有信仰宗教之自由；人民可廣泛接納各類宗教信仰，政府為保行政中立，與宗教間實施政教分離並平等發展。就信仰人口而言，融合臺灣道教、臺灣佛教與民間宗教的臺灣民間信仰，是臺灣最大的信仰人口。若以宗教別劃分，道教、佛教則是臺灣的首兩大宗教。大部分臺灣人同時信仰道教、佛教與儒教與傳統民間信仰混合的臺灣民間信仰，約占臺灣人口的93%。而如一貫道、基督新教、天主教、伊斯蘭教、儒教、藏
  range:
    start:
      line_hint: 1
      snippet: 臺灣
    end:
      line_hint: 3
      snippet: 仰，在臺灣也各有不少信眾，並常有相當活躍的傳教活動。此外，原住民族部落以信仰天主教者居多，基督新教次之。而儒教所規範的禮儀與哲學觀，則被臺灣人視為是人際倫理之基礎觀念，從古至今傳承下來。每年在全國各大孔子廟舉行著世界僅存完整的儒家釋奠典禮。
