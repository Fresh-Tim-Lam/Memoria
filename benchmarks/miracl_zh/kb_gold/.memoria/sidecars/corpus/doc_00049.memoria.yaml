- id: 847#78
  name: 佛教
  tags:
  - 佛教
  description: 全球佛教徒達5億人，佛教徒人數遠少於基督教(約24億信眾)與伊斯蘭教(约15億信眾) ，但是一般仍旧認為基督教、伊斯蘭教與佛教是世界三大宗教。这是因为雖然印度教信仰人口統計達10億人遠高於佛教，但是印度教具有民族限制，集中特定國家(例如：印度或尼泊爾)，而猶太教亦有民族限制(例如：教規導致外邦人不易入教)，相較之下佛教提倡平等、和平與博愛的思想，較無民族性限制，因此普遍認為佛教更適合与基督教和伊斯兰教並稱世界三大宗教。
