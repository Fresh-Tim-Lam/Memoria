- id: 923#96
  name: 元朝
  tags:
  - 元朝
  description: 元朝經濟發達，城市文化興起，又因為交通發達，東西文化交流，使得元朝藝術呈現多元化。繪畫方面，文人畫成為主流，著重個人及書法表現，風格與元代強調裝飾的宮廷繪畫迥然不同。元初趙孟頫、高克恭等人提倡復古，回歸唐朝和北宋的風格，並且將書法入畫，創造出重氣韻、輕格律，注重主觀抒情的元畫風格。元朝中晚期以黃公望、王蒙、倪瓚、吳鎮等元代四大家為主，其中又以黄公望为冠。他們寄託清高人格的理念於繪畫上，以隱逸山水與梅、蘭、竹、菊、松、石等為象徵。黃公望創始「淺降山水」，先以水墨鉤勒皴染為基礎，
  range:
    start:
      line_hint: 1
      snippet: 元朝
    end:
      line_hint: 3
      snippet: 。審美觀趨向飄逸的超然之態獲得一種精神解脫有一定聯繫。鲜于枢与赵孟頫齐名，但影响略小，尤其擅长行、草书。与他们同时代的书法家邓文原则擅长章草，是研习这种古书体不多见的名家之一。康里巙巙稍晚于赵孟頫，也以草书名世，是少数民族书法家的代表人物。
