  name: 西班牙
  tags:
  - 西班牙
  description: 西班牙國家足球隊是1964，2008和2012三届欧洲杯冠军，並於2010年南非世界盃足球賽首度夺冠。俱乐部层面，有着众多百年俱乐部如皇家马德里，巴塞罗那，马德里竞技，塞维利亚等世界顶级足球俱乐部，在欧洲冠军联赛中也都经常会取得出色的成绩。
