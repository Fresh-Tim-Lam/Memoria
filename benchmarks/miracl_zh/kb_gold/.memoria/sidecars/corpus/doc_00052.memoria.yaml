  description: 2014年，以上市公司营业额排名的《财富世界500强》排行榜中，有28家企业的总部设在德国。德国DAX指数则由30家市值最大的德国公司组成。著名国际品牌包括梅赛德斯-奔驰、BMW、彪馬、SAP、大众汽车、奥迪、西门子、安联、阿迪达斯、保时捷和DHL。
