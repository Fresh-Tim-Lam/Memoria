  description: 德国最大的国际媒体企业为贝塔斯曼、阿克塞尔·斯普林格集团和。德新社亦为重要的媒体机构。德国的电视市场为欧洲最大约3,800万家庭拥有电视，近90%的德国家庭拥有有线电视或卫星电视，可接收公共免费电视及商业电视频道。德国有超过500个公共和私人广播电台，德国之声为最主要的德国外语电视和广播商。德国国家广播为德国广播，德国公共广播联盟则负责地方服务。
