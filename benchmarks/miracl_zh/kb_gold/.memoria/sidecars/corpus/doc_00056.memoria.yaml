- id: 1182#19
  name: 联合国
  tags:
  - 联合国
  description: 安理会由15个会员国组成，其中包括5个常任理事国（中国、美国、英国、法国、俄罗斯）和以及10个非常任理事国。其中五个常任理事国对于安理会决议具有否决权，因此常任理事国能够阻止通过安理会决议，但无法阻止讨论。十个非常任理事国任期两年，根据地域分配原则由大会从成员国中选出。安理会的主席每个月根据英文字母顺序进行轮换。
