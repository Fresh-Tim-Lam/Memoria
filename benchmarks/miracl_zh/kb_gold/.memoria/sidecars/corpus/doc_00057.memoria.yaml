      snippet: 水道和珠江前、后航道交织成的河网。河网区主要水道总长度416公里，其中前、后航道纵贯广州市城区。珠江入海有八大口门，其中虎门、蕉门、洪奇沥三口门在广州市境内，其河川径流分别注入伶仃洋。珠江口海岸线522公里，浅海水域面积约4000平方公里。
