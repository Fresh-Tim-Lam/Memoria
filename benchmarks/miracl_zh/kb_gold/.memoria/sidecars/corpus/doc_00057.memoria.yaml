  name: 广州市
  tags:
  - 广州市
  description: 广州市位于西江、东江和北江的下游，境内河流水系发达，水域面积广阔。全市河流属珠江水系，包括珠江三角洲和北江两个二级水系，主要归属珠江三角洲水系。其中东北部以山区河流为主，主要河流有流经从化区、花都区和白云区的流溪河，流经增城区的增江、东江北干流及白坭河等；南部为珠江三角洲河网区，主要为西、北、东江下游水道和珠江前、后航道交织成的河网。河网区主要水道总长度416公里，其中前、后航道纵贯广州市城区。珠江入海有八大口门，其中虎门、蕉门、洪奇沥三口门在广州市境内，其河川径流分别注入伶
  range:
