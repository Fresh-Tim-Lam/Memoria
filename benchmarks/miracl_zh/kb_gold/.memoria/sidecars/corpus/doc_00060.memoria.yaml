- id: 1739#1
  name: 法国国旗
  tags:
  - 法国国旗
  description: 法國的國旗以三色旗（）著稱，最早出現在法國大革命時期，顔色取自當時法國國徽（紅和藍），再加上法國王室的顔色白色。其中藍色是聖馬丁長袍的顔色，白色紀念民族英雄聖女貞德，紅色則是聖但尼軍旗的顔色。最早的三色旗色彩的排列與今天不同，紅色在左，不過後來有過調整。
  range:
    start:
      line_hint: 1
      snippet: 法国国旗
    end:
      line_hint: 3
      snippet: 色旗（）著稱，最早出現在法國大革命時期，顔色取自當時法國國徽（紅和藍），再加上法國王室的顔色白色。其中藍色是聖馬丁長袍的顔色，白色紀念民族英雄聖女貞德，紅色則是聖但尼軍旗的顔色。最早的三色旗色彩的排列與今天不同，紅色在左，不過後來有過調整。
