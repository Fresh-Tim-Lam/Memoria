- id: 1739#5
  name: 法国国旗
  tags:
  - 法国国旗
  description: 这种标准被1974年至1981年期间执政的法国总统德斯坦（）批准采用，以替换早先颜色较暗的三色旗版本。2020年，法國總統馬克龍在未告知公眾的情況下，把國旗中的藍色從淺色的鈷藍色改回深色的海軍藍，這一改動直到2021年11月才被發現。
