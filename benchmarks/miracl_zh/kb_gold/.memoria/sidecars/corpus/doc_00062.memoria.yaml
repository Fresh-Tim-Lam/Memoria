- id: 1739#7
  name: 法国国旗
  tags:
  - 法国国旗
  description: 据说，三色旗的起源来自于1789年7月法国革命期间革命军所戴的帽章。该帽章由革命军总司令拉法叶侯爵（Marquis de Lafayette）设计，它采用的颜色借鉴了巴黎市市徽的红色和蓝色，原本只有红蓝两色，后来拉法叶加入代表王室的白颜色，寓意是期望人民与王室携手合作，建立一个自由平等的新国家。1789年后，巴黎的颜色不再被使用；原因可能是拉法叶当时采用了美国独立战争旗子的颜色（蓝，红和白色）。大多数的历史学家和旗帜学家，包括法国的那些学家，同意现在这种最终的说法，虽然这来源
  range:
