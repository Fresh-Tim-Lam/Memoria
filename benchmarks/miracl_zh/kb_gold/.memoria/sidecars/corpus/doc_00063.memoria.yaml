  name: 法国国旗
  tags:
  - 法国国旗
  description: 1815年波旁王朝復辟后，三色旗被革命前使用过的王室的丁香花（fleur-de-lis）白色旗代替。然而1830年革命，路易-菲利普（Louis-Philippe）国王登上王位后，再一次指定三色旗为国旗，一直持续至今。
