  description: 澳大利亞联邦（），通称澳大-{}-利亚、澳-{}-洲（，缩写为AU、AUS），是一个位于南半球中北部、东半球东部的议会制君主立宪制、联邦制国家。全国整体属于大洋洲，是大洋洲面积最大、南半球面积第二大和全球面积第六大的国家。澳大利亚国土囊括了整块澳大利亚大陆、塔斯马尼亚岛及圣诞岛等数个海外岛屿，国土总面积7,692,300平方公里，和美國本土的面积相近。根据2019年的普查数据，全国人口约为2522万，居世界第54位。该国没有陆上邻国，所有近邻国家均与其隔海相望。其中东南部有新
  range:
    start:
      line_hint: 1
      snippet: 澳大利亚
    end:
      line_hint: 3
      snippet: 及西北部是印度尼西亚、东帝汶等东南亚国家。首都为堪培拉，最大城市为悉尼，其他主要城市有墨尔本、珀斯、布里斯班等，本土划分为六个州及两个领地。经济社会发展上，属于发达国家和资本主义国家。国内发行与流通的貨幣為澳大利亚元，是全球第五大流通貨幣。
