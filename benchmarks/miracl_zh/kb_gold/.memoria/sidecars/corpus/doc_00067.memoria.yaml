  name: 清朝
  tags:
  - 清朝
  description: 清朝建立伊始，清政府為禁止和截斷東南沿海的反清勢力與據守台灣的鄭成功部的聯繫，以鞏固新朝的統治，曾五次頒布禁海令，並三次頒布「遷海令」，禁止人民出海貿易。1683年清軍攻佔台灣後，康熙接受東南沿海的官員請求，停止清初的海禁政策，并在“粤东之澳门（一说广州）、福建之漳州府、浙江之宁波府、江南之云台山”分别设立粤海关、闽海关、浙海关、江海关作为管理对外贸易和征收关税的机构。江浙闽粤四大海关总领各自所在省的所有海关口岸，通常下辖十几至几十个海关口岸。但當時西方殖民者的殖民地已遍佈中
  range:
    start:
      line_hint: 1
      snippet: 清朝
    end:
      line_hint: 3
      snippet: 易和征收关税的机构。江浙闽粤四大海关总领各自所在省的所有海关口岸，通常下辖十几至几十个海关口岸。但當時西方殖民者的殖民地已遍佈中國周圍，其殖民步伐引起了清廷警惕，康熙甚至曾口諭大臣們：「海外如西洋等國，千百年後中國恐受其累，此朕逆料之言」。
