  name: 清朝
  tags:
  - 清朝
  description: 清廷平定明鄭後放宽海禁，在“粤东之澳门（一说广州）、福建之漳州府、浙江之宁波府、江南之云台山”分别设立粤海关、闽海关、浙海关、江海关作为管理对外贸易和征收关税的机构。江浙闽粤四大海关总领各自所在省的所有海关口岸，通常下辖十几至几十个海关口岸，並准许外商在指定口岸通商，逐步建立一套管理外商来华贸易的制度，主要有公行制度和商馆制度。浙江、福建與廣東地區盛行海外貿易，人民時常與日本、琉球、東南亞各國及葡萄牙、西班牙與荷蘭等西洋各國展開貿易。到18世紀還有英國、法國與美國參與其中，當
  range:
    start:
      line_hint: 1
      snippet: 清朝
    end:
      line_hint: 3
      snippet: 的茶葉；四川盛產植物、藥物、像大黃等等，而且都傾向於聯盟保護的形式，在所有的城市裡也一樣。清朝官員在商業界裡都擁有自己的股份／分成，同時亦惠及平民百姓。清朝的市集亦相當繁華，中外商家貿易往來頻繁，外國商人對中國商人的誠實也有深刻的良好印象。
