  description: 菲律宾分为吕宋岛、米沙鄢群島和棉兰老岛三个岛组，劃分為17個大區（包括国家首都区、科迪勒拉行政区和邦萨摩洛自治区在内），下设76个省，最大島為吕宋岛，首都為马尼拉。
