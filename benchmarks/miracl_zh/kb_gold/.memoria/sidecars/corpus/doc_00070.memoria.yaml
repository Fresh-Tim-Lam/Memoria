  description: 2010年代，中國眾多棋手崛起，江維杰、范廷鈺、時越、羋昱廷、陳耀燁、周睿羊、檀嘯等年輕棋士接連贏得世界比賽冠軍。2015年，柯洁崛起，一時風頭無兩，但其光芒迅速因AlphaGo于2016年的横空出世而变得黯淡。
