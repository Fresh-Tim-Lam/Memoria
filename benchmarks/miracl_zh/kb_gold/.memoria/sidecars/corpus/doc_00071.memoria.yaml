- id: 2207#9
  name: 一神論
  tags:
  - 一神論
  description: 基督教是一种信仰神和天国的一神论宗教，发源于中东地区。在人类发展史中，基督教扮演非常重要的角色，（中世紀到文藝復興尤甚）世界各地遍布为数众多的教堂。基督徒相信耶稣为神（天主或稱上帝）的圣子、人类的救主（弥赛亚，即基督）的一神论宗教。基督教与伊斯兰教、佛教並列為当今三大世界性宗教。主要有羅馬公教（又称天主教）、希臘正教（又稱正教會）、基督新教（華人俗稱基督教）三大派别，以及其他许多规模较小的派別。基督教虽然产生于中东地区，但后来由于阿拉伯帝国和奥斯曼土耳其帝国的兴起、扩张和持续
  range:
    start:
      line_hint: 1
      snippet: 一神論
    end:
      line_hint: 3
      snippet: 有现象。《一本讀懂世界三大宗教》指出，基督教的信徒佔2008年世界人口32.9%，即約20億7千萬人。天主教徒佔其中52.89%（約11億人），基督新教佔其中17.63%（約3億6千萬人），而東正教則佔其中10.64%（約2億2千萬）人口。
