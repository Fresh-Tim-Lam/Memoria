- id: 2234#38
  name: 雍正帝
  tags:
  - 雍正帝
  description: 康熙六十一年（1722年）年十一月十三日，康熙聖祖病重時於畅春园召集雍正多位親兄弟：誠親王允祉、淳郡王允祐、貝勒允禩、貝子允禟、敦郡王允䄉、貝子允祹、允祥至御榻前，諭曰：「皇四子胤禛人品貴重深肖朕躬，必能克承大統，著繼朕登基即皇帝位」。康熙死時，包括宮人內侍和內廷行走之大小臣工當時也都在場，並於宣諭完畢七個時辰之後才病逝的，此之後才再次由隆科多負責宣述康熙帝的遺詔。。雍正繼位，任命康熙皇八子允禩、皇十三子允祥、馬齊和隆科多總理事務。
