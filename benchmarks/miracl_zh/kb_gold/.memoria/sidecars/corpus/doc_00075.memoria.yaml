  name: 路德维希·范·贝多芬
  tags:
  - 路德维希·范·贝多芬
  description: 贝多芬最著名的作品包括《第三交响曲“英雄”》、《第五交响曲“命运”》、《第六交响曲“田园”》、《第九交响曲“合唱”》、《悲怆奏鸣曲》和《月光奏鸣曲》等等。其32首编号钢琴奏鸣曲，包括《悲怆》和《月光》等被汉斯·冯·彪罗尊称为钢琴的“新约全书”（“旧约全书”为巴赫的《平均律钢琴曲集》）。他早期的音乐，受海顿和莫札特的古典主义风格影响很大，如第一交响曲。而在早期钢琴奏鸣曲，如《悲怆》中，其和声特点、八度的频繁以及丰富厚实的织体，体现了穆齐奥·克莱门蒂和杨·杜赛克对贝多芬的影响。到
  range:
    start:
      line_hint: 1
      snippet: 路德维希·范·贝多芬
    end:
      line_hint: 3
      snippet: 义风格影响很大，如第一交响曲。而在早期钢琴奏鸣曲，如《悲怆》中，其和声特点、八度的频繁以及丰富厚实的织体，体现了穆齐奥·克莱门蒂和杨·杜赛克对贝多芬的影响。到了中后期，作品越发表现出他强烈的个人风格，贝多芬甚至藉著音乐道出自己的理想和诉求。
