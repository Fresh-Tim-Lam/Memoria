  name: 光绪帝
  tags:
  - 光绪帝
  description: 光緒帝（），名載湉（），爱新觉罗氏，是清朝第11位，也是自入关以来的第九位皇帝，同時是中國最後一位有正式諡號及正式廟號的皇帝，1875年2月25日至1908年11月14日在位，年号「光绪」。
