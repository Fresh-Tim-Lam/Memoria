- id: 3127#0
  name: 马尼拉
  tags:
  - 马尼拉
  description: 马尼拉（, ；），又稱岷里拉，馬尼剌（閩南語），是菲律宾的首都，位於菲律宾的最大岛—呂宋島馬尼拉灣的東岸；今為菲第二大城，人口有150萬；為全國經濟、文化、教育和工業中心。2013年4月，馬尼拉都會人口排名全球第6名，達2120萬人。
