  description: 1960年，巴西首都由位于海岸的里约热内卢迁往內陸的行政首都巴西利亚，以減輕里约热内卢作為政治和經濟首都的壓力。1964年，巴西發生军队政变，推翻政府，建立了長達21年的反共右翼军人独裁统治。
