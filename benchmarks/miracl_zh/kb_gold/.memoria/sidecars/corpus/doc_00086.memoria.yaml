  name: 南美洲
  tags:
  - 南美洲
  description: 南美洲共有12个国家和4个尚未独立的海外领地。这些海外领地分别属于英国（2个）、法国（1个）和挪威（1个），其中隶属英国的南乔治亚和南桑威奇群岛和隶属挪威的布韦岛为无常住居民的荒岛。
