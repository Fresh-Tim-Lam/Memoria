  name: 潍坊市
  tags:
  - 潍坊市
  description: 潍坊市地处山东半岛中部，地势南高北低，以山丘、平原、滨海三个地貌单元为主。北部为渤海莱州湾，沿海线长113公里。市区为平原，几乎无起伏地势。潍坊市总面积1.6万平方公里，约占山东省总面积的10%，居山东第二位。
