- id: 4090#1
  name: 荷兰
  tags:
  - 荷兰
  description: 荷兰的領土可分為歐洲區與加勒比區兩個部份。歐洲區領土位于欧洲西北部，濒临北海，与德国、比利时接壤，並與英國隔海相望。加勒比海區，位於美洲加勒比海地區，包括博奈爾島、聖尤斯特歇斯島和薩巴島三個小島。荷蘭最大的三個城市分別為阿姆斯特丹、鹿特丹與海牙。阿姆斯特丹是宪法确定的正式首都，然而，政府、國王的王宫和大多数都位于海牙。此外，国际法庭也设在海牙。鹿特丹港，位於鹿特丹，為全世界進出量第八的大型港口。
