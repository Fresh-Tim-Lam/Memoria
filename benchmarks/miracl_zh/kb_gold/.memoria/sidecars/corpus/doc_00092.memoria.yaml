- id: 4664#52
  name: 长沙市
  tags:
  - 长沙市
  description: 长沙传统上以工程机械制造业为支柱产业，随着经济转型，2015年，新材料产业产值达到2621亿元，取代工程机械成为了长沙第一大产业。1978年长沙市GDP总量为16.85亿元，到2017年达到10,535.51亿元。曾经基础薄弱的长沙通过推动自主创新驱动加速工业化，和着力做强县域经济，在2005年至2015年十年间，GDP增幅达到460%，在33个主要城市中位居第一。2016年，长沙提出了建设“三个中心”即国家智能制造中心、国家创新创意中心、国家交通物流中心的目标。
