  name: 光绪
  tags:
  - 光绪
  description: 同治十三年十二月五日（1875年1月12日），清穆宗驾崩。此时距翌年正月初一日还有二十四天（同治十三年十二月是小尽，只有二十九天），群臣拟定光绪、承熙、绍德、延道四个备选年号，并附满语。十二月九日（1875年1月16日），两宫皇太后硃笔落点“光绪”。
