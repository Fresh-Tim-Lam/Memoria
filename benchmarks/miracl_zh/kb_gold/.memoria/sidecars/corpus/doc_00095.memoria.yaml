  name: 行星
  tags:
  - 行星
  description: 2006年8月24日在捷克首都布拉格舉行之第26屆國際天文學聯會上的定義，初時曾提出包括鬩神星、冥衛一與穀神星的十二行星，但爭議與反響頗大，亦引起天文愛好者與民間熱烈討論；至8月24日下午第26屆國際天文學聯會上的定義：太陽系有八顆行星（決議時曾出現「古（經）典行星」一詞，指的也是這八顆），分別為水星、金星、地球、火星、木星、土星、天王星與海王星。質量不夠的將會被IAU會議決議歸類為矮行星（如冥王星）或太陽系內小天體（如小行星、彗星等）。（此分類方法因以地球為界，故必會忽略地
