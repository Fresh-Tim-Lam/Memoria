- id: 4849#16
  name: 细菌
  tags:
  - 细菌
  description: 细菌具有许多不同的代谢方式。一些细菌只需要二氧化碳作为它们的碳源，被称作自养或自營生物。那些通过光合作用从光中获取能量的，称为光合自养生物。那些依靠氧化化合物中获取能量的，称为化能自养生物。依靠有机物形式的碳作为碳源，称为异养或異營生物。
