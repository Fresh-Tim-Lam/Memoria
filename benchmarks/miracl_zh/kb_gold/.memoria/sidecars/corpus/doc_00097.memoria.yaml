- id: 4880#0
  name: 葡萄牙
  tags:
  - 葡萄牙
  description: 葡萄牙共和国（），通称葡萄牙或者葡國（ ），是西南欧伊比利亚半岛上的共和国，实行单一制和半总统制，首都为里斯本。葡萄牙的西部和南部濒临大西洋，北部和东部则与西班牙相接，领土面积92,212平方公里（35,603平方英里）。葡萄牙首都里斯本以西的罗卡角是欧洲大陆的最西端。除欧洲大陆上的本土外，大西洋的亚速尔群岛和马德拉群岛亦为葡萄牙领土的一部分，为地方政府管辖的自治区域。
