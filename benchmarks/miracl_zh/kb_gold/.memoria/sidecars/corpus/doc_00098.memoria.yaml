- id: 4880#12
  name: 葡萄牙
  tags:
  - 葡萄牙
  description: 葡萄牙的国土包括伊比利亚半岛上的本土，以及大西洋上的马德拉群岛和亚速尔群岛，位于32°至43°N、32°至6°W之间。葡国领土面积92,090
    km（35,560 sq mi），其中陆地面积91,470 km（35,320 sq mi），水域面积620 km（240 sq mi）。葡国拥有1,727,408 km的专属经济区，大小位居世界第11位。葡萄牙位于欧洲大陆的西南尽头，东面与北面与唯一的邻国西班牙接壤，西面则是大西洋。
