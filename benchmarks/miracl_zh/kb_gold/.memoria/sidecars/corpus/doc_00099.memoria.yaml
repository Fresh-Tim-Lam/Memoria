  name: 成吉思汗
  tags:
  - 成吉思汗
  description: 整个元朝时期乃至后世王朝，官修历史一直保持了元朝的传统，将大蒙古国时期与元朝时期的统治一并而论，不作区分，统一将君主称为“皇帝”。《元史》中的記載鐵木真於1206年建大蒙古国时，称其“即皇帝位于斡难河之源，诸王群臣共尊其為成吉思皇帝”。元惠宗至正五年（1345年）十一月修成的法律《至正条格》中，称铁木真为“成吉思皇帝”，将他下的命令称为“聖旨”。明初官修《元史》，书中出现过“成吉思皇帝”一词多次，从未出现过“成吉思汗”一词。1252年成书的《元朝秘史》（《蒙古秘史》），蒙文音
  range:
