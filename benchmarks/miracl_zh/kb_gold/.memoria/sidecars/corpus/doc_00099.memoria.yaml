      line_hint: 3
      snippet: 吉思合罕”，旁注释为“太祖皇帝”。直到近代中国，《新元史》中出现了“成吉思合罕”、“成吉思可汗”等词语，原因是《新元史》完成于民初（1920年），而《史集》、《世界征服者史》等西方的史书在清朝末年传入中国，《新元史》作者柯劭忞也深受其影响。
