  name: 立陶宛
  tags:
  - 立陶宛
  description: 立陶宛共和國（），通稱立陶宛（; ），位于欧洲东北部，是波罗的海三国之一，首都與最大城市為维尔纽斯，另外還有考那斯與克萊佩達等城市。立陶宛全國人口约280万，面积约6.5万平方公里，北接拉脱维亚、东南接白俄罗斯、南接波兰、西南接俄罗斯的-{zh-hans:加里宁格勒;zh-hant:加里寧格勒;}-州，西濱波羅的海。
