  name: 白俄罗斯
  tags:
  - 白俄罗斯
  description: 白俄罗斯位于欧洲的中部，是一个内陆国家，与其接壤的国家有在东部的俄罗斯，北部的拉脱维亚，波兰，西北的立陶宛以及南部的乌克兰。白俄罗斯面积20.76万平方公里，南北相距560公里，东西相距650公里。白俄罗斯地处东欧平原，地勢低平、多为河流溼地，森林覆盖面积达到40％，最高峰为捷尔任斯克山，海拔345米，最低点在涅曼河为90米。
