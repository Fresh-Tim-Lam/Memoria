- id: 5438#36
  name: 乌克兰
  tags:
  - 乌克兰
  description: 乌克兰位于欧洲东部，面积为60.37万平方公里（约占原苏联面积的5.3%），东西长1,300公里，南北长900公里。南临亞速海和黑海，陆上东北接俄罗斯，北邻白俄罗斯，西连斯洛伐克、波兰和匈牙利，南同摩尔多瓦、罗马尼亚接壤。乌克兰大部分地区属东欧平原，最高峰为西部喀尔巴阡山脉的戈维尔拉山（海拔2,061米）。气候属温带大陆性气候，克里米亚半岛南岸为亚热带气候。
