- id: 5527#1
  name: 忽必烈
  tags:
  - 忽必烈
  description: 1260年5月5日在自己的弟弟旭烈兀的支持和封地属臣的拥立下，自立为大蒙古国大汗，称大蒙古国皇帝。1271年12月18日，忽必烈改国号为“大元”，建立元朝，成为元朝首任皇帝。忽必烈于1260年5月5日至1276年2月4日自立为汗期间实际统治中国北方及蒙古高原地区属于蒙古大汗的直辖领地，于1271年12月18日至1294年2月18日作为元朝皇帝统治中国，前后在位34年，作为全中国皇帝在位18年。
