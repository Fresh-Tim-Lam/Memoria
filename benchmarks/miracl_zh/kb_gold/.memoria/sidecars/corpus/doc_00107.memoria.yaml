- id: 5881#1
  name: 中东
  tags:
  - 中东
  description: “中东”是欧美人使用的一个地理术语。一般来说包括巴林、埃及、伊朗、伊拉克、以色列、约旦、科威特、黎巴嫩、阿曼、卡塔尔、沙特、叙利亚、阿联酋和也门；巴勒斯坦、马格里布国家（阿尔及利亚、利比亚、摩洛哥、突尼斯），以及苏丹、毛里塔尼亚和索马里，由于阿拉伯世界历史文化原因，一般人们认为属于中东国家；土耳其和塞浦路斯尽管地理上属于中东地区的一部分，但是他们自身认为属于欧洲；北边的阿富汗有时也与中东联系密切。
  range:
    start:
