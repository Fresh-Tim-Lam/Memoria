- id: 6007#26
  name: 共产主义
  tags:
  - 共产主义
  description: 當前由共产党长期執政的國家包括中華人民共和國、越南社會主義共和國、老撾人民民主共和國、古巴共和國。朝鲜虽为劳动党一党专政，但其不再将马克思主义作为指导思想。現存的社会主义國家目前都有階級、政黨、警察和軍隊存在，以保證生產資料的生產、使用、收益和處分，因此按共產主義理論，这四国普遍认为仍然處於前社會主义甚至国家资本主义阶段，但有一些共產主义者則認為「現存的社會主義國家皆走上了修正主義的道路」，故此認為「現今已經沒有任何一個社會主義國家了」。
  range:
    start:
      line_hint: 1
      snippet: 共产主义
    end:
      line_hint: 3
      snippet: 隊存在，以保證生產資料的生產、使用、收益和處分，因此按共產主義理論，这四国普遍认为仍然處於前社會主义甚至国家资本主义阶段，但有一些共產主义者則認為「現存的社會主義國家皆走上了修正主義的道路」，故此認為「現今已經沒有任何一個社會主義國家了」。
