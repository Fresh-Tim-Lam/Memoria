- id: 7086#0
  name: 新京特別市
  tags:
  - 新京特別市
  description: 新京特別市，通稱新京（郵政式拼音：），是满洲国的首都，轄區相當於今中华人民共和国吉林省省会长春市。新京坐落在满洲国中部，城市中心坐标为北纬43°55′，东经125°18′，市内主要河流为松花江支流伊通河，随着行政区域的扩大，新京市域面积在1942年达到444.19km²。
