- id: 7102#0
  name: 满洲国
  tags:
  - 满洲国
  description: 滿洲國（1932年3月1日－1945年8月18日）是前东北亚国家，為日本侵佔中國東北後建立的傀儡政權。日本發動九一八事變控制中國東北後，拉拢部分前清宗室及漢人將領權貴而建立此政权。領土包括今辽宁省、吉林省和黑龙江省全境（不包括關東州，即大連地區），以及今内蒙古自治区東部和河北省北部的原熱河省地區。南与日治朝鲜接壤，北与苏联接壤，西與蒙古人民共和国（外蒙古）相鄰。首都設於新京特別市（今长春市）。
