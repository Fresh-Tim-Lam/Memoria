  name: 满洲国
  tags:
  - 满洲国
  description: 1932年3月1日，在日本策劃下，滿洲「建國」，發布《建國宣言》，宣布滿洲國成立，“首都”为長春（後改名新京），“領土”包範圍包括現今遼寧、吉林和黑龍江3省全境（不含日據關東州，即今日大連），以及內蒙古東部、河北承德。
