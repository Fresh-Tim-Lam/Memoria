  name: 戈特弗里德·莱布尼茨
  tags:
  - 戈特弗里德·莱布尼茨
  description: 莱布尼茨对如此繁多的学科方向的贡献分散在各种学术期刊、成千上万封信件、和未发表的手稿中，其中四成為拉丁文、三成為法文、一成五為德文。截至2010年，莱布尼茨的所有作品还没有收集完全。2007年，戈特弗里德·威廉·莱布尼茨图书馆暨下薩克森州州立圖書舘的莱布尼茨手稿藏品被收入联合国教科文组织编写的世界记忆项目。
