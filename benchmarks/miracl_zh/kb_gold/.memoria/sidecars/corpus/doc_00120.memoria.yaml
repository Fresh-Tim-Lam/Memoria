  name: 中国共产党全国代表大会
  tags:
  - 中国共产党全国代表大会
  description: 简称“中共中央”、“党中央”，根據1956年中国共产党第八次全国代表大会通过的中共党章规定，中共中央每届任期五年。全国代表大会如提前或延期举行，它的任期相应地改变。中央委员会委员和候补委员必须有五年以上的党龄。中央委员会委员和候补委员的名额，由全国代表大会决定。中央委员会委员出缺，由中央委员会候补委员按照得票多少依次递补。中央委员会全体会议由中央政治局召集，每年至少举行一次。中央政治局向中央委员会全体会议报告工作，接受监督。在全国代表大会闭会期间，执行全国代表大会的决议，领导
  range:
    start:
      line_hint: 1
      snippet: 中国共产党全国代表大会
    end:
      line_hint: 3
      snippet: 员出缺，由中央委员会候补委员按照得票多少依次递补。中央委员会全体会议由中央政治局召集，每年至少举行一次。中央政治局向中央委员会全体会议报告工作，接受监督。在全国代表大会闭会期间，执行全国代表大会的决议，领导党的全部工作，对外代表中国共产党。
