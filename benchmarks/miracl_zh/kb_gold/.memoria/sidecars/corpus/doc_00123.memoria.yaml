  name: 联合国安全理事会
  tags:
  - 联合国安全理事会
  description: 安理会由5个常任理事国和10个非常任理事国组成。5个常任理事国是中國（1971年10月25日聯合國大會第2758號決議通過之後席位由實際控制中國大陸的中華人民共和國為唯一且合法的中國，接替實際控制台澎金馬的中華民國）、法国、俄罗斯聯邦（1991年12月苏联解体后席位由俄罗斯联邦接替）、英国、美國。非常任理事国由联合国大会选举产生，最初为6个，1965年开始增加到10个，席位按地区分配，即亚洲2个、非洲3个、拉丁美洲2个、东欧1个、西欧及其他国家2个。非常任理事国任期2年，经选
  range:
    start:
      line_hint: 1
      snippet: 联合国安全理事会
    end:
      line_hint: 3
      snippet: 配，即亚洲2个、非洲3个、拉丁美洲2个、东欧1个、西欧及其他国家2个。非常任理事国任期2年，经选举每年更换5个，不能连选连任。根据地域分配原则，每次新选出的5个成员国中应包括来自亚洲和非洲的3个国家、一个东欧国家和一个拉美或加勒比地区国家。
