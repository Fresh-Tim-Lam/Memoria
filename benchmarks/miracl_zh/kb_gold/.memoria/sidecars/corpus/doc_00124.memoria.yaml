- id: 8199#22
  name: 冬至
  tags:
  - 冬至
  description: 明清兩代則在北京南郊天壇祭天。清代皇帝祭天儀式每年都有，祈求天帝保佑、國泰民安，並已發展到極為繁瑣、複雜、隆重：期間皇帝必須穿祭服、請牌神，太常寺官奏請行禮，典儀官唱讚「燔柴迎帝神」；更在東南煪柴爐升火，西南方懸望燈，樂隊齊鳴。
