- id: 8471#0
  name: 长江流域
  tags:
  - 长江流域
  description: 长江流域介于东经90°33'～122°25'，北纬24°30'～35°45'之间，东西直距3000公里以上，南北宽度除江源和长江三角洲地区外，一般均达1000公里左右。长江流域横跨中国东部、中部和西部三大经济区共计19个省、市、自治区；经济总量巨大，有上海、南京、重庆和武汉等中心城市，是中国基础原材料、机电工业和高新技术等优势产业集中地；也是中国水资源配置——南水北调水源地。流域总面积180万平方公里，占中国国土面积的的18.8%，长江干流全长6300余公里；支流众多，其中支
  range:
    start:
      line_hint: 1
      snippet: 长江流域
    end:
      line_hint: 3
      snippet: 总面积的五分之一。长江流域具有独特的生态系统，拥有众多稀有动植物，生物多样性居中国七大流域首位。长江流域年均水资源总量9960亿立方米，全流域水能理论蕴藏量约2.8亿千瓦，可开发量约2.6亿千瓦，森林资源蕴藏量大，林木蓄积量、矿产资源丰富。
