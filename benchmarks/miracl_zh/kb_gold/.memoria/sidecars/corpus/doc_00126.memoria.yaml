- id: 8471#2
  name: 长江流域
  tags:
  - 长江流域
  description: 长江流域北以巴颜喀拉山、西倾山、岷山、秦岭、伏牛山、桐柏山、大别山、淮阳丘陵等与黄河和淮河流域为界，南以横断山脉的云岭、大理鸡足山、滇中东两向山岭、乌蒙山、苗岭、南岭等与澜沧江、元江（红河）和珠江流域为界，东南以武夷山、石耳山、黄山、天目山等与闽浙水系为界，长江源头地区的北部以昆仑山与柴达木盆地内陆水系为界，西部以可可西里山、乌兰乌拉山、祖尔肯乌拉山、尕恰迪如岗雪山群与藏北羌塘内陆水系为界，南部以唐古拉山与怒江流域为界，长江三角洲北部，地形平坦，水网密布，与淮河流域难以分界，
  range:
    start:
      line_hint: 1
      snippet: 长江流域
    end:
      line_hint: 3
      snippet: 江流域的面积则接近200万平方公里。 长江干流流经青海、西藏、四川、云南、重庆、湖北、湖南、江西、安徽、江苏和上海计11个省级行政区，支流延伸至贵州、甘肃、陕西、河南、广西、广东、浙江与福建8个省级行政区部分地区，流域覆盖19个省级行政区。
