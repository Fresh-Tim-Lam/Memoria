  name: 大萧条
  tags:
  - 大萧条
  description: 大萧条期间，美国总统富兰克林·德拉诺·罗斯福支持了公共事业，进行農業補貼，并尝试了多重方法以重振美国经济。与此同时，不放弃消灭财政赤字。根据凯恩斯主义，这些措施都对经济大有裨益。但直至第二次世界大战爆发，罗斯福才将美国经济拉出泥潭。
