- id: 9939#2
  name: 全国人民代表大会
  tags:
  - 全国人民代表大会
  description: 根据《中华人民共和国宪法》和《中华人民共和国全国人民代表大会和地方各级人民代表大会选举法》等法律的规定，各级人民代表大会实行民主集中制。全国人民代表大会代表由中国内地各省、自治区、直辖市人民代表大会和各特别行政区选举委员会间接选举产生，全国人大常委会则由全国人大会议选举产生，任期均为五年。第一届全国人大于1954年召开，现任的第十三届全国人大代表于2018年3月就职。目前，全国人大的全体会议一般在每年3月召开。
