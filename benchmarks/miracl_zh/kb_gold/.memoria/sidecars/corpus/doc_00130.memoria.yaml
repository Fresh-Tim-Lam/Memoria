  name: 叶卡捷琳娜二世
  tags:
  - 叶卡捷琳娜二世
  description: 叶卡捷琳娜二世·阿列克谢耶芙娜（，），亦称叶卡捷琳娜大帝（），或依照英文（Catherine II）譯為凱薩琳二世、凱薩琳大帝，俄罗斯帝国史上在位时间最长（1762年至1796年在位）的君主，在位時間長達34年。叶卡捷琳娜出生于普鲁士波美拉尼亚斯德丁，出生名为索菲娅·弗雷德里卡·奥古斯塔·冯·安哈尔特-采尔布斯特-多恩堡（），通过政变废黜其夫君彼得三世，即位为全俄罗斯女皇帝。
