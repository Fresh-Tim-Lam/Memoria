  description: 中国共产党第十六届中央委员会第二次全体会议于2003年2月24日至26日在北京举行。出席这次全会的有，中央委员191人，候补中央委员151人。有关负责同志列席了会议。中央政治局主持会议。中央委员会总书记胡锦涛作了重要讲话。
