  description: 中国共产党第十六届中央委员会第六次全体会议于2006年10月8日至11日在北京举行。出席这次全会的有，中央委员195人，候补中央委员152人。中央纪律检查委员会常务委员会委员和有关方面负责同志列席了会议。
