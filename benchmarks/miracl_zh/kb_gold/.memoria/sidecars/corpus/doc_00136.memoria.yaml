  name: 中国共产党第十六届中央委员会
  tags:
  - 中国共产党第十六届中央委员会
  description: 中国共产党第十六届中央委员会第七次全体会议于2007年10月9日至12日在北京举行。出席会议的有中央委员190人，候补中央委员152人。中央纪律检查委员会委员和有关负责同志列席会议。会议由中央政治局主持。中央委员会总书记胡锦涛作了重要讲话。会议决定，中国共产党第十七次全国代表大会于2007年10月15日在北京召开。
