- id: 10312#12
  name: 中国共产党中央委员会
  tags:
  - 中国共产党中央委员会
  description: 中央委員會每屆任期五年。中国共产党全國代表大會如果提前或延期舉行，它的任期相應地改變。中央委員會委員和候補委員必須有五年以上的黨齡。中央委員會委員和候補委員的名額，由全國代表大會決定。中央委員會委員出缺，由中央委員會候補委員按照得票多少依次遞補。
  range:
    start:
      line_hint: 1
      snippet: 中国共产党中央委员会
    end:
      line_hint: 3
      snippet: 員會每屆任期五年。中国共产党全國代表大會如果提前或延期舉行，它的任期相應地改變。中央委員會委員和候補委員必須有五年以上的黨齡。中央委員會委員和候補委員的名額，由全國代表大會決定。中央委員會委員出缺，由中央委員會候補委員按照得票多少依次遞補。
