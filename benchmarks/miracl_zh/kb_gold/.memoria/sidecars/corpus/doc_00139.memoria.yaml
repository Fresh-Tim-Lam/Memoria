- id: 10709#5
  name: 全国人民代表大会常务委员会委员长
  tags:
  - 全国人民代表大会常务委员会委员长
  description: 委员长和全国人民代表大会的任期相同，每届任期五年（1954年宪法每届任期四年）。1982年宪法第六十六条规定，“委员长、副委员长连续任职不得超过两届”。自1993年乔石当选全国人大常委会委员长起，委员长一直由中国共产党中央政治局常务委员会委员担任。吴邦国是文革结束后，唯一连任两届的委员长。
