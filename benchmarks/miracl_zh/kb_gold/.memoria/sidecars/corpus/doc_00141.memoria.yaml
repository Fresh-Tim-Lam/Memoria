  name: 陳水扁
  tags:
  - 陳水扁
  description: 陳水扁（），暱稱阿扁（），為中華民國臺南官田出身的政治人物、海商法律師，目前為民主進步黨籍。生於中華民國臺灣省臺南縣官田鄉西庄村（今臺南市官田區東西庄-{里}-），第十、十一任中華民國總統（2000年－2008年）。歷任民主進步黨主席、臺北市議會議員、立法委員、臺北市市長與民進黨籍的中華民國總統等職。陳水扁在2020年1月12日因支持的一邊一國行動黨政黨票失利而宣布退出政壇。
