- id: 11466#36
  name: 陳水扁
  tags:
  - 陳水扁
  description: 陳水扁曾經反對黨政合一，然而就任後數度兼任民進黨主席。該提案由謝長廷提出。謝長廷完成兩年黨主席任期不久，民進黨修改黨章，陳水扁正式以總統身份兼任黨主席。在2004年5月連任總統后，2004年12月立委選舉，陳水扁未能使泛綠取得過半，辭去黨主席職務，2007年10月回任，2008年1月再度因立委選舉敗選辭職。
  range:
    start:
