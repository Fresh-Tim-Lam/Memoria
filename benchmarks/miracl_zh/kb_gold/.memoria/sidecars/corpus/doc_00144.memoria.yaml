      snippet: 吴王杜伏威平定李子通（620年－621年）、林士弘（621年－622年）的战争，太子李建成平定刘黑闼（622年－623年）的战争。至624年消灭高开道、辅公祏后唐朝基本统一中原。628年，柴绍率军消灭依附突厥的梁师都，唐朝统一战争最终结束。
