  name: 哈利·波特
  tags:
  - 哈利·波特
  description: 《哈利波特》（），英國作家J·K·羅琳的青少年奇幻文學系列小說，描寫主角哈利波特在霍格華茲魔法學校7年學習生活中的冒險故事；該系列被翻譯成75種語言，在超過兩百個國家出版，所有版本的總銷售量5億，名列世界上最暢銷小說之列。正體中文版由皇冠文化出版。美國華納兄弟電影公司把這7集小說改拍成8部電影，前6集各一部，第7集分兩部。哈利波特電影系列是全球史上最賣座的電影系列，總票房收入過77億美元，在多國上映。此外還有位於佛羅里達的主題樂園，與大量衍生作品，使作者羅琳本人在此作品完成後
  range:
    start:
