      snippet: 這7集小說改拍成8部電影，前6集各一部，第7集分兩部。哈利波特電影系列是全球史上最賣座的電影系列，總票房收入過77億美元，在多國上映。此外還有位於佛羅里達的主題樂園，與大量衍生作品，使作者羅琳本人在此作品完成後躋身英國最富裕的女性人物之列。
