  description: 北冰洋（）又稱北極海（Arctic Sea）、北大洋或北極洋，位於北極圈內，大致以北極點為中心。北冰洋是世界五大洋中最小最淺的。-{面}-積1405.6萬平方公里，約占世界大洋-{面}-積的3.6%。平均深度1200-1300米，為世界大洋平均深度的三分之一。最深處為南森海盆，深度為5450米。
