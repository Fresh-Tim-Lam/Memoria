  name: 北冰洋
  tags:
  - 北冰洋
  description: 北冰洋海底大陆架很广阔，面积约440万平方公里，占北冰洋面积的1/3，深海区在大洋中所占的比例很小。在亚欧大陆以北，大陆架从海岸一直延伸约1000公里，最宽处可达1200多公里；在阿拉斯加以北，大陆架比较窄，只有20多公里。
