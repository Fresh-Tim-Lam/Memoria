  name: 印度洋
  tags:
  - 印度洋
  description: 印度洋（），位于亚洲、非洲、大洋洲和南极洲之间，印度位在印度洋北部的中央位置，這也是印度洋名稱的由來，印度洋大部分在南半球。總面积7491万平方公里，约占世界海洋总面积的21.1%，是世界第三大洋。印度洋的範圍北至印度次大陸及阿拉伯半島（南亞及西亞）；西達東非；東側則以印度尼西亞、巽他群島及澳大利亞為界；南迄南冰洋（也有定義至南極洲）。印度洋西面于开始于厄加勒斯角的东经20°处与大西洋相接，东面于东经146°55'处与太平洋相接。印度洋的最北边大概为波斯湾内北纬30°处。印度
