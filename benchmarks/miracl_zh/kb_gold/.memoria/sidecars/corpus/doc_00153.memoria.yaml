- id: 17358#0
  name: 心率
  tags:
  - 心率
  description: 心率（）是指心脏收縮（contractions）跳动的頻率（beats）和每分钟跳动的次数（bpm），正常人平静时（安靜心率）每分钟60到100次（60~100bpm(次/分鐘)），運動時心跳會加速，心肺功能較好的運動員會比正常人的心跳要慢。
