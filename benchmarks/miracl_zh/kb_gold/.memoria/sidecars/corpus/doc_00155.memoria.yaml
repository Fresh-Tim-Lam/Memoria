  description: 富兰克林·德拉诺·罗斯福（，, ，，姓名簡稱為），民主黨籍政治人物，第32任美國總統，荷兰裔美国人，紐約市羅斯福家族出身。是美國1920至1930年代經濟危機和第二次世界大戰的中心人物之一。从1933年至1945年間，連續出任四屆美國總統，且是唯一連任超過兩屆的美國總統。
    富兰克林·罗斯福的远房堂兄狄奧多·罗斯福是第26任美国总统，故在中文世界經常称呼富兰克林·罗斯福为“小罗斯福”总统。
