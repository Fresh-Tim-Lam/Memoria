  name: 维尔纳·海森堡
  tags:
  - 维尔纳·海森堡
  description: 维尔纳·海森堡（，），德国物理学家，量子力学创始人之一，“哥本哈根学派”代表性人物。1933年，海森堡因為“创立量子力学以及由此导致的氢的同素异形体的发现”而獲得1932年度的诺贝尔物理学奖。他对物理学的主要贡献是给出了量子力学的矩阵形式（矩阵力学），提出了“不确定性原理”（又称“海森堡不确定性原理”）和S矩阵理论等。他的《量子论的物理学原理》是量子力学领域的一部經典著作。
