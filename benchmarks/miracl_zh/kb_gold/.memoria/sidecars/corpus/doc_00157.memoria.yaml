- id: 18658#5
  name: 北宋
  tags:
  - 北宋
  description: 宋朝的開國皇帝是趙匡胤，庙号太祖。他本來是后周的殿前都點檢，掌管禁軍，乃職業軍人。趙匡胤由於戰功卓著，成為了後周世宗的左膀右臂。世宗死後，繼位的恭帝年幼，后通過陈橋兵變奪取後周政權，建立北宋王朝。
