  description: 坦克炮主要分为滑膛式和线膛式两类。在坦克上多装在可以360度回转的装甲炮塔内以获得最大的攻擊效能，並配備裝甲防护，与观瞄火控设备、自动装弹机和炮塔回转机构组成坦克的武器系统。
