- id: 19913#12
  name: 坦克炮
  tags:
  - 坦克炮
  description: 坦克炮本身在技术上的进步有限。历史上大多数坦克炮都是线膛炮，但多数现代坦克装备的都是滑膛炮。膛线使炮弹作纵轴旋转有利弹道稳定和精准度，但发射新式尾翼稳定脱壳穿甲弹却必须要滑膛炮。这类动能弹，包括更早期的穿甲弹和实心弹，通常是最好的反坦克武器，但它们的穿透力和精准度却会随射程降低。高爆破甲弹能有效对坦克作远程打击，但其精准度也是有限的。如果射程拉得极远，则炮射导弹可能更加准确。
