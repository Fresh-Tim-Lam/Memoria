    end:
      line_hint: 3
      snippet: 举动可能引发大范围动荡。这是美国总统首次作出这一表态，引发中东多国强烈反对，警告此举可能引发“危险后果”，破坏巴以和平进程。美国和以色列在宣布承认耶路撒冷为以色列首都后，Yandex英文版和谷歌在地圖搜索结果中将耶路撒冷显示为以色列的首都。
