  name: 耶路撒冷
  tags:
  - 耶路撒冷
  description: 目前，以色列已经立法确定耶路撒冷是其永久不可分割的首都，以色列政府、议会、最高法院等机构均位于耶路撒冷。而巴勒斯坦民族权力机构也声称未来巴勒斯坦国的首都将设在东耶路撒冷。目前，巴勒斯坦在该市最醒目的正式存在是东方大厦，20世纪末巴勒斯坦解放组织的总部。俄罗斯、澳大利亚和巴西等国仅承认西耶路撒冷为以色列首都。
    2017年12月6日，美国总统唐纳德·特朗普宣布在不界定耶路撒冷边界范围的前提下承认耶路撒冷为以色列首都，基於，不簽署中止令，启动美驻以使馆迁往耶路撒冷的进程。美国在中东
  range:
    start:
      line_hint: 1
