  description: 劍橋大學在眾多排行榜中，均在十強之列，並經常與牛津大學爭奪“全英最佳”之名譽。個別學科方面，則以數理見長。泰晤士高等教育的《世界聲譽排名》於2021年將劍橋列作全球第六。QS世界大學排名在2021年則為全球第七。
