  name: 中国国家博物馆
  tags:
  - 中国国家博物馆
  description: 中国国家博物馆，简称国家博物馆或国博，位于中国北京市东城区东长安街16号、天安门广场东侧。总建筑面积近20万平方米，藏品数量140余万件，展厅数量48个，是世界上单体建筑面积最大的博物馆，是中华文物收藏量最丰富的博物馆之一。
