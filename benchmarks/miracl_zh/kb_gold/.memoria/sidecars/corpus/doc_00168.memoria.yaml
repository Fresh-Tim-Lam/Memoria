  name: 文森特·梵高
  tags:
  - 文森特·梵高
  description: 1890年2月至4月間，梵高病情加劇。難以書寫及進行創作。在後來寫給西奧的書信中，梵高說：“（那段時期）我只依照對北方的回憶畫了幾幅小作品”。梵高讓弟弟和母親把他1880年代的作品寄過來以便進一步完善，《在永恒之門》就是這樣完成的。
