- id: 22632#0
  name: 平安时代
  tags:
  - 平安时代
  description: 平安时代（，794年-1185年）是日本古代的最后一个历史时代，它从794年桓武天皇将首都从長岡京（784年至794年）移到平安京（现在的京都）开始，結束時間歷史學界多以1185年源赖朝獲得朝廷，即獲得各令制國守護與地头任命權，作為平安時代與鎌倉時代的分野，不過民間過去多以1192年源賴朝受封征夷大將軍，作為鐮倉時代的開始。
