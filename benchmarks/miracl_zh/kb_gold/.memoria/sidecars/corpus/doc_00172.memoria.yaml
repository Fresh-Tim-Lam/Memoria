  description: 甲骨文公司（）是一間全球性的大型企業科技軟件公司，总部位于美国得克薩斯州奧斯汀。現任董事長兼CTO為公司創辦人劳伦斯·埃里森，CEO為凱芝。至2019年，甲骨文是繼微软後，全球收入第二多的软件公司。
