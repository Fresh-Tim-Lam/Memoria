  name: 南沙群岛
  tags:
  - 南沙群岛
  description: 南沙群岛（亦称斯普拉特利群岛，，越南稱長沙群島，），古稱萬里長沙或万里石塘，是南中国海四大群島中位置最南、岛礁最多、分布最广的一组群岛，地理上位于北纬3°40′-11°55′和东经109°30′-117°50′。南北长500多海里，东西宽400多海里，总面积约90万平方公里，由230多个岛、洲、礁、沙和滩组成，露出水面的約占总数的1/5，目前已定名的約192个，總陸地面積约17.06平方公里。
