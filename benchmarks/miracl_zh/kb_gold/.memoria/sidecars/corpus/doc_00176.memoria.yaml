  description: 南沙群岛位于北纬3°35′～11°55′，东经109°30′～117°50′，东西长约905公里，南北宽约887公里，海域面积为88.6万平方公里。其西北与越南相对，东北与菲律宾隔海相望，南部水域与马来西亚、文莱、印度尼西亚等国沿海相接。南海的地质构造比较复杂，主要以大陆架、大陆坡、中央海盆三个部分呈环状分布。其中南沙群岛形成于南海陆坡区的南沙台阶上，处于多山的海底高原上。南沙群岛共有大小岛礁200多个，一般按照它们在海面上下的位置分为五类：岛、沙洲、暗礁、暗沙、暗滩等。南沙
