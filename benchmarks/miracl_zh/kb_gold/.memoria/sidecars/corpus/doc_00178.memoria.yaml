- id: 23607#0
  name: 九龍
  tags:
  - 九龍
  description: 九龍（），與香港島及新界同為香港三大地域之一。九龍位於香港境內的地理中心，三面環海，與南面的香港島隔維多利亞港相望。香港十八區中的五區屬於九龍，分別是深水埗區、油尖旺區、九龍城區、黃大仙區、觀塘區。九龍連同新界在中國古籍稱為九龍半島。
