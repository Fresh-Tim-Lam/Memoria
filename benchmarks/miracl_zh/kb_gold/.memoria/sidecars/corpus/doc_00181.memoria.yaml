- id: 24666#11
  name: 中国画
  tags:
  - 中国画
  description: 明朝初期，崇尚宋代畫風的畫家在宮廷、民間相當普遍，另一方面則有力求把宋朝畫重生及轉化。由畫家戴進領導的「浙派」對當時畫風影最大。明朝中期經濟繁華，蘇州形成「吳門畫派」，其中以沈周、文徵明、唐寅、仇英四家最為著名。他們的作品大多以表現江南文人優雅閒適的生活。到了明朝後期，隨著社會思潮的活躍，士大夫文人畫更是向獨抒性靈發展，以畫為樂、以畫為寄。
