  description: 美國内戰（），中文通稱南北战争，是美國歷史上最大規模的内战，發生於1861至1865年期間。參戰雙方為北方的美利堅合眾國（簡稱“联邦”，Union）和南方的美利堅聯盟國（簡稱“邦联”，Confederate）。
