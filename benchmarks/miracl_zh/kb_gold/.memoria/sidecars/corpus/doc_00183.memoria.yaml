- id: 25596#32
  name: 南北战争
  tags:
  - 南北战争
  description: 1861年7月东战场展開马納沙斯会战。7月21日，北方发起向南方首都里士满进军的攻势，3.5万北方军队排着整齐队形，在军乐声中向里士满进军。由于北軍事先大张声势，认为南军不堪一击，加上这一天是星期六，于是许多华盛顿市民、国会议员、记者等身着盛装，携妻带子，提着装有野餐的篮子，有的坐马车，有的随军队步行，像过节一样，前来战地观光，看热闹。
