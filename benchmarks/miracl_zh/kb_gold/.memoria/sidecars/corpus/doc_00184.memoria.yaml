- id: 26216#1
  name: 会计准则
  tags:
  - 会计准则
  description: 会计准则的制订主体有两类：在奉行大陆法系的国家，会计规范一般采用法定主义。即会计事务的处理规则从属于税法，国家制订了一系列具体的会计法规、甚至包括统一的会计科目表，如法国、德国。在奉行普通法的国家，会计准则由民间专业团体制订、并在实践上被税法、证券法所承认，如美国的《公认会计原则》（GAAP），以及国际会计准则委员会的《国际会计准则》（IAS）。
  range:
