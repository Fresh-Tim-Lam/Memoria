- id: 26459#0
  name: 维吾尔族
  tags:
  - 维吾尔族
  description: 維吾爾人（），古稱回鶻或畏兀儿，是生活在歐亚大陆內陆的突厥語民族，主要使用属突厥语族的维吾尔语和以波斯阿拉伯字母为基础的维吾尔老文字。大部分维吾尔人信仰伊斯兰教逊尼派。1934年，中華民國新疆省发布政府令，统一使用“维吾尔”作为汉文规范称谓。目前，维吾尔族主要分布在中国新疆和中亚地区，生活在中国新疆维吾尔自治区的约1300万维吾尔人，是中華人民共和國官方统计的55个少數民族之一。
