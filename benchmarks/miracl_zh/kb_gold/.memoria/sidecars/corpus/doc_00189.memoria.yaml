  name: 聖經
  tags:
  - 聖經
  description: 聖經（；； ; ，原意「書」）是猶太教與基督教（包括新教、天主教、東正教）重要的經典。猶太教的圣经只有《塔納赫》（被基督教称为旧约）。基督教的圣经是包含舊約與承接的新約兩部。
