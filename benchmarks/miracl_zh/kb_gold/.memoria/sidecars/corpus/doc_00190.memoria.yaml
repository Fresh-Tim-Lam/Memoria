- id: 30103#36
  name: AC米兰
  tags:
  - AC米兰
  description: 19/20夏季與冬季转会窗口，AC米兰前后签下莱奥、凯西、特奥、本·纳赛尔、杜阿尔特、雷比奇、萨勒马克尔斯、克亚尔、伊布等球员，夏窗转会费支出超1亿欧元。与此同时，库特罗内、洛卡特利、皮亚特克等球员也先后租借/转会离队。
