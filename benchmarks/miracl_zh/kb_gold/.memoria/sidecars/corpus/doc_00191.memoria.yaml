- id: 30139#4
  name: 中国政法大学
  tags:
  - 中国政法大学
  description: 1983年，中共中央指示“要抓紧筹办中国政法大学，把它建成中国政法教育中心”，北京政法学院与中央政法干校合并，组建为中国政法大学。邓小平亲自选任校长并为学校题写校名。80年代，学校开始在北京昌平县城（今北京市昌平区城北街道）建设新的校区。
