- id: 31136#14
  name: 隋炀帝
  tags:
  - 隋炀帝
  description: 隋炀帝在营建东都的同时，又下令开凿大运河。隋朝大运河以洛阳为中心，分为三大段。中段包括通济渠与邗沟。通济渠北起洛阳，东南入淮水。邗沟北起淮水南岸之山阳（今江苏淮安），南达江都（今扬州）入长江。南段名江南河，北起长江南岸之京口（今镇江），南通余杭（今浙江杭州）。北段名永济渠，南起洛阳，北通涿郡（今北京城西南）。大运河分段开凿，前后历时五年，全长两千七百余公里，是世界著名的伟大工程之一，后经元朝取直疏浚，全长1794公里，成为现今的京杭大运河，京杭大运河利用了隋朝大运河不少河段，
  range:
    start:
      line_hint: 1
      snippet: 隋炀帝
    end:
      line_hint: 3
      snippet: 现今的京杭大运河，京杭大运河利用了隋朝大运河不少河段，缩短了900多公里的航程。开凿大运河的目的是为了加强中央对东方和南方的统治，同时也是为了从南方漕运粮食和便利对东北用兵。大运河对中国南北的经济、文化交流和巩固国家的统一都起了巨大的作用。
