- id: 31152#15
  name: 台灣地理
  tags:
  - 台灣地理
  description: 臺灣氣候以通過中南部嘉義縣的北回歸線為界，將臺灣南北劃為兩個氣候區。以北為副熱帶季風氣候，以南為熱帶季風氣候（夏吹西南風，冬吹東北風）。冬季溫暖（山地低於平地、北部低於南部）、夏季炎熱（除山地外，其餘皆在20℃以上）、雨量多（山地多於平地、東岸多於西岸、北部多於南部）。五、六月為梅雨季，六至九月為颱風季，於冬天時偶有寒流。只有儲量不多的煤、黃金、銅、硫磺、天然氣、石灰岩、大理石和石棉。
