- id: 31363#0
  name: 瑞典國旗
  tags:
  - 瑞典國旗
  description: 瑞典國旗即瑞典王國的國旗，於1906年6月22日正式制定。在1157年，瑞典國王埃里克九世於遠征芬蘭前向神禱告，突然看到如同金色十字架的光芒橫越青空。根據這個傳說，藍底金十字與藍底金王冠的圖案成為了瑞典的國家象徵。也有指金十字是來自瑞典福爾孔王朝（House
    of Folkung）中的金色十字架，並以藍底為本而設計的。
