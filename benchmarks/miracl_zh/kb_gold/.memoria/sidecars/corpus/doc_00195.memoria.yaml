- id: 31390#0
  name: 穀梁傳
  tags:
  - 穀梁傳
  description: 《穀梁傳》是《春秋穀梁傳》的简称，是一部对《春秋》的注解，与《左传》、《公羊传》同为解说《春秋》的三传之一。传说孔子的弟子子夏将这部书的内容口头传给战国時魯國人穀梁子，穀梁子将它写记录下来，學者認為此書原本是口頭傳授，其成书时间是在汉朝，由學派門人集結而成。
  range:
    start:
