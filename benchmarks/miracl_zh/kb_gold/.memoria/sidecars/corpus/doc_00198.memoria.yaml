- id: 32471#22
  name: 叙利亚
  tags:
  - 叙利亚
  description: 兵种有陆军，海军，空军和防空部队。现役部队的人数为20万，预备役为160万人。正规职业军人中95%是阿萨德家族所属的阿拉维派，而军官中的阿拉维派更是占98%。叙利亚共和国卫队和第四机械装甲部队是叙利亚的精锐部队，几乎全部由阿拉维派组成，并且都由总统巴沙尔的弟弟马赫尔·阿萨德亲自领导指挥。这样的组成结构目的是确保军队对总统家族的绝对效忠。至2015年敘利亞政府軍因內戰耗損已由原本的30萬正規軍，降至15萬正規軍。
