- id: 33298#21
  name: 秘鲁
  tags:
  - 秘鲁
  description: 赫克托弗洛雷斯博士认为，馬鈴薯起源的最有可能的地方是位于秘鲁南部和玻利维亚东北部之间，现在的的喀喀湖岸边的考古将该地区的历史推至前400年，智利和秘鲁都自认是馬鈴薯的原产地
    。环球时报等稱秘鲁為世界「馬鈴薯之乡」。智利和秘鲁一度争执不下，秘鲁打算过提交至联合国解决。在秘鲁倡议下，2005年12月第60届联合国大会最终将2008年定为“国际马铃薯年”。
