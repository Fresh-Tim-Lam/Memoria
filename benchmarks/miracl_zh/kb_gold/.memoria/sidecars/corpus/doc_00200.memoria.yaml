      snippet: 该地区的历史推至前400年，智利和秘鲁都自认是馬鈴薯的原产地 。环球时报等稱秘鲁為世界「馬鈴薯之乡」。智利和秘鲁一度争执不下，秘鲁打算过提交至联合国解决。在秘鲁倡议下，2005年12月第60届联合国大会最终将2008年定为“国际马铃薯年”。
