- id: 33484#0
  name: 室女座
  tags:
  - 室女座
  description: 室女座（，天文符號：♍），是最大的黄道帶星座，面积1294.43平方度，占全天面积的3.318%，在全天88个星座中，面积排行第二位，仅次于長蛇座。室女座中亮于5.5等的恒星有58颗，最亮星为角宿一（室女座α），视星等为0.98。每年4月11日子夜室女座中心经过上中天。现在的秋分点位于右执法（室女座β）附近。
