- id: 35016#10
  name: 日本料理
  tags:
  - 日本料理
  description: 由于日本是海岛型国家，日本人相当喜好海产品，因此生食成為了日本料理當中的一項特色，例如鮪魚、鲑鱼、河豚、章鱼、贝类、虾蟹类和海草等海產物均可以作刺身食用，甚至牛肉、馬肉、雞肉和雞蛋都可以生食入菜。
