- id: 35232#25
  name: 呼吸系統
  tags:
  - 呼吸系統
  description: 肺部除了進行氣體交換外，也有許多代謝和內分泌上的機能。肺部會產生表面活性剂，也有可以溶解肺血管血栓的纤维蛋白溶解系统。肺部會分泌許多物質，由動脈送到全身，也會從去除血管中的一些物質。在血液循環時，前列腺素會減少甚至消失，但當肺組織伸展時，肺部會合成前列腺素，釋放到血液中。
  range:
    start:
      line_hint: 1
      snippet: 呼吸系統
    end:
