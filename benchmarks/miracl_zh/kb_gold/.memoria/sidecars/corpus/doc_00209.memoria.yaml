- id: 35719#1
  name: 美国国务院
  tags:
  - 美国国务院
  description: 美国国务院是美国最龐大的政府機構之一；其行政首長为国务卿（，意即国务部长），现任的国务卿是安東尼·布林肯。美国国务院总部设在美国首都华盛顿雾谷地區C街2201号的杜鲁门大楼，离白宫只有几个街区距离。因此「霧谷」（Foggy
    Bottom）有時也作為國務院的代稱。
