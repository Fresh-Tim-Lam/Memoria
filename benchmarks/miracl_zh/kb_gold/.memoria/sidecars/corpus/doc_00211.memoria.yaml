- id: 36969#20
  name: 辽朝
  tags:
  - 辽朝
  description: 遼朝的宗教以佛教和薩滿教為主，此外也崇拜契丹祖先和民間信仰。民族信仰有木葉山崇拜、天地崇拜與拜日神、拜山神等。木葉山崇拜源自契丹始祖出現與契丹八部興起的傳說，帶有薩滿教的文化背景。契丹族於木葉山（今內蒙古西拉木倫河與老哈河合流處）興建契丹祖廟以祭拜始祖，最後發展成遼朝皇室的柴冊儀。
    遼朝佛教基本上繼承盛唐的教學佛教。早在唐朝唐武宗發動滅佛事件時因為河北諸藩鎮不聽從，大量僧侶與佛教文物流向河北地區，使得當地佛教文化蓬逢發展。902年龍化州建開教寺，為佛教北傳契丹的起始點。918
  range:
    start:
      line_hint: 1
      snippet: 辽朝
    end:
      line_hint: 3
      snippet: 及佛畫，河北豐潤天寶寺塔發現的佛經，內蒙古巴林右旗釋迦佛舍利塔中發現的佛經，堪稱佛教藝術瑰寶。遼朝完成以《大般若經》為首的主要佛教石刻，於遼興宗時期出版的《契丹大藏經》，其地位僅次於宋朝宋太祖時期開版《蜀版大藏經》，在佛典史上佔有重要地位。
