  description: 截至2022年底，世界人口超过80亿，联合国估计在2050年时将达到90至100亿。2022年，人口最多的国家是中国（14亿5千万）、印度（14亿1千万）、美国（3亿3千万）、印尼（2亿8千万）、巴基斯坦（2亿3千万）、巴西（2亿1千5百万）、尼日利亚（2亿1千5百万）、孟加拉国（1亿7千万）、俄罗斯（1亿4千5百万）、墨西哥（1亿3千万）、日本（1亿2千5百万）等。一般来说，发达国家和地区的人口增长速度很慢，很多国家甚至已经是负增长。而開發中國家的增长速度却没有放慢。
