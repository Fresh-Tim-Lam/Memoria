  name: 史蒂芬·霍金
  tags:
  - 史蒂芬·霍金
  description: 雖然在校內被暱稱為「愛因斯坦」，但霍金初時在學術上的成績並不成功。隨著時間的推進，開始表現出對科學主題具相當的才能，而受到撻塔老師的啟發，霍金決定要在大學裡讀數學。由於霍金的父親擔憂數學系的畢業生就業機會很少，於是建議他主修醫學，並要求兒子到他的母校牛津大學就讀。但當時牛津大學沒有主修數學的課程，霍金因此決定主修物理與化學。儘管當時校長的建議要等到明年才入讀，然而霍金在1959年3月的入學考試中的物理部分幾乎獲得滿分，面試也進行的很順利，並在考試後取得獎學金，他獲准在牛津大學
  range:
