      snippet: 校牛津大學就讀。但當時牛津大學沒有主修數學的課程，霍金因此決定主修物理與化學。儘管當時校長的建議要等到明年才入讀，然而霍金在1959年3月的入學考試中的物理部分幾乎獲得滿分，面試也進行的很順利，並在考試後取得獎學金，他獲准在牛津大學主修物理
