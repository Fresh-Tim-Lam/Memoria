  name: 史蒂芬·霍金
  tags:
  - 史蒂芬·霍金
  description: 在牛津大學主修物理需要念完三年課程，在這期間沒有任何考試，只有在最後有個畢業考試，必須通過畢業考試，才可獲得學士學位。霍金估算他大約平均每天讀書一小時，在牛津的三年間一共讀書1,000小時，這樣懶散的讀書習慣的確讓畢業考試成為他嚴竣的挑戰。霍金完全明白自己的狀況，他決定只回答理論物理學的考題，而忽略那些需要實際知識的考題。那時期，在理論物理學裡有兩個尖端的研究領域，一個是宇宙學，另一個是粒子物理學。霍金認為宇宙學比較具挑戰性，涉及到很多深邃奧妙的大問題，而當時在英國最具盛名的
  range:
    start:
      line_hint: 1
      snippet: 史蒂芬·霍金
    end:
      line_hint: 3
      snippet: 譽學士學位。柏爾曼對這事件給出評論：那些考官「有智慧得足以知道他們正在跟一個遠比那裡大多數人聰明得多的對象交談。」他在自然科學取得一級榮譽和榮譽文憑後，霍金跟朋友到伊朗旅行，然後他於1962年10月在劍橋大學三一學堂開始了他的研究生的學業。
