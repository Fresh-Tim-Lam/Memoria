- id: 39793#15
  name: 英国
  tags:
  - 英国
  description: 英国地處中緯，常年受西風帶控制，北大西洋暖流流經，全年溫和多雨，為溫帶海洋性氣候。四季气温甚少低于-11C°，高于35C°。7月平均气温13-17℃。风多从西北方吹来，带来大西洋的潮湿天气，东部位於西風的背風地帶，所以东部較西部干燥。夏季最温暖的是英格兰南部，因为它緯度較低且城市熱島效應較強，而较寒冷的是緯度較高的蘇格蘭北部。冬季和高地的早春多大雪。
