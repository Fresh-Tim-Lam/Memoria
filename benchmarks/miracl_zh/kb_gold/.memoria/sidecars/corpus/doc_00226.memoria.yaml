- id: 40427#3
  name: 皮蛋
  tags:
  - 皮蛋
  description: 皮蛋的制作方法之一是用輕鹼的化學物質混合石灰泥和米糠包裹在鸭蛋外面放在陰涼處三個月以上，米糠作用是分隔每顆皮蛋。储存一段时间后，鸭蛋内部产生变化，蛋清凝结为胶冻状、变成半透明黑色，上面有许多淡黄色花纹，极似松树针状叶，故又名松花蛋。蛋黄溏化，稀软金黄。使用时不必再烹调，中医认为皮蛋性寒，最好加些食醋和薑末。
  range:
    start:
      line_hint: 1
      snippet: 皮蛋
