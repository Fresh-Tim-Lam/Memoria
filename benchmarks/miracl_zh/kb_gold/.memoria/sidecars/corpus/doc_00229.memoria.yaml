  description: 卡梅隆电影的突破开始于他的特效小组，该特效小组的工作开始于《终结者》。而后来他导演的《终结者2：审判日》是少量使用电脑特技，该片最终获得了奥斯卡的最佳视觉效果、最佳混音、最佳化妆和最佳音效剪辑四项大奖。卡梅隆在1997年导演的电影《泰坦尼克号》同样大范围地使用了电脑特技，也获得了奥斯卡最佳视觉效果奖。《泰坦尼克号》成为当时投资最为昂贵、票房收入最高也是投资回报最为丰厚的电影。在这部平了奥斯卡获奖记录的电影所获得的十一项大奖中，有三项是属于卡梅隆的，分别是最佳导演、最佳制片以及
