  name: 桓武天皇
  tags:
  - 桓武天皇
  description: 桓武天皇（；），是日本第五十代天皇（在位：781年4月3日－806年4月9日）。其父為光仁天皇，其母高野新笠是百濟武寧王的後裔。794年，桓武天皇将首都从長岡京移到平安京，是為日本平安時代的開始。
