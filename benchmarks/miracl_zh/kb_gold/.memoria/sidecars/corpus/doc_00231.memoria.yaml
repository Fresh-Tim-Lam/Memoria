- id: 43399#14
  name: 尼加拉瓜
  tags:
  - 尼加拉瓜
  description: 尼加拉瓜面積為130,967平方公里，約與希臘或亚拉巴马州相當，為中美地峽上面積最大的國家。尼加拉瓜國土位於北緯10至15度、西經79至88度間，尼加拉瓜在自然地理上主要可分為三個區域：東岸的加勒比沿岸低地、中央高地和西岸的太平洋沿岸低地。尼加拉瓜东岸臨加勒比海，又被稱作米斯基托海岸，海岸線540公里，有较宽阔的低地，主要是熱帶雨林及沼澤地帶；内陆为高原和山地，西岸臨太平洋，海岸線350公里，為全國人口最密集的區域，但多活火山及地震；西南部有中美最大湖泊尼加拉瓜湖。
