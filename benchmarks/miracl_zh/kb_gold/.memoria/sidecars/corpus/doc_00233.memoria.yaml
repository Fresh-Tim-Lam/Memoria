- id: 44621#10
  name: 加拿大政治
  tags:
  - 加拿大政治
  description: 加拿大刑事法律是聯邦政府的管轄範圍，並在全國執行。加拿大的民事法律，除魁北克省外，都是根據英格蘭的普通法。英國政府於1774年容許魁北克省採用法國的民事法。加拿大的法庭是分聯邦、省和市三級。
