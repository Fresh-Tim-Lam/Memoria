      line_hint: 1
      snippet: 加拿大
    end:
      line_hint: 3
      snippet: ，免税等优惠。 加拿大的司法机关有权解释法律和推翻议会的法案。 加拿大最高法院的九位大法官是由总理和司法部推荐后由总督委任，并由首席大法官（现任为贝弗利·麦克拉克林，首位女性首席大法官）领导。所有高等法院和上诉法院的法官都是由联邦政府任命。
