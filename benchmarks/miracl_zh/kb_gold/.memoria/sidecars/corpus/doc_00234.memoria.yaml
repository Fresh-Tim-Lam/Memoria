  name: 加拿大
  tags:
  - 加拿大
  description: 加拿大的法律体系以普通法为主，部分地区如魁北克继承了法国的成文法传统。加拿大宪法为该国的最高法律，由成文法以及不成文惯例组成。在1867年通过的宪法法令划分联邦政府与省政府的权力。在1931年的《西敏法令》使其在立法上有进一步的自主权，而在1982年通过的另一套更令它在立法上完全独立，脱离英国的控制。那套法令同时修改原有的宪法，并加入《加拿大權利與自由憲章》，这宪章保障加国公民的基本权利。通常政府不能凌驾这宪章，但是因令联邦议会以及省议会有权利去推翻宪章的某些部分。
    虽然不是
  range:
