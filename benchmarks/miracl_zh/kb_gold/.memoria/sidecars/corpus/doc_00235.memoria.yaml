- id: 45014#2
  name: 中国电视金鹰奖
  tags:
  - 中国电视金鹰奖
  description: 首届金鹰奖于1983年在昆明举行，共有9大类奖项，但作为第一个带有民间性的评奖活动受到了社会和媒体的广泛关注。当时中国中央电视台以及各省电视台的导演、编剧均如期到场，当时演艺界有关牧村、郑绪岚、王洁实等当时众多的知名歌唱演员前往参加演艺活动，奖品即一个奖杯，之后演变为一位女性手中高举一只展翅雄鹰的形象。
