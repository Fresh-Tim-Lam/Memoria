  name: 武夷山市
  tags:
  - 武夷山市
  description: 2009年武夷山的茶叶产量达9327吨，茶叶加工产值6.7亿元。茶品牌武夷岩茶在中国茶叶界有较高的知名度，1980年代被评为中国十大名茶之一，且为中国地理标志产品；而大红袍则是武夷山茶叶中的极品，属于受国家保护的原产地域产品，异常珍贵。据媒体报道，大红袍茶叶制作、保管非常特殊，其日常存放地是中国农业银行的金库，搬运移动都有武装护卫，普通人很难看到。除大红袍外，还有“名枞”、“肉桂”、“水仙”、“奇种”等茶叶品种。目前已有大红袍茶叶被中国国家博物馆收藏，开博物馆收藏茶叶之先河。
  range:
    start:
      line_hint: 1
      snippet: 武夷山市
    end:
      line_hint: 3
      snippet: 外，还有“名枞”、“肉桂”、“水仙”、“奇种”等茶叶品种。目前已有大红袍茶叶被中国国家博物馆收藏，开博物馆收藏茶叶之先河。另外，武夷岩茶(大红袍)制作技艺还被列入国家级非物质文化遗产名录。大红袍茶叶还曾被作为中华人民共和的国礼赠与外国政要。
