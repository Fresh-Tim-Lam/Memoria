  name: 司马懿
  tags:
  - 司马懿
  description: 司馬懿家族數代為官，高祖父司馬鈞為漢安帝時的征西將軍，曾祖父司馬量為豫章太守，祖父司馬儁為潁川太守，父親司馬防為京兆尹。司馬防有八子，因字中都有一個“達”字，當時號稱司馬八達。司馬懿是司馬防的次子，出生于漢靈帝光和二年（179年）。司馬懿少年時期就胸懷謀略，當時正是東漢末年亂世，司馬懿「常慨然有憂天下心」。素以知人善任著稱的南陽太守楊俊曾見過少年司馬懿，他說司馬懿絕非尋常之子。尚書崔琰與司馬懿的兄長司馬朗交好，曾對司馬朗說：「你弟弟聰明懂事，做事果斷，英姿不凡，不是你所能比得
  range:
