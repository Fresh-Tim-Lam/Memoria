      snippet: 胸懷謀略，當時正是東漢末年亂世，司馬懿「常慨然有憂天下心」。素以知人善任著稱的南陽太守楊俊曾見過少年司馬懿，他說司馬懿絕非尋常之子。尚書崔琰與司馬懿的兄長司馬朗交好，曾對司馬朗說：「你弟弟聰明懂事，做事果斷，英姿不凡，不是你所能比得上的。」
