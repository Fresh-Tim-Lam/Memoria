- id: 49647#1
  name: 期货
  tags:
  - 期货
  description: 期貨是一種衍生性金融商品，按現貨標的物之種類，期貨可分為商品期貨與金融期貨兩大類。參與期貨交易者之中，套戥者（或稱對沖者）透過買賣期貨，鎖定利潤與成本，減低時間帶來的價格波動風險。投機者則透過期貨交易承擔更多風險，伺機在價格波動中牟取利潤。
