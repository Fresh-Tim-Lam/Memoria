      snippet: 市。 士林夜市原本是以小吃與攤商而興起，迄今仍以此為主；然而由於士林夜市的規模與商機極大，周邊地主紛紛開設店面趕上商機。在攤販並未完全合法的城市裡，士林夜市與其他大型固定夜市共同維繫著這一特殊的文化現象，也成為台北市民夜生活的經常去的地方。
