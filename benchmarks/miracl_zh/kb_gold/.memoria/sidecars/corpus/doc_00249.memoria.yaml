  name: 忍者龜
  tags:
  - 忍者龜
  description: 忍者神龟最早于1984年出现在新罕布什尔州多佛市由幻影工作室出版的漫画书中。这个概念源自凯文·伊斯特曼和彼得·莱尔德在某个休闲夜晚一边看着糟糕电视一边进行头脑风暴时所绘出的草图。
    这些年轻的艺术家就利用退税款和伊斯特曼叔叔的贷款而自费发行了一本单期漫画书，而这本漫画书旨在戏仿漫威漫画的夜魔侠和，以及的和弗兰克·米勒的。 自1984年以来，《忍者神龟》系列漫画书历经多家出版社。
