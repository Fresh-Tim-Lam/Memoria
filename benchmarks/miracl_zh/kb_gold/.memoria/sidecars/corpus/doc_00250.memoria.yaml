- id: 51593#5
  name: 世界大戰
  tags:
  - 世界大戰
  description: 第二次世界大戰發生在亞洲和歐洲，雖然早在1937年日本便與中國爆發了中日戰爭，不過大多數人仍多把第二次世界大戰的爆發定為1939年9月1日德國入侵波蘭開始，自1939年末期到1941年初期為止，發動一連串戰爭並藉由條約的簽署使得納粹德國和義大利王國幾乎佔領了歐洲絕大部分的地區，包括法國、比利時、荷蘭、丹麥、挪威、南斯拉夫、希臘，只有匈牙利王国、羅馬尼亞王國和保加利亞王國為德国義大利盟友。而名義上保持中立的蘇聯在和德國簽訂《德蘇互不侵犯條約》後，也陸續佔領或者吞併了其在歐洲邊界
  range:
    start:
      line_hint: 1
      snippet: 世界大戰
    end:
      line_hint: 3
      snippet: 聯在和德國簽訂《德蘇互不侵犯條約》後，也陸續佔領或者吞併了其在歐洲邊界的波羅的海三小國，又佔領了芬蘭和羅馬尼亞的邊界领土。1941年6月歐洲的軸心國集團聯合芬蘭決定聯合入侵蘇聯領土，這次攻勢亦引致人類歷史上規模最大的地面战争-蘇德戰爭爆發。
