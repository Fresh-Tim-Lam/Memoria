  description: 越南戰爭（，；1961年－1975年），-{zh:簡稱越戰;zh-tw:簡稱越戰;zh-hk:全稱越南戰爭;zh-cn:简称越战;}-，又称第二次印度支那战争，是受中华人民共和国和苏联等国家支持的北越（越南民主共和国）協同南越“越南南方民族解放陣線”對抗受美国等国家支持的南越（越南共和国）的一場战争。其发生在冷战时期的越南（主战场）、老挝、柬埔寨，是二戰以後美國參戰人數最多的戰爭，影响极为深远，美国在越南战争中不堪消耗，遂逐步将军队撤出越南，最终北越击败南越并统一越南。综合国
