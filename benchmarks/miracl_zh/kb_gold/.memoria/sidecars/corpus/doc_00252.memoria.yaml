      snippet: 越南共和国）的一場战争。其发生在冷战时期的越南（主战场）、老挝、柬埔寨，是二戰以後美國參戰人數最多的戰爭，影响极为深远，美国在越南战争中不堪消耗，遂逐步将军队撤出越南，最终北越击败南越并统一越南。综合国力随之削弱，冷战的优势逐渐为苏联占据。
