  name: 墨西哥城
  tags:
  - 墨西哥城
  description: 墨西哥城（ ，缩写为CDMX），是墨西哥合眾國首都暨政治、經濟、文化等眾多領域的樞紐中心，亦為世界上最大的都市之一。墨西哥城位於墨西哥中部的高原地區中央，其與周圍的衛星城市原合稱墨西哥聯邦特區（México,
    D.F.），行政级别上與該國其他31個州（Estados）同等但在行政上直屬中央。
