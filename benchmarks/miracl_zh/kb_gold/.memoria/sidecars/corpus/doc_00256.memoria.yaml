  description: 下表所示的是大陆地区增加了字头0的电话区号，電話區號除了C1局城市均为8位以外，其他城市后面加"（8）"的为该区域电话为8位号码，未标注"（8）"的表示该区域电话号码为7位。对于区号末位数字，“0”排在“9”之后，为最大的数字。已废弃区号：
