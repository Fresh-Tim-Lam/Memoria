- id: 57945#0
  name: 明治维新
  tags:
  - 明治维新
  description: 明治維新（），是指日本明治时代初期的日本所推行的一系列重大复兴举措。明治維新前夕，日本在西方堅船利炮的衝擊之下，由一群有知者組成「薩長土肥」藩士成立的新政權在戊辰戰爭中消滅德川幕府和反抗者，推行版籍奉還，結束長達六百多年的武士封建制度，以藩閥和資本家取代武士階級的統治。日本在明治维新中通过推行“王政复古”以达到天皇亲政和議會政治（合議），建立三權分立的新式政府。經濟上推動了財政統一，穩定幕府後期嚴重負債的國家財政；並推行殖產兴业，掌握新式技术，實現国家工业化，生產力大幅提升。
  range:
    start:
      line_hint: 1
      snippet: 明治维新
    end:
      line_hint: 3
      snippet: ，並積極實現日韓合併，乃至於日後拓展海外殖民地等，日本出現了「脫亞入歐」的風氣，都源於此使國力大幅膨脹的變革，是日本近代史上的重要轉捩點。日本的明治维新十分有意义，因为它是当时亚洲众推行改革的国家之中，少數甚至可以說唯一成功改革的国家之一。
