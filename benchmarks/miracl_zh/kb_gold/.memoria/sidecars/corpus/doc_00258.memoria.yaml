- id: 57945#10
  name: 明治维新
  tags:
  - 明治维新
  description: 後來，政府內倒幕派與德川派的鬥爭漸趨白熱化。1868年1月3日，明治天皇颁布“王政复古大号令”，宣布废除幕府，并命令德川庆喜“辞官纳地”，将一切权力重新归於天皇。当倒幕派得知德川庆喜決定从大坂（今-{大阪}-）出兵進攻时，旋即派出以萨摩藩、长州藩成員为主力的军队，在京都附近的鳥羽、伏見兩地展开激烈战斗。经过三天的交戰，以寡擊眾的新政府，在新式軍隊與精良武器的助威下取得重大胜利，並決定乘勝追擊，派遣东征军攻打德川幕府的中心据点—江户。
