  description: 五條御誓文是日本明治天皇於慶應4年陰曆3月14日（1868年4月6日）发表的誓文。明治天皇親率文武百官在京都御所的正殿紫宸殿向天地、人民宣誓，揭示國是方針，堂堂開啟了明治維新的歷史序幕。
