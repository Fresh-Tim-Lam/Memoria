- id: 58858#0
  name: 中欧
  tags:
  - 中欧
  description: 中欧全称中部欧洲（德语：Mitteleuropa， 英语：Central Europe），是欧洲五个地理大区之一，包括德國、瑞士、列支敦士登、奧地利、匈牙利、波兰、捷克、斯洛伐克、斯洛文尼亞這九国。此概念在歷史中曾有過中斷，在冷戰時代因為把歐洲強行劃分成東西兩方，德國被拆分成東德西德，奧、瑞、列被當做西方陣營，維持民主和資本主義模式；而其餘算作東歐陣營，被改造成共產和社會主義模式，東歐民主化後，所有中歐國家都恢復舊有制度。
  range:
    start:
      line_hint: 1
      snippet: 中欧
    end:
      line_hint: 3
      snippet: 尼亞這九国。此概念在歷史中曾有過中斷，在冷戰時代因為把歐洲強行劃分成東西兩方，德國被拆分成東德西德，奧、瑞、列被當做西方陣營，維持民主和資本主義模式；而其餘算作東歐陣營，被改造成共產和社會主義模式，東歐民主化後，所有中歐國家都恢復舊有制度。
