  name: 雨林
  tags:
  - 雨林
  description: 全世界大多数雨林都位于季风槽地带，又被称作熱帶輻合帶。热带雨林目前分布在东南亚（从缅甸到菲律宾、马来西亚、印度尼西亚、巴布亚新几内亚以及澳大利亚东北部）、斯里兰卡、撒哈拉以南非洲（从喀麦隆到刚果）、南美（如亚马逊雨林）、中美以及太平洋三大島群。热带雨林曾被称作“地球之肺”，但是目前的研究结果表明，雨林通过光合作用对于大气中氧气的净增加量并不多。
