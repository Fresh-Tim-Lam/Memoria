  name: 巴拿马运河
  tags:
  - 巴拿马运河
  description: 巴拿馬運河（）位於中美洲的巴拿馬，橫穿巴拿馬地峽，連接太平洋與大西洋，全長82公里，大致呈西北－东南走向。運河最寬處達304米，最窄處也有152米，是世界的航運要道之一。
