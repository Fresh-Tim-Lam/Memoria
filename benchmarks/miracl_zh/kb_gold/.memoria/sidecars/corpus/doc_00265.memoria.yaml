  name: 葡萄糖
  tags:
  - 葡萄糖
  description: 葡萄糖很容易吸收進入血液，因此醫院与運動愛好者常常以其作強而有力的快速能量來源。除此之外，葡萄糖對腦部正常功能極為重要，高循环血糖濃度可產生葡萄糖強記效應（），並促進記憶力和認表現。
