- id: 72463#0
  name: 自閉症
  tags:
  - 自閉症
  description: 自閉症（）為一種由腦部发育障碍所導致的疾病，其特徵是情緒，言語和非言語的表達困難及社交互動障礙，會對限制性行為與重複性動作有明顯的興趣。家長一般會在自閉症孩童兩到三歲時注意到其狀況。其症狀會漸漸加重，不過有些有自閉症的孩童在之前，在一段时间内有着正常或接近正常的早期发展阶段（見兒童發展階段），之后会出现一个或多个自闭症的特发特征，比如语言倒退等。因此，早期发育的特定时间段受自闭症的影响较小，诊断也更难。有時可能因其他學習障礙而遭醫生誤診。
    自閉症和及有關。很多研究人員懷疑自閉
  range:
    start:
      line_hint: 1
      snippet: 自閉症
    end:
      line_hint: 3
      snippet: 症的比例約是每一千人中有1至2名。，在已開發國家約有1.5%的兒童診斷是有自閉症譜系，而美國在2000年的比例是0.7%。男孩擁有自閉症機率比女孩高出4到5倍，自1960年代時，診斷為自閉症的比例大幅增加，部份原因可能是人類飲食習慣的改變。
