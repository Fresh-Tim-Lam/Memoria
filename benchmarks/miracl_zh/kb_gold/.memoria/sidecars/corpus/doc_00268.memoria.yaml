- id: 74250#10
  name: 小学
  tags:
  - 小学
  description: 臺灣國民小學課程的學習領域主要有語文學習領域（包含中文、英語、地方语言（臺語、客語與原住民語），中文在小學稱作「國語」，國中或以上稱作「國文」）、生活領域（小學1、2年級的科目，為自然與生活科技、藝術與人文、社會領域的合併科目）、數學領域、社會領域、自然與生活科技領域、藝術與人文領域、健康與體育領域、彈性課程、綜合活動領域，以及六大重大議題（資訊教育、環境教育、性別平等教育、人權教育、生涯發展、家政教育）；其使用課本因學校而有所不同。
    小學分為兩種，國民小學與國民型小學。國民
  range:
    start:
      line_hint: 1
      snippet: 小学
    end:
      line_hint: 3
      snippet: 用馬來語為教學媒介語。在晉升進入中學教育之前，小學生在六年级需參加小六鑑定測驗（Ujian Pencapaian Sekolah Rendah，UPSR），馬來語（国语）不及格的考生須讀為期一年的中學預備班(Peralihan)注：马来文。
