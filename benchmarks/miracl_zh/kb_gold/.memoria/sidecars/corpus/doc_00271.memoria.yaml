  name: 海峽兩岸關係
  tags:
  - 海峽兩岸關係
  description: 大陆市场对台湾工农业商品采取全面开放进口的政策。2005年时任国民党主席连战访问大陆后，中国大陆决定将椰子、菠萝、番石榴、番荔枝、莲雾等十五项台湾水果关税税率由15%清零。台湾水果在大陆销量迅速增加后，2010年中国大陆进一步将34项农产品列入ECFA早期收获清单中免征关税，以促进两岸贸易。与此相反，截至2021年9月，台湾明确列出2444项工农业商品禁止从大陆进口，占其所有商品项目数量的约25%，其中被禁止的1038项为农产品，占台湾农产品项目中的37%。此外，台湾还将78
  range:
    start:
      line_hint: 1
      snippet: 海峽兩岸關係
    end:
      line_hint: 3
      snippet: 外，台湾还将785项大陆商品归于有条件准许输入项目，对产品规格、材料等设置了诸多限制规定。根據官方統計數據，2020年台湾占大陆总对外贸易额的9.8%，是大陆第七大贸易伙伴和第六大进口来源地；与此同时，中國大陸卻占台灣近40%的對外貿易額。
