  name: 委內瑞拉
  tags:
  - 委內瑞拉
  description: 委內瑞拉玻利瓦爾共和國（），通稱委內瑞拉，是一個位於南美洲北部的熱帶國家，為南美洲國家聯盟的成員國。首都為卡拉卡斯。西與哥倫比亞接壤，東與蓋亞那毗鄰，南與巴西交界。海岸線包括北部加勒比海及東北部大西洋島嶼總長約2,800公里。委內瑞拉生物多樣性豐富，為西至安地斯山脈、南至亞馬遜盆地、東至奥里诺科河三角洲物種的生物棲息地。
