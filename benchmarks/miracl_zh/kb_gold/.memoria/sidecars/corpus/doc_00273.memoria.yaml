- id: 78157#0
  name: S.H.E
  tags:
  - S.H.E
  description: S.H.E，為臺灣女子演唱團體，其團名取自三位成員英文名字的首個字母，是由Selina（任家萱）、Hebe（田馥甄）和Ella（陳嘉樺）三位成員組成。三人在2000年參加《宇宙2000實力美少女爭霸戰》選秀比賽，之後被宇宙唱片（現名華研國際音樂）簽下培訓後，於2001年9月11日正式出道，發行首張專輯《女生宿舍》。
