  name: 歐亞大陸
  tags:
  - 歐亞大陸
  description: 歐亞大陸或亚欧大陆，也称为欧罗细亚（），是亚细亚洲和欧罗巴洲的合稱。面积5473.8万平方公里。亚、欧二大陆单从地理学方面来归类应属同一个、地球表面面积最大的洲。亚洲与欧洲的分别主要出于社会学区别这两个地区人文历史的需求。
