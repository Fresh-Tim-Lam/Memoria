  name: 2000年美国人口普查
  tags:
  - 2000年美国人口普查
  description: 第22次美国人口普查是由美國人口調查局进行的。通过普查，美国截至2000年4月1日共有居民281,421,906人，比1990年人口普查时的248,709,873人增加13.2%。美国的居民人口包括50个州和华盛顿特区的全部人口。普查局还详细统计出波多黎各有3,808,610位居民。比10年前增加8.1%。
