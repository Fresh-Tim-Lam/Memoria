- id: 82054#0
  name: 福冈县
  tags:
  - 福冈县
  description: 福岡縣（）是位於日本九州地方北部的縣，西北部臨日本海（、玄界灘），東北部臨瀨戶內海（），西南臨佐賀縣和有明海，南部和熊本縣接壤，東部和大分縣接壤。人口約510萬，是九州地方人口最多的縣，也是日本三大都市圈以外唯一人口密度超過每平方公里千人的縣。縣廳所在地是福岡市，縣內則有福岡市、北九州市兩個政令指定都市。自明治時代起曾因煤礦資源而成為日本一大重工業地區，現在經濟則以服務業為主。
