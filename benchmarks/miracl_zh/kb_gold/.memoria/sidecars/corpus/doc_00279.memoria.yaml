  name: 福冈县
  tags:
  - 福冈县
  description: 1920年日本首次人口普查時，福岡縣有人口218.8萬人。1940年時，福岡縣人口已突破300萬大關，達309.4萬人。二戰期間福岡縣人口一度減少，但戰後則因軍人復員返鄉而快速增加，1950年時達353萬人。1960年人口普查時，福岡縣的人口突破400萬大關。然而在1960年代，由於煤礦關閉導致人口嚴重外流，福岡縣的人口一度出現減少，1970年時才重新超過400萬人。此後福岡縣人口穩定增加。2000年時，福岡縣人口突破500萬人大關。但此後因老齡化、少子化問題，福岡縣人口增長
  range:
    start:
      line_hint: 1
      snippet: 福冈县
    end:
      line_hint: 3
      snippet: 始，福岡縣人口的自然增長率已是負數，但因人口遷入數多於人口流出數，使得福岡縣人口仍維持增長。九州·沖繩地方是福岡縣主要的人口遷入來源，而東京圈是福岡縣主要的人口流出目的地。2014年，福岡縣的總和生育率有1.46，略高於日本平均值1.42。
