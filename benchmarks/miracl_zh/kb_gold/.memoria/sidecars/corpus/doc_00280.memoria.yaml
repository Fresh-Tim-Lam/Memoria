      snippet: 了第二个专利。接着为了进一步提高效率，增大蒸汽机的动力，瓦特对汽缸本身进行了分析与研究。1782年，瓦特试制出一种带有双向装置的新汽缸，把原来的单向汽缸组装成双向汽缸，并首次把引入汽缸的蒸汽，由低压蒸汽改为高压蒸汽，他也因此取得第三个专利。
