  name: 英国工业革命
  tags:
  - 英国工业革命
  description: 1769年，瓦特制成第一台蒸汽机。这一年，瓦特以发明分离冷凝器，获得他在革新纽可门蒸汽机过程中的第一个专利。但这种蒸汽机仍无法克服纽可门蒸汽机只作往返运动的缺点，不能使蒸汽机变成能带动各种工作机的原动机。1781年，瓦特研制出一套齿轮联动装置，可以将活塞的往返直线运动，转变为轮轴的旋转运动，他因此获得了第二个专利。接着为了进一步提高效率，增大蒸汽机的动力，瓦特对汽缸本身进行了分析与研究。1782年，瓦特试制出一种带有双向装置的新汽缸，把原来的单向汽缸组装成双向汽缸，并首次把引
