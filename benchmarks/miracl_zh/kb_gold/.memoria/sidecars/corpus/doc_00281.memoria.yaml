- id: 82327#20
  name: 英国工业革命
  tags:
  - 英国工业革命
  description: 瓦特蒸汽机的问世，解决了工业发展中的动力问题。从此以后，只要有煤作为燃料，就可以开动蒸汽机。并且，工厂也是根据需要建立起来，而不再受河流水力的限制。马克思说：“瓦特的伟大天才表现在1784年4月他所取得的专利的说明书中，他没有把自己的蒸汽机说成是一种用于特殊目的的发明，而是把它说成是大工业普遍应用的发动机。”
  range:
