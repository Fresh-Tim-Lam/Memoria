- id: 82792#0
  name: 美国国务卿
  tags:
  - 美国国务卿
  description: 美國國務卿（），直译为美國國務部長，前稱即其前身為美国外交部长（）是美國國務院的首長，同時為美國內閣閣员，主管美国外交事务。国务卿代表美国总统執行對外政策，相当于美国外交部长，其地位要比其他内阁部长高，是所有內閣部長中的首席。现任美国国务卿为安東尼·布林肯，于2021年1月26日上任。
