  name: 战国时期
  tags:
  - 战国时期
  description: 戰國時期諸侯各自為政，相互混戰，諸侯國內外動盪，社會非常不穩定。戰國初期東周境內尚有十幾個諸侯國，而以齊、晉、楚、秦、宋五國被推舉為霸主，史稱春秋五霸，春秋末年更有吳王夫差和越王勾踐一度稱霸。
