- id: 85803#2
  name: 中华人民共和国教育部
  tags:
  - 中华人民共和国教育部
  description: 1949年10月，中华人民共和国成立后，成立政务院文化教育委员会、中央人民政府教育部；1952年11月增设中央人民政府高等教育部、中央人民政府体育运动委员会、中央人民政府扫除文盲工作委员会。1954年，重新组建教育部，将扫除文盲工作委员会的职责并入教育部；1958年2月，高等教育部并入教育部。1964年7月，恢复高等教育部。1966年7月，高等教育部再次并入教育部。
