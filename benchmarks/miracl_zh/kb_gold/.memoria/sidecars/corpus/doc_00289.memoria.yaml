- id: 87411#0
  name: 關東煮
  tags:
  - 關東煮
  description: 關東煮（、）與關東炊（）是日本的大眾料理，“關東煮”（或関东炊き，读音皆为kantodaki）為關西人給這種料理的名稱。通常材料包括煮雞蛋、蘿蔔、蒟蒻、海帶結、蒟蒻絲-{zh-hans:等;zh-hk:、竹輪（也叫竹魚板、獅子狗魚蛋）等;zh-tw:等;}-，這些材料會放在昆布或者鰹魚湯裏煮。可以用來佐飯，也可以當作小吃來吃。
  range:
    start:
      line_hint: 1
      snippet: 關東煮
    end:
      line_hint: 3
