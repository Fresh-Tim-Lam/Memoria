- id: 87411#5
  name: 關東煮
  tags:
  - 關東煮
  description: 關東煮在臺灣也十分流行，常將其音譯俗寫作黑輪 （），其中黑輪也稱為甜不辣。「黑輪（）」是台語中帶有齒音性質的邊音導致的類化；關東煮在日本時代傳入台灣，直至今日台灣的關東煮大部分已獨立為當地口味，且在放置的材料上，也有相當的差異性。外觀上也有長條、圓形扁平狀的區別，主要由魚漿製成。
  range:
    start:
      line_hint: 1
      snippet: 關東煮
