  name: 肺
  tags:
  - 肺
  description: 肺的主要功能是将氧气从空氣运输到血液中，并将二氧化碳从血液中排出至大气中。气体交换过程是在一种特殊细胞中进行的，而这些细胞是由成千上万的微小薄壁泡囊组成的，这些微小泡囊被称作"肺泡"。
