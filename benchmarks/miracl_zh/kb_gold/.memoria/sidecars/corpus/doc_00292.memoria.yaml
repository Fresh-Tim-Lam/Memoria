  name: 聖週五
  tags:
  - 聖週五
  description: 根据福音书记载，耶稣于公元33年犹太历尼散月十四日与门徒设立記念仪式，后于上午九时左右被钉，于下午三时左右死去。主耶稣基督惟独吩咐门徒要記念祂的死亡。
