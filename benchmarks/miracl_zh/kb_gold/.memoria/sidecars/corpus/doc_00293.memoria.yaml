  name: 乌克兰苏维埃社会主义共和国
  tags:
  - 乌克兰苏维埃社会主义共和国
  description: 乌克兰在战后的领土有所扩大，边界西扩至“寇松线”，赢得部分前属于波兰第二共和国的领土，称为“西乌克兰”；向南扩展到曾属于罗马尼亚的伊兹梅尔一带；苏联和捷克斯洛伐克当局达成条约，将喀尔巴阡鲁塞尼亚划入乌克兰。乌克兰的领土扩展了64,500平方公里，新获得了1,100万人口。
