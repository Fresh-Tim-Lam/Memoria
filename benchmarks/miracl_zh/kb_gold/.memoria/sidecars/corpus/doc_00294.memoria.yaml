  description: 第二次世界大战以后，乌克兰国土得到扩展，人口也相应增多，但本土人口增长率很低。乌克兰在1979年普查的人口是49,754,642人；1989年人口普查的结果是51,706,742，增长了3.9%，为人口增长率最低的加盟共和国。
