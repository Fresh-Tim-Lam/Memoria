- id: 91285#2
  name: 波德星系
  tags:
  - 波德星系
  description: 大部分红外波段的放射线都来自星际尘埃. 。人们主要从该星云的螺旋臂中发现了这些星际尘埃，且其中的大多数都是星系形成时遗留下来的。据科学界现在最普遍的解释，该星云的螺旋臂上能探测到大量的红外辐射，是其中那些从星系形成时就出现的蓝色星体所造成的结果。这些短命的蓝色星体极其炽热，因此促进了红外线的辐射。
