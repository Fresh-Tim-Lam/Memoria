- id: 92326#0
  name: 大泽乡起义
  tags:
  - 大泽乡起义
  description: 大澤鄉起義，簡稱大澤起義，又稱陳勝吳廣起義、陳勝吳廣起事或陈胜吴广之乱，是公元前209年陳勝與吳廣發動的反秦起事，亦是秦末民变的一部分。起义沉重打擊了秦朝政權，揭开了秦末农民起义的序幕，也是中國歷史上第一次有记录的大規模的平民起義。
