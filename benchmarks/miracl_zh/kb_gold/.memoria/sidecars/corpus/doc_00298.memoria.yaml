  name: 太平山 (香港)
  tags:
  - 太平山
  - (香港)
  description: 太平山（），又名扯旗山、爐峰和域多利山（亦作域多厘山）；坊間通稱山頂（The Peak）或香港山頂；曾名屬領山（Mount Possession）和柯士甸山（Mount
    Austin）；古名硬頭山，位於香港島西部，屬於中西區的一部分，高552米，為香港島最高峰。廣義上的太平山是指包括太平山主峰、爐峰峽、歌賦山和奇力山在內的山嶺地形。根據香港政府地圖，太平山主峰的官方名稱爲「扯旗山」。
