  name: 基多
  tags:
  - 基多
  description: 基多（ ）是南美洲国家厄瓜多尔的首都，位于该国北部，离赤道仅24公里。是世界上距赤道最近的首都。因地处高原，海拔高度2852米，是仅次于玻利维亚拉巴斯的世界第二高首都，一年中月平均气温都在16℃左右，年平均温差只有1℃，四季如春。
