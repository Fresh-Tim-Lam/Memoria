- id: 92809#2
  name: 火星探测
  tags:
  - 火星探测
  description: 火星是太阳系八大行星之一，按离太阳由近及远的次序排列为第四颗。在太阳系八大行星之中，火星也是除了金星以外，距离地球最近的行星。大约每隔26个月就会发生一次火星冲日，地球与火星的距离在冲日期间会达到极近值，通常只有不足1亿千米，而在火星发生大衝时，这个距离甚至不足6000万千米。火星冲日意味着这时可以使用较小花费将探测器送往火星，火星探测通常也会利用此天文現象來運作。
