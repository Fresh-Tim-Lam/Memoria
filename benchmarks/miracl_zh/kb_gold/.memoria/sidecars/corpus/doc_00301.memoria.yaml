      snippet: 转移火星轨道而失败。“天问一号”於2020年7月23日由長征五號運載火箭從文昌衛星發射中心發射升空，並於2021年抵達火星，主要為放出探测器着陆火星。中国计划在2030年前后实施小行星探测、火星取样、木星系探测及行星穿越等3次深空探测任务。
