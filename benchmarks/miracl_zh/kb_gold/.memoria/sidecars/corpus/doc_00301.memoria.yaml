  name: 火星探测
  tags:
  - 火星探测
  description: 中国於2020年再次实施火星探测任务，将分成三步，绕、落、巡完成，因为除了美国，其它国家的环绕探测虽然没有发生问题，但着陆过程都失败了，为了保证着陆巡视器顺利完成火星着陆，天问一号需要在进行多轨调整逐渐接近火星之后才能着陆，环绕2至3个月寻找一个非常好的小窗口，让它进入到火星大气。
    此前在2011年，中国“萤火一号”，搭乘俄罗斯“福布斯号”首次探索，因火箭没能完成地球轨道转移火星轨道而失败。“天问一号”於2020年7月23日由長征五號運載火箭從文昌衛星發射中心發射升空，並於2
