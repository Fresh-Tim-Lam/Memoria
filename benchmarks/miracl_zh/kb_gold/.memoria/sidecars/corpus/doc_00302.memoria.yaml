- id: 94337#0
  name: 工作犬
  tags:
  - 工作犬
  description: 工作犬是指從事各項工作以協助其人類夥伴的狗，與展覽犬以外表特徵等作為評選標準相比較，工作犬重視犬種原本發展的功能性質，例如邊境牧羊犬重視協助牧羊的實際能力，而非其外型。有些犬種有將展覽用犬和工作犬分開登記以追蹤其系譜，例如等。除了畜牧之外，工作犬的工作類別尚有狩獵、拉車及守衛等多種，詳情請見下表。工作犬的育種造就了高智能健壯機警的犬隻，通常也具有極度的忠誠和吸引力，因此許多工作犬血統被追求作為寵物。不过，許多飼主沒去考慮這類犬隻並不是逆來順受的，所以棄養率非常地高。
