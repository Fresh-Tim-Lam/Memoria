- id: 94872#6
  name: 樱花
  tags:
  - 樱花
  description: 日本的櫻花多數在3月下旬至4月上旬開花，但近年因全球暖化的影響，令櫻花開放的時間有所提前。而且太平洋的氣候變暖，亦導致花開後被風吹至散落，大大縮短了民眾欣賞櫻花的時間。櫻花季節不長，通常在初開（開花）後一星期便會盛開（滿開）。再過一星期，盛開尖峰就過了，花瓣就開始凋零。如有強風和下雨也會使得花期縮短。
