- id: 95393#0
  name: 马铃薯
  tags:
  - 马铃薯
  description: 馬鈴薯（学名：""），属茄科茄属多年生草本植物，块茎可供食用，是全球第四大重要的粮食作物，仅次于稻米、玉米和小麦。原產於南美洲秘魯與波利維亞境內的安地斯山脈。馬鈴薯的人工栽培最早可追溯到大约公元前8000年到公元前5000年的秘鲁南部地区。大航海時代馬鈴薯被裝船帶回歐亞大陸的菜單當中，現在是歐美地區許多國家的主食，為世界第四大主食作物。
