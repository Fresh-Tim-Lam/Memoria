- id: 95393#5
  name: 马铃薯
  tags:
  - 马铃薯
  description: 馬鈴薯的人工栽培最早可追溯到大约公元前8000年到公元前5000年。由美国威斯康辛大学发起的研究，通过在350種不同的馬鈴薯上使用遗传标记，最终确定全世界的馬鈴薯都起源于今天的秘鲁南部所在区域种植的馬鈴薯，从那里逐渐向南美的北部和南部传播出来。随着西班牙征服印加帝国，馬鈴薯在16世纪下半叶被西班牙人带回到欧洲传播开来。然后再被欧洲的探险者和殖民者带到全世界各地。在馬鈴薯被传入欧洲的早期，它的消耗量并不是很大。馬鈴薯引到英國愛爾蘭時，甚至很長階段都作為奇花異草觀賞。到了19世纪
  range:
    start:
      line_hint: 1
      snippet: 马铃薯
    end:
      line_hint: 3
      snippet: 年至1848年之间，一场名为“晚疫病”（late blight）的瘟疫袭击了欧洲的馬鈴薯种植业，严重破坏馬鈴薯种植。爱尔兰受灾最重，导致大饥荒（馬鈴薯饥荒），至少有100万人因此死亡，超过200万的爱尔兰人出逃，其中大约4分之3移民到美国。
