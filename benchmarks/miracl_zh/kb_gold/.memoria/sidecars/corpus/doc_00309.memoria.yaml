  name: 本傑明·富蘭克林
  tags:
  - 本傑明·富蘭克林
  description: 班傑明·富蘭克林 FRS FRSE（，又譯范克廉，），出生於美國麻省波士頓，美國博學家、開國元勛之一。他是傑出的政治家、外交家、科學家、發明家，同時亦是出版商、印刷商、記者、作家、慈善家、共濟會的成員。作為科學家，他因電學發現和理論成為美國啟蒙時代和物理學史上重要人物。作為發明家，他因避雷針、雙目眼鏡、富蘭克林壁爐等聞名。他創立了許多民間組織，包括費城消防站和賓夕法尼亞大學。
