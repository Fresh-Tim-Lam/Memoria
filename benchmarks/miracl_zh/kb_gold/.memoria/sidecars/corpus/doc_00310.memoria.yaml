      snippet: ，因此工蟻經常將它們搬來搬去，維持合適的生長環境。大部分螞蟻可粗分為三個階級：工蟻、雄蟻和蟻后，雌幼蟲發育成工蟻或是蟻后則取決於幼蟲期獲得的養分。工蟻沒有翅膀，只有雄蚁和處女雌蟻有翅膀，雌蚁交配后會把翅膀拔掉，雄蟻在交配後一段時間便會死亡。
