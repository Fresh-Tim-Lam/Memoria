- id: 97858#1
  name: 蚂蚁
  tags:
  - 蚂蚁
  description: 螞蟻屬完全變態，要經過卵、幼蟲、蛹等階段才發展為成蟲，大部分的物種在幼蟲階段沒有移動能力，由工蟻喂養，工蟻覓食時會把液態食物吃下，回巢後再吐出餵給幼蟲，成蟲之間也以這種方式交換食物，此行為稱作「交哺」（trophallaxis），幼蟲發育時需要舒適的溫度，因此工蟻經常將它們搬來搬去，維持合適的生長環境。大部分螞蟻可粗分為三個階級：工蟻、雄蟻和蟻后，雌幼蟲發育成工蟻或是蟻后則取決於幼蟲期獲得的養分。工蟻沒有翅膀，只有雄蚁和處女雌蟻有翅膀，雌蚁交配后會把翅膀拔掉，雄蟻在交配後一段
  range:
