- id: 97858#11
  name: 蚂蚁
  tags:
  - 蚂蚁
  description: 年齡多形性是指羽化時間不同的成蟲會表現出不同的行為，大致來說，年齡較大的個體會從事覓食與其他巢外工作，年齡較小的個體則會從事巢內的工作，如照顧幼蟲與蟻后、清理垃圾，挖掘巢穴等。學者認為此分工方式可以最大效率地利用每一個體，年老的個體壽命較短，所以從事比較危險的工作，年輕的個體壽命較長，所以從事較安全的工作。
