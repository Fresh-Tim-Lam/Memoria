- id: 97858#12
  name: 蚂蚁
  tags:
  - 蚂蚁
  description: 剛羽化的工蟻負責巢中事務，如照顧幼蟲和蟻后、清掃環境、打理巢穴等；羽化較久的工蟻則出外覓食。幾乎所有的螞蟻都具有年齡多形性（Age polytheism）的分工機制，除了兩個物種以外，分別是
    "Amblyopone pallipes" 和 大眼擬鬥牛犬蟻（"Nothomyrmecia macrops"）。
  range:
    start:
