- id: 104380#1
  name: 染色单体
  tags:
  - 染色单体
  description: 在减数分裂或有丝分裂过程中，复制了的染色体中的两条子染色体。每个染色单体是由一条脱氧核糖核酸（DNA）双链经过紧密盘旋折叠而成。中期染色体由两条染色单体组成，两者在着丝粒（著絲點）（centromere）部位相互结合。
