- id: 104392#1
  name: 染色体
  tags:
  - 染色体
  description: 染色體（）是真核生物特有的構造，主要由雙股螺旋的去氧核糖核酸和5种被称为组蛋白的蛋白质构成，是基因的主要載體。染色体是细胞内具有遗传性质的遗传物质深度压缩形成的聚合体，易被碱性染料染成深色，所以叫染色体（由染色质组成）。染色质和染色体是同一物质在细胞分裂间期和分裂期的不同形态表现。染色体出现于分裂期。染色质出现于间期，呈丝状。其本质都是脱氧核糖核酸（DNA）和蛋白质的组合（即核蛋白组成），不均匀地分布于细胞核中
    ，是遗传信息（基因）的主要载体，但不是唯一载体（如细胞质内的腺粒
  range:
