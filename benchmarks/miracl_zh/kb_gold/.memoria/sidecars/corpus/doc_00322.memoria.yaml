- id: 104392#6
  name: 染色体
  tags:
  - 染色体
  description: 染色体的超微结构显示染色体是由直径僅100埃（A）的去氧核糖核酸-组蛋白高度螺旋化的纤维所组成。每一条染色单体可看作一条双螺旋的脫氧核糖核酸分子。有丝分裂间期时，解螺旋而形成无限伸展的细丝，此时不易为染料所着色，光镜下呈无定形物质，称之为染色质。有丝分裂时脫氧核糖核酸高度螺旋化而呈现特定的形态，此时易为碱性染料着色，称之为染色体。
  range:
    start:
      line_hint: 1
      snippet: 染色体
