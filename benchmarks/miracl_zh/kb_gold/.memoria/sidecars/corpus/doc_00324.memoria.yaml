  name: 法兰西第一帝国
  tags:
  - 法兰西第一帝国
  description: 法兰西第一帝国结束于1814年4月6日（4月2日，参议院宣布废黜拿破仑，4月6日，拿破仑在枫丹白露退位，4月20日，拿破仑被流放、前往厄尔巴岛）。随后是波旁复辟时代，1815年3月20日到7月7日，经历了短暂的百日王朝。
