  name: 联合国总部大楼
  tags:
  - 联合国总部大楼
  description: 联合国总部大楼（亦称联合国大厦）是联合国总部的所在地，位於美国纽约市曼哈顿東側，屬於國際領土，因此只要是會員國國民持有護照就可以進入，包括與美國無邦交的聯合國會員國。聯合國總部大樓位于紐約市，其西側邊界為第一大道、南側邊界為東42街、北側邊界為東48街、東側邊界為東河，從聯合國總部大樓可以俯瞰東河。此大樓於1949年和1950年間興建，土地購自於當時的紐約房地產家，面積闊達17英畝（約6.87973公頃）。在此之前，洛克斐勒家族有意提供其在紐約州威斯特徹斯特郡洛克菲勒莊園的土
  range:
