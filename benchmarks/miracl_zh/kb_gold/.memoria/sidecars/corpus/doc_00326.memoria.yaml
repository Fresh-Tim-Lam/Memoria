      snippet: 17英畝（約6.87973公頃）。在此之前，洛克斐勒家族有意提供其在紐約州威斯特徹斯特郡洛克菲勒莊園的土地，但因距離曼哈頓遙遠而作罷；之後，納爾遜·洛克菲勒便協助新的土地的購買，其父小約翰·戴維森·洛克菲勒則捐助了850萬美元協助興建大樓。
