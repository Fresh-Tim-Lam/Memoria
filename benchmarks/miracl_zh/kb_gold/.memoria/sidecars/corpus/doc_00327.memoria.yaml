  name: 联合国总部大楼
  tags:
  - 联合国总部大楼
  description: 联合国总部虽然位于纽约市，但它使用的土地及其租用的建筑物空间完全由联合国管理，而不是美国政府。它们通过与美国政府签订的条约而享有治外法權。然而，作为对当地警察、消防和其他服务的交换，联合国同意承认大多数美国地方、州和联邦法律。
