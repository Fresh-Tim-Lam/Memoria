  name: 爱尔兰文学
  tags:
  - 爱尔兰文学
  description: 20世纪爱尔兰戏剧持续繁荣着，代表人物包括塞缪尔·贝克特、布兰敦·贝汉、德尼·约翰斯通、布莱恩·弗里尔、托马斯·基尔罗、汤姆·墨菲、休·李奥那多和约翰·基恩。其中成就最高的是塞缪尔·贝克特。贝克特受存在主义影响，创作了包括《等待戈多》在内的一系列表现现代社会荒诞、虚无特征的后现代主义剧作。贝克特被尊为“荒诞派”戏剧的大师。
