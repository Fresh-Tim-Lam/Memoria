- id: 111327#6
  name: 猩猩屬
  tags:
  - 猩猩屬
  description: 猩猩的耳朵和鼻子较小，他们的耳朵是无裂（unlobed）的。猩猩的平均脑容量为397立方厘米，脑壳相对脸部略高，因此显得有些凸起。与大猩猩和黑猩猩相比，猩猩的眉骨没有那么明显。成年雌猩猩和年幼猩猩脸部较窄，而成年雄猩猩则有着明显的矢状嵴和一个巨大的脸盘，这种特征可以向领地内的其它雄性宣示自己的权威。雄猩猩的大脸盘基本上由脂肪组织构成，它由肌肉支撑。成熟的雄性个体也会发育出大喉结和长犬牙。
