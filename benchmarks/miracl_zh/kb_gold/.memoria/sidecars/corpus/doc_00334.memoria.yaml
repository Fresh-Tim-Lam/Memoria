  name: 富兰克林·皮尔斯
  tags:
  - 富兰克林·皮尔斯
  description: 富兰克林·皮尔斯（，）是第14任美国总统，1853至1857年任职。身为北方民主党人，他认为废奴运动从根本上威胁国家统一。他支持并签署《堪薩斯-內布拉斯加法》、执行《逃奴法》等举措未能阻止南北冲突，还开罪反奴团体。南方最后在1861年脱离联邦并挑起南北战争。
