  name: 里斯本
  tags:
  - 里斯本
  description: 里斯本（），亦稱為葡京，是葡萄牙共和國的首都和最大都市，它也是該國的政治中心，作為政府所在地和國家元首的住所。其位置位于葡萄牙中南部大西洋沿岸，城北为辛特拉山，城南为特茹河出海口，与伦敦、巴黎、罗马等同为西欧历史最悠久的城市。市區面積100.05平方公里、人口544,851人（2021年）。包含衛星城的都会区人口超過300萬，相當於葡萄牙人口的27%左右.。现今与波尔图同为葡萄牙两大代表性城市。
