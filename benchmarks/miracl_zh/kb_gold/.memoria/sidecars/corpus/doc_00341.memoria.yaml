      snippet: 市。但自21世纪初，伊斯兰堡多次遭到恐怖主义威胁。在2007年7月当地的红色清真寺的一伊斯兰学校发生了伊斯兰原教旨主义武装分子和巴政府之间的武装冲突、2008年6月2日的丹麦驻巴基斯坦大使馆爆炸案以及同年9月20日的伊斯蘭堡萬豪酒店爆炸案。
