  name: 伊斯兰堡
  tags:
  - 伊斯兰堡
  description: 伊斯兰堡位于巴基斯坦东北的波特瓦尔高原上，海拔540米，属副热带湿润气候。在历史上，这个地区处于一个前往旁遮普和开伯尔-普什图的十字路口处，而马格拉关口则扮演前往两个地区的入口的角色。伊斯兰堡修建于1960年代以取代当时的首都卡拉奇。现在伊斯兰堡是有秩序的国际城市，被认为是巴基斯坦最发达的城市，也被列为Gamma+级的全球城市。但自21世纪初，伊斯兰堡多次遭到恐怖主义威胁。在2007年7月当地的红色清真寺的一伊斯兰学校发生了伊斯兰原教旨主义武装分子和巴政府之间的武装冲突、20
  range:
    start:
