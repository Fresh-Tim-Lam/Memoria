- id: 115813#2
  name: 曼徹斯特聯足球俱樂部
  tags:
  - 曼徹斯特聯足球俱樂部
  description: 曼联成立于1878年，前身是由位於紐頓希夫的蘭開郡和約克郡鐵路公司（Lancashire and Yorkshire Railway）的鐵路工人所成立的紐頓希夫LYR足球會（Newton
    Heath LYR F.C.）。1902年时遭遇经济困难，在获得的资金援助后改名为曼彻斯特联隊。1908年，曼联第一次夺得英格兰顶级联赛冠军，次年又首获英格兰足总杯，並开始在英格兰足坛取得成绩。但是球队在1910年代和1940年代的两次世界大战之间陷入了低潮，三十多年没有获得重要荣誉。
