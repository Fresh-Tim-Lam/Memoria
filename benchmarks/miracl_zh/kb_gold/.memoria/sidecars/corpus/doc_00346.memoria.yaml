- id: 117965#6
  name: 三星集团
  tags:
  - 三星集团
  description: 20世纪80年代初，三星集团已经发展成为拥有30个子公司，125个海外分公司，21个海外现地法人，10.5万名员工，经营范围涉及机械、电子、造船、建筑、化工、纤维、食品、贸易、金融、保险、零售、医院、酒店等诸多领域的大型跨国公司。1983年，三星总资产为14,353亿韩圆，自有资本3,214亿韩圆，负债35,039亿韩圆，负债率为567.83%，不仅高于韩国制造业360.3%，也高于韩国50大企业集团454.8%的平均水平。其恶化的整体财务状况显示三星已经患上了“大企业病”。
  range:
    start:
      line_hint: 1
      snippet: 三星集团
    end:
      line_hint: 3
      snippet: 2日，李健熙在三星50周年庆典上发表要将三星在21世纪到来之前打造成新型国际企业的“二次创业宣言”，并提出“自律经营”、“重视技术”、“尊重员工”的二次创业精神。三星从这一时期开始废弃了原来各子公司各自使用的三星标识，统一使用集团商业标识。
