  description: 2008年，李健熙因非法资金案辞职，后于2010年复任三星集团会长，并由其长子李在镕担任三星电子副社长。2010年12月，李在镕升任社长位置。2012年12月，李在镕出任三星集团副会长，成为三星集团的实际控制人。
