- id: 118047#22
  name: 英語史
  tags:
  - 英語史
  description: 近代英语和晚期现代英语在词汇上有本质的不同。晚期现代英语的词汇量大得多，这些词大量产生于工业革命和亟需新词的技术，以及受到英语在国际上发展的影响。大英帝国全盛时期曾统治了地球四分之一的面积，英语也由此吸收了大量的外语。英国英语和美国英语这两大英语分支，被全世界4亿人所使用。英国英语的“皇室口音”最有声望，而通俗美国口音的影响力更大。全世界说英语的人数加起来可能超过10亿。
