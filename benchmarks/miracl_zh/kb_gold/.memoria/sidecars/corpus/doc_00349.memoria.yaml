- id: 120704#1
  name: 蝦蛄
  tags:
  - 蝦蛄
  description: 虾蛄俗名众多，包括皮皮虾（因为中国大陆的网络流行语而广为人知）、、螳螂虾、虾爬子（或虾耙子）、虾狗弹、爬虾（或扒虾）、虾虎、蝦猴、口虾蛄、富贵虾、琵琶虾等。在古時亞述人稱之為「海蝗蟲」，澳洲人也稱之為「明蝦殺手」，最近西方也有称“拇指切割者”。
