- id: 121446#29
  name: 儿童
  tags:
  - 儿童
  description: 儿童期间由于广泛的发育性障碍所导致的出现孤僻、内向。难以与人交流为特征的一系列综合症状。有作“自闭症”。这样的孩子自幼缺乏社会交往倾向，存在交往技巧缺陷。他们不会認同别人，包括与自己的父母发展关系；有显著的情感交流和语言交流的障碍；行为方式刻板、生硬，且兴趣范围狭窄。
