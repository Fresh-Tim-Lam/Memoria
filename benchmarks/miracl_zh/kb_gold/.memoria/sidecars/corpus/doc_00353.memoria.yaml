- id: 127631#1
  name: 清昭陵
  tags:
  - 清昭陵
  description: 皇太极是清太祖努尔哈赤的第八子，生于明万历二十年（1592年），曾追随其父，统一了女真各部，创建了清政权，是清朝名義上和正式的开创者，戎马征战数十载，是中国历史上杰出的政治家、军事家，是清朝历史上有作为的皇帝之一，他为大清基业和入主中原奠定了坚实的基础，对清朝历史影响重大，堪称“上承太祖开国之绪业，下启清代一统之宏图”的创业之君。天命十一年（公元1626年）他继父位称汗，天聪十年（公元1636年）四月称帝，改后金国号为“大清”，並改元崇德。皇太极死于崇德八年（公元1643年）
  range:
    start:
      line_hint: 1
      snippet: 清昭陵
    end:
      line_hint: 3
      snippet: 响重大，堪称“上承太祖开国之绪业，下启清代一统之宏图”的创业之君。天命十一年（公元1626年）他继父位称汗，天聪十年（公元1636年）四月称帝，改后金国号为“大清”，並改元崇德。皇太极死于崇德八年（公元1643年），时年52岁，在位17年。
