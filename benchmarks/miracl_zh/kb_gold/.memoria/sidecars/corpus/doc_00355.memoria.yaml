- id: 128117#4
  name: 美国独立日
  tags:
  - 美国独立日
  description: 历史学家对大陆会议是否的确在7月4日签署《独立宣言》存在长期的争议，尽管约翰·亚当斯、托马斯·杰斐逊、本杰明·富兰克林后来都写道他们在那一天签署宣言。然而大多数历史学家认为独立宣言实际在一个月后亦即1776年8月2日正式签署通过，而不是人们通常认为的7月4日。独立日是美国的国庆日，其庆祝内容大多为表达爱国情绪。与其他夏季活动类似，独立日的庆祝活动往往在户外举行。独立日是一个联邦假日，因此当天所有非必需的联邦机构（如邮政和联邦法院）均会放假。政治活动家通常会选择当天在公众场合赞
