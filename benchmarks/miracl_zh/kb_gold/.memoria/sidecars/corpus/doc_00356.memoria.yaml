  name: 梵高博物馆
  tags:
  - 梵高博物馆
  description: 身世悲慘的凡高於1890年與世長辭，他的弟弟西奧是巴黎的藝術經紀商，共收藏了凡高的画200幅和素描500幅，還有凡高寫給西奧的信850多封，加上他友人以及當代画家的精選作品，形成了美術館中出色的收藏。
