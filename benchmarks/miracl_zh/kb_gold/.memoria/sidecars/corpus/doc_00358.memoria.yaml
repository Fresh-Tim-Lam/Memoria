- id: 131555#2
  name: 徐汇区
  tags:
  - 徐汇区
  description: 辖区内有多所高等学校，包括著名的综合性、研究型大学上海交通大学、华东理工大学和专业特色显著的上海师范大学、上海医科大学，以及著名艺术院校上海音乐学院等。学科涵盖文、理、工、商、医、法、师范、艺术等，为上海科教文化最齐全最集中之地区，被誉为“上海科教文化核心区”。上海市徐匯中學為徐汇区實驗性示範性中學，其建筑古蹟为上海市文物保护单位。
