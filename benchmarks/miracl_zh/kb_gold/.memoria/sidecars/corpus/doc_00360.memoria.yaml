- id: 132852#4
  name: 印度地理
  tags:
  - 印度地理
  description: 印度在西北部和巴基斯坦接壤，北部和中華人民共和國、不丹、尼泊爾；東部和緬甸接壤。孟加拉國的大部份地區都和印度接壤。印度的領海和印度南側的島國斯里蘭卡、馬爾代夫、印度尼西亞的領海相鄰。斯里蘭卡隔保克海峡和印度相望。
