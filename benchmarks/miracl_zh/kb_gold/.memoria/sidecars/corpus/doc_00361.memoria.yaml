- id: 134204#2
  name: 美国参议院
  tags:
  - 美国参议院
  description: 作为美國的上議院，参议院拥有几项独特的咨询和同意权，其中包括批准条约，确认内阁成员、最高法院大法官、联邦法官、军队负责人、监管机构、大使、其他联邦行政官员和联邦军警人员。如果没有副总统候选人获得美國選舉人投票的过半数，则由参议院负责从获得选举人票数最多的两人中选出一人担任该职务。参议院对被众议院弹劾的人进行审判。
