  name: 美国法律
  tags:
  - 美国法律
  description: 美国法律（law of the United States）源自美国独立战争时期的英国普通法体系，只是在最高权力条款规定下，美国宪法、国会制定的其他法律和美国参与的国际条约是国家的最高法律。这些文件组成了联邦制下联邦法律的基础，确定了联邦、五十个州与海外领地的法律权限。
