- id: 141203#4
  name: 江南运河
  tags:
  - 江南运河
  description: 到隋朝时，隋煬帝以东都洛阳为中心，开凿连通南北的大运河。在先后开凿通济渠、疏通邗沟、开凿永济渠之后，隋煬帝于大業六年（610年）下旨疏凿和拓宽长江以南的运河古道，连接京口（今镇江）和餘杭（今杭州），将舊有运河连接拓宽，截弯取直。至唐代基本形成现在的格局。
