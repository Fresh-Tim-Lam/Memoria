  name: 珊瑚
  tags:
  - 珊瑚
  description: 香港位於太平洋熱帶地區的北面邊緣，冬季水温較低，當海流向東時會受珠江出海口影響水質也較淡，因此沒有龐大的珊瑚礁，只有外港及離島零散的珊瑚群落，整體來說並非理想的珊瑚棲息地，但仍有12科28屬84種珊瑚。
