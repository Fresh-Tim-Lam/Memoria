- id: 143193#5
  name: 南港山 (台北市)
  tags:
  - 南港山
  - (台北市)
  description: 該處為一絕佳之展望點，台北市風光及四週群山景色可盡收眼底：向北望，近可俯視由左而右排列之四獸山（指「象山」、「獅山」、「豹山」及「虎山」），遠可欣賞五指山、七星山系，及欣賞到基隆河及松山機場飛機起降景觀；向東面及南面可遠眺新北市連綿不絕的山脈，及北二高在山巒間穿梭。
  range:
