- id: 149093#0
  name: 滇缅公路
  tags:
  - 滇缅公路
  description: '!城市名||距起點距離 滇緬公路，前称昆畹公路，起點在中华人民共和国云南省昆明市，終點是缅甸臘戍，全長1,453公里。公路始建於1938年春，於1938年12月初步建成通車，以後陸續加以修改。滇緬公路是中国抗日战争時期，中国西南地区後方的一條歷時最久，運量最大的國際通道，有力地支援了中國抗日戰爭的初期。'
