- id: 150272#2
  name: 修正主义 (马克思主义)
  tags:
  - 修正主义
  - (马克思主义)
  description: “修正”一词来自于拉丁文revidere和revisere，本意为“重判”、“重新审查”，原为中性词，其派生词“修正主义”原泛指对某种学说的修正。20世纪初后，被马克思主义者用于专门称呼那些修改马克思主义基础原理的流派和思潮。最早使用“修正主义”一词指称伯恩斯坦的思想可能是1898-1899年罗莎·卢森堡发表的一组论文，集为《社会改良还是社会革命？》。
