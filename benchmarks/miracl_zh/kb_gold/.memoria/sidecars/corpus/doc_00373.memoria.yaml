- id: 150590#1
  name: 巴塞罗那足球俱乐部
  tags:
  - 巴塞罗那足球俱乐部
  description: 該隊百年的歷史上，獲得许多冠軍獎盃，是西班牙贏得最多冠軍獎盃的球會。在1929年奪得第一屆西班牙足球甲级联赛以及之後的26次聯賽冠軍，30次西班牙國王盃冠軍，5次欧洲冠军联赛冠軍及3次国际足联俱乐部世界杯冠軍。
