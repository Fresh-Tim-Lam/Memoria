- id: 155715#1
  name: 澳門新葡京酒店
  tags:
  - 澳門新葡京酒店
  description: 新葡京酒店所處的區域附近開設有不少賭場或角子機娛樂場，如永利澳門，旁邊則與葡京酒店相鄰，並設有天橋連接葡京以至金碧娛樂場。 赌场叫作新葡京娱乐场，分为四个楼层，合共设有240张赌桌及750部角子机，主要游戏楼层设有10个贵宾厅并提供超过140张百家乐赌枱。
