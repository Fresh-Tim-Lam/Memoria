  name: 李玟
  tags:
  - 李玟
  description: 1997年CoCo第5張華語專輯《每一次想你》問世，李玟幻化成維納斯。這張專輯標榜CoCo特有的「玟式唱腔」，其最大的特色就是「Sincere」─真摯、真誠的音樂共鳴。《每一次想你》是鮑比達、姚謙和CoCo這個黃金金三角組合第二次合作。专辑中的《我的翅膀》则是CoCo三姐妹第一次的合唱。《每一次想你》在發行台灣版本之後，也發行了香港版，除封面、CD盤面設計更換之外，也加收了《等愛降落》粵語版─《虛線》。此張專輯也讓她在隔年第9屆金曲獎首度入圍最佳國語女演唱人獎。
    1997年1
  range:
    start:
      line_hint: 1
      snippet: 李玟
    end:
      line_hint: 3
      snippet: 當時，CoCo要推出首張粵語大碟「李玟Coco」，特地到香港舉辦大型發表會，索尼唱片特地邀請了國際通訊社前往採訪，希望將她的熱歌熱舞傳送到全球，但沒想到國際通訊社對這位小妮子「沒興趣」，不願意前往拍攝，此消息使得CoCo的內心受到不小打擊。
