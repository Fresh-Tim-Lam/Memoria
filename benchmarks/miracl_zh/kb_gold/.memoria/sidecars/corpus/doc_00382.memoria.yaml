- id: 157455#2
  name: 基督教历史
  tags:
  - 基督教历史
  description: 羅馬天主教與希臘東正教在中世紀散佈到全歐洲，文藝復興時代又進一步散布到全世界，成為目前世界上最大的宗教，擁有約20億信徒。現今最具規模的三大教派為罗马天主教、东正教、基督新教（“新教”为泛指称谓。其宗派繁多，如信义宗、圣公宗、归正宗等。新教至今仍在产生新的教派）。
