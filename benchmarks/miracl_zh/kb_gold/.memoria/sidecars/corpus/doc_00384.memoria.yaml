- id: 157707#0
  name: 香山 (北京)
  tags:
  - 香山
  - (北京)
  description: 香山是位于中國北京市海淀區的山脈，為西山的余脉，占地约2400余亩，主峰是鬼见愁，海拔557米。2012年10月以闻名于世的香山红叶入选世界名山。香山是三山五园组成部分之一，清代构成西北皇家园林中重要景观，以香山二十八景、西山晴雪著称。香山集自然景观与中国园林艺术于一体，具极高文化价值。这一地区现大部分被划为香山公园，周边还有北京植物园、团城演武厅等多处园林和人文景观。该地区的景观形成于辽朝以后，以明清的庙宇居多。
