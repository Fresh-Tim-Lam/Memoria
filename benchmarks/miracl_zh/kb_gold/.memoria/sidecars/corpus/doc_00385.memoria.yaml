- id: 161649#0
  name: 中国科学院云南天文台
  tags:
  - 中国科学院云南天文台
  description: 中国科学院云南天文台位于云南省的天文科研机构，拥有多个天文观测站点与一个科研园区，云南天文台本部科研园区位于昆明市区东侧风景秀丽的凤凰山上，海拔2000于米，原为抗日战争时期国立中央研究院天文研究所（现紫金山天文台）的西迁后方所建立的天文观测站，1972年扩建为综合性天文台。2001年，经中央机构编制委员会批准，云南天文台与原北京天文台、乌鲁木齐天文观测站（现新疆天文台）、长春人造卫星观测站等台站、及南京天文光学技术研究所和国家授时中心（原陕西天文台）整合为中国科学院国家天文
  range:
    start:
      line_hint: 1
      snippet: 中国科学院云南天文台
    end:
      line_hint: 3
      snippet: 台保留原级别，同时具有法人资格。 截至2015年6月，云南天文台共有正式职工240人，其中科技人员为210多人。科技人员包括研究员和正高级工程师30多人、副研究员和高级工程师50多人。博士研究生60多人，硕士生60多人，以及在站博士后5人。
