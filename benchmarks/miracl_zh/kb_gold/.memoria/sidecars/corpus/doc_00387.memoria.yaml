  name: 钢琴家
  tags:
  - 钢琴家
  description: 在中国，钢琴被视为西洋乐器。中国出身的世界级钢琴家有傅聪，以诠释肖邦和莫扎特的曲子闻名。還有香港著名鋼琴家鄭慧博士，擁有有鋼琴女詩人的美譽。虽然专业的音乐学院开设了钢琴专业培养职业钢琴演奏家，但民间直到改革开放后，越来越多的家庭才拥有钢琴并让子女学弹钢琴。自2000年来自深圳艺术学校的李云迪获得肖邦国际钢琴比赛首奖后，中国掀起一股“钢琴热”，大城市里成千上万的孩童涌进各种培训中心学习钢琴。在年轻一代的钢琴家里，李云迪、郎朗、陈萨、宋思衡、王羽佳、张昊辰等开始在国际上崭露头角，
