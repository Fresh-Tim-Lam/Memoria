  name: 日本流行文化
  tags:
  - 日本流行文化
  description: 日本動畫主要由東京電視台播放。此台是現時日本製作最多動畫片集的電視台，以動畫及綜藝節目聞名於世；其中，動畫《神奇宝贝》、《新世紀福音戰士》、《Keroro軍曹》、《哈姆太郎》、《火影忍者》、《衝鋒21》、《守護甜心！》、《爆丸》、《戰鬥陀螺
    鋼鐵奇兵》、《遊戲王》、《妖怪手錶》、《偶像學園》、《寶石寵物》、《星光少女》更廣為世界各地電視台轉播。
