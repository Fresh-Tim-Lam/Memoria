- id: 168581#10
  name: 數字化革命
  tags:
  - 數字化革命
  description: 第三代电子计算机是集成电路电子计算机，诞生于20世纪60、70年代。1958年，美国德州仪器公司成功研制了半导体集成电路，但成本高昂；1964年，IBM完成了IBM360系统的研制，集成电路计算机的时代由此展开。此时，十几个乃至数百个电子元件组成的逻辑电路已经可以建立在几平方毫米大的单晶硅片上，它们组成的小规模集成电路（，简写：SSI）代替了分立元件。这代计算机的速度提升至每秒百万次量级，体积变小、速度变快、能耗减少、价格降低、可靠性变强，软件逐渐完善。多道系统和分时系统于此
  range:
    start:
      line_hint: 1
      snippet: 數字化革命
    end:
      line_hint: 3
      snippet: 变强，软件逐渐完善。多道系统和分时系统于此时出现，它们是操作系统诞生的标志。微电脑的发展速度极为迅猛，开始走入日常的办公与学习之中。IBM为此耗费了50亿元，费用约为曼哈顿工程的2.5倍，此项研究工作因此成为了世界上最大的私人企业投资项目。
