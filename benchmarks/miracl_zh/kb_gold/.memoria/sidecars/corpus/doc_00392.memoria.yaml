  description: 1889年設市時，福岡市有人口50,847人。此後直到二戰，福岡市人口長期穩定增加，並在1930年代成為九州人口最多城市和日本人口第七多城市。二戰期間福岡市人口一度減少，但在戰後迅速恢復並在1955年突破50萬人大關。1972年升格為政令指定都市時，福岡市有人口約91.2萬人。1975年，福岡市人口突破百萬大關。在2010年至2015年期間，福岡市的人口增長率和增長數都是政令指定都市首位，人口數更超過京都市和神戶市，成為政令指定都市中人口第五多城市。2020年5月，福岡市人口
  range:
