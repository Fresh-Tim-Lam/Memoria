      line_hint: 3
      snippet: 日本僅次於東京23區、京都市、名古屋市、橫濱市，排名第五，使得九州各地的年輕人口流入福岡市。但另一方面，自九州其他地區轉入的人口亦有約三成比例在之後轉入東京地區。福岡市的總和生育率長期低於日本平均值，在19個政令指定都市中也只排名第16位。
