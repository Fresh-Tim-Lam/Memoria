  name: 曼聯足球俱樂部歷史
  tags:
  - 曼聯足球俱樂部歷史
  description: 曼联的传奇开始于1878年。兰开郡和约克郡铁路公司（Lancashire and Yorkshire Railway Company）铁路客货车工場的工人请求他们的雇主许可和赞助他们建立一支足球队。请求被答应，于是紐頓希夫LYR成立了。他们的球场在北路（North
    Road）上。
