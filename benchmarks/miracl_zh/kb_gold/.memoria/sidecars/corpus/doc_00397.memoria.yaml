  name: 香奈儿
  tags:
  - 香奈儿
  description: 香奈兒公司（），是1910年由可可·香奈儿（"Coco" Chanel，1883年8月19日－1971年1月10日）所創辦的頂級法國女性知名時裝私人公司，由Pierre
    Wertheimer的孫子Alain Wertheimer和GérardWertheimer擁有，Pierre Wertheimer是創辦人可可·香奈兒的早期業務合作夥伴。一开始，这家小商店只是一間帽子店。1912年，可可将店搬至内搬迁至位于旺多姆广场旁边的31号康朋街。
