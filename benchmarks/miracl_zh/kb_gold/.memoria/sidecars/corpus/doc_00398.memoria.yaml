- id: 179955#18
  name: 澳門博彩業
  tags:
  - 澳門博彩業
  description: 澳門現有30間娛樂場（賭場），大部分集中在澳門新口岸，即在港澳碼頭─友誼大馬路─葡京酒店沿線一帶，小部份在氹仔的大酒店內；當中以金沙娛樂場規模最大、海島娛樂場規模最小。它們全部在政府的特許，以及共同的規章下經營。
