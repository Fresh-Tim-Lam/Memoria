  name: 樱花 (民谣)
  tags:
  - 樱花
  - (民谣)
  description: 《樱花》（）是一首描写春天美景的日本传统民谣，创作於江户时代幕末，是为儿童学习日本筝而作。春天是樱花盛开的季节。本曲调式为日本小调，只有do、mi、fa、la、ti五个音。
