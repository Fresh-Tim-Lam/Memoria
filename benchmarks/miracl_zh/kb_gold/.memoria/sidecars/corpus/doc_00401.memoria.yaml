  name: 爱丁堡公爵菲利普亲王
  tags:
  - 爱丁堡公爵菲利普亲王
  description: 2009年4月，菲利普成为英国王室任職最長的君主配偶，2013年2月成为最年長的英国男性王室成员，2019年4月成为英国王室第三长寿成员（继爱丽丝公主、格洛斯特公爵夫人和伊丽莎白王后之后）。
    就个人而言，他对自身极长的寿命并不热衷。在2000年接受采訪時，當被問道是否想當個百歲老人，他回答到“那我...无法想象比這還要糟糕的事情"他说 "因我的身體已猶如脫落的碎片一般”。
