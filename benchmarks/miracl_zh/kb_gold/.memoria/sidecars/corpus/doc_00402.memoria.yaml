  description: 在春秋战国时期，除了群貊（mò）之外，都和中原的华夏发生了广泛的接触和交流。春秋时北方的晋国与战国时北方的燕赵两国，都征服和兼并了许多夷狄部族，并与之相互通婚。东方的齐鲁两国则完全征服了东夷。西方的秦国，从受封之前就世代致力与和戎狄的斗争，到秦始皇时代已经完全征服了西戎与巴蜀一带的氐羌。楚国则在一直在长江流域进行扩张，不但兼并许多华夏诸侯、更将群蛮与百越的地方都收入版图。吴国是一个夏人（周人，太伯仲雍）统治本地土著的诸侯国。而越国则属于南方百越部族。这两个国家先后加入了诸夏的
