      snippet: 侯、更将群蛮与百越的地方都收入版图。吴国是一个夏人（周人，太伯仲雍）统治本地土著的诸侯国。而越国则属于南方百越部族。这两个国家先后加入了诸夏的集团，最后这两个国家的人民与土地都并入了楚国。秦楚两大强国，一个统一了九州的西部，一个统一了南部。
