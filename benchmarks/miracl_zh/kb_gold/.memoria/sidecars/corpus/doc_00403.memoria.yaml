- id: 188940#4
  name: 朝廷
  tags:
  - 朝廷
  description: 日本的朝廷就是与武家幕府相对，而以天皇为基础的统治机构，俗曰公家。10世纪后喪失了统治實权，成为形式上存在的虛設机构。但其中的职务仍然存在。直到安土桃山时代以前，武家政權掌权但并不太干涉朝廷的官职任命等事，虽然官职并没有权力，只是空名。到江戶时代，日本幕府开始大力干涉朝廷内部事務，強制天皇把许多有力的武士任命为朝廷的官员直到大政奉還為止。
