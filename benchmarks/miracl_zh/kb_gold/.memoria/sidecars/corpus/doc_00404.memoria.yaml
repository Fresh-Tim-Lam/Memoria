  name: 有限承认国家列表
  tags:
  - 有限承认国家列表
  description: 目前联合国拥有193个会员国，而梵蒂冈与巴勒斯坦国则拥有观察员国地位。但是仍然有一些符合宣告说建国标准、得到了其他大多数国家承认并是联合国成员国的国家也被列入本列表，这是由于这些国家因为领土或其他冲突而未得到其他另外一些国家的承认。
