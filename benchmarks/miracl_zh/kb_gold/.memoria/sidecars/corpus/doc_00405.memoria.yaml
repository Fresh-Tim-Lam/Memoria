- id: 199538#4
  name: 希伯來聖經
  tags:
  - 希伯來聖經
  description: 在基督宗教中，由于宗派的差别，信仰的不同，所理解的希伯来语圣经的含义也是不尽相同的。在基督新教中，希伯来语圣经指的是39卷的旧约，等同于犹太教的24卷的塔納赫。但在天主教中，希伯来语圣经指的则是46卷的旧约；在东正教中，希伯来语圣经指的就是50卷的旧约。
