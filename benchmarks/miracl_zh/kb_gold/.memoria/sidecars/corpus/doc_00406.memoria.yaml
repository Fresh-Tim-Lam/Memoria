- id: 202805#46
  name: 中国书法史
  tags:
  - 中国书法史
  description: 明中期，以吴中四才子——祝允明、文征明、唐寅和王宠——为代表的文人书法，体现了这个时期的书法成就。祝允明、文征明和唐寅都是当时知名的大才子，以诗文名揚天下，而文、唐二人在绘画上也是当世巨擘，王宠则擅长篆刻。这些人艺术修养全面，书法风格方面追求个性，与仕途必修的台阁体书风截然不同。祝允明的草书成就最高，清朝朱和羹在《临池心解》中这样评价他：“祝京兆大草深得右军神理，而时露伧气；小草则顿宕纯和，行间茂密，亦复丰致萧远，庶几媲美褚公。”文征明小楷名动海内，代表作《千字文》被认为可比
  range:
    start:
      line_hint: 1
      snippet: 中国书法史
    end:
      line_hint: 3
      snippet: 子太保，仕途亨通，是当时的文坛领袖。董其昌艺术修养非常全面，书法和绘画都有极高成就，并擅长书画鉴定和收藏，且精通禅理。他的书法综合了前朝历代各家风格而能自成一路，其书风飘逸空灵，布局疏朗匀称，用墨枯湿浓淡变化多端，被认为是“集古法之大成”。
