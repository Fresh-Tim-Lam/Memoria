  name: 美国音乐
  tags:
  - 美国音乐
  description: 美国音乐反映了该国多元种族混合的文化。该国音乐受到西非、爱尔兰、和欧洲大陆音乐的影响，最出名的音乐类型包括爵士、藍調、乡村、藍草、摇滚、节奏布鲁斯、拉格泰姆、嘻哈、理髮師合唱、流行、实验、铁克诺、浩室、舞曲、、騷沙和摇滚等。美国是全球。2014年，该国唱片零售额达到了48.983億美元。美国的音乐在全球听众众多。自20世纪初，美国流行音乐开始风靡全球。
