  name: 燕麦
  tags:
  - 燕麦
  description: 燕麦（学名：）别称皮燕麦，为禾本科早熟禾亚科燕麦属植物，是人類的主食之一，常製成燕麥片、販售，大燕麥片也常作為家畜的飼料。燕麥是高營養成份的食物，定期食用時可以降低血液中的膽固醇。
