- id: 206639#1
  name: 燕麦
  tags:
  - 燕麦
  description: 燕麦中所含的燕麦球蛋白（Avenin，是類似小麦中的成份）會讓少部份人有乳糜瀉症狀。而燕麦在製造過程也常會混合到少量含有麸质的穀類，例如小麦及大麥。燕麥含有植酸攝取過量會影響鈣、鐵、鎂的吸收，為骨質疏鬆症、貧血患者應注意的產品，加工製品單位熱量遠高於米飯，糊化後升糖指數（GI值）亦會增加。
  range:
    start:
      line_hint: 1
      snippet: 燕麦
    end:
      line_hint: 3
      snippet: 的成份）會讓少部份人有乳糜瀉症狀。而燕麦在製造過程也常會混合到少量含有麸质的穀類，例如小麦及大麥。燕麥含有植酸攝取過量會影響鈣、鐵、鎂的吸收，為骨質疏鬆症、貧血患者應注意的產品，加工製品單位熱量遠高於米飯，糊化後升糖指數（GI值）亦會增加。
