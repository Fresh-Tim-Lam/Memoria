- id: 211507#16
  name: 湖南人口
  tags:
  - 湖南人口
  description: 维吾尔族在湖南省内虽分布较少，但湖南是除新疆以外维族人口最集中的省份，全省维吾尔族人口数7,939人（2000年人口普查），人口数列湖南人口第十一位（2000年第五次人口普查），占维吾尔族人口（仅中国大陆）的比重为0.094%，维族占湖南全省少数民族人口的0.124%。
