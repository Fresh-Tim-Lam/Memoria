- id: 216246#1
  name: 里约热内卢
  tags:
  - 里约热内卢
  description: 里約熱內盧由葡萄牙人於1565年建立，最初是葡萄牙帝國的里約熱內盧都督所在地。後在1763年成為葡萄牙帝國的巴西州首府，在本土被拿破崙入侵後，葡萄牙王室於1808年遷往巴西，里約熱內盧成為葡萄牙女王玛丽亚一世的臨時首都所在地。隨後，她在她的兒子葡萄牙攝政王若昂六世的領導下，以皇帝委任的葡萄牙總督身份開始統治城市，直到1822年巴西獨立戰爭後，里約熱內盧成為巴西的首都，直至1960年4月21日遷都巴西利亞為止；。
