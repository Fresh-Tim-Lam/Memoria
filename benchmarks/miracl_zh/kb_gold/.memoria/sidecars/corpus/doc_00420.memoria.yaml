- id: 218148#15
  name: 美国宪法历史
  tags:
  - 美国宪法历史
  description: 1776年初，大陆会议通过了独立方案，建立一个政治实体并且寻求外国援助。大陆会议指派了以托马斯·杰斐逊为首的五人委员会起草这个宣言。独立宣言在1776年7月2日被通过，并且在4日被正式宣告。宣言包含了基于英国哲学家约翰·洛克的宪政思想的三项基本原则：自然权利、政府的合法性来自被统治者和被统治者改变政府的权利。
