- id: 226068#6
  name: 江海关
  tags:
  - 江海关
  description: 清初平定明鄭后，政府于康熙廿三年宣佈展界開海，决定重新设立负责对外贸易事务的机构，并定名为海关，取代了历代沿用数百年的“市舶司”管理体制，遂海关一词沿用至今。当时全国共设有四座海关，由北往南分别为江、浙、闽、粤海关。江海关最初设在连云港云台山，后移至上海松江，康熙二十六年江海关因原办公地点狭窄，于是移驻到上海县城宝带门内（今黄浦区小东门内）。
