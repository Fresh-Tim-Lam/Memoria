- id: 226070#1
  name: 江海关大楼
  tags:
  - 江海关大楼
  description: 1685年，在清朝击败明鄭政权后，放松海禁并在江南、浙江、福建、广东四省设海关管理国际贸易。其中江南海关简称“江海关”。《中英南京条约》签订后，道光二十三年（1843年11月17日），江海关于县城洋泾浜北面（今延安东路外滩）设立盘验所，进行外商的出入境申报及缴纳关税的业务，此事标志着清政府开始履行《南京条约》中将上海作为通商口岸的条文，上海自该日起正式开埠。
