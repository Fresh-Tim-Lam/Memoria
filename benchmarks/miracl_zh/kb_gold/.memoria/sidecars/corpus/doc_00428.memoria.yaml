  name: 楊受成
  tags:
  - 楊受成
  description: 由楊受成一手創立的英皇集團至今已發展為多元化綜合企業，業務包括金融、地產、鐘錶珠寶、娛樂、酒店、傳媒和傢俬及室內佈置等，並擴展至中國、澳門、泰國、印尼、美國及歐洲等地。楊受成更托付陶傑寫他一生的自傳，推出『爭氣』一書。
