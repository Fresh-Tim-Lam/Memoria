- id: 233864#1
  name: 廢藩置縣
  tags:
  - 廢藩置縣
  description: 1868年，德川幕府被推翻后，明治天皇為政，是为明治维新。新政府决定废除封建制度，革新日本的政治制度。將軍不再，政归天皇，超过三百个大名放弃领地，以往同時具備領地與一級行政區功能的「藩」俱廢，改以新設「县」取代；新政府按照地理分布劃出超过三百个县，建立中央集權導向的地方制度，虽然幕藩體制没有被完全废除，但在名义上已不再存在。
  range:
    start:
