- id: 239014#1
  name: 公司秘書
  tags:
  - 公司秘書
  description: 公司秘書的工作於公司的方向、管治、行政及管理都是不可或缺的。公司秘書的責任很廣泛，範圍包括行政，例如人事管理、公司帳目管理、籌組股東周年大會、公司業績報告，確保董事局及管理階層的利益申報和披露符合法規、或向董事提出良好的公司管治手法等等。
    公司秘書不僅與公司董事、經理及股東緊密合作，還要與政府中各個規管公司經營的部門，交流與溝通：
