      snippet: 遠超過地震的影響，英語中的海嘯一詞就是來自于日語中的「津波」（）。除了地震和海嘯之外，火山亦經常在日本引發災害。近年日本較為活躍的火山有有珠山、淺間山、三宅島、阿蘇山和櫻島等。日本其他的主要自然災害還有山體滑坡、泥石流、洪灾、風災和雪災等。
