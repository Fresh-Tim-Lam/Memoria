  description: 由於日本列島位處數個板塊的的交界和環太平洋火山帶之上，火山活動十分活躍，日本在歷史上曾多次發生地震和海嘯等災難。20世紀以來，在日本造成重大損失的大地震有1923年導致超過10萬人死亡的關東大地震、1995年的阪神淡路大地震和2011年引發海嘯和福島核事故的東北地方太平洋地震。在沿海地區，地震之後引發的海嘯常帶來遠超過地震的影響，英語中的海嘯一詞就是來自于日語中的「津波」（）。除了地震和海嘯之外，火山亦經常在日本引發災害。近年日本較為活躍的火山有有珠山、淺間山、三宅島、阿蘇山
  range:
