  description: 日本动画最早开始于1917年，早期的動畫製作人包括下川凹天、 和北山清太郎，被合称为“日本动画之父”。此後直至1980年代，日本的動畫才開始在日本被接納為主流，製作量隨之迅速增長，GUNDAM系列作品的製作亦於這個年代開始。日本動畫於1990年代及2000年代迎來它被海外市場接受程度的提昇。動畫連續劇諸如《新世紀福音戰士》和《攻殼機動隊》於日本大受歡迎，亦吸引海外觀眾的注意。《七龍珠》《美少女戰士》《神奇寶貝》等作品的周邊商品在歐美地區更是搶手貨。《千與千尋》於2002年德國
  range:
    start:
      line_hint: 1
      snippet: 日本
    end:
      line_hint: 3
      snippet: 動畫市場的迅速擴張，大量在1990年代成立，並帶動動畫展覽會的興起。這些展覽會主要展示日本以至世界各國的動漫作品，並包含cosplay比賽等其他元素。另一方面，日本的動漫文化亦創造不少獨特的名詞，例如用於指稱熱衷及博精於ACG的「御宅族」。
