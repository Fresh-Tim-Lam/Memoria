      snippet: -tw:烏龍麵}-這两种传统的麵條比較受歡迎，汤底通常是用鱼类煮成的高湯加入酱油调味以及加上不同种类的蔬菜。另一種很受欢迎的麵类是在20世纪早期由中国传入的拉麵。拉麵使用的汤底有许多种，比如用鱼类和酱油煮成的高汤，或是猪肉和奶油煮成的高汤。
