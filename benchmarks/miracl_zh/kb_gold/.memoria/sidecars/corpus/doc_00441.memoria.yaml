  name: 日本
  tags:
  - 日本
  description: 日本饮食文化的其中一項特色是生食，大部份食物如鮪魚、鲑鱼、河豚、章鱼、牛肉、雞肉、雞蛋等都可以生食入菜。由于日本是海岛型国家，日本人相当喜好海产品，例如鱼，贝类，章鱼，虾蟹类和海草等。日本人在明治时代前有一段頗長的时间（約1200年）除武士在外會進食打獵得來的野獸外並不進食獸肉，可能因此導致日本人比起區內其他國家體格比較矮小。直至1872年1月24日，明治天皇宣布廢除肉食禁令並親自食用牛肉，才終結日本人不常吃獸肉的歷史。现在的日本料理大多含有獸肉，如牛肉、猪肉和鸡肉等都是日常
  range:
    start:
      line_hint: 1
