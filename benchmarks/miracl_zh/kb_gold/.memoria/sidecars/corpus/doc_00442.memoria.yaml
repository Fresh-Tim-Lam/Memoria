  description: 香港（全稱香港特別行政區，簡稱港，雅稱香江；，縮寫作 / / ），是中華人民共和國的兩個特别行政區之一，是一個全球城市，亞太地區、大中華地區、粵港澳大灣區主要城市之一。處南海北岸、珠江口東側，毗鄰廣東省，西隔珠江與澳門、珠海市相望，北沿深圳河接深圳市。位於中國大陸南端，地處西太平洋沿岸各國中心，又當太平洋和印度洋航運要衝。全境由香港島、九龍和新界組成；香港地理環境上則由九龍半島等大陸土地，以及263個島嶼構成。截至2021年年中，香港人口臨時數字由去年年中的748萬人減至約7
