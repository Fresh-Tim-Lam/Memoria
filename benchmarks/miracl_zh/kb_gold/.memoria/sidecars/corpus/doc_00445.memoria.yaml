- id: 274728#0
  name: 台灣宗教
  tags:
  - 台灣宗教
  description: 臺灣各宗教受《憲法》保障，人民擁有宗教信仰的自由，並且各宗教間皆為平等。除此之外，政府奉行政教分離原則，政府與宗教之間亦無關聯。臺灣主體民族為漢族，因此如佛教、道教等傳統信仰在一般民眾中極為流行且根深柢固。西方世界較常見的基督宗教，亦擁有不少的信眾。
