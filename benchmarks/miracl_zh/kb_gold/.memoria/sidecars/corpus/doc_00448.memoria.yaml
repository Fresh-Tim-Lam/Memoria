  name: 台灣宗教
  tags:
  - 台灣宗教
  description: 根據皮尤研究中心於2015年的預測，在2020年時台灣的信仰人口將為：民間信仰43.8%、佛教21.2%、基督教5.8%、回教<1%、猶太教<1%、印度教<1%、其他宗教15.5%、沒有宗教信仰13.7%。佛教和民間信仰者合計將佔約65%，基督教佔5.8%。
