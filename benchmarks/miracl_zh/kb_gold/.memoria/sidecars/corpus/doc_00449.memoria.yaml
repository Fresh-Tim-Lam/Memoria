- id: 274728#70
  name: 台灣宗教
  tags:
  - 台灣宗教
  description: 在台湾亦有一些较少与其他教派来往的小型教派，传教方式方式特立独行。例如江端仪在1960年代创立的新约教会，江端仪去世后由洪以利亚带领。新约教会的圣山位于高雄市那瑪夏區的錫安山。至於眾多國際小教派，如東方正統教會（非指正教會）、舊天主教會、基督科學教會等則無相關社群、僅偶然伴隨外籍人士出現在台灣人眼中。
  range:
