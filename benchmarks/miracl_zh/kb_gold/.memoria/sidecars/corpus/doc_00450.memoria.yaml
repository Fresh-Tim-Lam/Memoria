  name: 英皇集團
  tags:
  - 英皇集團
  description: 英皇集團（），創辦人楊成，現任董事局主席為其子楊受成，成立於1942年，從上海街一間鐘錶零售商成安記表行發展成為綜合企業，業務包括金融、地產、鐘錶珠寶、電影、娛樂、酒店、傳媒和傢俬及室內佈置等。
