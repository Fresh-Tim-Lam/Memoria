  name: 納斯達克100指數
  tags:
  - 納斯達克100指數
  description: 納斯達克100指數（）是美國納斯達克100支最大型本地及國際非金融類上市公司組成的股市指數，以市值作基礎，並以一些規則平衡較大市值股份造成的影響。與標準普爾500指數、納斯達克綜合指數不同，在成份股中並沒有金融機構。納斯達克100指數、道瓊工業平均指數、標準普爾500指數及羅素2000指數是美國最重要的股票指數。四個主要指數均有標準、迷你及微型期貨／選擇權可供投資者交易。
    此表格顯示2022年2月22日的成份股資料。
