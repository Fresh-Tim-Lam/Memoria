  name: 间谍
  tags:
  - 间谍
  description: 近代影視作品中，警隊與黑幫的臥底題材取得了一定程度的成功，因為劇情往往比較刺激，受到影迷的熱捧，比較著名的有英国电影《007》系列，美國電影好萊塢《不可能的任務》系列，《金牌特務系列》，香港電影《門徒》、《無間道》系列和《使徒行者》系列，中国影视作品《潜伏》、《黎明之前》、《敌营十八年》、《風聲》等等。
