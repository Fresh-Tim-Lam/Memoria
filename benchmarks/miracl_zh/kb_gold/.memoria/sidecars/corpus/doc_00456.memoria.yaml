- id: 297848#2
  name: 臺灣五大家族
  tags:
  - 臺灣五大家族
  description: 所以近年來也有人將此台灣前五大財閥，即台塑 王家、遠東 徐家、國泰與富邦 蔡家、和信與中信 辜家、新光與台新 吳家，稱為新台灣五大家族。其中傳統的五大家族獨鹿港辜家猶引領風騷。而板橋林家、霧峰林家、高雄陳家儘管不在前五大榜上，但在金融產業方面仍保持著相當的影響力（例如華南金控最大民股林明成、林知延父子為板橋林家後人、霧峰林家以彰化銀行為主、高雄陳家則在南部坐擁大片土地），惟規模不及「吳辜蔡」三家。
