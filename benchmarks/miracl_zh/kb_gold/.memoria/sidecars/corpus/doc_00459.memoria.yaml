- id: 311811#8
  name: 皮埃蒙特大区
  tags:
  - 皮埃蒙特大区
  description: 早前於1820年-1821年及1848年-1849年所发起对抗奥地利帝国的战争失败之后，皮埃蒙特成为了1859年-1861年间意大利统一运动的发起地区。统一之后，萨伏依王室成为了意大利国王王室，而都灵也短暂地成为意大利的首都。但是，王国的领土增加却降低了皮埃蒙特在王国中的地位，国都先迁至佛罗伦萨，后来再迁至罗马。其中一个可证明皮埃蒙特在意大利历史上占有代表地位的，就是意大利的王储冠以皮埃蒙特亲王衔。義大利統一完成後，皮埃蒙特是義大利首次工業化的發展重鎮之一。
