      snippet: 》。1986年創刊了年刊現代用語詞典《imidas》。這個詞典的發行相當成功，以後每年都有發行。集英社與小學館共同擁有Viz Media，該公司出版了北美地區所有三家公司的漫畫。集英社從1977年開始主辦昴文學獎。以下雜誌皆按照停刊日期排列
