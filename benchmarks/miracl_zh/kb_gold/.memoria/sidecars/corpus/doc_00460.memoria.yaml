  description: 集英社發行的漫畫雜誌包括Jump雜誌系列，其中包括少年漫畫雜誌《週刊少年Jump》、《Jump Square》以及《V Jump》，以及青年漫畫雜誌《週刊Young
    Jump》、《Grand Jump》與《Ultra Jump》。也出版其他類型的雜誌，包括《週刊Playboy》、《non-no》等時尚雜誌，還出版了文藝書、小說等書籍。2014年起開設網上漫畫平台《少年Jump+》。1986年創刊了年刊現代用語詞典《imidas》。這個詞典的發行相當成功，以後每年都有發行。集英
  range:
