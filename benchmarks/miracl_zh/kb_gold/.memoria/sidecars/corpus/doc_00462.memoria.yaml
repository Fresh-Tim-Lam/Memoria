- id: 321513#19
  name: 孝懿仁皇后
  tags:
  - 孝懿仁皇后
  description: 雍正帝幼年時曾被佟佳氏撫養，當時她是以貴妃或皇貴妃的身份撫養眾皇子，所以雍正帝只是其一，而養育雍正帝的保母亦包含順善夫人王氏和恭勤夫人謝氏。雍正帝称佟佳氏“十载躬育”，並对佟佳氏的弟妹等人亦颇为礼遇，甚至稱佟佳氏的弟弟隆科多为“舅舅隆科多”。佟佳氏的妹妹佟贵妃亦因姊姊孝懿仁皇后的缘故，得到雍正帝晉升为皇贵妃。
