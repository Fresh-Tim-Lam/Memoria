- id: 322742#0
  name: 秘鲁行政区划
  tags:
  - 秘鲁行政区划
  description: 秘鲁是一个单一制、权力分散的国家。根据秘鲁宪法，秘鲁一级行政区划包括24个大区（西班牙语：región，旧称 departamento）和1个直属区（provincia
    constitucional，意为“宪法指定的省份”），首都利马所在的利马省不属任何大区。大区再被分为196个省（provincia）和1832个区（distrito）。
