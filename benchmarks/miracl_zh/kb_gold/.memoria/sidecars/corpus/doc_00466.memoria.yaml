- id: 326128#0
  name: 东非共同体
  tags:
  - 东非共同体
  description: 东非共同体（簡稱東共體；英文：East African Community，EAC）是由肯雅、乌干达、坦桑尼亚、布隆迪、卢旺达和南苏丹六个东非国家组成的区域性国际组织。该组织于1967年首次成立，1977年解散；其後在2000年由肯尼亚、乌干达和坦桑尼亚在阿鲁沙重新組織成立，总部也设于阿鲁沙。2004年，三国签订条约，成立关税同盟，于2005年1月生效。
