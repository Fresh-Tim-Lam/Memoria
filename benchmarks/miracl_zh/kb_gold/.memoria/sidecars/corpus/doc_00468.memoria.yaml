      snippet: 大量明亮恆星與暗灰塵。螺旋臂內的疏散星团內有大量藍色恆星沿著螺旋臂分佈，其間有大量的星際塵埃暗區。較暗的恆星和星際氣體佔了星系質量大部分，並且主導了星系內側動力狀態。而星系外側可見物體的動力模式則必須以目前無法被直接觀察的暗物质的存在解釋。
