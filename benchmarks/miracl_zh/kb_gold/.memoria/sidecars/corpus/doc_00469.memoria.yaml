  name: 图尔
  tags:
  - 图尔
  description: 图尔（，），法国中西部城市，中央-卢瓦尔河谷大区安德尔-卢瓦尔省的一个市镇和该省的省会，下辖图尔区，其市镇面积34.36平方公里，时人口数量为人，是该省乃至整个大区人口数量最多的城市。2018年，图尔-卢瓦尔河谷都会区成立，代替了原来的城市圈公共社区，成为了法国22个都会区之一。
