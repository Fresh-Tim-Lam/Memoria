- id: 335780#2
  name: 現代英語
  tags:
  - 現代英語
  description: 根據民族語網站，1999年有超過五億八百萬人以英語作為第一或第二語言，其使用者數目在全世界僅少於中文的使用者。然而漢語的使用範圍較小，主要侷限於大中华地区及华人间的交流。相對於其使用範圍來說，使用英語的地區遍及美國、加拿大、英國、愛爾蘭、澳洲、紐西蘭、印度、巴基斯坦及南非等地。長久以來，龐大的使用人口，加上全球的普及應用，讓英語成為一種國際語言。現今不論文化交流、資訊傳播、商業活動，還是國際外交等領域，英語都必不可少。
