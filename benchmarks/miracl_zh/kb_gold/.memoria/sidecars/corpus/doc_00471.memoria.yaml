- id: 354639#3
  name: 行星定義
  tags:
  - 行星定義
  description: 按照以上定義，太陽系有八個行星：水星、金星、地球、火星、木星、土星、天王星和海王星，而冥王星被排除在外。至2007年7月為止，已獲承認的矮行星則有冥王星、穀神星和鬩神星，2008年7月才增加了第四顆鳥神星，又於同年9月增加了第五顆妊神星。但國際天文學聯合會的這項決議並無法弭平所有爭議，部分天文學家拒絕承認此一決議。
  range:
