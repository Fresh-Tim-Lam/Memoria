- id: 368178#1
  name: 波蘭國旗
  tags:
  - 波蘭國旗
  description: 波兰官方在1831年采用白色和红色为国家代表色。这两种颜色有着纹章学的血统并延伸自波兰立陶宛联邦两个政体国徽上的颜色（即波兰红底白鹰和立陶宛红底白马白骑士（、）上的红和白）。在1831年之前，波兰士兵配戴各种颜色的帽徽。国旗在1919年被正式采用。自2004年起，每年5月2日定为波兰的国旗日。
