- id: 370931#1
  name: 足球週刊
  tags:
  - 足球週刊
  description: 《足球周刊》与多間歐洲雜誌社有合作關係，與《法國足球》(France football)、西班牙《足球先生》(don balon)、南非《開球》(Kickoff)有獨家版權合作協議，與意大利《米蘭體育報》(La
    Gazzetta dello Sport)及Eurosport為海外戰略合作伙伴，因此《足球周刊》經常能轉載球員獨家訪問、球員專訪，和專題介紹。
