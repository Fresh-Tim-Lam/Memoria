  name: 美商海盗船
  tags:
  - 美商海盗船
  description: Corsair也有生產許多的水冷散熱模組。從Hydrocoo，一個外置、擁有LED溫度顯示與提手的設備開始，直到後來轉型為基於嚴密 Swiftech設計的Corsair
    Cool內部模組。Corsair也設計出了小型的水冷產品Nautilus 500，一個由120mm風扇，水冷排，低噪音水泵與可變風速風扇組成的獨立外置元件。Nautilus
    500與其他水冷散熱模組相比是一個意義深長的出發點，因其在保證效果與安裝簡易的前提下仍具有性價比。
