  name: 大陆篮球协会
  tags:
  - 大陆篮球协会
  description: 联赛发源于宾西法尼亚州，声称是世界上最早的职业篮球联赛。NBA虽然同样成立于1946年，但成立于六月的NBA比成立于四月的大陆篮协晚两个月。大陆篮协的首任行政主管是Harry
    Rudolph，也是NBA著名的裁判Mendy Rudolph的父亲。
