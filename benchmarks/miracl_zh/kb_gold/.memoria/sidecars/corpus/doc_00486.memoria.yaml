- id: 387443#15
  name: 中國文化史
  tags:
  - 中國文化史
  description: 春秋戰國時代的思想開放運動其規模之大歷史之長也為僅見。人文思想在此時期也成為中國哲學的支柱。诸子百家在这个历史阶段各自宣扬自己的政治主张与处世思想，其中，孔子、孟子、荀子等所主张的崇尚伦理道德和等级制度而继承西周礼制的儒家，墨子、宋钘等所主张的尚贤兼爱非攻非命节葬而继承夏商文化的墨家，老子、杨朱、列子、庄子等所主张的崇尚自然而清静无为并追求个人自由的道家，商鞅、韩非等所主张的鼓吹君主集权专制和刑名权术的法家，與後來的佛家思想，並為後世中國最重要的五種思想。
