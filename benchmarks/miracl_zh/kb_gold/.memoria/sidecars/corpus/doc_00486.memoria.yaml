      snippet: 家，墨子、宋钘等所主张的尚贤兼爱非攻非命节葬而继承夏商文化的墨家，老子、杨朱、列子、庄子等所主张的崇尚自然而清静无为并追求个人自由的道家，商鞅、韩非等所主张的鼓吹君主集权专制和刑名权术的法家，與後來的佛家思想，並為後世中國最重要的五種思想。
