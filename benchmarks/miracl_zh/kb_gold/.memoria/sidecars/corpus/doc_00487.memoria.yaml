- id: 387775#5
  name: 李光洙
  tags:
  - 李光洙
  description: 李光洙的作品數量相當多，主要有小說《無情》、《麻衣太子》、《泥土》、《端宗哀史》、《再生》、《尹光浩》、《徬徨》、《有情》、《異次類之死》、《愛》、《元曉大師》等。另外，李光洙亦著有大量的詩歌及論文，如有名的《民族改造論》、《文學的價值》、《文學是什麼》、《今日我韓青年和情育》、《文士與修養》、《藝術與人生》、《余的作家的態度》、《朝鮮文學的概念》等等。
  range:
    start:
