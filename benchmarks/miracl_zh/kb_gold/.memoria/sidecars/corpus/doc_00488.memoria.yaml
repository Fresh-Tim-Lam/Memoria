- id: 387983#89
  name: 西班牙帝國
  tags:
  - 西班牙帝國
  description: 15世紀起，西班牙建立美洲殖民地，使西班牙語和天主教傳播到美洲和西屬東印度群島（密克羅尼西亞聯邦、關島、馬里亞納群島、帛琉和菲律賓）。今天「拉丁美洲」一詞的由來，和西班牙在美洲的殖民統治有很大關係。目前在美洲大陆，除加拿大、美国、巴西、圭亚那、苏里南以及法属圭亚那以外的所有地区都以西班牙语为官方语言，而美国也因为有不少拉丁裔美国人使用西班牙语，西班牙语已成为美國的第二大使用语言。受西班牙帝国的影响，目前世界上有约3亿人以西班牙语作为第一语言。
