  name: 港澳地區
  tags:
  - 港澳地區
  description: 香港位於南中國海沿岸，地處珠江口以東，全境由香港島、九龍和新界（包括264個島嶼）三大部份組成，總面積共2,754.8平方公里。北面連接中國大陸，西面與澳門隔海相望。
