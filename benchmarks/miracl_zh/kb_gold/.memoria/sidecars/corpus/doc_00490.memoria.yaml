- id: 395279#1
  name: 藥用鼠尾草
  tags:
  - 藥用鼠尾草
  description: 藥用鼠尾草有許多不同的用途與功效，部份同屬植物也有相同的效用，它常常栽培來做為廚房用的香草或醫療用的藥草，有時也被稱為庭園鼠尾草、廚房鼠尾草、達爾馬希亞鼠尾草。在南歐，有時候也會種植一些和藥用鼠尾草類似的植物，來做為香草與藥草使用，這些和鼠尾草同屬的植物常會和真的藥用鼠尾草弄混淆。
