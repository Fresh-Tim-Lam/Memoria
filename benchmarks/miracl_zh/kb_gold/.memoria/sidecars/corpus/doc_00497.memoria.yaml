- id: 411204#4
  name: 基督教派系
  tags:
  - 基督教派系
  description: 在早期教会被认为是异端的一些运动今日已不复存在，它们通常并不被当作是基督教派，如诺斯替主义，以便尼主义以及亚流主义。今日基督教世界最大的分别在于東正教、天主教、以及宗教改革后产生的种种不同的教派（即新教）。在东正教和新教之间也存在不同程度的合一与分裂。
