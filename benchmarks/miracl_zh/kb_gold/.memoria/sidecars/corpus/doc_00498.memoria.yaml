  name: 基督教派系
  tags:
  - 基督教派系
  description: 西方基督教主要分为两个主要部分：天主教和新教，其中新教分為若干主流宗派。起源於中東的耶路撒冷，後在歐洲發展，之後通過西方地理大發現和全球開拓，而把基督教擴展至全世界，使基督教成為全世界的主流宗教之一。
