- id: 418094#1
  name: 股價指數
  tags:
  - 股價指數
  description: 股價指數編成方式有很多種。廣基指數（）代表整個股票市場的績效，採用選樣的方式反映投資人對經濟現況的敏感度。最常被提及的廣基指數多以包含一個國家最大的的证券交易所裡最具規模的上市公司編製，例如美国道瓊工業指數（）及标准普尔500指数（），倫敦金融時報指數（或倫敦金融時報100種股價指數，倫敦金融時報100指數，），法國證商公會指數（或法國證商公會40種股價指數，），德國法蘭克福股價指數（）及日經指數（或日經225指數，）。
