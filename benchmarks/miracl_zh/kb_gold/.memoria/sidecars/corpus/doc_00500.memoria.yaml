  tags:
  - 明朝
  description: 明朝（1368年1月23日－1644年4月25日）是中國歷史上最後一個由漢族建立的大一统朝代，歷經十二世、十六位皇帝，國祚二百七十六年。明朝初代皇帝是明太祖朱元璋，末代皇帝則是明思宗朱由检。
