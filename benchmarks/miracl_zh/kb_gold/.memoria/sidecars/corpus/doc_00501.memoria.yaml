- id: 428010#90
  name: 明朝
  tags:
  - 明朝
  description: 文學方面，中國小說史上的四大名著中的《西遊記》、《水滸傳》、《三國演義》（原本是《金瓶梅》後被三國代替）就是出於明朝。馮夢龍加工編輯的三部白話短篇小說集「三言」（即《喻世明言》《警世通言》《醒世恆言》）每部四十篇，共一百二十篇，主要是描寫青年愛情故事以及平民市井生活，最著名的如《杜十娘怒沉百寶箱》、《金玉奴棒打薄情郎》、《轉運漢巧遇洞庭紅》等；與「三言」類似每部四十篇的短篇小說集還有凌蒙初編著的「二拍」以及1987年才被發現的《型世言》（陸人龍編著）。傳統雅文學的發展在明代繼
  range:
    start:
      line_hint: 1
      snippet: 明朝
    end:
      line_hint: 3
      snippet: 著的「二拍」以及1987年才被發現的《型世言》（陸人龍編著）。傳統雅文學的發展在明代繼續發展，著名文人有劉基、宋濂、高啟、方孝孺、唐寅、歸有光、徐渭、王世貞、袁宏道、錢謙益、張岱、吳偉業等人。散曲家則有王磐、馮維敏、薛論道、陳譯、康海等人。
