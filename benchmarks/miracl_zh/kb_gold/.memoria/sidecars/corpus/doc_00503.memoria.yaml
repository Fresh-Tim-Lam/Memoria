- id: 433946#1
  name: 花見
  tags:
  - 花見
  description: 赏花的习俗刚刚传入日本时，指观赏梅花，但是现今多指观赏樱花，并在盛开的樱花树下宴饮庆祝。每年三四月份，樱花从开花、盛开再到凋谢，通常只会持续一两周时间，期间各种媒体会进行追踪报道。近年来，日本以外也开始流行类似的赏花活动。
