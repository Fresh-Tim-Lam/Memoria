- id: 443096#0
  name: 幕府 (日本)
  tags:
  - 幕府
  - (日本)
  description: 幕府（）是指日本歷史上由征夷大將軍（俗稱幕府將軍，簡稱將軍）領導與統治的武家政權，為日本特有國情下所產生近似「尊王攘夷」的政治體制，從1185年源平合戰結束時開始，至1867年明治維新時結束，歷經鎌倉幕府、室町幕府、江戶幕府的三個幕府時期，時間總長682年。
