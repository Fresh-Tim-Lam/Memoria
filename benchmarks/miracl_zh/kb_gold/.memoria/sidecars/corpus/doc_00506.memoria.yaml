- id: 448048#0
  name: 2022年冬季奥林匹克运动会
  tags:
  - 2022年冬季奥林匹克运动会
  description: 第二十四屆冬季奧林匹克運動會（；），又稱2022年冬季奥运会，一般稱為北京冬奧，于2022年2月4日至2月20日在中華人民共和國首都北京举行，此外，河北省西北部城市张家口也将承办本届冬奥会的户外冰雪项目；这是中国首次举办冬季奥运会，而作为主办地点之一的北京也因而成为首座“双奥之城”（既举办过夏季奥运会，又举办过冬季奧運会的城市）。本次冬奧會與2018年平昌冬奧會、2020年東京奧運會連續在亞洲舉行，是奧運會歷史上首次在歐洲以外的大洲連續舉行奧運會。
