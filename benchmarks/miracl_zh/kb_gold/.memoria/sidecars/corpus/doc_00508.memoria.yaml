  description: 2011年3月31日，印度人口普查委员会对印度全国的人口进行了普查，结果显示印度的人口达到1,210,193,422人，是世界上仅次于中国的人口第二大国，于2001年至2011年间的年均人口增长率为1.76%，较前一个十年（1991年至2001年）的2.13%为低。性别比为0.94女/男，于2001年人口普查时的年龄中位数为24.9岁。截止至2019年，
    印度的人口数为1368,737,513, 每年以1.08%在增长。 过去50年来的医疗进步及绿色革命使农业生产力提高促使人
  range:
