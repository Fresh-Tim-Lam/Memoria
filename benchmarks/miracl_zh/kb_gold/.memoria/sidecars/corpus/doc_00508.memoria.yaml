      snippet: 高，比哈里邦最低；性别比是1.064男/女，预期寿命68.59岁，人口增长率为1.606%，出生率为22.69 /1,000人。印度由于贫富差距大，都市中有不少的贫民窟，传染病窜流：登革热、疟疾、日本脑炎、A型肝炎、E型肝炎等危险程度皆高。
