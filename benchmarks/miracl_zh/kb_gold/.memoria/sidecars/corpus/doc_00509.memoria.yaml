- id: 451168#0
  name: 省港旗兵
  tags:
  - 省港旗兵
  description: 是1984年上映的一部香港警匪片，由麥當雄執導及監製，為「省港旗兵系列」電影的首部作品。電影以當時肆虐香港的廣州犯罪份子為題材，講述他們從中國大陸到香港抢劫杀人的故事，真實改編自國寶集團總裁朱國榮（本名朱子昭）於1980年犯下轟動一時的「南通銀行解款車劫殺案」。片中演員大多為新人或兼職，全片以寫實手法拍攝，內容相當暴力及震撼。電影取得成功後，開拍續集《省港旗兵2》、《省港旗兵3》和《省港旗兵4：地下通道》。
