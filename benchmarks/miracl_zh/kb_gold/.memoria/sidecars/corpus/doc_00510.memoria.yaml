  name: 细胞分化
  tags:
  - 细胞分化
  description: 细胞分化（），是发育生物学的研究课题之一，指的是在多细胞生物中，一个干细胞在分裂的时候，其子细胞的基因表达受到调控，例如DNA甲基化，变成不同細胞类型的过程。类如全能（）的受精卵在分裂到一定程度时，其子细胞就会开始向特定的方向分化，形成胎儿的肌肉，骨骼，毛发等器官。分化后的细胞在其结构，功能上都会出现差异，而且成为了所谓的“单能性”细胞（），就是其只能分裂得出同等细胞类型的子细胞。但是所有这些子细胞的基因组（）却是与“祖宗”的干细胞一样的。研究细胞分化，对理解疾病的发生，如癌
  range:
