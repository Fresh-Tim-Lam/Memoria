      snippet: 官。分化后的细胞在其结构，功能上都会出现差异，而且成为了所谓的“单能性”细胞（），就是其只能分裂得出同等细胞类型的子细胞。但是所有这些子细胞的基因组（）却是与“祖宗”的干细胞一样的。研究细胞分化，对理解疾病的发生，如癌症的出现有着重要意义。
