- id: 455688#14
  name: 俗語
  tags:
  - 俗語
  description: 例如，「火燒芭蕉心不死」，表面上說的是芭蕉的「心」不死，實際上是指人心不死，比喻不甘失敗，或不肯罷休；「驢唇不對馬嘴」、「牛頭不對（搭）馬嘴」。表面上說的是「驢唇」對不上「馬嘴」，實指兩方面或兩件事不相符合；「跳進黃河洗不清」表面上說的是，人跳進黃河也洗不清身子，實際意義是人的冤屈無法辯白，恥辱洗不掉；又如，「鐵公雞一毛不拔」，表面上說的是鐵製的公雞拔不下一根羽毛，實際上說是說人吝嗇，一毛不拔。
