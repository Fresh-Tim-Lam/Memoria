- id: 461600#1
  name: 马其顿 (希腊)
  tags:
  - 马其顿
  - (希腊)
  description: 它包括古代马其顿帝国的大部分位于今天希腊北部的领域。后来这个名称被扩展到巴尔干半岛的其它部分，这个地区成为今天的馬其頓地区。希腊的马其顿地区占这个地区的52.1%的陆地面积以及52.9%的人口。到1912年为止它是奥斯曼帝国的一部分。1913年，奥斯曼帝国在欧洲的大部分领地被分给了希腊、塞尔维亚、保加利亚、阿尔巴尼亚和蒙特內哥羅。
