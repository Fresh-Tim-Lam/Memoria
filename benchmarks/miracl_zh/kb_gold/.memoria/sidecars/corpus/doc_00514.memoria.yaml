  name: 臺灣族群
  tags:
  - 臺灣族群
  description: 臺灣族群主要有台灣原住民族、漢族與其他移民，2004年的一份對4062位民眾的調查結果中，1.4%為原住民族，漢族部分則包含閩南人約76.9%、客家人約10.9%、外省人約10%。
