  name: 臺灣族群
  tags:
  - 臺灣族群
  description: 根據內政部統計處，截至2013年8月，臺灣原住民族人口數為53萬1435人（佔台灣人口總數的2.28%）。 但根據馬偕紀念醫院有日本血統的林媽利醫生在基因領域個人研究，他個人認為，臺灣的閩南人及客家人有不少是滿清時被迫漢化的平埔族，她於2007年的DNA研究顯示，全台各族群比率約為：閩南族群73.5％，客家人17.5％，1945年之後遷台的外省族群7.5％，原住民佔1.5％。但林媽利的研究有人质疑，人類學博士陳叔倬和西拉雅文化研究者段洪坤提出其研究存有數據前後矛盾、歸類標準有
