      snippet: ：閩南族群73.5％，客家人17.5％，1945年之後遷台的外省族群7.5％，原住民佔1.5％。但林媽利的研究有人质疑，人類學博士陳叔倬和西拉雅文化研究者段洪坤提出其研究存有數據前後矛盾、歸類標準有選擇性、歸類方法不準確等研究方法上的錯誤。
