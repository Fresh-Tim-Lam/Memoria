  description: NBA是北美洲30支球队组成的职业男子篮球联盟，除加拿大一队外剩下29队都在美国。1946年6月6日，NBA的前身美國籃球協會在纽约成立，1949-50
    NBA赛季开始时协会与国家篮球联盟合并后更名国家篮球协会，简称NBA。NBA积极参与美国篮球联合会，该机构是国际篮球联合会认可的美国篮球管理组织。此外，NBA还属北美洲四大职业体育联赛。
