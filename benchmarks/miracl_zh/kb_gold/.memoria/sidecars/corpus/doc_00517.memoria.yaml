- id: 471631#12
  name: 无神论人口
  tags:
  - 无神论人口
  description: 在台湾，2014年美國中央情報局發布的調查，2300萬臺灣人口中，佛教、道教與臺灣民間信仰三者難捨難分，約佔93%。基督徒（包括天主教、新教、東正教等）約4.5%，其他信仰或不表態，約2.5%。另一項調查則顯示，現今臺灣有八成的民眾擁有宗教信仰，有五成的民眾經常參加各類型的宗教儀式與慶典。強調自己為無宗教信仰者約18%。
