- id: 472332#0
  name: 香港地質
  tags:
  - 香港地質
  description: 香港位於中國南方珠江口的東南側，南臨南海，北邊與廣東省深圳經濟特區接壤。陸地面積為1,104平方公里，包括與大陸相連的新界和九龍半島，以及大嶼山島、香港島等大小200多個島嶼。香港是典型的島海環境，擁有綿長的海岸綫，地勢山巒起伏，近45%的陸地高出海平面100米以上，只有零星的平原分布於沿海地帶。
