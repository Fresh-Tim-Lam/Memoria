- id: 476094#1
  name: 賞櫻
  tags:
  - 賞櫻
  description: 日語的賞花（）一般指的是賞櫻。每年三至四月樱花盛開期间，许多日本家庭都會去到櫻花樹下賞花、吃点心。日本各地櫻花開放的時間不一，會受氣候影響，所以每年日本的網站都會預測並詳列各地的開花情況，有些還有照片顯示開花程度，方便公眾游览。
    下列是日本的一些賞櫻名地：
