- id: 495104#16
  name: 日本地理
  tags:
  - 日本地理
  description: 除了地震和海嘯之外，火山引發的災害在日本也不少見。1708年富士山寶永大噴發時，江戶市內也堆積了大量火山灰。1986年伊豆大島三原山噴發，导致島上所有居民都被迫離島避難。2014年御岳山喷发，导致58人死亡，5人失踪，是二战之后日本所发生最严重的火山灾害。而近年日本較為活躍的火山有有珠山、淺間山、三宅島、阿蘇山和櫻島等。日本其他的主要地质災害還有山體滑坡、泥石流等。
