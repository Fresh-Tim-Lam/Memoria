  name: 蒙古龍屬
  tags:
  - 蒙古龍屬
  description: 蒙古龍的正模標本（編號AMNH 6710）是一顆牙齒。同一挖掘地點還發現10多顆相同型態的牙齒、基枕骨、前三節部分頸椎。這些牙齒長、呈圓柱狀。這些化石發現於On
    Gong組地層，地質年代相當於白堊紀晚期
