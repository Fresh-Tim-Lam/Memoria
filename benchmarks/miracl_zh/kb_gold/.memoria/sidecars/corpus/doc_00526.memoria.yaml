      snippet: 觀眾的注意。《七龍珠》、《美少女戰士》和《神奇寶貝》的周邊商品在歐美地區更是搶手貨。《神隱少女》於2002年德國柏林影展中得到金熊獎，並在第七十六屆奧斯卡電影頒獎典禮中得到「最佳動畫長片」一獎項。而《攻殼機動隊》亦在2004年坎城影展上映。
