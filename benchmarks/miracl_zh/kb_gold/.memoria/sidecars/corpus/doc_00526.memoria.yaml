  description: 日本动画最早开始于1917年，早期的動畫製作人包括了下传凹天、 和北山清太郎，被合称为“日本动画之父”。此後直至1980年代，日本的動畫才開始在日本被接納為主流，製作量隨之迅速增長，GUNDAM系列作品的製作亦於這個年代開始。日本動畫於1990年代及2000年代迎來了它被海外市場接受程度的提昇。動畫連續劇諸如《新世紀福音戰士》和《攻殼機動隊》於日本大受歡迎，亦吸引了海外觀眾的注意。《七龍珠》、《美少女戰士》和《神奇寶貝》的周邊商品在歐美地區更是搶手貨。《神隱少女》於2002年
  range:
