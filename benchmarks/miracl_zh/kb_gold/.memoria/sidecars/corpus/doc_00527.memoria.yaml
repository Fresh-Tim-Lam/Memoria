- id: 518669#4
  name: 中国航天史
  tags:
  - 中国航天史
  description: 1960年2月19日16时47分，中国第一枚自行设计、制造的试验型液体探空火箭T-7M在上海市南汇县老港公社东进大队简易发射场首次发射成功，飞行高度8千米，迈出了中国探空火箭技术的第一步。同年11月5日，中国仿制的第一枚近程导弹“P-2”发射成功。1962年3月初，中国自行设计的第一枚导弹运往酒泉发射场。3月21日，导弹发射失败，后经认真总结，找到了问题症结。1964年6月29日，修改设计后的导弹试验取得圆满成功。
