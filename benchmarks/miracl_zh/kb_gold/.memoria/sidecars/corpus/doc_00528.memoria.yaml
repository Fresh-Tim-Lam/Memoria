  description: 《蜘蛛侠》（）是一部于2002年上映的美国超级英雄电影，由山姆·雷米执导，基于漫威漫画的同名虚构角色制作。托比·马圭尔在片中扮演男主角彼得·帕克，一位在校高中生，由于特殊经历而获得了与蜘蛛有关的超能力并成长为一位锄强扶弱的超级英雄。另外几位主演还包括威廉·达佛饰演诺曼·奥斯本（即绿恶魔），克斯汀·邓斯特出演玛丽·简·沃森，以及詹姆斯·弗朗科扮演哈里·奥斯本。
