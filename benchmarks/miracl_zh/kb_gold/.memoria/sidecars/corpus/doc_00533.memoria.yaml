      snippet: ，其中金城银行是“北四行”的重要支柱。在1921年2月7日天津创设了当时中国最早的证券交易所——天津证券花纱粮食皮毛交易所。1940年代，解放北路上设有49家国内外银行；有270多家国内外保险机构和1家证券交易所，是当时中国北方的金融中心。
