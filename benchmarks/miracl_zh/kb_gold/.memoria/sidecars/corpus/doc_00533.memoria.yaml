  name: 天津租界
  tags:
  - 天津租界
  description: 除外资银行，由于天津租界内相对稳定的商业环境，华资银行也在天津租界内聚集。1935年，天津共有中国资本银行29家，其中最著名的是北四行：即1915年成立的盐业银行天津分行、1917年成立的金城银行天津总行、1918年成立的大陆银行天津总行和1922年开业的中南银行天津分行，这四家银行中，除大陆银行外，其余三家银行的总行都设在天津，其中金城银行是“北四行”的重要支柱。在1921年2月7日天津创设了当时中国最早的证券交易所——天津证券花纱粮食皮毛交易所。1940年代，解放北路上设
