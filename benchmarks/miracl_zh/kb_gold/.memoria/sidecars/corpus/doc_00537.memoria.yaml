    Schiffer ）组成的Big5，堪称世界模特行业的黄金年代。她的经典金句“我们超级名模，要么每天工资至少10000美元，要么终日呼呼大睡”以及“我们不是去制作时尚，因为我们本身就是时尚”等至今经久流传。
