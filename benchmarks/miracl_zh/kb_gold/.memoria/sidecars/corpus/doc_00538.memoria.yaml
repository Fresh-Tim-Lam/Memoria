      snippet: 2006年第39届世界体操锦标赛，中国女子体操队第一次获得团体金牌。2008年在本土举行的北京奥运会上首次获得女子团体金牌，此外取得平衡木金牌3次（2000年、2012年、2020年），高低槓金牌三次（1984年、1992年、2008年）。
