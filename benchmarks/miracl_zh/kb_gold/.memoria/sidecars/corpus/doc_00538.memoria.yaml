  name: 竞技体操
  tags:
  - 竞技体操
  description: 最近30年里，中国男子体操和女子体操发展迅速，不仅在团体项目并且在个人项目都有突破。中国男子体操队获得了2000年奥运会、2008年奥运会和2012年奥运会的团体冠军，并夺得第30届、第31届、第33届、第37届、第39届和第40届世界体操锦标赛团体冠军（不是每届比赛都设置团体项目）。2000年以后几乎在所有国际比赛上保持前三名的位置。李宁、李小双、李小鵬、杨威、鄒凱是各个时期的杰出运动员。女子体操在1984年奥运会上由马燕红为中国体操队获得首枚单项金牌。2006年第39届世
  range:
