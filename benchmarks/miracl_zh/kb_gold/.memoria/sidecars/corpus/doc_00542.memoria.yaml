  name: 因信稱義
  tags:
  - 因信稱義
  description: 天主教承认信仰的力量，但是这不是得救的充分条件。天主教教导人称义靠着信心，但也要靠着行为（善工、守律法）得救，《天主教教理》多處指出兩者俱備才是完滿的信仰：
