- id: 569990#1
  name: 弗朗西斯科·佛朗哥独裁
  tags:
  - 弗朗西斯科·佛朗哥独裁
  description: 1931年建立的西班牙第二共和国于1936年陷入西班牙内战。内战一方是纳粹德国、法西斯意大利支持的，由佛朗哥将军率领的右翼反共和政府武装，另一方是苏联和墨西哥支持的左翼政府军及共产国际纵队。1939年4月1日，弗朗哥一方获得胜利，西班牙内战结束，西班牙第二共和国正式解体，弗朗哥成立独裁政权。在这段时期，西班牙在名义上恢复君主制但王位悬空，弗朗哥担任“考迪罗”，王室仍获得特权及保护。
