- id: 608687#16
  name: 海禁
  tags:
  - 海禁
  description: 康熙二十三年（1684年），清朝正式开海，准许百姓对外贸易，并在“粤东之澳门（一說廣州）、福建之漳州府、浙江之宁波府、江南之云臺山”分别设立粤海关、闽海关、浙海关、江海关作为管理对外贸易和征收关税的机构。江浙闽粤四大海关总领各自所在省的所有海关口岸，通常下辖十几至几十个海关口岸。
