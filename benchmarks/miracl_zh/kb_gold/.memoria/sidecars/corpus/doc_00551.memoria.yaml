- id: 614211#1
  name: 中国国家女子足球队
  tags:
  - 中国国家女子足球队
  description: 中国第一支国家女子足球（集训）队于1984年成立。20世纪80年代初期，女足运动在中国兴起。1982年开始有业余比赛，1984年终于组建了第一支女子国家集训队，并第一次举办了全国女子足球邀请赛。此后，中国先后举办广州、西安等国际邀请赛。至1986年，中国女子足球首次远征欧洲，在意大利举办的两次国际邀请赛上分获冠军、季军。同年，又首次夺得亚洲杯冠军。2013年3月郝伟任中国女足主教练。中國女足的球衣贊助商是耐克。
