  name: 中国国家女子足球队
  tags:
  - 中国国家女子足球队
  description: 中国女子足球运动的潜能是在20世纪70年代末期开始被发掘出来的。1978年，女足的星星之火首先在云南、陕西、辽宁等地燃起，随后迅速扩大到全国各地。1981年，在云南楚雄举办了第一次全国女子足球比赛。1983年12月15日，中国国家女子足球队正式成立。中国女足与国外交流始于1983年，与外国强队的交流中，中国女子队员的技术水平得到明显提高。1986年7、8月期间，中国女子足球队远征意大利，先后取得第三名和第一名的好成绩。同年12月，中国女足以全部比赛不失一球的记录荣获第六届亚洲
  range:
    start:
      line_hint: 1
      snippet: 中国国家女子足球队
    end:
      line_hint: 3
      snippet: 球队远征意大利，先后取得第三名和第一名的好成绩。同年12月，中国女足以全部比赛不失一球的记录荣获第六届亚洲杯女子足球锦标赛冠军，实现了冲出亚洲的愿望，为纪念这次历史性的胜利，国家体委授予当时的国家女足队员“我国第一批女子足球运动健将”称号。
