  name: 中国国家女子足球队
  tags:
  - 中国国家女子足球队
  description: 中国女足在得到1999年的世界杯亚军后，出现了球员青黄不接的情况，2003年和2007年球队都未能晋级世界杯四强。在2004年8月11日的雅典奥运会女足比赛中，球队创记录的0-8惨败给了欧洲冠军德国女足。
