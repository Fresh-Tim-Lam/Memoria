  name: 中国国家女子足球队
  tags:
  - 中国国家女子足球队
  description: 在亚洲赛场，中国女足一家独大的统治性局面已经不复存在，传统劲旅朝鲜女足和后起之秀日本女足近年的战绩已经逐渐赶上中国女足。但是在低谷中的中国女足在亚洲杯上依然有着出色的表现，在2006年亚洲杯赛上重新夺回冠军头衔，并且在2年后的2008年亚洲杯赛中也杀入决赛。不过，随着澳大利亚和韩国女足水平的提高，此两国的战绩也开始逐渐赶上中国女足。
