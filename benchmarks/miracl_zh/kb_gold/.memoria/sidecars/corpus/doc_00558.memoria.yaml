- id: 630092#8
  name: 西班牙语国家和地区列表
  tags:
  - 西班牙语国家和地区列表
  description: 美洲、尤其是拉丁美洲是前西班牙帝国的殖民地最集中的地区，因此西班牙语在美洲非常流行，是美洲第一大语言。 北美三国（美国、加拿大和墨西哥）中只有墨西哥以西班牙语为官方语言，而虽然有很多美国人说西班牙语，但西班牙语只有在新墨西哥州才具有事实上的官方语言地位。
  range:
    start:
      line_hint: 1
      snippet: 西班牙语国家和地区列表
    end:
      line_hint: 3
      snippet: 丁美洲是前西班牙帝国的殖民地最集中的地区，因此西班牙语在美洲非常流行，是美洲第一大语言。 北美三国（美国、加拿大和墨西哥）中只有墨西哥以西班牙语为官方语言，而虽然有很多美国人说西班牙语，但西班牙语只有在新墨西哥州才具有事实上的官方语言地位。
