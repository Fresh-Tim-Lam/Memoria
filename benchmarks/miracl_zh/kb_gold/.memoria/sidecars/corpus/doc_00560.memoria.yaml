- id: 635195#31
  name: 中国大陆电影
  tags:
  - 中国大陆电影
  description: 随着台湾、大陆、香港的日益沟通，合資片成為很多中國電影製作的主流，一來以當地熟悉的演員較易吸引各地觀眾，二来对电影投资资金困难问题得到解决，如香港演員與大陆演員合作的《英雄》、《十面埋伏》、《功夫》、《十月围城》等，便獲得觀眾收看。與此同時，随着中外合作的发展，亦有中美、港韓等多種合作關係的合資電影製作。
