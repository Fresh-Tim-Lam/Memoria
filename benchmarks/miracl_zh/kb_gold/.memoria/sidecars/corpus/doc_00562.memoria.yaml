- id: 643124#7
  name: 量子力學的數學表述
  tags:
  - 量子力學的數學表述
  description: 更为准确地说，海森堡是在薛定谔之前创立矩阵力学的。这一表述是量子力学第一个有效的表述，是一个本质性的突破。海森堡的矩阵力学是基于无穷维矩阵的代数演算。这一表述与经典力学的数学表述方式大相径庭。不过，他的出发点是实验研究中所用到的“指标”，并且他也并没有意识到他的“指标方法”实际上就是矩阵方法。这一点后来是由玻恩阐明的。实际上在那个时代，线性代数并不像现在这样为物理学家所熟识。
