  name: 俄语国家和地区列表
  tags:
  - 俄语国家和地区列表
  description: 俄语是4个被普遍承认的独立主权国家、实际独立但未获广泛承认的阿布哈兹、南奥塞梯和德涅斯特河沿岸共和国以及摩尔多瓦嘎嘎烏孜的官方语言，也是乌克兰、克里米亚事实上的官方语言之一，亦曾是许多如今已不存在的国家的官方语言。俄语是全世界第八大语言，它的通行伴随着俄罗斯帝国和苏联的扩张，直到今天，它仍然是大多数前苏联加盟共和国的通用语言之一。
