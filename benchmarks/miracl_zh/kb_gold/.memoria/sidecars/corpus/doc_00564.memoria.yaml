      snippet: 手指」写的（出31:18;申5:22），不同於其他由梅瑟书写的诫命。「十句话」在天主的话里，占着卓越的位置；「十句话」载在出谷纪和申命纪中，流传至今。自旧约时代，经常为圣经所引用，但是，直到耶稣基督的新盟约，「十句话」的完整意义才显示出来。
