  name: 天主教會
  tags:
  - 天主教會
  description: 根據天主教教義，《聖經》與教會當局的教導（即聖傳）具同等地位，都是信仰最高法則。例如，出自聖經的十誡與教會的訓導「教會五規」都對天主教徒具有約束力。「十诫」（Decalogue）一词，其字面的意义是「十句话」（出34:28;申4:13;
    10:4）。在圣山上，天主给自己的子民启示了这「十句话」。是天主「用手指」写的（出31:18;申5:22），不同於其他由梅瑟书写的诫命。「十句话」在天主的话里，占着卓越的位置；「十句话」载在出谷纪和申命纪中，流传至今。自旧约时代，经常为圣经所
  range:
