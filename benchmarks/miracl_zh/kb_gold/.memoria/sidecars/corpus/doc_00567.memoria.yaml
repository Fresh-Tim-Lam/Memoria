  name: 中华人民共和国体育
  tags:
  - 中华人民共和国体育
  description: 2008年举办的北京奥运会，是进入21世纪后，中国体育领域影响最大的事件。2001年，中国赢得2008年奥运会举办权。在中央政府、北京市政府的参与下，北京奥组委开始北京奥运的筹备工作。除420亿美元的总投资外，两级政府为北京奥运会提供了近乎无限的资源支持。研究者认为，2008年北京奥运会将中华人民共和国体育事业推向了历史新高度。此后，中国体育进入“后奥运时代”。而奥运会的成功举办，极大地的刺激了中国体育市场和体育产业的发展。
