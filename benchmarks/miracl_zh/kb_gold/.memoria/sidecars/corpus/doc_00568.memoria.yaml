  name: 克斯汀·鄧斯特
  tags:
  - 克斯汀·鄧斯特
  description: 在2002年的超级英雄电影《蜘蛛侠》中，邓斯特饰演了女主角玛丽·简·沃森（），与扮演彼得·帕克/蜘蛛侠的托比·马奎尔演对手戏，是对方的邻居兼最好的朋友，也是其暗恋的对象。这部由山姆·雷米导演的影片也是邓斯特当时商业上最成功的作品。《娱乐周刊》的欧文·格雷伯曼（）称邓斯特有在最少的台词中融入诱人风情的能力。《洛杉矶时报》影评人肯尼斯·图兰（）指出邓斯特和马奎尔在银幕上建立起了真正的联系，并总结认为他们的关系将是观众很少能在电影中看到的。《蜘蛛侠》在商业和评论两方面都获得了成功，
  range:
    start:
      line_hint: 1
      snippet: 克斯汀·鄧斯特
    end:
      line_hint: 3
      snippet: 斯特有在最少的台词中融入诱人风情的能力。《洛杉矶时报》影评人肯尼斯·图兰（）指出邓斯特和马奎尔在银幕上建立起了真正的联系，并总结认为他们的关系将是观众很少能在电影中看到的。《蜘蛛侠》在商业和评论两方面都获得了成功，全球票房超过8.2亿美元。
