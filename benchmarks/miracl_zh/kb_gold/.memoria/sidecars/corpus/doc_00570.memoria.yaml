  name: 俄罗斯联邦武装力量
  tags:
  - 俄罗斯联邦武装力量
  description: 截至2005年，只有30％的俄军人员属于契約制志愿兵。 俄军计划在2007年前将俄军的人员组成结构调整为70％的契約制志愿兵和30％的征召式义务兵。到2006年11月，俄军共拥有约60支部队拥有78,000名契約制志愿兵。
    到2007年，俄罗斯国防部指定88支部队为常备部队，并且计划将其全部志愿兵化 。这些部队包括大部分的空军，海军，核部队，全部的空降军部队，海军步兵部队，大部分的摩托化步兵旅以及全部的特种部队。2009年，海军所有的舰艇和潜艇部队也将全面实施志愿兵制。
    俄军
  range:
    start:
      line_hint: 1
      snippet: 俄罗斯联邦武装力量
    end:
      line_hint: 3
      snippet: 兵制。 俄军中女兵数量比男兵少得多，但是仍然有超过92,000名女性在俄军中服役（2007）。 可以预见，未来的俄军将是一支以契約制志愿兵为主，征召式义务兵为辅的军队。俄军保留有庞大的预备役人员以便在常备军无法应付升级的冲突时进行紧急动员。
