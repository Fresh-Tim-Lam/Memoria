- id: 675394#1
  name: 有絲分裂
  tags:
  - 有絲分裂
  description: 仅真核细胞可以进行有丝分裂，其过程在物种之间有所不同。例如，动物细胞进行“开放式”有丝分裂，核膜在染色体分裂前破裂。真菌则进行“封闭”式有丝分裂，在完整核膜中染色体即完成了向两个子核的分裂。原核细胞由于没有细胞核，只进行二分裂。
  range:
    start:
      line_hint: 1
      snippet: 有絲分裂
