- id: 679336#35
  name: 圣诞节
  tags:
  - 圣诞节
  description: 在意大利，聖誕節揉合了现代传统及古罗马祖先遗留下、庆祝Natale（译者注：圣诞节的意大利文）的习俗。圣诞的降临节同日从古罗马的神农节（Saturnalia）中的异教徒庆典由来的可能性，而她们的假期就从这天开始一直到显现节。聖誕食物、宗教仪式、摆设和礼物，都是重点项目。在某些地区，礼物是由La
    Befana（译者注：意大利传说送礼物给小朋友的老妇）于显现节时送出的，其他的地区则由小耶稣于圣诞节或平安夜送出。而近年，他们的位置渐渐被Babbo Natale——一个像圣诞老人的人
  range:
    start:
      line_hint: 1
      snippet: 圣诞节
    end:
      line_hint: 3
      snippet: 物，都是重点项目。在某些地区，礼物是由La Befana（译者注：意大利传说送礼物给小朋友的老妇）于显现节时送出的，其他的地区则由小耶稣于圣诞节或平安夜送出。而近年，他们的位置渐渐被Babbo
