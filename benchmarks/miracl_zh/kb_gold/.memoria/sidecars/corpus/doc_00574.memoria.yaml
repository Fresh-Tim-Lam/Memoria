- id: 679336#40
  name: 圣诞节
  tags:
  - 圣诞节
  description: 另外捷克的圣诞传统习俗，还包括对来年的预测。他们将苹果切开，如果第一下能看见苹果核，就预示来年好运气，如果没有就表示来年不顺。女孩们将自己的鞋子从肩头抛过，如果鞋尖指向门的方向，就预示自己来年将会出嫁。另一个传统，是将一点熔铅倒入水中，根据铅在水中形成的形状来猜测来年的运勢。
  range:
    start:
