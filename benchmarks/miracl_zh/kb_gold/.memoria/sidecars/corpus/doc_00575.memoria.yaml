- id: 679336#47
  name: 圣诞节
  tags:
  - 圣诞节
  description: 在美国和加拿大，除了加拿大魁北克省會出现法国式的圣诞老人Père Noël之外，美加兩國的习俗基本上是相同的。纽约洛克菲勒中心會摆放圣诞树，滑冰场會有盛大溜冰活动、华盛顿的给白宫上圣诞装饰的的活动，是美国圣诞节中最亮丽的风景线。作为英联邦的加拿大在26日节礼日（坊間通常稱為Boxing
    Day）也会放假。
