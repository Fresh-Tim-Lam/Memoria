- id: 693748#1
  name: 北勢溪 (新北市)
  tags:
  - 北勢溪
  - (新北市)
  description: 北勢溪沿岸原有翡翠谷、鷺鷥潭、鯉魚潭、太陽谷、火燒樟等諸多景點，是早期大台北地區的最佳旅遊勝地之一。自從翡翠水庫開工集水後，這些景點就陸續淹沒而消失。
