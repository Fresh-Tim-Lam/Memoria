- id: 698739#0
  name: 季铵盐
  tags:
  - 季铵盐
  description: 季铵盐，又稱四級銨鹽或活性四級化合物，屬於典型的陽離子界面活性劑。。是铵离子的四个氢离子都被烃基取代后形成的季铵阳离子的盐，具有通式
    RNX。其中四个烃基可以相同，也可以不相同，X多为卤素阴离子，HSO，RCOO及OH（季铵碱）。
