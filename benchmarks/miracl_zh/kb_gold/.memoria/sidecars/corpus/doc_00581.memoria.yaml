  name: 以色列行政区划
  tags:
  - 以色列行政区划
  description: 耶路撒冷（希伯来语：）是以色列六个行政区之一，面积652平方公里，人口约85万（2006年），其中犹太人占68%、阿拉伯人占30%。东耶路撒冷是1967年中东战争被以色列占领，现被并入耶路撒冷区，但巴勒斯坦国设为西岸地区十一省之一的耶路撒冷省；东耶路撒冷面积335平方公里，人口328,601。首府耶路撒冷，面积126平方公里，人口617,042。
