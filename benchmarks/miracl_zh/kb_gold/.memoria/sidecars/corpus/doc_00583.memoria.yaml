  name: 法國政府
  tags:
  - 法國政府
  description: 法蘭西第五共和國政府是由第五共和國的法國憲法確定的半總統制政府。國家自稱为「不可分割的、世俗的、民主的和社會的共和國」。憲法規定政府分為立法、行政和司法三个分支，并聲稱法國是「由1789年宣言明確的人權和國家主權原則的連接體」。
