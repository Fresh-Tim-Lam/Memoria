  name: 北极地区
  tags:
  - 北极地区
  description: 北冰洋面积约1475万平方公里，是四大洋中最小的一个，可分为北极海区和北欧海区两部分。洋面上有长年不化的冰层，占北冰洋面积的三分之二，平均厚度约为3米，是永久性的海冰。北冰洋底部有广阔的大陆架，最宽达1
    200千米以上，所占面积达到总面积的33.6%。洋底中央横卧着两条海岭：雷蒙索诺夫海岭和门捷列夫海岭，将北冰洋地分为三个海盆：加拿大海盆、马卡罗夫海盆和南森海盆。北冰洋周边分布着大部属于大陆架范围的边缘海，如挪威海、格陵兰海、喀拉海、拉普捷夫海、东西伯利亚海、楚科奇海、波弗特
  range:
    start:
      line_hint: 1
      snippet: 北极地区
    end:
      line_hint: 3
      snippet: 夫海岭，将北冰洋地分为三个海盆：加拿大海盆、马卡罗夫海盆和南森海盆。北冰洋周边分布着大部属于大陆架范围的边缘海，如挪威海、格陵兰海、喀拉海、拉普捷夫海、东西伯利亚海、楚科奇海、波弗特海、巴芬湾、哈德孙湾以及加拿大北极群岛间各大小海湾和海峡。
