  name: 帕默·J·霍登
  tags:
  - 帕默·J·霍登
  description: 作为一名北达科他州人，1965年，霍登从北达科塔州立大学获得了学士学位。1967年，霍登在爱荷华州立大学取得硕士学位并于1970年取得了哲学博士学位。越南战争中，霍登在美军担任农业顾问。1972年5月1日，霍登开始在爱荷华州立大学担任动物科学及猪推广专业助教。
