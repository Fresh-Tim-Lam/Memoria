- id: 754897#0
  name: 汶川大地震
  tags:
  - 汶川大地震
  description: 汶川大地震發生於北京時間2008年5月12日（星期一）14时28分04秒，震央位於中國四川省阿坝藏族羌族自治州汶川縣映秀镇附近、四川省会成都市西北偏西方向79千米处。根据中国地震局的数据，此次地震的面波震级达8.2级、矩震級達8.3级，破坏地区超过10万平方公里。地震烈度可能達到11度。本次地震的地震波围绕地球传播了6圈，地震波及大半个中国及亞洲多個國家和地区。北至辽宁，東至上海，南至香港、廣東、澳门、泰國、越南，西至巴基斯坦均有震感。
