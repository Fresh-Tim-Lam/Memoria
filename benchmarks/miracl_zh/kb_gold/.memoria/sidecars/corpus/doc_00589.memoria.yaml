- id: 762103#0
  name: 有机反应
  tags:
  - 有机反应
  description: 有机反应即涉及有机化合物的化学反应，是有机合成的基础。几种基本反应类型为：加成反应、消除反应、取代反应、周环反应、重排反应和氧化还原反应。在有机合成当中，有机反应被广泛的应用于各种人造分子的合成。比如药物、塑料、食品添加剂和合成纤维等等。
