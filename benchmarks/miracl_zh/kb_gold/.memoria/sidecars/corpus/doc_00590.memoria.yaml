- id: 764648#2
  name: 比利时人口
  tags:
  - 比利时人口
  description: 比利时有三种官方语言：荷兰语、法语和德语，分别对应组成联邦的三个社区。半数以上的人口说荷兰语（55%），法语是第二大语言（44%），少数人讲德语（1%）。比利时人说的荷兰语或法语都带有本地方言，这些带有方言的荷兰语和法语与荷兰的荷兰语和法国的法语差别甚微，通话交流方便。
