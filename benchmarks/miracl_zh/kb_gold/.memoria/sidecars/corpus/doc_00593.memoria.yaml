- id: 764856#36
  name: 正教
  tags:
  - 正教
  description: 主教制是最古老的制度。而天主教的主教制则是源自1世纪早期教会的主教制度，所以可以说主教制是整个基督宗教中历史最悠久的神职人员制度。从最早的基督教会开始，教会（教堂）就散布到不同的地方，每个地方的教会领导者就成了“主教”。其它受派的“长老”就成了“神父”，然后受派的“仆人”就成了“执事”。一个地区的最重要城市的主教有时候被称为“大主教”，其它小一点的地方教会就会向大城市里的教会寻求领导。
