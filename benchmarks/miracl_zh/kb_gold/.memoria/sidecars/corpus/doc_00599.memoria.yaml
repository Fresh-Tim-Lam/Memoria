  name: 烏克蘭地理
  tags:
  - 烏克蘭地理
  description: 烏克蘭位於歐洲東部，是歐洲面積第二大的國家，國土面積603,700平方公里。北面與白俄羅斯毗鄰，西與波蘭﹑斯洛伐克和匈牙利相連，南靠摩爾多瓦和羅馬尼亞，東與俄羅斯銜接。境內多為平原和丘陵。
