      snippet: 語国歌《》()，先试用三年；试用期后（1965年），有12个州宣布拥护这首国歌，7个州要求延长试用期，6个州反对，联邦政府决定无限期延长试用期。1981年4月1日，联邦议会决定采用这首歌为正式国歌，但只对外交和军队执行，对地方不具有强制性。
