  description: 《瑞士诗篇》（；；；）是瑞士国歌，歌词原文为德语，作者为列昂哈尔德·维德美尔（1808年-1868年），由修道士阿尔贝里克·茨维济希（1808年-1854年）配曲，茨维济希只是从自己1835年创作的B大调弥撒曲中找了一段适合的曲调配上，1841年11月22日在苏黎世音乐节上首次演唱，受到欢迎，并翻译成瑞士的其他各种官方语言-法语、意大利语和羅曼什語。
    1961年9月，瑞士联邦政府决定用这首歌代替原来以英国国歌曲调演唱的德語国歌《》()，先试用三年；试用期后（1965年），有1
  range:
