- id: 801144#5
  name: 英國地理
  tags:
  - 英國地理
  description: 英国地处中纬，常年受西风带控制，北大西洋暖流流经北部，全年温和多雨，为温带海洋性气候。四季气温甚少低于-11C°，高于35C°。风多从西北吹来，带来大西洋的潮湿天气，东部位于西风的背风地帶，所以东部较西部干燥。夏季最温暖的是英格兰南部，因为其地区緯度较低且城市热岛效应较强，而较寒冷的是纬度较高的苏格兰北部。冬季和高地的早春多大雪。
