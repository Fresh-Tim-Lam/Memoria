- id: 801731#7
  name: 月球車
  tags:
  - 月球車
  description: 玉兔二号月球车是中华人民共和国设计制造的一辆月球车，搭载于嫦娥四号月球探测器，于2019年1月3日定名。嫦娥四号于2018年12月8日凌晨2时23分34秒366毫秒从西昌卫星发射中心由长征三号乙改进Ⅲ型运载火箭发射，于2019年1月3日10時26分成功软着陆于月球背面冯·卡门撞击坑。1月3日22时22分，玉兔二号月球车从嫦娥四号着陆器完成分离，成功踏上月面,
    成为世界上第一个登陆月球背面的人造移动设备。
