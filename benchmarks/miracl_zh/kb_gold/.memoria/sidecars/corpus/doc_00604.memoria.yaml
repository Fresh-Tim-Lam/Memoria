  name: 鼠尾草属
  tags:
  - 鼠尾草属
  description: 鼠尾草属是唇形科下最大的一个属，包括大约1000种植物，广泛分布在全球各地的温带和热带地区，既有草本也有灌木或亚灌木，大多数品种集中在亚洲。
    其中有许多品种可以入药或作为观赏花卉。
