- id: 898037#0
  name: 魏博
  tags:
  - 魏博
  description: 魏博，唐朝地名。“魏博”一词原为魏博节度使简称，代指魏博地区。《元和郡县图志》载魏博节度使所辖州六：魏州、相州、博州、卫州、贝州、澶州。县四十三。治所在魏州（今河北省邯郸市大名县东北）。所在地区地处河北南部、黄河以北，西依太行，东南靠黄河，南为河南。
