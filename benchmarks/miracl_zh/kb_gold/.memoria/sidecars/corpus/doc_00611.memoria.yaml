- id: 917281#30
  name: 参议院 (法国)
  tags:
  - 参议院
  - (法国)
  description: 参议院有监督政府工作的义务，最主要的方式是讨论政府工作报告。此外参议员可以口头或者书面向政府提问，政府必须回答这些提问。从1995年的宪法修正开始每周至少有一个这样的口头提问，即每个参议员都可以强迫政府讨论对它来说尴尬的问题。此外每年参议院就政府工作做出不同的报告。
