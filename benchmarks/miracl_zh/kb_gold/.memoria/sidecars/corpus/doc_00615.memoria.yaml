      snippet: 表選舉，為中華民國的国会议员選舉，各省分別於1947年11月21日至23日舉行。该次选举原定与第一届立法委员选举同时在10月进行，但国共内战致使铁路破坏，交通不便，使得选举推迟，最终国民大会代表普选略微提前于立法委员普选而在11月首先举行。
