  name: 陳水扁政府
  tags:
  - 陳水扁政府
  description: 民主進步黨在2001年立法委員選舉及2004年立法委員選舉中雖為立法院第一大黨，但席次並未過半；在野泛藍陣營的中國國民黨和親民黨則共組「國親聯盟」與之抗衡、並擁有過半席次，使得陳水扁政府8年執政期間成為「少數政府」。
