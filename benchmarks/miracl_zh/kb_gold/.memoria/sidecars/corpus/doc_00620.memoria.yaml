- id: 1005809#0
  name: 臺灣都會區
  tags:
  - 臺灣都會區
  description: 臺灣都會區，大致分為5個大都會區、2個次都會區；分別是臺北、桃園、新竹、臺中、嘉義、臺南、高雄，並組成臺灣西部走廊的重要地帶。臺灣6個直轄市（臺北、新北、桃園、臺中、臺南、高雄）即位於這5個大都會區，3個市（基隆、新竹、嘉義）中的兩個亦為2個次都會區的核心所在。詳見下述。
