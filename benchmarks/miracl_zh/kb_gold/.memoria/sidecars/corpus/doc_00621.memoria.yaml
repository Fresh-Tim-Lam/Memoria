  name: 俄羅斯人
  tags:
  - 俄羅斯人
  description: 中华人民共和国建立之初的1950年代，中华人民共和国政府承认双重国籍。苏联政府仍持吸引侨民回国政策。1954年时，包括俄罗斯人在内，中国境内的苏联侨民为14万至16万人，新疆8万人，其它地区6万人，除自动离开外，亦在1954年、1955年由中华人民共和国政府主动遣返回国。在新疆，对苏联侨民的遣返持续至1960年代中期。到1966年，全新疆仅余外侨361人，其中苏侨201人。苏侨问题基本解决。此后，在中华人民共和国政府不承认双重国籍的背景下，拥有中华人民共和国国籍的俄罗斯人被归
  range:
    start:
      line_hint: 1
      snippet: 俄羅斯人
    end:
      line_hint: 3
      snippet: 在中华人民共和国，俄罗斯族是被官方承认的构成中华民族的五十六个民族之一。2010年中华人民共和国第六次全国人口普查中，俄罗斯族人共计1.53万，主要聚居于新疆北部、内蒙古和黑龙江省。在59万在华外籍人士中，有多少俄罗斯国籍人士则无确切数字。
