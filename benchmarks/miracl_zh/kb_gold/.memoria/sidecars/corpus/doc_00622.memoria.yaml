- id: 1016336#2
  name: 魏州
  tags:
  - 魏州
  description: 唐朝武德四年（621年）复为魏州，同年又以魏州的聊城县、武水县、堂邑县、高唐县置博州。龙朔二年（662年）改为冀州。咸亨三年（672年）复为魏州。天宝、至德年间又曾改为魏郡。广德元年（763年）后，魏博节度使治此，为河北三镇的軍事要地。魏博藩镇为唐中后期至五代时最大最具影响力的军事藩镇。土贡：花綢、綿綢、平綢、施、绢、紫草。户十五万一千五百九十六，口百一十万九千八百七十三。终唐一朝，领十四县：贵乡县、元城县、魏县、馆陶县、冠氏县、莘县、朝城县、昌乐县、澶水县、洹水县、成安县、
  range:
