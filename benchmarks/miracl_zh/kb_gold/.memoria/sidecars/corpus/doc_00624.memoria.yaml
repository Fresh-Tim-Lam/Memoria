- id: 1045133#3
  name: 比利时皇家美术博物馆
  tags:
  - 比利时皇家美术博物馆
  description: 本馆拥有超过兩萬件可溯至15世纪至今的绘画，雕刻，以及油画。该馆弗拉芒油画（Flemish painting）收藏丰富，其中有老彼得·布呂赫爾、罗希尔·范·德韦登、罗伯特·康宾、安东尼·范·戴克、雅各布·乔登斯等名家的油画。该馆亦以其“鲁本斯廳”为榮，该室藏有超过20幅鲁本斯油画。该馆也藏有雅克-路易·大卫创作的著名油画《马拉之死》。
