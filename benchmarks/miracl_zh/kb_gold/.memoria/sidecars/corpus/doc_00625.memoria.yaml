  name: 中世纪前期
  tags:
  - 中世纪前期
  description: 鼎盛时期的罗马帝国，是人类历史上最庞大的国家之一。他的版图不仅囊括了整个地中海盆地，而且还包括了今天的法国、英格兰的一部分地区。在这片广袤的土地上，靠军队的强大、城市的合理管理和地方上层人士的忠诚，罗马帝国的统治非常稳固。
