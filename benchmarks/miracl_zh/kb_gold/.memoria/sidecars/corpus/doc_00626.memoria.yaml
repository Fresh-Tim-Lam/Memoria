  name: 防灾减灾日
  tags:
  - 防灾减灾日
  description: 2008年5月12日，中华人民共和国四川汶川发生里氏8.0级特大地震。据统计，汶川大地震共造成69227到300000人死亡，是中华人民共和国成立以来破坏力最大的地震，也是唐山大地震後傷亡最惨重的一次。这场大地震给中国人民带来了巨大的心理压力和难以愈合的心灵创伤，堪称国家和民族史上的重大灾难。
