  name: 2004年中国超级联赛杯
  tags:
  - 2004年中国超级联赛杯
  description: 2004年中超联赛杯是中國足協舉行的首屆中国超级联赛杯，杯賽於2004年6月2日展開，决赛于12月11日在济南进行，最后由山東魯能泰山夺得冠军。天津康师傅与沈阳金德的两场比赛均在天津举行。
