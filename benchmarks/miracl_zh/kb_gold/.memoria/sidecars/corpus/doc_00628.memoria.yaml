  name: 全国人民代表大会常务委员会副委员长
  tags:
  - 全国人民代表大会常务委员会副委员长
  description: 副委员长和全国人民代表大会的任期相同，每届任期五年（1954年宪法每届任期四年）。1982年宪法第六十六条规定，“委员长、副委员长连续任职不得超过两届”。
