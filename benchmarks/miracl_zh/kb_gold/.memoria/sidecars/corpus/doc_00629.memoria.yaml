- id: 1057816#0
  name: 祭天
  tags:
  - 祭天
  description: 祭天是古代出于对天的敬畏，为了战争、祈穀、祈雨等与农业相关的祈求，而對天帝之原始崇拜。在古代中國社會，多由君主或者各级諸侯领主下令修建不同规格的的祭坛或神廟，以用于祭天。在中国史上，由于被「天圆地方」的观念影响，祭坛往往为圆形，象征天的形状，又被称为圜丘。一開始，有祭天之權者多半為貴族，平民只能祭拜各鄉土神，不能享有祭天之權，直到民間信仰逐漸演變，平民方能祭天，稱為拜天公、拜天。
