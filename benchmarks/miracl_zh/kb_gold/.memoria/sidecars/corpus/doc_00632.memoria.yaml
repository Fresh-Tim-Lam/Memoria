- id: 1067355#1
  name: 圜丘坛 (首尔)
  tags:
  - 圜丘坛
  - (首尔)
  description: 据《三国志·乌丸鲜卑东夷传》记载，高句丽和东濊在朝鲜三国时代和前三国时期就举行十月祭天仪式。到高丽王朝时期，高丽成宗是第一个举行祭天仪式的高丽君主，并将祭天仪式规范化。这些祭天仪式主要是祈求农业丰收。高丽的祭天仪式在高丽后期被终止。朝鲜王朝时期，朝鲜世祖复兴了祭天仪式。但是由于祭天是天子的行为，在世祖继位的第10年，祭天仪式因为来自明朝皇帝的压力而停止。1897年，高宗称帝建立大韩帝国后，祭天仪式再次被-{}-复兴。
