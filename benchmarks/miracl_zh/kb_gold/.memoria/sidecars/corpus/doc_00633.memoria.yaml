- id: 1073731#1
  name: 隋唐大运河
  tags:
  - 隋唐大运河
  description: 隋唐大运河以洛阳为中心，南至余杭，北到涿郡。隋代的政治和军事中心位于目前的中国渭河平原，尤其是中原地区，在平定南陈期间，为了运兵南下，开始修建运河。待开皇九年（589年）三月平定南陈后，为了将江南的粮食和纺织品运送到北方，又陆续开凿了数条运河。最终形成以洛阳为中心，首尾相连的几条运河。
