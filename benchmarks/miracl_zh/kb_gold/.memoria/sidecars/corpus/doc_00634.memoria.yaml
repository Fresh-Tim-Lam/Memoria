  name: 木星的磁層
  tags:
  - 木星的磁層
  description: 木星在兩極展示出明亮、持續存在的極光。不同於地球的極光只在太陽活動活躍時，暫時的出現在極區；木星的極光是永久性的，然而它的強度每天每刻都在變化。它們由三個主要的元件組成：極光橢圓，這是狹窄的亮區，寬度小於1,000公里，圓形的特徵位於距離磁極大約16°；衛星的極光斑點，對應於最大的四顆衛星聯結到木星電離層的磁場線所留下的印記，和位於主體橢圓形的瞬變與排放。而極光幾乎在所有的電磁頻譜上都有發射，從無線電波到X射線（到達3KeV），最明亮的是中紅外線（波長3－4μm和7－14μm
  range:
    start:
      line_hint: 1
      snippet: 木星的磁層
    end:
      line_hint: 3
      snippet: 的四顆衛星聯結到木星電離層的磁場線所留下的印記，和位於主體橢圓形的瞬變與排放。而極光幾乎在所有的電磁頻譜上都有發射，從無線電波到X射線（到達3KeV），最明亮的是中紅外線（波長3－4μm和7－14μm）和遠紫外線（波長從80－180nm）。
