  description: 1924年，23岁的海森堡还只是哥廷根大学未取得终身教职的一名年轻教师，他於同年九月应玻尔的邀请来到哥本哈根进行六个月的交流访问，此间海森堡受到了玻尔和他的学生汉斯·克喇末等人的深刻影响。1925年海森堡回到哥廷根，在五月之前他的工作一直是致力于计算氢原子谱线并试图只采用可观察量来描述原子系统。同年六月为了躲避鼻炎的流行，海森堡前往位于北海东部并且没有花粉侵扰的黑尔戈兰岛。在那里他一边品味歌德的抒情诗集，一边思考着光谱的问题，并最终意识到引入不可对易的可观察量或许可以解决这个
  range:
    start:
      line_hint: 1
      snippet: 物理学史
    end:
      line_hint: 3
      snippet: 测中只能展示出粒子性或波动性两者之一，即不可能同时观测到电子的粒子性和波动性，这被玻尔称作互补原理。海森堡的不确定性原理、玻尔的互补原理和波恩的波函数统计诠释以及相关联的量子观念，构成了被当今物理学界最为认可的量子力学思想——哥本哈根诠释。
