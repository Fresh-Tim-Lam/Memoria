- id: 1105906#4
  name: 中国电子游戏产业
  tags:
  - 中国电子游戏产业
  description: 中国大陆的游戏业起步较晚，1994年金盘电子推出的神鹰突击队是中国大陆最早的电脑游戏；1995年2月成立的前导软件是早期的著名公司，由IDGVC投资，1996年推出官渡，之后的赤壁更是最早中文即时战略游戏；因为管理层和市场的估计不足公司1998年关闭，之前发布了赤壁的源代码以及与Intel合作的OEM产品齐天大圣。
    ；目标软件也是1995年成立，比前导晚了2个月，但同年即发布了铁蹄惊雷，仅在美国发售；1998年推出的铁甲风暴(Metal Knight)受到国内外好评；1995
  range:
    start:
      line_hint: 1
      snippet: 中国电子游戏产业
    end:
      line_hint: 3
      snippet: 起步較早十多年如大宇資訊和光譜資訊、第三波等公司由初期的代理美日遊戲到學習技術後開始自製中文色彩遊戲，如仙劍奇俠傳、金庸群俠傳、三國群英傳等外國不可能涉獵的題材傳至中國大陸後成為一時熱門，諸多廠商日後也前往中國大陸設廠開啟了兩岸遊戲的合作。
