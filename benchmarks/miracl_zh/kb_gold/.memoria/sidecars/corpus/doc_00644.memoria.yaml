      snippet: 分时间段内，波兰纹章旗是波兰国家的主要象征，通常由国家首脑使用。虽然它的设计随时间的变化而改动，但它通常是一面纹章旗，也就是说，它是完全基于国徽设计（红底金冠白鹰）的。纹章旗不应与在1919年被正式使用，由白红两色条纹构成的波兰国旗相混淆。
