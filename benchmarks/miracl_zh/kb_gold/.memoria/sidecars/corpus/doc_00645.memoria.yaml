  name: 旧金山纪事报
  tags:
  - 旧金山纪事报
  description: 《旧金山纪事报》（，又称《旧金山新闻》）是北加利福尼亚地区发行量最大的报纸，同时也是美国发行量最大的报纸之一，订户主要集中在舊金山灣區，但该报发售范围遍及加州北部和中部，从萨克拉门托和向南一直到圣路易斯-奥比斯波县。该报于1865年由和兄弟创立，创刊名为《每日要闻纪事报》（The
    Daily Dramatic Chronicle）。随着旧金山的发展，报纸也随之壮大，到了1880年，该报成为美国西海岸发行量最大的报纸。而如今，西海岸只有《洛杉矶时报》在发行量上超过了《旧金山纪事
  range:
