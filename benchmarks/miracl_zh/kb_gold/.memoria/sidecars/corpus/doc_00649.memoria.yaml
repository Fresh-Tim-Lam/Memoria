- id: 1127168#8
  name: 国家公务员考试
  tags:
  - 国家公务员考试
  description: 在2022年以前，国家公务员考试层级分为副省部级和地市级两类试题，在试题数量和出题角度均会有所区分。自2022年起，国家公务员考试层级分为三类：副省部级、地市级和行政执法三类试题。其中行政执法类试卷专为国税系统、国家市场监管总局、国家海事局及海关总署等行政执法岗的公务员设立。
