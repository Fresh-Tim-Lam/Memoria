  name: 中央人民政府教育部
  tags:
  - 中央人民政府教育部
  description: 中央人民政府教育部是根据1949年9月27日中国人民政治协商会议第一届全体会议通过的《中华人民共和国中央人民政府组织法》第十八条的规定，于1949年10月1日设置的一个中央人民政府政务院部门。1954年9月，第一届全国人民代表大会第一次会议在北京召开，会议通过了《中华人民共和国宪法》和《中华人民共和国国务院组织法》，成立中华人民共和国国务院。根据国务院《关于设立、调整中央和地方国家机关及有关事项的通知》，中央人民政府教育部即告结束。国务院按照《国务院组织法》的规定，将原中央人
  range:
    start:
      line_hint: 1
      snippet: 中央人民政府教育部
    end:
      line_hint: 3
      snippet: 法》，成立中华人民共和国国务院。根据国务院《关于设立、调整中央和地方国家机关及有关事项的通知》，中央人民政府教育部即告结束。国务院按照《国务院组织法》的规定，将原中央人民政府教育部改为中华人民共和国教育部，接替相关工作，成为国务院组成部门。
