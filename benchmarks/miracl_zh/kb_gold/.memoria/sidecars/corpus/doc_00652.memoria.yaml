- id: 1146447#1
  name: 陈县
  tags:
  - 陈县
  description: 秦朝末年（公元前209年7月），包括陈胜与吴广在内的900名贫苦农民，去渔阳驻守边地，途中卻延誤了時間。由于逾期應役按秦律都要被杀头，陈胜与吴广一起号召起义，迅速组织了一批农民为主的队伍，并占领了蘄縣大澤鄉（安徽宿縣西寺坡鄉劉村集），史称大泽乡起义，陈胜在占领陈县后自立为王，国号张楚，即张大楚国之意。
