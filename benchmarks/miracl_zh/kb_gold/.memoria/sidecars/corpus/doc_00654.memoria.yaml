- id: 1159405#0
  name: 福建语言
  tags:
  - 福建语言
  description: 闽语，为福建省內各種本土語言，在中國大陸及西方各国通稱作福建话。具体可分为闽东语、闽北语、闽中语、邵將語、莆仙語、闽南语。另外，在福建地区流通的漢語變體還有客家語、吳語、赣语和延平官話等。
