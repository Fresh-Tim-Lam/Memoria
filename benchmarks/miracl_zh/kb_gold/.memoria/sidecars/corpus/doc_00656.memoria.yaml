- id: 1173626#2
  name: 天津金融业
  tags:
  - 天津金融业
  description: 天津出现的第一家银行便是英国汇丰银行天津分行，该行于1882年正式开业。其后是1895年在天津开业的英国麦加利银行天津分行，1896年开业的俄国华俄道胜银行天津分行，1897年开业的德国德华银行天津分行，1898年出现了最早的中国资本资银行—中国通商银行天津分行，1899年开业的日本横滨正金银行天津分行，此外还有法国的东方汇理银行天津分行及中法工商银行天津分行、美国花旗银行天津分行、意大利华义银行天津总行、比利时华比银行天津分行等。到1900年天津有银行、钱庄、票号300多家
  range:
    start:
      line_hint: 1
      snippet: 天津金融业
    end:
      line_hint: 3
      snippet: 柱。在1921年2月7日天津创设了当时中国最早的证券交易所——天津证券花纱粮食皮毛交易所。在20世纪40年代，解放北路上设有49家国内外银行；有270多家国内外保险机构，还有功能完备的证券交易所，是当时全国仅次于上海的金融中心和保险业中心。
