- id: 1186518#1
  name: 香港動畫
  tags:
  - 香港動畫
  description: 目前香港動畫主要是動畫電影為主，主要有《麥嘜》系列，還有原創電影動畫《龍刀奇緣》、《反斗高比玩轉聖誕城3D》等，和從香港漫畫《風雲》改編的《風雲決》。電視動畫在一般情況下通常會和日本合作，由日本繪畫然後由香港加工。例子有《神鵰俠侶》（第一輯，第二、三輯由香港獨力製作）、《Hello
    Kitty愛漫遊》，另外也有全本地製作的電視動畫《古惑香蕉頭》及短篇動畫《迪迪仔周記》、《癲噹》等，而OVA動畫也有《超神Z》。
  range:
    start:
      line_hint: 1
      snippet: 香港動畫
    end:
      line_hint: 3
      snippet: 常會和日本合作，由日本繪畫然後由香港加工。例子有《神鵰俠侶》（第一輯，第二、三輯由香港獨力製作）、《Hello Kitty愛漫遊》，另外也有全本地製作的電視動畫《古惑香蕉頭》及短篇動畫《迪迪仔周記》、《癲噹》等，而OVA動畫也有《超神Z》。
