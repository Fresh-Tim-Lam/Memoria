- id: 1188358#0
  name: 世界主要宗教
  tags:
  - 世界主要宗教
  description: 世界主要宗教在20世纪根据比较宗教学的研究，依照其基本哲学观念和神学范畴来分类，但对于如何划分宗教信仰人群，尚有许多问题没有完全解决，包括：虽然基督宗教、伊斯兰教和佛教在中文語境裡常被统称为世界三大宗教，但一般列举主要宗教仍然包括其他几种重要的宗教。
