      snippet: sjid），位于巴基斯坦首都伊斯兰堡，是巴基斯坦的国家清真寺。它是巴基斯坦乃至南亚地区最大的清真寺，同时也是世界第六大清真寺。清真寺由沙特阿拉伯国王费萨尔·本·阿卜杜勒-阿齐兹·阿勒沙特出资修建，并以其名冠名。建筑风格以贝都因人帐篷为灵感。
