- id: 1208685#0
  name: 联合国安全理事会成员国列表
  tags:
  - 联合国安全理事会成员国列表
  description: 联合国安全理事会成员包括五个常任理事国和十个非常任理事国。安全理事会的常任理事国名額为五个，自1945年联合国成立以来一直未变；其中，中國的代表权在1971年时，通过联合国大会决议，由中華民國转至中华人民共和国行使；原苏联的代表權於1991年，由俄羅斯聯邦繼承。1966年以前，安全理事会的非常任理事国名额为六个；1966年起，名额增至十个席次。非常任理事国每次当选后的任期为两年、任期不得連續，每年进行非常任理事国一半席位的选举。为了保持非常任理事国席位在各个地区之间的平衡和每
  range:
    start:
      line_hint: 1
      snippet: 联合国安全理事会成员国列表
    end:
      line_hint: 3
      snippet: 非洲集团和亚洲-太平洋集团中交替产生。这一原则在1967年时得到确认，自1968年开始施行，所以1967年没有阿拉伯国家按照这一原则当选非常任理事国。应该强调的是，非常任理事国的名额分配方法并非是正式的，而是非官方性质的，因此是可以变更的。
