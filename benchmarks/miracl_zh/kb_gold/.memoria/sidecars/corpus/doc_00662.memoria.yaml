- id: 1208685#9
  name: 联合国安全理事会成员国列表
  tags:
  - 联合国安全理事会成员国列表
  description: 截至2017年12月，在联合国的193个会员国当中，只有5个是安全理事会的常任理事国，这也就意味着剩余的188个联合国会员国需要分配安理会的另外10个成员国席位。因此，有为数众多的联合国会员国至今未有一次當選安理会的成员国。
