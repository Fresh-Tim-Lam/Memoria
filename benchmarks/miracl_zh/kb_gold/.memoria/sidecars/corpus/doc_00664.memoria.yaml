      snippet: 州的结果保持不变，不过德克萨斯州已经取代加利福尼亚州成为近十年来人口增长总数最多的州，内华达州则继续保持人口增长率最高州的位置，而密歇根州则是全美唯一一个人口数有所减少的州。首都華盛頓哥伦比亚特区则实现了自20世纪50年代以来首次人口增长。
