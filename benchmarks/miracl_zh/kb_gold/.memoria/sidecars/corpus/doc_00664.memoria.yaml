  name: 2010年美國人口普查
  tags:
  - 2010年美國人口普查
  description: 最终结果显示，美国人口已达308,745,538人，成为世界第3人口大国（仅次于中華人民共和國和印度）。与2000年美国人口普查时的结果相比人口增长了9.7%，增长速度有所放缓（1990-2000年的总增长率为13.2%）。而在各州中，加利福尼亚州、德克萨斯州、纽约州作为人口最多3州的结果保持不变，不过德克萨斯州已经取代加利福尼亚州成为近十年来人口增长总数最多的州，内华达州则继续保持人口增长率最高州的位置，而密歇根州则是全美唯一一个人口数有所减少的州。首都華盛頓哥伦比亚特区则
