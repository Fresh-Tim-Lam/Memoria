- id: 1239996#1
  name: 中国大陆移动终端通信号码
  tags:
  - 中国大陆移动终端通信号码
  description: 中国大陸手机号码以1开头（未来预留92和98开头），共11位数，前7位数字通常称为手机号段，可用于区分运营商和归属地，其作用类似于固定电话区号，但并不能相互对应。
    示例：1XX-YYYY-ZZZZ
