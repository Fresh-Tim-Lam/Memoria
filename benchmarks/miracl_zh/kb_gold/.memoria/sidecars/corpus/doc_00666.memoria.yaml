  description: 亨利·爱德华·「艾德」·罗伯茨（，）是一名美国工程师、企业家、医生，他曾于1975年发明了第一台个人电脑， 因而他也经常被称为“个人电脑之父”。
    1970年他创立了微仪系统家用电子公司（MITS，Micro Instrumentation and Telemetry Systems），最初公司是面向火箭模型爱好者销售电子设备，然而其第一个成功的产品曾是1971年《大众电子》（"Popular
    Electronics"）封面上所介绍的电子计算器。 这一计算器相当地成功，1973
  range:
