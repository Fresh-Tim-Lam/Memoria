      snippet: 397美元的个人电脑。比尔·盖茨和保罗·艾伦后来前往MITS公司为该电脑制作了软件和Altair BASIC语言，这也是微软的第一个产品。罗伯茨于1977年卖掉了MITS公司并前往佐治亚州，在那里他务农、学习医学，最后成为了小镇的一名医生。
