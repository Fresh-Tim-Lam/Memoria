  name: 复旦大学
  tags:
  - 复旦大学
  description: 复旦大学（），简称復旦，旧称復旦公學、國立復旦大學，始创于1905年，位于中国上海，是一所世界知名、国内顶尖的综合性研究型大学，在大中华地区享有极高的声誉。复旦大学校名取自《尚书大传》之“日月光华，旦复旦兮”，表示取之不尽，用之不竭的自力更生和勤奋，更含不忘“震旦”之旧和复兴中华的意义。1917年始设大学部，1952年院系调整，江、浙、皖、沪等地大批文理学科的专家学者调入复旦，复旦大学自此成为人文社会和自然科学的全国重镇，享有“江南第一学府”的美誉。2000年与上海医科大学合
  range:
