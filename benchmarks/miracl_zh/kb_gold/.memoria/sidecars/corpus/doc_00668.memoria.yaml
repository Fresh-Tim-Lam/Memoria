  name: 复旦大学
  tags:
  - 复旦大学
  description: 复旦大学目前学校直属中华人民共和国教育部，是教育部与上海市共建的全国重点大学，中国首批7所“211工程”、首批9所“985工程”重点高校之一，也是首批“珠峰计划”、“111计划”重点建设的研究型大學，同时亦是长三角高校合作联盟、金砖国家大学联盟和中国C9联盟成员。
