- id: 1281449#16
  name: 偉大社會
  tags:
  - 偉大社會
  description: 一度面臨全面核戰危機的1962年古巴导弹危机在美苏妥协中和平解决。1961年越南战争开始局部介入。5月为了进一步帮助越南共和国（南越）总统吳廷琰的政府，美国总统肯尼迪派遣一支美軍特种部队进驻越南共和国，开启了美军战斗部队进入越南的先河。这一事件也常被认为是越战开始的标志。
