- id: 1301857#0
  name: 赵匡赞 (赵弘殷之子)
  tags:
  - 赵匡赞
  - (赵弘殷之子)
  description: 赵匡赞是中国宋朝开国皇帝宋太祖赵匡胤的五弟。父亲是宣祖赵弘殷，母亲是昭宪太后杜氏。趙匡赞年纪很小就夭折了。建隆元年（960年）春正月，赵匡胤建立北宋之後，追封五弟为夔王，后来改封岐王。
