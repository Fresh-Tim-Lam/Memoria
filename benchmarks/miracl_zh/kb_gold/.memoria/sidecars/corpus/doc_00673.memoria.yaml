- id: 1301860#0
  name: 赵匡济
  tags:
  - 赵匡济
  description: 赵匡济是中国宋朝开国皇帝宋太祖赵匡胤的大哥，父亲是宣祖赵弘殷，母亲是昭宪太后杜氏。趙匡济在宋朝建立之前就去世了。建隆元年（960年）春正月，赵匡胤建立北宋之後，追封大哥为邕王，后来改封曹王。
