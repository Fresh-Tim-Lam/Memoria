      snippet: ·坎波斯宣布西班牙波旁王朝复辟。共和国的建立始于1873年2月10日阿玛迪奥一世的退位，随后发生了伊达尔戈事件，当时激进政府要求他签署一项针对炮兵军官的法令。第二天，2月11日，由激进分子、共和党人和民主党人组成的议会多数派宣布成立共和国。
