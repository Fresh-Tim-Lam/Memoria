  name: 西班牙第一共和國
  tags:
  - 西班牙第一共和國
  description: 西班牙共和国，通常被称为西班牙第一共和国，以区别于1931 - 1939年存在的西班牙第二共和国，是短暂的共和政体。存在于1873年2月11日西班牙议会宣布共和国成立到1874年12月29日阿尔塞尼奥·马丁内斯·坎波斯宣布西班牙波旁王朝复辟。共和国的建立始于1873年2月10日阿玛迪奥一世的退位，随后发生了伊达尔戈事件，当时激进政府要求他签署一项针对炮兵军官的法令。第二天，2月11日，由激进分子、共和党人和民主党人组成的议会多数派宣布成立共和国。
