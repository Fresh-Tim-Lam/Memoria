- id: 1352771#1
  name: 中国共产党湖南省委员会
  tags:
  - 中国共产党湖南省委员会
  description: 中共湖南省委由中国共产党湖南省代表大会选举产生。在代表大会闭关期间，执行中国共产党中央委员会的指示和中国共产党湖南省代表大会的决议，领导湖南省的工作，定期向中国共产党中央委员会报告工作。现任中共湖南省委书记是张庆伟。
