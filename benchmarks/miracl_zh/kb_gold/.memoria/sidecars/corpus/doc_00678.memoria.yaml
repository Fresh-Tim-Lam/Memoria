  name: 芒市
  tags:
  - 芒市
  description: 芒市土司方克明、遮放土司多建勋常至缅甸拜佛，见到缅甸境内的公路与汽车，于是萌生了在芒市地区修筑车路、引进汽车的想法。二土司合议修建芒市经遮放、畹町到缅甸九谷的公路，聘请印度工程师勘测修筑，1928年遮放通车，1931年芒市通车。芒市至缅甸九谷的公路是滇西地区最早的公路，土司购入的汽车成为滇西汽车运输业的开端。1937年，蒋介石下令修筑大理至滚弄的滇缅公路，龙云复电称芒市土司和缅甸腊戌已有公路，交通部研究后决定滇缅公路改由潞西出境。经拓宽、改直、降低坡纵，芒市段的滇缅公路在19
  range:
    start:
      line_hint: 1
      snippet: 芒市
    end:
      line_hint: 3
      snippet: 华人民共和国成立后改称昆畹公路潞畹段，1990年成为320国道的一部分。1979年重建芒市南天门段昆畹公路，1983年重建三台山段，1985年建成芒市环城西路（现芒市大街），改变国道直穿城区（团结大街）的状况，1997年改建升格为二级公路。
