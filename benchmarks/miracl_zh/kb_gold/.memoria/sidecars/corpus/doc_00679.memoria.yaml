- id: 1414605#41
  name: 马来西亚文化
  tags:
  - 马来西亚文化
  description: 曲棍球在马来西亚很受欢迎，马来西亚队在2010年世界排名第14位。马来西亚在主办第十届世界杯之前，在吉隆坡默迪卡體育場举办了第三届曲棍球世界杯。马来西亚有自己的一级方程式赛道；雪邦国际赛车场，并于2000年举行了第一届世界摩托车锦标赛。高尔夫球也正变得流行，全国各地大多都有高尔夫球场。其他运动包括舞龙和赛龙舟，马来西亚的海岸线以潜水，帆船，水上运动和其他活动而闻名。
