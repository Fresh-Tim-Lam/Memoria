  name: 美国国家公园列表
  tags:
  - 美国国家公园列表
  description: 全美有29个州、以及美属萨摩亚和美属维尔京群岛拥有国家公园。这其中加利福尼亚州以9个居首，阿拉斯加州以8个紧随其后，接下来分别是犹他州（5个）和科罗拉多州（4个）。阿拉斯加州的朗格-聖伊利亞斯國家公園占地面积超过3.2万平方公里，大于美国面积最小的9个州，也是最大的国家公园，面积排第2至第4的国家公园同样位于阿拉斯加州。密苏里州的傑弗遜國家擴張紀念公園占地面积不足0.2平方公里，是最小的国家公园。所有国家公园的面积总和约有21万平方公里，平均每个3620平方公里，不过中位数只
  range:
    start:
      line_hint: 1
      snippet: 美国国家公园列表
    end:
      line_hint: 3
      snippet: 國家公園是造访人数最多的国家公园，这年有超过1000万游客到访，其次是游客人数超过470万的亚利桑那州大峡谷国家公园。与之相比，位置偏远的阿拉斯加州北极门国家公园同年仅接待游客1.2万人。截至2014年，美国已有14个国家公园入选世界遗产。
