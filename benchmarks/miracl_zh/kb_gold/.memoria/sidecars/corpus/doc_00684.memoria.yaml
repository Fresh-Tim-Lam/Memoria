- id: 1518232#0
  name: 心跳过速
  tags:
  - 心跳过速
  description: 心跳过速（tachycardia、tachyarrhythmia），也稱心跳过快，是指心跳速度超出正常范围。一般來說，成年人在靜止狀態下心跳达到每分钟一百下以上即屬心跳過速。剧烈的体育运动、紧张、焦虑或服用某些药物等可能会造成生理上的心跳过速，而心血管疾病、贫血、甲亢等疾病则会造成病理性心跳过速。
