  name: 斯蒂格·拉松
  tags:
  - 斯蒂格·拉松
  description: 拉松在2008年榮登全世界最暢銷作家第二名，僅次於卡勒德·胡賽尼。到了2010年3月，他的《千禧年三部曲》已經在超過四十個國家賣出了六千五百萬本，也是首位在亞馬遜書店賣超過100萬本電子書的作者。根據《出版者周刊》統計，三部曲的最後一部《直搗蜂窩的女孩》是2010年全美最暢銷的書籍。
