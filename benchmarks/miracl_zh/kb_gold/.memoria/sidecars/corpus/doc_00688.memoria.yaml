- id: 1532896#5
  name: 切葉蟻
  tags:
  - 切葉蟻
  description: 在一個成熟的切葉蟻群中，每隻個體都有不同的分工，主要根據其體型大小為依據來負責不同的職責。美洲切葉蟻屬與頂切葉蟻屬展現了極高的多態性，在蟻群中主要能夠分為四種階級：迷你工（minims）、小工（minors）、一般工蟻（mediae）與兵蟻（majors）。美洲切葉蟻屬各階級之間的體型大小差異較頂切葉蟻屬明顯。
