  name: 中央政法干部学校
  tags:
  - 中央政法干部学校
  description: 1978年学校恢复招生。1982年，中央人民公安学院从中央政法干部学校独立出去。1983年5月7日中国政法大学成立，以中央政法干校为基础成立了中国政法大学进修学院。后沿革为中央政法管理干部学院。
