- id: 1548014#1
  name: 格罗宁格博物馆
  tags:
  - 格罗宁格博物馆
  description: 该馆藏有六个世纪以来的弗拉芒和比利时油画，包括自扬·范·艾克（Jan van Eyck）至马塞尔·布罗塔尔斯（Marcel Broodthaers）的名作。该馆藏品中的亮点是“弗拉芒原始派”（Flemish
    Primitives）艺术作品，文艺复兴和巴洛克大师们的作品，18至19世纪的新古典主义及现实主义时期的油画作品，比利时象征主义及现代主义里程碑式作品，弗拉芒表现主义经典作品，以及布鲁日的许多二战后现代艺术作品。
