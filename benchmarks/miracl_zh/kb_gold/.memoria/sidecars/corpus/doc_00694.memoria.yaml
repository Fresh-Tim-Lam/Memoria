  description: 17世纪、18世纪的剧本往往是由著名诗人创作的。例如在欧洲最受尊重的编剧之一的梅塔斯塔斯（意大利文：Metastasio，1698–1782，真名皮埃特罗·塔帕斯）。洛伦佐·达·彭特也是18世纪著名的编剧。沃尔夫冈·阿马德乌斯·莫扎特也创作了许多歌剧。另外还有Eugène
    Scribe、贾科莫·梅耶贝尔、丹尼尔·奥柏、温琴佐·贝利尼、葛塔诺·多尼采蒂、焦阿基诺·罗西尼、朱塞佩·威尔第、雅克·奥芬巴赫、儒勒·马斯内、乔治·比才、阿里格·博伊托、阿兰·鲍伯利等著名编剧。法国的He
  range:
    start:
      line_hint: 1
      snippet: 歌劇劇本
    end:
      line_hint: 3
      snippet: 罗西尼、朱塞佩·威尔第、雅克·奥芬巴赫、儒勒·马斯内、乔治·比才、阿里格·博伊托、阿兰·鲍伯利等著名编剧。法国的Henri Meilhac、Ludovic
        Halévy创作了很多轻歌剧。朱塞佩·威尔第和阿米尔卡雷·蓬基耶利曾经共同创作歌剧。
