      snippet: 十余年时间里，发生了多次成员的更替。最早是《体育战报》因为影响力有限而退出，联盟随即又补充了葡萄牙的《球报》、比利时的《足球杂志》、意大利的《米兰体育报》、法国的《11人》和英国的《世界足球》。这5家新加入媒体同样被认为是ESM的创始成员。
