  name: 欧洲体育杂志联盟
  tags:
  - 欧洲体育杂志联盟
  description: 欧洲体育杂志联盟（英文名称：European Sports Magazines，简称ESM)，成立于1989年，是当时西班牙的《足球先生》在联合德国的《踢球者》、荷兰的《国际足球》以及意大利的《体育战报》和瑞士的《体育》后成立起了这个机构，组建的最基本原则之一就是一个国家只能有一本杂志或报纸加入此联盟。此后的十余年时间里，发生了多次成员的更替。最早是《体育战报》因为影响力有限而退出，联盟随即又补充了葡萄牙的《球报》、比利时的《足球杂志》、意大利的《米兰体育报》、法国的《11人
  range:
