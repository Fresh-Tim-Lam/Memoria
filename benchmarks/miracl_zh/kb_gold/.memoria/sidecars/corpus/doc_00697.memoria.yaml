  description: 19世纪末，罗马成为统一的意大利首都，城市化进程加速，法西斯时期该区的外观发生巨大变化，特别是在1924年和1936年之间，开辟帝国广场大道，以及在其两侧古罗马广场与帝国议事广场的考古发掘，摧毁了不少小街巷和普通民居。
