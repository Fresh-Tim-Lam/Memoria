- id: 1637709#1
  name: 再城市化
  tags:
  - 再城市化
  description: 当城市化进程中，发展到一定水平时，过度集中带来的不利影响开始凸现，城市发展开始倾向分散，最终导致逆城市化的过程，即城市的人口、工业商业等非农业资源逐步向农村分散，而城市中心区发展缓慢，甚至导致城市中心区开始逐步衰落。在此背景下，发生逆城市化的国家与城市的政府和公共部门通过采取各种积极的应对措施，包括调整不合理的产业结构，大力发展高新技术产业和第三产业，并积极开发城市中心的衰落区，在市域内实现人口再度增长，出现了所谓再城市化。总而言之，再城市化就是城市在城镇化进程中，发生逆城市
  range:
    start:
      line_hint: 1
      snippet: 再城市化
    end:
      line_hint: 3
      snippet: 极的应对措施，包括调整不合理的产业结构，大力发展高新技术产业和第三产业，并积极开发城市中心的衰落区，在市域内实现人口再度增长，出现了所谓再城市化。总而言之，再城市化就是城市在城镇化进程中，发生逆城市化之后进一步提升城市化的功能和内涵的过程。
