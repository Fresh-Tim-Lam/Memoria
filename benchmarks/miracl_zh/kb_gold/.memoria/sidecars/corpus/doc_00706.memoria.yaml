- id: 1756147#9
  name: 原始印欧人
  tags:
  - 原始印欧人
  description: 公元前2000年代初，居于东欧草原西部（大约在今天的多瑙河下游平原）的一批原始印欧人，沿多瑙河向西挺进，他们翻越阿尔卑斯山进入今天的意大利一带，被称为拉丁人。罗马人是拉丁人中最著名的一支。与此同时，另一些原始印欧人继续向西和北两个方向迁移，形成了西欧和中欧的凯尔特人和北欧的日耳曼人。
