  name: 荷蘭地理
  tags:
  - 荷蘭地理
  description: 荷兰位于欧洲西北部，属于西欧国家。西、北部临北海，南部与东部分别和比利时与德国接壤。荷兰大部分的国土均由填海而成，其国土面积的一半海拔低于1米，26%甚至低于海平面，荷兰人修建了堤坝保护低地，因此荷兰又被称为低地国。荷兰位于莱茵河的入海口，莱茵河、瓦尔河和马斯河将荷兰一分为二。荷兰的总面积为41526平方千米，其中水域面积就有7643平方千米。荷兰的人口极为密集，共有1684多万人，其人口密度为406人/平方千米，排名为世界第16位，在人口1000万以上的国家中人口密度排名第
