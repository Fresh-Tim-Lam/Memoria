  description: 2021年2月4日，中華人民共和国外交部发表声明，批评英国广播公司同年1月29日播出2019冠状病毒病中国大陆疫情的“假新闻”。路透社援引外交部新闻司相关负责人的话称：“BBC近期涉新冠疫情新闻视频中将疫情与政治挂钩，重新翻炒疫情‘隐瞒论’‘源头论’‘责任论’，还将一段反恐演习视频作为中国防疫部门‘暴力执法、侵犯人权’新闻播出，这是典型的带有意识形态偏见的假新闻，影响恶劣”，就此向BBC驻北京分社提出严正交涉。2月5日，中华人民共和国外交部发言人趙立堅在Twitter發文表示
