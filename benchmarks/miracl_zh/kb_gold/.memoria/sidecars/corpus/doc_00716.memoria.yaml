  description: 台灣《地方制度法》規定，人口聚居達125萬人以上、縣人口聚居到達200萬人以上，且在政治、經濟、文化及都會區域發展上，有特殊需要之地區得設直轄市。中華民國目前共有臺北市、新北市、桃園市、臺中市、臺南市、高雄市六個直轄市。臺灣這六個直轄市之中又以臺北都會區、高雄都會區、臺中都會區為臺灣三大都市。臺北市于1967年升格為直轄市；高雄市於1979年升格為直轄市；新北市、臺中市、臺南市等三個直轄市都是在2010年升格，而臺中市、臺南市和高雄市都在2010年進行了合併；桃園市則是在20
