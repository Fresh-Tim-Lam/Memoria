  - 雍正皇帝
  - (小说)
  description: 《雍正皇帝》是中国大陆作家二月河的一篇长篇历史小说。本书是二月河“皇帝系列”三部曲中的第二部，前一部是《康熙大帝》，后一部是《乾隆皇帝》。《雍正皇帝》荣获香港《亚洲周刊》评选的20世纪中文小说100强中的压轴作品（第100名）。本书曾被改编为电视剧《雍正王朝》。《雍正皇帝》是二月河“帝王系列”的第二部，它跨越康、雍、乾承先启后数十年历史，成功地描写了雍正皇帝波澜壮阔的一生。本书问世后，再次轰动文坛，在更广大的读者群中引起震动。雍正皇帝是中国历史上极有作为的皇帝之一，也是最有争
  range:
    start:
      line_hint: 1
      snippet: 雍正皇帝 (小说)
    end:
      line_hint: 3
      snippet: 莫测、扑朔迷离的疑团。作为创建了清王朝“康乾盛世”的三位杰出帝王之一，雍正生活在两位执政时间最长的皇帝即在位61年的康熙大帝和在位60年的风流天子乾隆之间，犹如耸立在两座高峰之间的又一座高峰，他承先启后，是“康乾盛世”中功不可没的一代帝王。
