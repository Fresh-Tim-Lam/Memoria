- id: 2789601#5
  name: 畹町镇
  tags:
  - 畹町镇
  description: 芒市土司方克明、遮放土司多建勋常至缅甸拜佛，见到缅甸境内的公路与汽车，遂萌发在家乡修筑公路、引进汽车的想法，于1928年12月修通畹町至遮放的公路，1931年畹町至芒市全线基本修通。抗日战争时期，为打破日本对中国的交通封锁，1937年11月2日蒋介石电令云南省主席龙云修筑大理至缅甸滚弄的滇缅公路，3日龙云复电称芒市至畹町已有公路，交通部研究后决定滇缅公路改由畹町出境连接缅甸腊戌。腾冲、龙陵、潞西、梁河、陇川、盈江、莲山、瑞丽两县六设治局出工上万人，对芒市至畹町的道路进行拓宽、
  range:
    start:
      line_hint: 1
      snippet: 畹町镇
    end:
      line_hint: 3
      snippet: 设治局出工上万人，对芒市至畹町的道路进行拓宽、改直，1938年8月31日滇缅公路全线通车。1939至1941年间，共有369,161吨的物资自滇缅公路输入中国，其中油类居首，占三分之一。因畹町地域狭小，遂将遮放作为中缅之间公路运输的转接点。
