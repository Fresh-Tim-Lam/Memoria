- id: 2798095#18
  name: 帕迪·查耶夫斯基
  tags:
  - 帕迪·查耶夫斯基
  description: 1954年《飞歌电视剧场》第七季查耶夫斯基的《午夜》（爱娃·玛丽·森特、E·G·马歇尔主演）在电视播出的15个月后搬上百老汇舞台。舞台剧版由爱德华·罗宾逊、吉纳·罗兰兹主演，在美国全国巡演引起巨大回响。哥伦比亚影业公司1959年拍摄了电影版。
    《第十个人》（1959年）是第二部查耶夫斯基大获成功的百老汇剧作，提名1960年托尼奖最佳话剧、最佳导演（蒂龙·谷史列）、最佳场景设计。谷史列以他的另外一部剧目《基甸》再次提名托尼奖。查耶夫斯基最后一部百老汇作品是根据约瑟夫·斯大林生平
  range:
    start:
      line_hint: 1
      snippet: 帕迪·查耶夫斯基
    end:
      line_hint: 3
      snippet: 二部查耶夫斯基大获成功的百老汇剧作，提名1960年托尼奖最佳话剧、最佳导演（蒂龙·谷史列）、最佳场景设计。谷史列以他的另外一部剧目《基甸》再次提名托尼奖。查耶夫斯基最后一部百老汇作品是根据约瑟夫·斯大林生平改编的《斯大林的激情》，反响不佳。
