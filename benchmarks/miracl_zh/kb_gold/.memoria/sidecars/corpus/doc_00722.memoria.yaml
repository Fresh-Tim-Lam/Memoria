- id: 2799973#4
  name: 中国共产党江苏省委员会
  tags:
  - 中国共产党江苏省委员会
  description: 中华人民共和国成立以后，南京成为江苏省会，中共江苏省委驻于南京市，初期办公地点在西康路33号美国驻中华民国大使馆旧址（现为西康宾馆），1960年之后迁入位于西侧马鞍山上的古林寺遗址，形成现在的北京西路70号省委大院。
