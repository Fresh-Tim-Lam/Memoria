  name: 巴西國家男子籃球隊
  tags:
  - 巴西國家男子籃球隊
  description: 巴西國家男子籃球隊 是一支来自于南美洲的世界男篮劲旅。著名球员有拉菲尔·阿劳约、林德罗·巴博萨、内内、安德森·瓦雷让等。2012年奥運會巴西派出NBA球員為主力的隊伍，但在淘汰賽中負于阿根廷無缘四強。
