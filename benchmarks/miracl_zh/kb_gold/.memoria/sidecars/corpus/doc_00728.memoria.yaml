  description: 拿破仑于1815年滑铁卢战役后被废黜，波旁王朝恢复法国王位。拿破仑·路易逃离了流放，但拿破仑家族从来没有放弃恢复拿破仑帝国的念头。 拿破仑·路易娶了他的堂姐
    ，拿破仑一世的哥哥约瑟夫·波拿巴之女。他和他弟弟路易-拿破仑·波拿巴定居在意大利，在那里，他们信奉自由主义政治和在奥地利和意大利北部参与组织反抗统治战斗的烧炭党。于1831年3月17日，拿破仑·路易由于教皇和奥地利军队镇压革命活动而逃离意大利，并患上了麻疹，最终在弗利死在了他弟弟的怀里。最后，拿破仑帝国被于1852年成为
