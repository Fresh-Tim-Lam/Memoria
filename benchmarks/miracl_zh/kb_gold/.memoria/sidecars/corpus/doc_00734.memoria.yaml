  name: 旧金山湾区城市列表
  tags:
  - 旧金山湾区城市列表
  description: 旧金山湾区，简称湾区，是北加州围绕旧金山湾和圣巴勃罗湾河口的一片城市群。根据2010年美国人口普查，该地区约18,000平方公里土地上生活了超过710万居民。加利福尼亚州有三个主要城市坐落于此：旧金山、圣何塞和奥克兰。
