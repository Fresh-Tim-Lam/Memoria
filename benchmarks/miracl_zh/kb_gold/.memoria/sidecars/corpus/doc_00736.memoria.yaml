  name: 胜利旗
  tags:
  - 胜利旗
  description: 自2006年5月9日胜利日阅兵始，胜利旗不再单独入场，而和俄罗斯国旗一同出现。然而俄罗斯的老兵组织对俄罗斯国旗的使用产生了异议，认为在卫国战争中现今的俄罗斯三色国旗是德国一方的弗拉索夫领导的俄罗斯解放军所使用的旗帜。在一封致俄罗斯总统的公开信中写道：
