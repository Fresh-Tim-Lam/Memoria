  name: 潍坊站
  tags:
  - 潍坊站
  description: 潍坊站，位于中华人民共和国山东省潍坊市潍城区，是胶济铁路、胶济客运专线上的火车站，建于1902年（始称潍县站），由中国铁路济南局集团青岛西车务段管辖。
    本站亦为坊子支线的接轨车站。
