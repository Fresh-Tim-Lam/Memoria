- id: 3228559#0
  name: 印度行政區歷年人口列表
  tags:
  - 印度行政區歷年人口列表
  description: 印度共有28個邦及7個联邦属地。印度於2011年共有12.1億人，為世界上人口第二多的國家，僅次於中华人民共和国。印度土地面積僅占全世界的2.4%，但人口占全世界的17.5%。中央平原為世界上人口最稠密的地區，東部及西部海岸地區、德干高原地區同樣為印度人口稠密區域。拉贾斯坦邦西部的塔尔沙漠則為世界上人口最稠密的沙漠。
    沿喜马拉雅山脉的印度北部及東北部地區存在寒漠及肥沃的谷地，由於較為惡劣的環境，使得這個區域人口密度較低。
