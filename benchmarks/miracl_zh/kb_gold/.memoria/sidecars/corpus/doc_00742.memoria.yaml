  name: 岸田文雄
  tags:
  - 岸田文雄
  description: 2021年9月29日，岸田在自民党总裁选举中击败河野太郎、高市早苗等对手，当选新一届自民党总裁，並於2021年10月4日就任日本第100任內閣總理大臣（首相），10月14日，岸田文雄解散眾議院，創下二戰以來日本首相最快解散紀錄。10月31日，岸田文雄領導自民黨參戰第49屆日本眾議院大選並獲得過半數議席。
