  name: 上海迪士尼樂園
  tags:
  - 上海迪士尼樂園
  description: 2016年6月15日，上海迪士尼乐园举行开园庆典，庆典邀请了众星表演节目以庆祝开园。谭盾、孙俪、谭维维、张靓颖、李克勤、郎朗等均在庆典上表演节目。中国大陆东方卫视、美国迪士尼频道、迪士尼XD以及Facebook专页均对此现场直播报道。
