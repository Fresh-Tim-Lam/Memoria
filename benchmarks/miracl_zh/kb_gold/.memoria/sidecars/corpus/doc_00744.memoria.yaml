- id: 3362372#6
  name: 本日山
  tags:
  - 本日山
  description: 西藏和平解放前，环绕林芝市巴宜区境内的苯教神山本日山建有苯教寺院七座，即达则寺、衮钦寺、滚巴颠巴寺、嘉黎寺、大卓萨寺、宗琼丹寺、羊滚寺。其他藏传佛教寺院也有不少。如今，本日山周围保存完好的寺庙有4座，即吉日寺、大卓萨寺、达则寺、色迦棍钦寺，均属苯教。达则寺曾为西藏苯教第二大寺。
