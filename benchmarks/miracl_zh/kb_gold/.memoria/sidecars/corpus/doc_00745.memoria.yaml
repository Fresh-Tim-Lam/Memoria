- id: 3366882#1
  name: 全国人民政权代表大会
  tags:
  - 全国人民政权代表大会
  description: 全國人民政權代表大會每届任期五年，全部立法議員經由等額選舉產生，每年举行两次例会。古巴在地方设有省级、市级（任期为两年半）人民政权代表大会。省、市和全国代表大会的选举一般分阶段举行，通常会持续数月。新当选的全国代表大会代表随即召开会议，确定各代表的合法性并选举大会主席，组建新一届全国人民政权代表大会。全国代表大会下设国务委员会，是大会休会期间的常设机构，由全国人民政权代表大会选举产生，在全国代表大会休会期间代表其行使国家权力。
  range:
    start:
      line_hint: 1
      snippet: 全国人民政权代表大会
    end:
      line_hint: 3
      snippet: 续数月。新当选的全国代表大会代表随即召开会议，确定各代表的合法性并选举大会主席，组建新一届全国人民政权代表大会。全国代表大会下设国务委员会，是大会休会期间的常设机构，由全国人民政权代表大会选举产生，在全国代表大会休会期间代表其行使国家权力。
