- id: 3384194#0
  name: 东非联邦
  tags:
  - 东非联邦
  description: 东非联邦（，）是一个正在酝酿中的單一聯合主權国家，旨在将坦桑尼亚、肯尼亚、乌干达、卢旺达、布隆迪和南蘇丹六国的東非共同體统一。截至2017年，六個國家都支持組成聯邦，但仍在為成員的主權和實施時序等問題繼續談判中。联邦成立后，面积最大的东非联邦将成为非洲最大的国家，也是世界第十大国家。截至2018年，這六個成員國組成的人口为178,978,883人，也将成为非洲第二大人口大国（尼日利亚之后，世界第八）。它的人口将大于俄罗斯、日本和墨西哥的人口，大约是美国的人口的一半。
