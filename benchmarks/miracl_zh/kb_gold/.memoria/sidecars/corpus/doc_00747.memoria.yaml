  name: 刘奇
  tags:
  - 刘奇
  description: 2008年1月，51岁的刘奇当选为十一届浙江省人大常委会副主任，晋升副部级，次月任浙江省总工会主席。2008年10月17日，中国工会十五大在北京开幕，大会选举他出任主席团委员。2011年1月，转任宁波市委副书记、代市长，同年2月26日当选宁波市人民政府市长。
