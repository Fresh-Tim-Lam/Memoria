  name: 中铁第一勘察设计院
  tags:
  - 中铁第一勘察设计院
  description: 截至2003年，铁一院已累计完成铁路各阶段研究及勘测设计34.8万公里。先后获得国家和省部级科技进步、优秀工程勘察设计、优秀软件、优秀标准设计奖400余项。其中，国家科技进步特等奖3项，一等奖2项，全国优秀工程勘察设计金奖7项。
