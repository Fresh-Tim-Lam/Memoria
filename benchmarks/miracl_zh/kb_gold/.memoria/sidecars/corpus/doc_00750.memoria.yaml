  description: 《英雄》（）改編夫差與勾践的故事。是文化传媒、上影、海润影视等联合出品的一部大型历史电视连续剧集，A&B Film Enterprises
    Limited 海外獨家發行。由赖建国导演，主演為郑嘉颖，谢天华，颖儿，朱孝天，张立昕等。於2011年12月18日至2012年3月15日期間拍摄。2013年4月23日於台灣華視首播。
