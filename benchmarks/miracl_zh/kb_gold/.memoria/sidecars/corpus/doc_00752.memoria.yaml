  name: 宁武 (政治人物)
  tags:
  - 宁武
  - (政治人物)
  description: 1943年初，在中共中央南方局的支持下，中国国民党民主派人士组织“民主同志座谈会”，参加者有朱蕴山、宁武、高崇民、马寅初、潘震亚、王卓然等人。同年8月，参加座谈会者决定建立中国国民党民主派组织。他们首先成立了10人筹备小组，但该小组并不仅限10人，宁武、邓初民、高崇民等人均参加过该小组会议。小组会议拟定组织名称为“三民主义同志联合会”（简称“民联”），以孙中山“联俄、联共、扶助农工”三大政策及“国民党一大宣言”为政治主张。
