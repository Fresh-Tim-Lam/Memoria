  name: 蜘蛛侠系列电影
  tags:
  - 蜘蛛侠系列电影
  description: 截至2021年，蜘蛛侠系列电影先后有11部，當中的主角蜘蛛侠是漫威公司出版漫画小说中的一个虚构超级英雄角色，自创建以来已经先后出现在5部电影中。第一部是1977年在哥伦比亚广播公司首播的电视电影《蜘蛛侠》，之后还在有海外的电影院进行放映，尼古拉斯·哈蒙德扮演蜘蛛人，E·W·斯瓦克汉默执导。
