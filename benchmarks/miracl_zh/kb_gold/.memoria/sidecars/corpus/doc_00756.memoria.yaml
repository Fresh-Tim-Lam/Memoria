  name: 清朝历史
  tags:
  - 清朝历史
  description: 1635年，皇太极打败林丹汗，取得了传国玉玺。漠南蒙古各部向后金臣服，为其上尊号博格达汗。崇德元年四月十一乙酉日（1636年5月15日），皇太极改国号为“大清”，改元崇德，皇太极是大清帝国的实际建立者和开国皇帝。
