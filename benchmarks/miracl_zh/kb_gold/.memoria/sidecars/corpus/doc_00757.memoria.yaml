  name: 繼承者們
  tags:
  - 繼承者們
  description: 《繼承者們》（，），全名《欲戴王冠，必承其重－繼承者們》（）為韓國SBS電視台自2013年10月9日起播出的水木迷你連續劇，由朴信惠、李敏鎬及金宇彬主演，《戀人啊》、《老千》、《Midas》的姜信孝導演與《戀人系列》、《秘密花園》、《紳士的品格》的金銀淑作家合作打造。劇情講述平凡現實的貧窮繼承者車恩尚（朴信惠
    飾）與上流社會1%的繼承者金嘆（李敏鎬 飾）和崔英道（金宇彬 飾）邂逅後所展開的浪漫羅曼史，是一部描繪富家子弟高中生們之間愛情與友情的青春偶像劇。
