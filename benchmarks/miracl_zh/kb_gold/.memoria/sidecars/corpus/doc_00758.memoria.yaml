  description: 南沙群島地理上位於北緯3度40分到11度30分和東經109度30分到117度50分之間，南北長500多海里，東西寬400多海里，總面積82萬平方海里，由230多個島、礁、沙洲、暗沙和灘組成，露出水面的約佔總數的1/5，目前已定名的約192個，總陸地面積約16平方公里。
