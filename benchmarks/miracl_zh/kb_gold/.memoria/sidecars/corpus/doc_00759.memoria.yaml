- id: 3524312#6
  name: 联合国主要机构
  tags:
  - 联合国主要机构
  description: 安全理事會由15個成員國組成，其中現在5個常任理事國：中國、美國、联合王国、法國、俄羅斯联邦；十個非常任理事國，現任國家有：波士尼亞和黑塞哥維那、巴西、哥倫比亞、加蓬、德國、印度、黎巴嫩、尼日利亞、葡萄牙和南非。五個常任理事國擁有對的否決權；因此，任一常任理事國能夠否決它們不接受的決議，但不能阻止對這項決議的討論。十個非常任理事國任期兩年，在確保區域平衡的前提下由聯合國大會選舉產生。有70多个联合国会员国从未担任安理会理事国。安理會主席一職按理事國國名英語字母順序每月輪換。
