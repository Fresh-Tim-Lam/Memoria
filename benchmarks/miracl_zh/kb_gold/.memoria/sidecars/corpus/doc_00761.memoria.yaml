- id: 3564490#0
  name: 台灣鐵路
  tags:
  - 台灣鐵路
  description: 臺灣鐵路（簡稱臺鐵）是臺灣鐵路管理局直營的鐵路線之總稱，為臺灣主要的鐵道運輸系統，最早於1891年開始營運。目前由西部幹線、東部幹線、南迴線等3條幹線，以及10條客貨運支線所組成。採用1067mm（窄軌）軌距，並沿用日治時期靠左行駛的規則，與今日台灣道路通行方向不同。臺灣民間口語所稱的「火車」或「搭火車」多指該鐵路系統。
