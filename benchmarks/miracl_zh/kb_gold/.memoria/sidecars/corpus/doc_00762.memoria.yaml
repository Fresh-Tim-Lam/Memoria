- id: 3583487#2
  name: 海上民族
  tags:
  - 海上民族
  description: 海上民族组成复杂，然而埃及的记录显示了以下族群：丹雅人（Denyen），赫梯人识别他们为阿达纳人（Adana），可能起源于北部叙利亚和土耳其交界地带。他们也被相信在塞浦路斯岛定居。他们在公元前1207年拉姆西斯三世统治时期，联合利比亚人和其他海上民族攻击了埃及。埃及第二十王朝允许他们居住在迦南，到公元前第11世纪，迦南大部被海上民族控制。他们也被认为可能是希腊人（亚该亚人）。有学者认为丹雅人联合希伯来人形成以色列十二部落中的丹部落（Dan）。埃克维什（Ekwesh），可能是青
  range:
    start:
      line_hint: 1
      snippet: 海上民族
    end:
      line_hint: 3
      snippet: 有所联系。弗林德斯·皮特里（Flinders Petrie）提出的另一种理论将这个名字与克里特岛东部的扎克罗斯（Zakros）联系起来。其他一些学者也认为Teucri（一支古老的部落被认为居住在特洛伊南部的安纳托利亚西北部）可能就是特耶克。
