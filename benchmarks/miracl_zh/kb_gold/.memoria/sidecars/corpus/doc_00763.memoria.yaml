- id: 3604382#13
  name: 动力系统理论
  tags:
  - 动力系统理论
  description: 混沌理論是描述一些特定動態系統的特性，這些動態系統的狀態會隨時間而變化，而且和對其初始狀態有高度的敏感性（稱為蝴蝶效應），由於初始狀態的微擾會使狀態的誤差隨著時間呈指數的成長，因此混沌系統看似是隨機，但其實混沌系統是一個確定系統，其未來的動態特性是由初始狀態所完全決定，沒有隨機的因素在內。
