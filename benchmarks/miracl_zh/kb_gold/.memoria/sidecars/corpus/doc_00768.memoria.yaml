- id: 3739526#0
  name: 石油巨头
  tags:
  - 石油巨头
  description: 石油巨头（）一般指世界上資本或企業規模巨大的石油集團公司，而最大的五至六家石油集團公司，亦被称为“石油超級巨頭”（或），包括英国石油公司、埃克森美孚公司、荷兰皇家壳牌、雪佛龙石油公司、康菲石油公司和道达尔石油公司等等，有时也被描述为形成影響美國國會的石油幫集团的一部分。
