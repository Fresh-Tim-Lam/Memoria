  name: 玉兔号月球车
  tags:
  - 玉兔号月球车
  description: 2003年，中国已经开始月球机器人的研制工作。2008年，月球车的样机通过验收。中国的多家单位提供了十几种月球车方案，最终选中的是航天科技集团第五研究院主要负责研制的月球车。2013年，月球车的研制完成。同年11月，国家国防科技工业局宣布将中国首辆月球车命名为“玉兔号”。
    2013年12月2日1时30分，搭载玉兔号月球车的嫦娥三号月球探测器从西昌卫星发射中心成功发射。經過14天航程後，嫦娥三号搭载玉兔号月球车于12月14日21時12分软着陆于预定的虹湾地区，12月15日凌晨4
  range:
    start:
      line_hint: 1
      snippet: 玉兔号月球车
    end:
      line_hint: 3
      snippet: 星发射中心成功发射。經過14天航程後，嫦娥三号搭载玉兔号月球车于12月14日21時12分软着陆于预定的虹湾地区，12月15日凌晨4时35分，玉兔号月球车从嫦娥三号着陆器上走下来，成为自1973年苏联的月球车2号以来首次踏上月球表面的月球车。
