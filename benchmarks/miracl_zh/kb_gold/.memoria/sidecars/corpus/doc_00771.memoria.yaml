  name: 江苏省沿江城市群城际轨道交通网
  tags:
  - 江苏省沿江城市群城际轨道交通网
  description: 江苏省沿江城市群城际轨道交通网是江苏省上报中国国家发改委批准的城际轨道交通线路网，规划范围包括南京都市圈、苏锡常都市圈和沪宁沿线地区等三部分，涉及南京、镇江、常州、无锡、苏州、扬州、泰州、南通等8个江苏城市。
