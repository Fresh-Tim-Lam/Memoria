- id: 3825941#5
  name: 北京申办2022年冬奥会计划
  tags:
  - 北京申办2022年冬奥会计划
  description: 2015年7月31日，第128届国际奥委会全体会议在马来西亚吉隆坡举行。当天下午，国际奥委会主席巴赫宣布：中国北京获得2022年第24届冬季奥林匹克运动会举办权。北京也创造历史，成为第一个既获得过夏奥会举办权又获得过冬奥会举办权的城市。
