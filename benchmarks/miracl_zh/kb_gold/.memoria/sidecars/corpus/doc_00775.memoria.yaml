  name: 北京申办2022年冬奥会计划
  tags:
  - 北京申办2022年冬奥会计划
  description: 按照计划，北京将同临近的河北省张家口市联合举办该届冬奥会。总体构想是沿北京（市区）-延庆-张家口一线，分三个区域布局竞赛场馆和非竞赛场馆，建设三个相对集聚的场馆群。
