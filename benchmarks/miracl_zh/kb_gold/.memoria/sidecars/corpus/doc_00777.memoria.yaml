- id: 3893007#1
  name: 人皆生而平等
  tags:
  - 人皆生而平等
  description: 1776年，第二次大陆会议指派了本杰明·富兰克林、托马斯·杰弗逊、约翰·亚当斯、罗伯特·李维顿、罗杰·谢尔曼五人撰写《独立宣言》。五人一致同意由托马斯·杰弗逊起草全文。杰弗逊起草完毕后交由富兰克林校对。富兰克林提出了少数改动，其中一处尤为突出。杰弗逊原本写道：“我们认为以下真理是神圣而不可否认的...”富兰克林将其改为：“我们认为以下真理是不言而喻的。”
    《美国独立宣言》的开头宣告如下：
