  name: 香港航空貨運
  tags:
  - 香港航空貨運
  description: 香港航空貨運以香港為基地，航線包括由香港至中國的鄭州、北京、上海、海口、昆明、哈爾濱、桂林、太原、杭州、南京、成都、重慶、福州、貴陽、海拉爾、廈門；日本的沖繩
    ；東南亞的曼谷、河內、峇里島、布吉、；臺灣的臺北等，配合客機腹艙載貨運力，確保提供最高品質的貨運服務。
