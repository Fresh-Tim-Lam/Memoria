  name: 明朝文学
  tags:
  - 明朝文学
  description: 明朝杂剧分为二个时期，以明武宗正德年间作为分界线。前期是统治阶级的附庸，没有现实内容，纯粹歌功颂德，充满了道德说教，代表性人物是：朱有燉、贾仲明、王子一、刘东生，代表性作品有：《黑旋风仗义疏财》、《关云长义勇辞金》。第二个时期的明朝杂剧则非常优秀，代表性人物有：康海、王九思、徐渭，康海的《中山狼》、王九思的《杜甫游春》，借古讽今、鞭挞社会黑暗、抨击腐败当局。徐渭的《四声猿》是明朝杂剧的最高成就，被誉为“明曲第一”，它由四个独立的剧目组成，《狂鼓吏》（祢衡）、《玉蝉师》（月明和
  range:
    start:
      line_hint: 1
      snippet: 明朝文学
    end:
      line_hint: 3
      snippet: 为“明曲第一”，它由四个独立的剧目组成，《狂鼓吏》（祢衡）、《玉蝉师》（月明和尚度柳翠）、《雌木兰》（花木兰）、《女状元》（黄春桃）。《四声猿》取自古代巴蜀民谣“巴东三峡巫峡长，猿鸣三声泪沾裳”，有悲愤、轻礼法、疾世俗的精神，语言豪迈奔放。
