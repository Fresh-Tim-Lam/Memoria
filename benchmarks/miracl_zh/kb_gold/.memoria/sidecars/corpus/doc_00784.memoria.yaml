  name: 纽约市摩天大楼列表
  tags:
  - 纽约市摩天大楼列表
  description: 从2003年至今，纽约市共有24座高度超过的建筑完工。包括全美最高建筑的世贸中心一号楼，另有12栋在建大楼。世贸中心一号楼是重建世界贸易中心计划的一部分，此外还有高的三号楼、高的四号楼、高的七号楼以及仍在興建的建筑：高的二号楼。
