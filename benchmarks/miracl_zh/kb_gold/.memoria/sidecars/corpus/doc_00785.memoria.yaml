- id: 3948549#4
  name: 纽约市摩天大楼列表
  tags:
  - 纽约市摩天大楼列表
  description: 纽约在摩天大楼的发展史上扮演者重要的角色；自1890年起，坐落于该市的建筑中共有11座夺得过世界最高楼的称号。纽约市早在20世纪10年代初到30年代初就经历了一场建设高楼的热潮，该市前82高的大楼中有16座都是在这一时期修建完成的，这其中就包括伍爾沃斯大樓、曼哈顿信托银行大楼、克萊斯勒大廈和帝国大厦，它们在各自建成之时都成为了世界最高楼，而帝国大厦则保持这一称号长达40年。
