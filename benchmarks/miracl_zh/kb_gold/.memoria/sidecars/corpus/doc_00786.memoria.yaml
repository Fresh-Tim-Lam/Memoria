      snippet: 年签约日本愛貝克思唱片，成为其独家创作艺人，这一年他卖出第一支作品《醉青楼》，被台灣歌手范逸臣演唱；2008年参与制作演員赵薇专辑《我们都是大导演》，并担任演員陈坤专辑《谜：ME》的专辑制作人；2011年开始担任公益项目行走的力量音乐总监。
