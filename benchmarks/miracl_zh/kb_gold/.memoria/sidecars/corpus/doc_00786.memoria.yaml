  description: 李荣浩经历过严重的意外车祸，在医院休养了1年多；出院后不久父亲因白血病离世，他带着母亲到北京通过给其他人写歌、制作音乐以償還債務；2004年，接受人生中第一次专访，在音乐杂志《吉他平方》上发表吉他单曲《烦》；2005年接受音乐杂志《现代乐手》专访并发表单曲《DREAM》；同年9月担任《我的音乐梦想》系列吉他丛书主编，后正式成为吉他中国乐手；同年签约日本愛貝克思唱片，成为其独家创作艺人，这一年他卖出第一支作品《醉青楼》，被台灣歌手范逸臣演唱；2008年参与制作演員赵薇专辑《我们
