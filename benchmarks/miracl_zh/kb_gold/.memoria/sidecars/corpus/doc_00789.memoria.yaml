  name: 无法满足
  tags:
  - 无法满足
  description: 一些乐评人认为该曲是史上最伟大的摇滚歌曲之一。2004年，《滚石》杂志将其列为“史上最伟大的500首歌曲”第二位。它在2006年因其“在文化、历史或美学上的重要意义”被收入美国国会图书馆的典藏。
