- id: 4100213#0
  name: 社会主义国家列表
  tags:
  - 社会主义国家列表
  description: 社会主义国家列表列出了過去及目前根据其宪法或法律定义为實行社会主义的國家。大部分社會主義國家受到蘇聯的影響而實施馬克思列寧主義。他們使用大致相同的“社會主義”定義，在通往共產主義的道路上稱自己為社會主義國家。出於這個原因，西方人士大多稱之為“共產主義國家”（雖然社會主義國家本身並不使用這個名字）。历史上共出现过几十个社会主义国家。法定的社会主义国家并不一定实际实行社会主义的社会经济制度。目前，世界上共有13個國家在憲法中規定本國實行社會主義制度，其中4个是以马列主义为指导意识
  range:
    start:
      line_hint: 1
      snippet: 社会主义国家列表
    end:
      line_hint: 3
      snippet: 主义国家。法定的社会主义国家并不一定实际实行社会主义的社会经济制度。目前，世界上共有13個國家在憲法中規定本國實行社會主義制度，其中4个是以马列主义为指导意识形态的国家（这4个国家都以共产党为法定执政党）：中华人民共和国、越南、老挝、古巴。
