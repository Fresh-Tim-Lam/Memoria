  name: 南马
  tags:
  - 南马
  description: 马来西亚半岛的最南端丹绒比艾便位于柔佛州。而这里也是亚洲大陆的“终点”。之所以不是新加坡而是马来西亚，是因為新加坡严格来说不属于亚洲大陆，而是一个岛国，因此大马最南端自然是在柔佛州而非新加坡。
