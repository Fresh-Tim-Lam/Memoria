  name: 莱昂纳多·迪卡普里奥作品名单
  tags:
  - 莱昂纳多·迪卡普里奥作品名单
  description: 1997年，迪卡皮歐出演詹姆斯·卡梅隆执导的《泰坦尼克号》，与凯特·温丝莱特演对手戏，该片创下史上票房最高的电影纪录，一直保持了十余年才被卡梅隆下一部导演的2009年电影《阿凡达》超越，迪卡皮歐也因该片在全球范围内声名鹊起，他还因该片获MTV电影大奖最佳男演员奖，并得到了第一个金球奖最佳电影男主角奖（正剧类）提名。
