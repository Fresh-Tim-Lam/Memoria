      snippet: 任女主角。接下来他又导演了另一部科幻片《深渊》。1991年，卡梅隆推出《终结者》的续集《终结者2：审判日》，施瓦辛格回归出演男主角，这年他还为动作犯罪片《惊爆点》担任执行制片人。3年后，卡梅隆执导了第3部由施瓦辛格主演的电影《真实的谎言》。
