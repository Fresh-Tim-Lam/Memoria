  description: 詹姆斯·卡梅隆是加拿大电影导演、编剧兼制片人，在电影和电视领域有广泛涉猎。卡梅隆的处女作是1978年的科幻短片《克赛诺起源》（），他亲自担任导演、编剧和制片人。卡梅隆从业早期做过各种技术性工作，如视觉特技制作、梳妆台助手、亚光画师和摄影师。他导演的首部长片电影是1981年上映的《食人鱼2：繁殖》（）。接下来他又执导了1984年的科幻动作惊悚片《终结者》，阿诺·施瓦辛格主演，这是两人的首度合作，也是卡梅隆的成名作。1986年，他编剧并导演的科幻动作续集电影《异形2》上映，出演前
  range:
