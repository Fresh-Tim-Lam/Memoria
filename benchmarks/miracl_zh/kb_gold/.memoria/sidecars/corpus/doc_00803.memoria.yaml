  description: 1997年，编剧、导演并亲自担任制片人的爱情灾难片《泰坦尼克号》上映，全球票房超过18.4亿美元，刷新了世界电影票房纪录。卡梅隆则在第70届奥斯卡颁奖典礼上获得最佳影片、导演和剪辑3项大奖。影片一共得到14项提名，追平了1950年的剧情片《彗星美人》所创纪录；最终11项获奖又追平了1959年史诗剧情片《賓漢》的纪录。卡梅隆还在第55届金球奖角逐中拿下了最佳影片奖（正剧类）和最佳导演奖。接下来他导演并监制了两部水下题材纪录片，分别是2003年的《深渊幽灵》（）和2005年的《深
