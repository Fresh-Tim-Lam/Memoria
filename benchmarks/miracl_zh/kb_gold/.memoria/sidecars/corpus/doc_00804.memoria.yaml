      snippet: 。2012年，他担任执行制片人并在其中出镜的《詹姆斯·卡梅隆：再见泰坦尼克》发行，这已是他参与制作的第3部和泰坦尼克号有关的纪录片。两年后，卡梅隆担任气象变化题材电视剧《多灾凶年》（）面世，该剧获得黄金时段艾美奖杰出纪录片或非虚构类剧集奖。
