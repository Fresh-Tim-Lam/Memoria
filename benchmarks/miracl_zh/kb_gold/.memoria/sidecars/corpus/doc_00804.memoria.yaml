  description: 卡梅隆首次现身电视荧屏是1998年的情景喜剧《我为卿狂》（）。两年后，他担任执行制片人的科幻题材电视剧《末世黑天使》在美国播出，该剧由杰西卡·阿尔芭主演。2005年，他在两部有关泰坦尼克号沉船事故的纪录片中亮相，分别是《泰坦尼克号的最后谜团》（）和《托尼·罗宾逊的泰坦尼克号历险记》（）。同年，卡梅隆还在喜剧剧集《明星伙伴》中以真实身份出镜，此后又为两部圣经题材纪录片担任执行制片人，分别是2006年的《解密出埃及记》（）和2007年的《失落的耶稣之墓》（）。2012年，他担任执
