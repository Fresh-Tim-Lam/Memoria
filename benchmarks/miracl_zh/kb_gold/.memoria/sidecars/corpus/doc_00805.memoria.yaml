  name: 富兰克林半美元
  tags:
  - 富兰克林半美元
  description: 美国铸币局局长内莉·泰洛·罗斯是本杰明·富兰克林长期的崇拜者，希望能将这位开国元勋的形象铸印到硬币上。辛诺克曾于1933年设计了一枚带有富兰克林形象的奖章，可能正是这枚奖章让罗斯有了制作富兰克林形象硬币的想法。富兰克林本人反对在硬币上刻个人肖像，他主张在上面刻上谚语，给拥有硬币的人带来思考并因此获益。1948年，罗斯在接受采访时指出，富兰克林当时只知道有些硬币上会有在世的皇室贵族人物形象，对于共和国给硬币刻上已经过世的国父来做纪念想必不会有所反感。事实上，富兰克林有可能会对硬
  range:
    start:
      line_hint: 1
      snippet: 富兰克林半美元
    end:
      line_hint: 3
      snippet: 罗斯福，后者还与优生优育基金会密切相关。铸币局官员觉得行走自由女神半美元的设计看起来有些老气，虽然当时林肯1美分硬币的设计也已经到了可以更换的时候，但亚伯拉罕·林肯这时仍然是深受爱戴的人物，罗斯不希望自己担上将硬币上林肯形象抹去的負面觀感。
