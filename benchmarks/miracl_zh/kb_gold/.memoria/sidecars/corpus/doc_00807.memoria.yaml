  name: 2008年夏季奥林匹克运动会奖牌得主名单
  tags:
  - 2008年夏季奥林匹克运动会奖牌得主名单
  description: 2008年8月8日至24日，2008年夏季奥林匹克运动会在中华人民共和国首都北京市举行，来自204个国家和地区的约1万1028名运动员参赛。本届奥运会一共举办了28个大项，共302项赛事，其中165项为男子赛事，127项为女子赛事，10项为混合赛事，赛事总数比希腊雅典举办的2004年夏季奥林匹克运动会要多一项。
