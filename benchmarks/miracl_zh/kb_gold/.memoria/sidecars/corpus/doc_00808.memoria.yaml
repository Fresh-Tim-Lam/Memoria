- id: 4811584#17
  name: 2015年歐霸盃決賽
  tags:
  - 2015年歐霸盃決賽
  description: 西維爾最後靠著巴卡在下半場致勝的一球，以 3-2 四度奪冠。按國家排名上，西班牙職業球隊在歐霸盃奪冠次數也同時與義大利並列，同為 9
    次奪冠。西維爾隊長雷耶斯也成為首位四次奪冠歐霸盃的球員，包括他在2010年與2012年在馬德里競技，以及2014年在西維爾的時期。超越歷史上，三次奪冠歐霸盃的球員、朱塞佩·贝尔戈米、三人。
