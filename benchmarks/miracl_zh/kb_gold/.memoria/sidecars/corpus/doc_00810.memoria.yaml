  name: 英國鐵路運輸
  tags:
  - 英國鐵路運輸
  description: 身為鐵路技術的發源地，英國的鐵路運輸系統是世界歷史上最悠久的。現在英國共有約16,536公里長的標準軌鐵路路線，其中約4,928公里實現電氣化。英國的鐵路本來由眾多小規模民營地方鐵路公司組成。在19世紀至20世紀初期，通過各企業之間的收購，整合為幾個大規模企業。1921年鐵路法通過之後，英國的鐵路服務整合為四大鐵路公司。1920年代開始，由於開始發展，鐵路業界規模開始縮小。二戰之後，政府開始介入鐵路業界。1948年，四大鐵路公司被國有化，成為英國鐵路。1994年之後，英國鐵路
  range:
    start:
      line_hint: 1
      snippet: 英國鐵路運輸
    end:
      line_hint: 3
      snippet: 1994年之後，英國鐵路重新，並在1997完成。目前英國鐵路業界基本上是以經營（即土建設施與運輸服務分開經營），但多數又共同使用英國全國鐵路的品牌。现如今几乎所有英国的铁路均由欧洲大陆的国营铁路收购并运营，包括德国铁路、法国国铁和荷蘭鐵路。
