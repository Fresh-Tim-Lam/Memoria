      snippet: 有超过2万的漫画作品，认证作者超过9000，签约作者近500人，超过40部漫画点击次数过亿。2014年10月14日，腾讯影视旗下黑体工作室负责人陈英杰公布了腾讯展开制作的一批改编电影，包括《QQ炫舞》、《洛克王国》、《QQ飞车》、《尸兄》。
