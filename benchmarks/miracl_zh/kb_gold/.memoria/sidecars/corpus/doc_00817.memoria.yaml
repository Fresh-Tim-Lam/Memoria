  name: 亚美尼亚国家美术馆
  tags:
  - 亚美尼亚国家美术馆
  description: 上面提到的这段时期，博物馆由于得到了三个杰出收藏家的捐赠而极大的丰富了自己的所藏。罗马尼亚籍亚美尼亚艺术史学家G.扎姆巴赫强给博物馆送了一批珍贵的画，包括泰奥多尔·鲁索、纳尔西斯-维尔日勒·迪亚、、欧仁·布丹和A.贝纳尔等人的作品，这极大的丰富了博物馆内的法国画作。另一个罗马尼亚籍亚美尼亚藏家瓦汉·巴拉基安捐给博物馆很多著名罗马尼亚画家的画和平面作品，欧洲的版画，以及150件欧洲、俄罗斯和东方的装饰应用艺术品。1936年，在法国享有盛名的亚美尼亚图形艺术家将自己从巴黎寄到埃里
  range:
    start:
      line_hint: 1
      snippet: 亚美尼亚国家美术馆
    end:
      line_hint: 3
      snippet: 家的作品。M.萨良、文化事务部领导人A.沙希尼安、学者、博物馆馆长鲁本·德拉姆比扬和费奥多西亚艾瓦佐夫斯基画廊馆长等都参加了开幕仪式。在仅12天的展览吸引了45000人参考。1944年11月5日，这些画作全部回到了克里米亚的费奥多西亚画廊。
