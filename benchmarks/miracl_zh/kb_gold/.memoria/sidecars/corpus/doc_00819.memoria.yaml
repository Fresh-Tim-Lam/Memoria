  name: 立陶宛體育
  tags:
  - 立陶宛體育
  description: 立陶宛人和歐洲其他國家的人民類似，也喜歡看欧洲冠军联赛、國際足協世界盃及其他世界一流的足球比賽。 橄欖球是在1960年代引進立陶宛，當時在考那斯和维尔纽斯有球隊。近二十年來，北部的希奥利艾成為立陶宛橄欖球的中心，當地有二個最強的球隊，Regbio
    klubas Vairas曾獲得多次的立陶宛冠軍，而Šiauliai BaltRex幾乎都是亞軍。立陶宛國家橄欖球隊在歐洲橄欖球聯盟的2A區比賽。國際橄欖球明生Laurynas
    Tipelis也在立陶宛國家橄欖球隊打球，曾保持有連續
  range:
    start:
      line_hint: 1
      snippet: 立陶宛體育
    end:
      line_hint: 3
      snippet: 橄欖球隊在歐洲橄欖球聯盟的2A區比賽。國際橄欖球明生Laurynas Tipelis也在立陶宛國家橄欖球隊打球，曾保持有連續十八場國際比賽勝利的紀錄。連續勝利從2006年開始，在2010年立陶宛在世界杯資格賽時，輸給等級更高的烏克蘭而結束。
