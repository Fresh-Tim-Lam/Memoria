- id: 5298515#31
  name: 基督教原始主義
  tags:
  - 基督教原始主義
  description: 後期聖徒運動的追隨者相信其創辦人約瑟·斯密是神的先知，他被揀選去恢復原初耶穌所建立的使徒教會。正如一般的復原主義者群體，摩爾門教徒相信，於使徒時代末期和公元325年第一次尼西亞會議之前，耶穌建立的教會和祭司職位已從地上撤回了。改革宗信徒的運動強調建基於聖經研讀，但斯密宣稱要恢復啟示和使徒權柄。根據Allen
    and Hughes表示後期聖徒比其他群體更有效和始終如一地用到「恢復」這個語言，早期的摩爾門教徒似乎沉醉於恢復古老的教會。
