  name: 贾跃亭
  tags:
  - 贾跃亭
  description: 2006年开始，中国大陆地区视频网站大量出现，土豆、优酷、酷6相继成为行业领头羊，这些公司分别获得创业投资，在美国上市。乐视网于2010年6月首发通过，8月登陆创业板，公开发行股票2500万股，总股本1亿股，发行价29.20元/股。乐视网也成为中国IPO股票中第一个网络视频公司。当时，乐视网在中國国内网站流量排名中位于168位，远远落后于优酷的第10位、土豆的第12位。就在乐视上市前10天，流量排名远在乐视之前的酷6网借壳华友世纪实现纳斯达克上市，但纳斯达克对酷6网的估价不到
  range:
    start:
      line_hint: 1
      snippet: 贾跃亭
    end:
      line_hint: 3
      snippet: 过了100%。然而2017年10月30日，多家媒体报道称，乐视网IPO财务造假，参与乐视网IPO审核的多位前发审委委员近期被调查。华兴资本CEO包凡(微博)在这篇报道中指出：“一个排名第17位的视频网站，却有业内第一的财务指标，变戏法啊。”
