- id: 5359336#9
  name: 河北省经济
  tags:
  - 河北省经济
  description: 河北省是中国农业大省，是小麦、棉花和玉米的重要产地，冀东平原盛产优质稻米。近20年畜牧业发展迅速，三河县是香港牛肉生牛的主要供应地。辛集是全国重要的皮革集散地之一。坝上的“张北马”是优良的役畜，清河是全国主要羊绒产品集散地，安国是重要的中药材市场。
