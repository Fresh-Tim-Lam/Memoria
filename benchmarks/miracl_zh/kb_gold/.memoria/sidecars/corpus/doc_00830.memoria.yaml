      snippet: 领袖与助理少数党领袖（常被称为参议院多数党党鞭与少数党党鞭），他们是各自政党在参议院的二把手。其主要职责为在重要议题上分别帮助两党拉票。而当政党领袖不在时，他们可能会成为代理政党领袖。1969年之前，多数党党鞭与少数党党鞭是他们的官方称呼。
