- id: 5489950#3
  name: 阿根廷国家参议院
  tags:
  - 阿根廷国家参议院
  description: 参议院拥有众议院所没有的特别权利。包括宣战权、任命由总统提名的法官、驻外大使、军队高级将领以及推动联邦性税务法。此外还负责弹劾众议员，因为参议院的议员在职时间更长，人数更少所以其本身被认为是一个比众议院更为严谨的机构。
