- id: 5494892#1
  name: 波兰旗帜列表
  tags:
  - 波兰旗帜列表
  description: 大多数波兰旗帜均为波兰国家代表色白色与红色构成。国家代表色于1831年正式采用，源自历史纹章，取至波兰国徽及立陶宛国徽的颜色。一些旗帜亦使用波兰国徽中的白鹰，一些军队使用的旗帜则使用军鹰（国徽的衍生形式）。
