  name: 波兰旗帜列表
  tags:
  - 波兰旗帜列表
  description: 波兰国旗的基本形式为红白二色二条横旗。带国徽的旗帜变体仅限于海外官方使用及海上使用。虽然法律对于国旗使用方式作出了规定，在现实中这两种旗帜仍时常互换使用。
