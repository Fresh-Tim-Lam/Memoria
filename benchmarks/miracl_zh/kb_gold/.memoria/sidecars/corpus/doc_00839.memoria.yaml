- id: 5542384#12
  name: 江苏地理
  tags:
  - 江苏地理
  description: 除了天然河流以外，江苏省的人工河道也极为众多，包括中运河、里运河、大运河等。其中京杭大运河纵贯南北达690公里，江苏省有8座地级市均位于京杭大运河沿线，占全部地级市数量（13个）的60%以上，孕育了苏州、淮安、无锡、镇江、扬州、徐州六座中国历史文化名城。此外，江苏省著名的人工河道尚有苏北灌溉总渠、通扬运河等。
