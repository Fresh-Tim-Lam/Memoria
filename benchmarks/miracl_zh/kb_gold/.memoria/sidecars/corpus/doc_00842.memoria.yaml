  name: 满洲国外交
  tags:
  - 满洲国外交
  description: 1932年3月1日，滿洲國政府發布《建國宣言》，正式成立滿洲國，首都長春（後改名为新京），領土範圍包括現今遼寧、吉林和黑龍江3省全境，以及內蒙古東部、河北承德。随后，满洲国外交总长谢介石向日、美、英、法、德、意、苏等17个国家发出通告，希望建立外交关系。
