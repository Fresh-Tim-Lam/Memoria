  name: 張小龍
  tags:
  - 張小龍
  description: 2010年底，张小龙给腾讯董事长马化腾发出一封邮件，他认为移动互联网领域的即时通讯软件米聊、TalkBox 語音聊、Kik、Whatsapp等层出不穷，将来会有一个新的通讯工具，建议腾讯做移动社交软件，而这种新的通讯工具很可能会对QQ造成很大威胁。2010年11月19日，微信项目正式启动，当时最初的人员均来自QQ邮箱团队，并没有设计手机客户端的经验。
