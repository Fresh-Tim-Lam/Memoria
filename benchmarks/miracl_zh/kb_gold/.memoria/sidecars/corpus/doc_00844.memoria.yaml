- id: 5607458#3
  name: 鱼雷巡洋舰
  tags:
  - 鱼雷巡洋舰
  description: 德国海軍參謀本部对于鱼雷巡洋舰的热情，尤以列奧·馮·卡普里維海军中将主政时为甚。在此期间，德国海军共建造了8艘这种舰艇，用来与更小一些的鱼雷艇组成分队共同行动，配合水雷区和岸防炮进行防御。一艘典型的德国鱼雷巡洋舰通常包括3具鱼雷发射管，舰艏一具，中部两舷各一具；同时还装设有两门中口径火炮，分别一前一后安设，提供一定的火炮火力。此外在舷侧突出部还安装有一些小口径火炮，用以在面对鱼雷艇一类的小型舰艇时进行自卫。
