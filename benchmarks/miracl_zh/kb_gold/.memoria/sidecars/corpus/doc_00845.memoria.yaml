- id: 5609969#40
  name: 新约的历史背景
  tags:
  - 新约的历史背景
  description: 这种对耶稣被钉十字架和复活的新解释的基础可在保罗书信和使徒行传中找到。大多犹太人认为保罗是基督教的创始人，他在基督教与犹太教的分裂上负有责任。最近，塔木德学者丹尼尔·博阿林（Daniel
    Boyarin）认为，保罗的灵性神学比一般认为的更根植于希腊犹太教。在《一个激进的犹太人》中，丹尼尔·博阿林认为，使徒保罗将耶稣的生活与希腊哲学结合起来，重新以柏拉图关于理念（真实的）与物质（虚假的）的对立来解释了希伯来圣经；（另见Paul
    the Apostle and Judaism）。
  range:
    start:
      line_hint: 1
      snippet: 新约的历史背景
    end:
      line_hint: 3
      snippet: 保罗在复活耶稣的象征中看到了属灵的而不是肉体的弥赛亚。他用这个弥赛亚观念建立了一种宗教，在这个教派中，所有的人——不仅是亚伯拉罕的后裔——都可以崇拜亚伯拉罕的神。不像犹太教认为自己是犹太人的本质宗教一样，保罗的基督教声称是这是所有人的宗教。
