- id: 5613124#4
  name: 中国人民政治协商会议全体会议
  tags:
  - 中国人民政治协商会议全体会议
  description: 1952年10月，刘少奇率领中共代表团出席苏共十九大。按照毛泽东的要求，刘少奇于10月20日通过书信向斯大林“请示”几个问题。按照《中国人民政治协商会议组织法》，中国人民政治协商会议全体会议每三年开会一次，所以自1949年开会之后，应在1952年召开第二次全体会议。刘少奇在信中陈述的上述情况，并称“如果在最近不召开人民政协的第二次全体会议，那就应该在明年或至迟后年召开第一次全国人民代表大会。因为人民政协在全国有很好的信誉，各民主党派也愿意召开人民政协，而不积极要求召开全国人民
  range:
    start:
      line_hint: 1
      snippet: 中国人民政治协商会议全体会议
    end:
      line_hint: 3
      snippet: 表大会推到三年以后去召开。”刘少奇在信中还表示，在目前过渡时期可暂不制定《中华人民共和国宪法》，而以《中国人民政治协商会议共同纲领》代替宪法，且可不断修改《中国人民政治协商会议共同纲领》，待中国基本进入社会主义后，再制定社会主义性质的宪法。
