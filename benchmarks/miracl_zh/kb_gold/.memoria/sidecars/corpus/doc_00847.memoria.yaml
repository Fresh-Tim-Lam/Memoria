  name: 北京公交318路
  tags:
  - 北京公交318路
  description: 每年的10月中旬，位于北京市海淀区的香山公园会举办一年一度的香山红叶节，游客们可在公园内欣赏到漫山遍野的红叶景观。从地铁古城站C口出站，乘坐318路可直达终点香山站。
