  name: 中国网络视听节目服务协会
  tags:
  - 中国网络视听节目服务协会
  description: 截至2016年，中国网络视听节目服务协会有会员单位672家，其中包括中央人民广播电台、中国国际广播电台、中国中央电视台、浙江电视台、湖南电视台等广电播出机构，人民网、新华网、中国网等国家级媒体网站，腾讯、阿里巴巴、百度、爱奇艺、优酷、搜狐、小米、暴风等互联网企业，中兴通讯、华为等技术公司，涵盖了网络视听行业全产业链。
