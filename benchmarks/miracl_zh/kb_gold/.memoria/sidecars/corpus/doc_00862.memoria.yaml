- id: 5768680#5
  name: 2017年九寨沟地震
  tags:
  - 2017年九寨沟地震
  description: 专家分析称，此次地震并不在汶川大地震的余震期内，因此与2008年发生的汶川地震没有实际联系，但两次地震成因相同：印度板块向欧亚大陆板块的俯冲，造成青藏高原的快速隆起，进而导致了地震的发生。地震局专家判断，此次地震发生在岷江断裂带与东昆仑断裂带东部交汇地带。
