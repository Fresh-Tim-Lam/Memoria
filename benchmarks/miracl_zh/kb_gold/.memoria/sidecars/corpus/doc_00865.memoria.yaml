- id: 5867679#0
  name: 翻筋斗
  tags:
  - 翻筋斗
  description: 翻筋斗（somersault）也稱為翻觔斗、翻跟頭、空翻，是一種體育動作，是一個人旋轉一圈，過程中腳要越過頭部。翻筋斗可以是往前的、往後的、或是側面的，可以在空中旋轉，也可以在地面旋轉，但當中都會有頭下腳上的瞬間。若是跳躍在空中旋轉，理想上旋轉後要著地恢復站立姿勢。若是在地面上的旋轉，也可以稱為。
  range:
    start:
      line_hint: 1
      snippet: 翻筋斗
