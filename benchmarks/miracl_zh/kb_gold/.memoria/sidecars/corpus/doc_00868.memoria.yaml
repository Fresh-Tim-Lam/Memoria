  name: 天雄军节度使
  tags:
  - 天雄军节度使
  description: 魏博軍節度使，唐末為天雄軍節度使，是唐朝在今河北地区设置的節度使，唐末到五代割据河北魏博（今邯鄲）一帶，为河北三镇之一。在8世纪末是河北三镇的首领，9世纪衰落。
