  name: 腾讯相关争议
  tags:
  - 腾讯相关争议
  description: 王者荣耀是中国大陆最受欢迎的手机游戏，一些人极度沉迷于游戏当中，导致猝死。这种现象也引起了游戏官方的注意。为解决这个问题，腾讯自7月4日起，在《王者荣耀》游戏采取防沉迷措施，基于游戏累计时长或单次时长对玩家进行相应提醒、下线等操作，实现防止沉迷游戏的目的。其中12周岁以下（含12周岁）未成年人每天限玩1小时，并计划上线每日21时以后禁止登录功能；12周岁以上未成年人每天限玩2小时，超出时间的玩家将被游戏强制下线；每日凌晨5时刷新累计时长以及登录时间。此外，《王者荣耀》将增加“
  range:
    start:
      line_hint: 1
      snippet: 腾讯相关争议
    end:
      line_hint: 3
      snippet: 者榮耀》方面表示，未來會將實名認證系統進一步強化，並配合相關部門進行身份真實性的校驗。此外，腾讯亦會將相關「家長監護」功能，直接綁定在硬件設備上，令家長可以透過設備而不是帳號，來管理孩子的玩樂時間，同時亦可避免他們透過多帳號登錄來規避限制。
