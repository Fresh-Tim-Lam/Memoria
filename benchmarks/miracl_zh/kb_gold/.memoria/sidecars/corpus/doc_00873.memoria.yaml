- id: 6041159#0
  name: 基督教象徵
  tags:
  - 基督教象徵
  description: 基督教象徵是指用於象徵基督宗教思想的標誌，包括標誌、行為、藝術品、事件等。早期的基督教象徵僅用於讓教會成員相互知道彼此身份，但隨著基督教在四世紀時合法化，更多標誌開始使用。最著名的基督教象徵有十字架、耶穌魚、好牧羊人等。
