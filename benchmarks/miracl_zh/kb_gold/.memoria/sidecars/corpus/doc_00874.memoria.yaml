  name: 拿破仑时代
  tags:
  - 拿破仑时代
  description: 拿破仑的法兰西第一帝国解体于1812年，当时拿破仑决意入侵俄国，但却低估了其部队可能遭遇的挑战。拿破仑确信沙皇正在与英国密谋，因此亲自率领
    60 万大军远征莫斯科，并在莫斯科近郊的博罗季诺击败了俄军。但沙皇早已撤离并烧毁了莫斯科，这使得拿破仑的庞大军队既得不到充分的补给，也没有躲避寒冬的营地。拿破仑只得下令撤退，但俄罗斯的严冬和俄军无休止的骚扰击垮了他的军队，最后只有3万人的部队成功回到法国。各国重新结成反法同盟，终于在1814年攻克巴黎迫使拿破仑退位。1815年拿破仑复辟，
  range:
    start:
      line_hint: 1
      snippet: 拿破仑时代
    end:
      line_hint: 3
      snippet: 退，但俄罗斯的严冬和俄军无休止的骚扰击垮了他的军队，最后只有3万人的部队成功回到法国。各国重新结成反法同盟，终于在1814年攻克巴黎迫使拿破仑退位。1815年拿破仑复辟，反法同盟旋即重新成立，拿破仑又在滑铁卢被以英国为首的联军部队最终击败。
