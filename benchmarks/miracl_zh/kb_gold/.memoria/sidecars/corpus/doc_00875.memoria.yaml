- id: 6104071#2
  name: 宝塔山公园
  tags:
  - 宝塔山公园
  description: 2018年，该公园票价为15元。每年3、4月樱花盛开，实为赏樱之佳处。 沿途遍植樱花，还能看到与日本一些友好城市的纪念牌。 全园唯一一株绿色樱花，花期3月底至4月初。花叶同开，重瓣，约15枚，直径约4厘米。刚刚绽放时花色皆为浅绿色，后期外层花瓣会略带浅红色。
