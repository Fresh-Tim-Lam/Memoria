- id: 6110532#1
  name: Kindle自助出版
  tags:
  - Kindle自助出版
  description: 2007年底，Kindle自助出版首次公测。在此期间，亚马逊通过电子邮件与广告的方式来吸引作者加盟。2009年12月5日，在《纽约时报》的采访里，亚马逊CEO杰弗里·贝索斯透露说，Kindle电子书的销售收入中，亚马逊只会保留65%，而剩下的35%将分给亚马逊的作者和出版商。许多人发现，苹果商店会将70％的版税分给APP发布者，在此之后，亚马逊表示他们也会将70％的版税分给作者和出版商。
