- id: 6252990#2
  name: 七半
  tags:
  - 七半
  description: 二戰戰後初期，日本國內的廠商開始製造摩托车；1950年代中期，全國約有120多家摩托车製造商，主要生產小排氣量的摩托车，大排氣量摩托车市場仍被國外摩托车品牌佔據；1960年代末期，經營不善和生產技術不佳的廠商開始退出市場，最終只剩下本田、川崎、鈴木和山葉四家摩托车製造商。
