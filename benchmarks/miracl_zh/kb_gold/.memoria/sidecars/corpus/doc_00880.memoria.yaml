- id: 6265379#1
  name: 德语国家和地区列表
  tags:
  - 德语国家和地区列表
  description: 全世界有1.05億人是德語母語人士。此外，另外還有8000萬不在德語國家的人使用德語作為第二語言，大約16％的歐盟人口說德語。 全世界现共有6个独立的主权国家和意大利的波尔扎诺自治省以德语作为官方语言，这些国家和地区除了德语的发源地德国，绝大多数曾经是神圣罗马帝国的选帝侯，是德意志邦联的一部分。德语也是欧盟等欧洲一体化组织的重要官方语言。
