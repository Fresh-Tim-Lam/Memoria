      snippet: 发行期为13年，沿用江户时代的货币单位（两、分、朱），预计发行额为3000万两，并设置商法司作为货币发行机构。明治政府规定，用旧货币上缴赋税时，也要根据政府规定的旧币与太政官札的兑换比例折算，太政官札事实上已成为与贵金属脱钩的日本法定货币。
