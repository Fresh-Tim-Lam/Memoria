  name: 太政官札
  tags:
  - 太政官札
  description: 1868年，日本“王政复古”，明治天皇颁布《五条御誓文》，被视为明治维新的开始。为向民间提供资金，以达到“殖产兴业”的目的，明治政府接纳时任参与兼会计事物挂的建议，发行纸币。庆应四年（1868年）闰四月十九，明治政府发布公告，正式宣布发行太政官札。公告称，发行太政官札只是权宜之计，发行期为13年，沿用江户时代的货币单位（两、分、朱），预计发行额为3000万两，并设置商法司作为货币发行机构。明治政府规定，用旧货币上缴赋税时，也要根据政府规定的旧币与太政官札的兑换比例折算，太政官
  range:
    start:
      line_hint: 1
