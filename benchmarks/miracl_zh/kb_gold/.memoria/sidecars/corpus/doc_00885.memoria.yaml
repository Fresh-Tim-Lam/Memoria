  name: 玉兔二号月球车
  tags:
  - 玉兔二号月球车
  description: 2018年8月15日，由中国国家航天局探月与航天工程中心联合相关单位组织的探月工程嫦娥四号任务月球车全球征名活动启动仪式于北京正式启动。在随后的22天内，共收到提交名称42945个，去除重复提名后共14847个。经由航天科技方面专家、高校语言文化名人和国家主流媒体总编组成的23人评审委员会筛选后推荐了153个名称进入初审，选出“逐梦、光明、玉兔二号、探索、征途、精灵、无畏、望舒、行者、金兔”共10个名称，再于9月进行网络投票，共收到44万余票。在公众投票与专家评委投票加权计算
  range:
    start:
      line_hint: 1
      snippet: 玉兔二号月球车
    end:
      line_hint: 3
      snippet: 初审，选出“逐梦、光明、玉兔二号、探索、征途、精灵、无畏、望舒、行者、金兔”共10个名称，再于9月进行网络投票，共收到44万余票。在公众投票与专家评委投票加权计算后，“玉兔二号”以高分入选，月球车于2019年1月3日正式命名为“玉兔二号”。
