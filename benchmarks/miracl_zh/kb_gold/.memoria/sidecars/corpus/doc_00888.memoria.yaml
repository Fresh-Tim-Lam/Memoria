  name: 中国国家铁路集团
  tags:
  - 中国国家铁路集团
  description: 中国国家铁路集团有限公司成立于2019年6月18日，其前身为中华人民共和国铁道部及中国铁路总公司。现由国家铁路局依法对公司进行行业监管。2022年時，中国国家铁路集团有限公司管辖铁路里程超14萬公里，职工總數超200万人。
