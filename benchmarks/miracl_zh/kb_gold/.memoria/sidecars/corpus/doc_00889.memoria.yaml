  description: 联合国秘书处大楼（）位于美国纽约市曼哈顿中城，高154米，是联合国总部大楼的中心，也是纽约市第一座使用玻璃幕墙的摩天大楼。该建筑所在地块被认定为联合国领土，但仍是美国的一部分。
