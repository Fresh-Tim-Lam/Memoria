  name: 美國基督教
  tags:
  - 美國基督教
  description: 美國的基督教教派通常分為三大類：福音派新教、主流新教和天主教會。也有基督教教派不屬於這些群體中的任何一個，例如正教會和東方正統教會，但它們要小得多。
