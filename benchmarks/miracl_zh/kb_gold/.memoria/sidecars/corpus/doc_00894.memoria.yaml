  description: 美国经典剧目剧团最初的27名成员包括勒内·奥贝若努瓦斯、彼得·多纳特、理查德·迪萨特、迈克尔·科巴特、鲁思·科巴特、保罗·谢纳、查尔斯·西伯特、肯·鲁塔和基蒂·温等人。鲍尔在1970年代中期创作的莎士比亚的《驯悍记》,
    主演马克·辛格，以及罗斯坦德的《西拉诺·德·伯杰拉克》，由彼得·多纳特和玛莎·曼森主演，均由公共广播电视公司转播。
