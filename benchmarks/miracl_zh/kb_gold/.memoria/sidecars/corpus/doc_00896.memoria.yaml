  name: 独立
  tags:
  - 独立
  description: 现在全世界有193个主权国家是联合国成员国，对内具有统治权，对外具有外交和自卫权，能够与其他国家进行平等合作关系；同时，有2个国家的治理机构是联合国大会观察员，即：巴勒斯坦（法理上，统治巴勒斯坦地区）和圣座（位于梵蒂冈城的天主教最高权力机构）。
