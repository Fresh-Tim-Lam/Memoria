- id: 6840446#2
  name: 只写语言
  tags:
  - 只写语言
  description: 被戏称为只写语言的编程语言有APL、（DDT）、Perl、Forth、（TECO）、Mathematica、IGOR Pro和各种语言中使用的正则表达式语法。这些语言的共同属性包括大量的操作符集和鼓励或至少允许编写非常密集的代码的语法。有些语法与其他语言非常不同，有些使用不同的字符集。
