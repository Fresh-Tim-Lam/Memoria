  description: 除了家用电器等家用产品外，以下公司还以生产社会基础设施的电气产品为特色，例如电力设备、运输设备和工业设备。与中国和韩国公司的竞争非常激烈，三星，LG，海尔和其他公司的竞争也很激烈。目前夏普已属于台湾鸿海集团。
