- id: 6885671#10
  name: 多首都國家
  tags:
  - 多首都國家
  description: 馬尼拉是菲律賓正式首都，菲律賓政府的行政及政治中心廣泛分佈於馬尼拉大都會。馬拉坎南宮，政府的行政中心以及大樓，國家的司法中心都位於馬尼拉本部，而立法部門位於都會區內的另外兩座城市，眾議院在奎松市而則在帕賽市。
