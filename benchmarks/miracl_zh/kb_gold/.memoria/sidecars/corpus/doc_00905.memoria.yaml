      snippet: 及多个电影节晚会。此外，周深还曾在音乐网剧和舞台剧中客串出演自己，并且参加过多个电台广播节目。 包括直播和录播节目中现场演唱的歌曲，不包括已经罗列在发行的专辑、录音室单曲、影视歌曲和其他录音室歌曲列表中的歌曲。只记录首次公开正式演唱的时间。
