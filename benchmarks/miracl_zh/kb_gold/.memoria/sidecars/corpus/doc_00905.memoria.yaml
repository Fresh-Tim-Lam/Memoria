  name: 周深媒体作品列表
  tags:
  - 周深媒体作品列表
  description: 从2014年7月参加《中国好声音》开始，周深参与了《蒙面唱将猜猜猜》、《我们的歌》、《歌手》等重要音乐综艺，以及《了不起的长城》、《新手驾到》等文化真人秀节目，并在《唱给世界听》、《创造营2021》等音乐类节目中担任导师。周深参加了《2021年中央广播电视总台春节联欢晚会》等各种晚会，及多个电影节晚会。此外，周深还曾在音乐网剧和舞台剧中客串出演自己，并且参加过多个电台广播节目。
    包括直播和录播节目中现场演唱的歌曲，不包括已经罗列在发行的专辑、录音室单曲、影视歌曲和其他录音室歌
  range:
    start:
      line_hint: 1
      snippet: 周深媒体作品列表
