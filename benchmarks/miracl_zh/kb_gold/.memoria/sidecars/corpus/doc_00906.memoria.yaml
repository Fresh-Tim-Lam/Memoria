- id: 6949350#1
  name: 哲學大綱
  tags:
  - 哲學大綱
  description: 哲学是研究关于如存在、价值、理性、心灵、语言的普遍和基础的学问。它不同于别的研究这种基础性问题的东西（如神秘主義、迷思或宗教），因为它具有批判性，有系统的研究方法，而且依赖理性论证。它包含了对语言的逻辑分析，对词语和概念的意义的澄清，是一套观念，关于生命和宇宙的信念，而这些恰恰是我们常常不假思索地相信着的。“哲学”一词，来自希腊语“菲罗索非亚”（φιλοσοφία），字面意义是“爱智慧”。
