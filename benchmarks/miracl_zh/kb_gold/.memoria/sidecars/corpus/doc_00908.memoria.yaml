- id: 6997631#0
  name: 周深音樂作品列表
  tags:
  - 周深音樂作品列表
  description: 華語流行歌手周深，截至2022年2月26日，正式发表137首个人录音室歌曲，此外有合作歌曲及現場歌曲一百余首，合计共两百多首正式在音乐平台发布的歌曲。其中《大魚》、《和光同尘》等十二首歌曲及演唱会《晚安
    明天见》獲得頒獎典禮獎項，《茧》、《Rubia》等三十八首歌曲、一張專輯《深的深》獲得其它獎項，《梅香如故》等七首合唱歌曲獲得合唱獎項。根據中國中央電視台的記錄，《胡同少年誌》等九首獲得了全球中文音樂榜上榜周榜冠軍，《不再流浪》更是打破了榜上榜直播六年以來直播時段的得票記錄。
  range:
    start:
      line_hint: 1
      snippet: 周深音樂作品列表
    end:
      line_hint: 3
      snippet: 影OST综合得分最高纪录保持者（《悬崖之上》96.26分），拥有最多90分以上高分歌曲的歌手（25首），五大维度推荐得分最高纪录保持者（《生活总该迎着光亮》95.39分），剧集OST综合得分最高纪录保持者（《My
        Only》97.98分）。
