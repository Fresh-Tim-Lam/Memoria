- id: 6997631#1
  name: 周深音樂作品列表
  tags:
  - 周深音樂作品列表
  description: 個人錄音室專輯《深的深》中收錄的歌曲《玫瑰與小鹿》、《藍色降落傘》與《大魚》均為獲獎作品。 周深與唐漢霄現場合唱的歌曲《末日飛船》為獲獎作品，後在錄音室重新編曲演唱錄制後，收錄於迷你專輯。
    2021年周深共发表录音室歌曲45首，其中3首为周深工作室出品，3首为公益歌曲，25首为影视歌曲。《繁星璀璨的天空》、《光亮》为获奖作品。 《和光同尘》為獲獎作品。
    《此生惟妳》、《蛻》、《隨風》、《触不可及》為獲獎作品。 《梅香如故》、《緣起》、《花開》為獲獎作品。 《大魚》為獲獎作品。
  range:
    start:
      line_hint: 1
      snippet: 周深音樂作品列表
    end:
      line_hint: 3
      snippet: 曲。若有录音室版本的歌曲，现场演唱就不再列出，否则重复次数太多。 周深在综艺节目个人现场翻唱并且在音乐平台上线的歌曲，不包含合唱歌曲。在综艺节目中播出但是未在音乐平台上线的歌曲，不在此列表中。未曾在综艺节目中播出的上线歌曲，亦不在此列表中。
