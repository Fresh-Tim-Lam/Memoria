- id: 7016632#5
  name: 英雄联盟：激斗峡谷
  tags:
  - 英雄联盟：激斗峡谷
  description: 2015年，腾讯与其旗下拳头公司接触，要求他们将热门游戏《英雄联盟》转变为手机版。但是，拳头拒绝并声称不能在智能手机上复制英雄联盟的游戏玩法。腾讯随后着手自行开发手机游戏《王者荣耀》，并初步翻译为“Honor
    of Kings”，同时将国际版取名为“《传说对决》”。
  range:
    start:
