- id: 7022587#8
  name: 中国行星探测工程
  tags:
  - 中国行星探测工程
  description: 首次任务天问一号于2020年7月23日在海南文昌航天发射场由长征五号运载火箭成功发射，探测器于2021年2月10日成功进入环火轨道。2021年5月15日7时18分，天问一号着陆器携带祝融号火星车成功着陆于火星乌托邦平原南部预选着陆区。5月22日10时40分，祝融号火星车安全驶离着陆平台，到达火星表面，开始巡视探测。6月11日，国家航天局公布了由祝融号火星车拍摄的首批高清科学影像图并宣布中国首次火星探测任务，同时也是中国行星探测工程的首次任务取得圆满成功。
