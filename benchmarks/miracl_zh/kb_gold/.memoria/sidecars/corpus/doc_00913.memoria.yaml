      snippet: 南部预选着陆区。5月22日10时40分，祝融号火星车安全驶离着陆平台，到达火星表面，开始巡视探测。6月11日，国家航天局公布了由祝融号火星车拍摄的首批高清科学影像图并宣布中国首次火星探测任务，同时也是中国行星探测工程的首次任务取得圆满成功。
