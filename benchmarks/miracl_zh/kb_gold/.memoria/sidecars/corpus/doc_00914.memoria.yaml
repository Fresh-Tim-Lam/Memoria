  name: 道格拉斯·麦克阿瑟
  tags:
  - 道格拉斯·麦克阿瑟
  description: 作為一位軍事將領，麥克阿瑟同樣有著褒貶不一的評價，美國軍事歷史學家稱麥克阿瑟是個有著「嚴重性格缺陷的人」，但仍是「不可多得的傑出人才，能以發散的思維看待問題，有著超常的記憶力，還能快速理解各種細節」，並「比起其他盟軍領導人更能憑直覺把握太平洋戰爭的總體局勢」。與在歐洲戰場作戰的同僚不同，麥克阿瑟在1944年新幾內亞、1945年菲律賓和1950年朝鮮戰場經常是在以寡擊眾的不利條件下，透過機動布署和出其不意取得了多次勝利。美國記者儘管對麥克阿瑟的人品頗有微詞，但也對後者在太平洋的
  range:
    start:
      line_hint: 1
      snippet: 道格拉斯·麦克阿瑟
    end:
      line_hint: 3
      snippet: 遭日軍於菲律賓奇襲、被中國志願軍伏擊等巨大失敗，稱其為美軍最被高估的將領，佩里也引用了一份非正式的網路調查結果，其指麥克阿瑟為美國史上最差勁的將軍，排在班尼狄·阿諾、愛德華·阿爾蒙德、、威廉·魏摩蘭、喬治·B·麥克萊倫、與霍雷肖·蓋茨之前。
