  description: 舉尾家蟻會分工，在巢內工作的個體體型和頭寬較小，在巢外工作的個體體型和頭寬則較大。有些 Orthocrema 亞屬的物種，如 "Crematogaster
    schimmeri", "C. biroi, C. pygmaea" ，有專門產卵的階級，產下的未受精卵會被幼蟲吃掉。
