- id: 7092780#6
  name: 少年Jump+
  tags:
  - 少年Jump+
  description: 集英社亦嘗試發掘國際市場，於2019年1月28日開設國際版網上漫畫平台「Manga Plus」，免費提供翻譯為英文和西班牙文的漫畫。這項計劃於2017年首次提出，目的在於開拓非日語使用者的讀者市場。同年，集英社跟漫威漫畫合作推出《漫威×少年Jump+超級合作企劃》（），內含7篇短篇漫畫均由《週刊少年Jump》漫畫家所創作，包括《遊戲王》作者高橋和希。其中《死侍：SAMURAI》在2020年12月起在少年Jump+上連載。
