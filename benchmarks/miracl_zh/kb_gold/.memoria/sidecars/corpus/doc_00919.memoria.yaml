- id: 7118554#1
  name: 德語地理分佈
  tags:
  - 德語地理分佈
  description: 對於德語的人口統計，一定程度上在乎於對德語定義，例如低地德語被認爲是獨立語言或者是德語的方言。但一般而言，估計全球有德語母語人口9000萬至9500萬人，另外1000萬至2500萬以德語爲第二語言，7500萬至1億人以德語爲外語。加上所有類型的德語使用者，全球大概有德語人口1.75億至2.2億人。
  range:
    start:
