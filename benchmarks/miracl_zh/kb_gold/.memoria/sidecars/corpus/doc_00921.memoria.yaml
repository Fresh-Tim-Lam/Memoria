- id: 7125520#3
  name: 赵龙 (1967年)
  tags:
  - 赵龙
  - (1967年)
  description: 2020年7月，赵龙离开长期工作的国土资源系统，外放福建，出任中共福建省委常委，省政府副省长、党组副书记。2021年1月，在胡昌升升任黑龙江省长后，赵龙接任厦门市委书记。2021年4月1日，不再兼任常务副省长职务。10月，赵龙再获晋升，出任福建省委副书记、代省长，系时任最年轻的省级行政区政府一把手、第二年轻的省部级正职官员。2022年1月25日，当选为福建省人民政府省长。
