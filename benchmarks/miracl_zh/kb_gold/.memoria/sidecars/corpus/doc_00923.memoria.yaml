  name: 第二次世界大战概览列表
  tags:
  - 第二次世界大战概览列表
  description: 第二次世界大战，简称二战。是一次在1939年至1945年所爆发的全球军事冲突，整场战争涉及到全球绝大多数的国家，包括所有的大国，并最终分成两个彼此对立的军事同盟─同盟国和轴心国。这次战争是人类史上规模最大的战争，动员1亿多名军人参与这次军事冲突。第二次世界大战也是有纪录以来最多大规模民众死亡的军事冲突，全部将近有6900万人因而死亡，让第二次世界大战成了人类历史上死伤人数最多的战争第二次世界大战起因
    纳粹大屠杀 第二次世界大战参战国
