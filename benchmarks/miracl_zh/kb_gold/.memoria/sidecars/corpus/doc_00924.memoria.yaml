  name: 2019冠狀病毒病疫情对旅游业的影响
  tags:
  - 2019冠狀病毒病疫情对旅游业的影响
  description: 2020年3月16日当日，旅游部门，艺术部门和文化部门宣布，马来西亚周边的几个旅游景点将关闭至2020年3月30日，其中包括游客中心，国家美术馆（National
    Arts Gallery），手工艺品中心，玲珑谷地考古遗址内的博物馆（Lenggong Archaeological Museum），马来西亚国家档案馆（National
    Archives of Malaysia）以及马来西亚国家图书馆（National Library of Malaysia）。
