  name: 本杰明·哈里森五世
  tags:
  - 本杰明·哈里森五世
  description: 作为弗吉尼亚参加大陆会议的代表和全体委员会主席，哈里森出席并主持了《独立宣言》的最后辩论。该宣言包括美国的基本理念：“我们认为这些真理是不言而喻的，人人生而平等，享有造物主赋予他们某些不可剥夺的权利，包括生命，自由和追求幸福的权利。”哈里森是1776年美国独立宣言的签署者之一。
