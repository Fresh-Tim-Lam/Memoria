- id: 7247592#0
  name: 2012年英國內閣改組
  tags:
  - 2012年英國內閣改組
  description: 英國首相戴维·卡梅伦在2012年9月14日改組聯合內閣，是上任近兩年半後首次。由於甘民樂未有如1990年代和2000年代時的政府般定期改組，因此外界高度關注是次人事變動。他的閣僚大多在2010年上任前的上任，部分更已在任數載，如凌士禮自04年起負責衛生事務，迈克尔·霍华德更曾領導。惟礙於，甘民樂只可改組隸屬己黨的職位，其餘自民黨出任的職位不在其控制範圍。而且甘民樂私底下亦對改組內閣反感，認為改組內閣令大臣要熟習新環境，繼而減低工作效率，因此內閣重臣定不可換人。
