  tags:
  - 1991年歐洲歌唱大賽
  description: 羅馬是意大利的首都，也是一個特殊的公社（名稱為“Comune di Roma Capitale”，羅馬首都自治市）。羅馬還是拉齊奧的首府。奇尼奇塔的15號工作室是羅馬中的一個大型電影製片廠，後來被確認為新場地。它是歐洲最大的電影製片廠，面積達40萬平方米，被認為是義大利電影院的中心。這些電影製片廠是在期間興建的，目的是復興義大利電影業。
