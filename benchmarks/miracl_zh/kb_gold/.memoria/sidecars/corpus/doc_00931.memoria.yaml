  name: 川茶
  tags:
  - 川茶
  description: 2017年杭州首届中国国际茶叶博览会上，蒙顶山茶入选“中国十大茶叶品牌”，这是继1958年之后由中国农业部组织的第二次十大名茶评选。四川还栽培有一些地方特有的茶树品种，包括崇州枇杷茶、古蔺牛皮茶、筠连早白尖、南江大叶茶等。
