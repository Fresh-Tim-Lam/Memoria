      snippet: 统选举第一轮投票将于2022年4月8日至23日举行，第二轮将在第一轮的两周后举行。若没有候选人在第一轮投票中获得多数票，两周后将在前两名候选人之间进行决赛。法国现任总统为埃马纽埃尔·马克龙，他赢得2017年大选，任期至2022年5月13日。
