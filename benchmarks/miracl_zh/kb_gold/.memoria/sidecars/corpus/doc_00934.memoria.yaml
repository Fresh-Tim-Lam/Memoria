  name: 2021年新疆棉花争议事件
  tags:
  - 2021年新疆棉花争议事件
  description: 2020年12月17日，英國廣播公司（BBC）以標題為《新疆採棉工：新证据揭露时尚产业背后的强迫劳动》報導有數十萬維吾爾族及其他少數民族人群在新疆廣闊的棉田中從事艱苦的體力勞動，而在圍牆及鐵絲網內的新疆再教育營設有數百家工廠，營地和工廠形成一個大型工廠綜合體，當記者在公共道路拍攝建築群的外圍時，被沒有標示的車輛尾隨跟踪，並多次遭到不同身份的人員上前阻攔。報導內容又寫道：「新疆的棉花種植業過去一直依賴來自中國其他省份的季節性農民工，儘管文件中聲稱工資水平可以達到每月5000元人
  range:
    start:
      line_hint: 1
      snippet: 2021年新疆棉花争议事件
    end:
      line_hint: 3
      snippet: 大量的“拾花工”，並訪-{}-問了BBC声称阻碍拍摄的“政府官员”，实为石榴籽公司雇來的后勤安保部部长，保安人员认为BBC沒有遵守該廠相關的規定強闖他才出來阻止，因為疫情期間他有责任保护工厂區域的衛生與安全，对BBC侵犯他的肖像权表示气愤。
