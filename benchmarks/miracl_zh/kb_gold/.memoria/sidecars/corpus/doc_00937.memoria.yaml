  description: 俄罗斯族是中华人民共和国政府认定的55个少数民族之一，散居在新疆维吾尔自治区北部的伊犁、塔城、阿勒泰和乌鲁木齐等地，也有部份散居在黑龙江省和内蒙古自治区东部等地，通用俄罗斯语和汉语。根据2010年的第六次全国人口普查数据，俄罗斯族约有15,393人。历经时代变迁，和大范围、长期跨族通婚，族群血统已经由俄罗斯人转变为华俄混血。在俄罗斯的华人华侨以新移民为绝大多数，在俄的华人75%以商业贸易为主，流动性非常大，其具体数量也难以给出准确的数字，不过根据俄罗斯官方统计，真正拥有俄罗斯
