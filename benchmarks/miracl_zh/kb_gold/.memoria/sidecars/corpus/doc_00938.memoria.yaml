- id: 7496746#1
  name: 馬來西亞國家基建公司
  tags:
  - 馬來西亞國家基建公司
  description: 2003年国家基建内部进行了一次重组活动，以进一步提高该公司作为城市公共交通服务商的地位及增加盈利。随后国家基建成立了五个新的子公司，每个子公司会专门从事不同关键领域的业务，分别为快捷通轨道（Rapid
    Rail）、快捷通巴士（Rapid Bus）、国家基建管理和工程服务（PRIME）、国家基建综合发展（PRIDE）、国家基建轨道和基础设施工程（PRIASE）和国家基建综合解决方案和管理（PRISM）六个私人有限公司。
