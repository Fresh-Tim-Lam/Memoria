- id: 7509574#0
  name: 执法人员
  tags:
  - 执法人员
  description: 執法人員是指执行法律的公共部门的雇员、國家機關和政府的公務員。一般警察、城管、海關人員、特別警察、特别调查员、检察官、特工、边境巡逻员、執達吏、治安官、獄警、校园警察等都屬於執法人員。警卫或保安是平民，因此他們不是执法人员，除非他们被授予执行特定法律的权力。
  range:
    start:
