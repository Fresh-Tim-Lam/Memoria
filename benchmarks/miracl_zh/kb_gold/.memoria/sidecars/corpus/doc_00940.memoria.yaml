- id: 7525103#0
  name: 语言便利市镇
  tags:
  - 语言便利市镇
  description: 在比利时，语言便利市镇（；；）指的是市政部门会为居民提供除当地官方语言以外的其他比利时官方语言服务（荷蘭語、法语、德语中的一者或两者）的市镇。比利时有27个语言便利全面的市镇，加上3个仅在教育方面有语言便利的市镇，共计30个语言便利市镇。布鲁塞尔首都大区有自己的双语法规（法语/荷兰语），因此该大区的市镇不属于语言便利市镇。除此之外，比利时其它所有市镇均为单语服务市镇。
  range:
    start:
      line_hint: 1
      snippet: 语言便利市镇
    end:
      line_hint: 3
      snippet: 者）的市镇。比利时有27个语言便利全面的市镇，加上3个仅在教育方面有语言便利的市镇，共计30个语言便利市镇。布鲁塞尔首都大区有自己的双语法规（法语/荷兰语），因此该大区的市镇不属于语言便利市镇。除此之外，比利时其它所有市镇均为单语服务市镇。
