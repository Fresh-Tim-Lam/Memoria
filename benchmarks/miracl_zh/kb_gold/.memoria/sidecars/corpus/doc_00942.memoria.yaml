      snippet: 中华人民共和国方面将陳水扁定位为法理台独的推进者。执政期间，陈水扁政府提出中華民國是臺灣，并于2006年废止國家統一綱領。而此前一年通过第七次中華民國憲法增修條文后，《中華民國憲法》的修憲及領土變更程序由國民大會複決，改为自由地區公民複決。
