  description: “发现计划”是1990年底设立的一项低成本、有限范围的太阳系探测任务计划，它承继了“行星观察者计划”的目标。20世纪80年代末， NASA
    选择了昂贵且更具雄心的任务来推进他们的目标，包括乔治·赫伯特·沃克·布什政府制定的建造自由号空间站和载人探索月球和火星的计划。然而，持续的成本超支和缺乏国会的支持，导致了任务项目小型化的趋势。
    NASA 太阳系探索处（SSED）最初提议在行星探索者计划之后设立一项小型无人任务的新计划，根据探索者项目管理员汤姆· 克里米吉斯（Tom Kri
