  description: 2019年1月20日，蘇睿勇在2019年沙特阿美休斯顿半程马拉松赛上创造了用时66:46的半程马拉松全国新纪录，打破了莫英仁保持了3年的用时67:08的纪录。这使他成为历史上唯一一位同时保持
    10,000m (31:15.95) 和半程马拉松国家纪录的新加坡人。
