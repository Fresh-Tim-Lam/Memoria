- id: 7659288#24
  name: 台灣農業
  tags:
  - 台灣農業
  description: 2013年台湾水果總產量為268万公吨，總產值1.91亿美元，種植面積為1844平方公里。台灣主要栽種香蕉、葡萄、番石榴、枣、荔枝、柑橘、芒果、橙子、木瓜、菠萝、柚子、沙梨、火龙果、楊桃、草莓、西瓜和蓮霧等水果。台湾年出口6万公吨總价值達34.52亿新台币的水果。2018年進口台灣水果最多的是中国大陆。
