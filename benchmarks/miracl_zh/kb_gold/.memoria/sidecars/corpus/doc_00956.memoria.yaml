  description: 中华民国建国后开始派遣驻西班牙公使，至1940年9月13日驻西班牙公使馆结束。1931年4月14日，西班牙共和国取代了西班牙王国。1939年1月26日，弗朗西斯科·佛朗哥在西班牙内战中获胜，建立西班牙国。
