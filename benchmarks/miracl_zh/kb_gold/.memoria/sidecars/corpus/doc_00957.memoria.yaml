  name: 泰格拉·洛鲁佩
  tags:
  - 泰格拉·洛鲁佩
  description: 泰格拉·切普克特·洛鲁佩（），肯尼亚长跑运动员、路跑者，全球和平、女权和教育的发言人。25000米和30000的世界纪录保持者，此前还保持着世界马拉松纪录。她是第一位保持马拉松世界纪录的非洲女性，她从1998年4月19日一直保持到2001年9月30日。她是三届世界半程馬拉松錦標賽冠军。还是第一位赢得纽约马拉松比赛的非洲女性，她曾两次赢得该比赛。她曾在伦敦、鹿特丹、香港、柏林和罗马赢得马拉松比赛。
