  name: 西藏汉化政策
  tags:
  - 西藏汉化政策
  description: 1992年，拉萨的常住人口估计略低于14万，包括96,431名藏族人，40,387名汉族人，以及2,998名回族和其他民族。此外，还有60,000-80,000名游客或临时居民，他们主要是前来西藏的朝圣者和商人；同年，西藏自治区总人口达到225.27万人，其中藏族人口216.80万人，占总人口的96.2%。2000年，根据第五次全国人口普查，拉萨市常住人口为47.45万人；同年，西藏自治区总人口达到251.23万，其中藏族人口242.18万，占总人口的96.4%。
