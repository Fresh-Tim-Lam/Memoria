      snippet: 游览人数最多的是巴黎现代艺术博物馆，主要收藏当代作品，2008年招待有80万人。在巴黎之外，全部大城市都拥有一座收藏法国及欧洲画作的美术博物馆。这其中最为著名的有里昂美术馆、里尔美术宫、鲁昂美术馆、第戎美术馆、雷恩美术馆和格勒诺布尔美术馆。
