  description: 在法国博物馆中，雕塑和绘画是主要藏品，一些博物馆只收集雕塑和绘画作品。国有的卢浮宫博物馆收藏了大量18世纪前的艺术杰作，例如达芬奇的名作《蒙娜·丽莎》。1986年于旧火车站落成的奥尔赛博物馆收藏有来自19世纪下半叶的艺术作品（主要是印象派和野兽派画作）。现代艺术作品则多收藏于蓬皮杜中心的法国国立现代艺术美术馆。此三家国有博物馆平均每年招待近1700万人。巴黎大皇宫美术馆也是国有博物馆，于2008年共招待有130万人。市立博物馆中，游览人数最多的是巴黎现代艺术博物馆，主要收藏当
  range:
