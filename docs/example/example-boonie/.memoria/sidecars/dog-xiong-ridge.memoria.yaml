- id: gou-xiong-ling
  name: 狗熊岭
  range:
    start:
      snippet: '## 狗熊岭'
      line_hint: 1
    end:
      snippet: '[[狗熊岭]]是《熊出没》的主要故事发生地：森林、河流与山洞交织，既是[[光头强]]的伐木区，也是[[熊大]]、[[熊二]]的家园。'
      line_hint: 3
- id: big-forest
  name: 大森林
  range:
    start:
      snippet: '## 大森林'
      line_hint: 14
    end:
      snippet: '[[狗熊岭]]深处的[[大森林]]是动物们的家园。[[熊兄弟]]与[[光头强]]关于伐木与保护的冲突，常发生在这片森林。'
      line_hint: 16
- id: forest-ranger
  name: 护林员
  range:
    start:
      snippet: '### 护林员'
      line_hint: 18
    end:
      snippet: 部分剧集中[[光头强]]曾短暂担任护林员，与[[熊兄弟]]站在同一侧保护[[大森林]]。
      line_hint: 20
