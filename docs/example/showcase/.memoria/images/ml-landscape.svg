  <rect x="175" y="184" width="0" height="0"/>
  <text x="175" y="200" text-anchor="middle" font-size="12" fill="#6b7a99">线性回归 / 逻辑回归</text>
  <text x="175" y="222" text-anchor="middle" font-size="12" fill="#6b7a99">决策树 / 随机森林 / GBDT</text>
