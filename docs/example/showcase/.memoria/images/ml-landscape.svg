  <rect x="345" y="70" width="270" height="250" rx="12" fill="#e9f9ef" stroke="#3aa866" stroke-width="2"/>
  <text x="480" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e6b3c">无监督学习</text>
  <text x="480" y="134" text-anchor="middle" font-size="13" fill="#2f6b45">无标签数据</text>
