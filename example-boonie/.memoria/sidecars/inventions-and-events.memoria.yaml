  name: 超级伐木机
  range:
    start:
      snippet: '## 超级伐木机'
      line_hint: 1
    end:
      snippet: '[[光头强]]驾驶[[超级伐木机]]欲清空山坡，[[熊兄弟]]几乎无计可施；机器最终因过载自毁。'
      line_hint: 3
- id: shrink-ray
  name: 缩小射线
  range:
    start:
      snippet: '## 缩小射线'
      line_hint: 5
    end:
      snippet: '[[缩小射线]]把[[光头强]]与[[熊兄弟]]缩小，草丛变丛林。二人合作后才恢复原状。'
      line_hint: 7
- id: ufo-crash
  name: 飞碟坠落事件
  range:
    start:
      snippet: '## 飞碟坠落事件'
      line_hint: 9
    end:
      snippet: '[[飞碟]]坠毁在[[狗熊岭]]，[[光头强]]试图修复却引发能量事故，飞碟彻底报废。'
      line_hint: 11
- id: qiang-xiong-rivalry
  name: 强熊对立
  range:
    start:
      snippet: '## 强熊对立'
      line_hint: 13
    end:
      snippet: '[[强熊对立]]是[[光头强]]伐木与[[熊兄弟]]护林之间的常态冲突，也是喜剧与温情的来源。'
      line_hint: 15
