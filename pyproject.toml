[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
dynamic = ["version"]
description = "Local knowledge-graph IDE with offline retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "PyYAML>=6.0",
    "jieba>=0.42",
    "bottle>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
benchmark = ["certifi>=2024.0"]
semantic = ["sentence-transformers>=3.0"]
search = ["pypinyin>=0.50"]

[project.scripts]
memoria = "memoria.cli.main:main"
memoria-m0 = "memoria.app.desktop:main"
memoria-build = "memoria.app.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "memoria.__version__.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
