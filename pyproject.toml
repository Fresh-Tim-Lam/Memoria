[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
dynamic = ["version"]
description = "Local knowledge-graph IDE with offline retrieval: Markdown notes with wiki-links, knowledge points, highlighters, LaTeX math, Mermaid diagrams and 2D/3D graph visualization."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# 说明：PEP 639 起 License classifier 与 SPDX license expression 互斥；
# setuptools>=77 会直接拒绝同时出现（实测 InvalidConfigError）⇒ 只保留 SPDX expression。
dependencies = [
    "pywebview>=5.0",
    "PyYAML>=6.0",
    "jieba>=0.42",
    "bottle>=0.12",
    "markitdown[pdf, docx]>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
benchmark = ["certifi>=2024.0"]
# 语义检索运行时依赖为 torch + transformers（embedding_provider 自实现均值池化，
# 不再需要 sentence-transformers，避免其拉入 TensorFlow/Keras 兼容链）
semantic = ["torch>=2.0", "transformers>=4.30"]
search = ["pypinyin>=0.50"]

[project.scripts]
memoria = "memoria.cli.main:main"
memoria-desktop = "memoria.app.desktop:main"
memoria-build = "memoria.app.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "memoria.__version__.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
