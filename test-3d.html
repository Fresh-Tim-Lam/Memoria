<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 弹性力导向关系图谱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0d1117; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container.grabbing { cursor: grabbing; }
        #canvas-container.dragging-node { cursor: move; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #c9d1d9;
            background: rgba(13, 17, 23, 0.85);
            padding: 16px 22px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #30363d;
            line-height: 1.8;
        }
        #info h3 { color: #58a6ff; margin-bottom: 8px; font-size: 15px; }
        .param-label { display: block; }
        .param-value { color: #4ec9b0; font-weight: bold; }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #c9d1d9;
            background: rgba(13, 17, 23, 0.85);
            padding: 16px 22px;
            border-radius: 10px;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #30363d;
            line-height: 1.8;
        }
        #stats h3 { color: #58a6ff; margin-bottom: 8px; font-size: 15px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h3>操作说明</h3>
        <span class="param-label">左键空白处拖拽：旋转视角</span>
        <span class="param-label">右键拖拽：平移视角</span>
        <span class="param-label">滚轮：缩放</span>
        <span class="param-label">左键按住节点拖拽：移动节点</span>
    </div>
    <div id="stats">
        <h3>运行状态</h3>
        <span class="param-label">节点数：<span class="param-value" id="node-count">0</span></span>
        <span class="param-label">连线数：<span class="param-value" id="link-count">0</span></span>
        <span class="param-label">FPS：<span class="param-value" id="fps">60</span></span>
        <span class="param-label">Alpha：<span class="param-value" id="alpha">1.0</span></span>
    </div>

    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls 必须单独引入，与 three.js 版本匹配 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- d3-force-3d：经过验证的 3D 力导向物理引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/d3-force-3d@3.0.3/dist/d3-force-3d.min.js"></script>

    <script>
        // ============================================================
        //  可调参数区（所有物理、视觉、交互参数集中管理）
        // ============================================================
        const config = {
            // --- 弹簧力参数 ---
            springStrength: 0.1,        // 弹簧劲度系数（越大越硬，0~1）
            springLength: 180,          // 弹簧静止长度（像素单位）

            // --- 多体斥力参数 ---
            repulsionStrength: -600,   // 节点间排斥力（负数=排斥，绝对值越大排斥越强）

            // --- 阻尼/惯性参数 ---
            velocityDecay: 0.4,        // 速度衰减（0~1，越大衰减越快，运动越"粘"）
            // 注意：d3 的 velocityDecay = 1 - 阻尼系数
            // velocityDecay=0.4 对应阻尼=0.6，节点有惯性但不会永远运动

            // --- 中心引力参数 ---
            centerStrength: 0.02,      // 中心引力强度（越大越聚拢）

            // --- 碰撞参数 ---
            collisionRadius: 18,       // 节点碰撞半径

            // --- 视觉参数 ---
            nodeRadius: 10,            // 节点渲染半径
            nodeSegments: 20,          // 球体分段数（越大越圆滑）
            edgeColor: 0x58a6ff,       // 连线颜色
            edgeOpacity: 0.4,          // 连线透明度
            dragHighlightColor: 0xff6b6b, // 拖拽高亮颜色

            // --- 布局参数 ---
            initialSpread: 400,        // 初始随机散布范围

            // --- 交互参数 ---
            dragAlphaTarget: 0.3,      // 拖拽时 alpha 目标值（越大弹簧越活跃）
        };

        // ============================================================
        //  全局变量
        // ============================================================
        let scene, camera, renderer, controls;
        let nodeGroup, edgeLine;
        let nodes = [], links = [];
        let simulation;
        let raycaster, mouse;
        let draggingNode = null;
        let dragPlane;
        let container;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        // ============================================================
        //  初始化
        // ============================================================
        init();
        animate();

        function init() {
            container = document.getElementById('canvas-container');

            // --- Three.js 场景 ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d1117);
            scene.fog = new THREE.Fog(0x0d1117, 800, 2500);

            // --- 相机 ---
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                5000
            );
            camera.position.set(600, 500, 800);
            camera.lookAt(0, 0, 0);

            // --- 渲染器 ---
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // --- OrbitControls：视角旋转控制 ---
            // 仅作用于空白处，拖拽节点时会自动禁用
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;       // 启用阻尼，旋转更平滑
            controls.dampingFactor = 0.08;       // 阻尼系数
            controls.rotateSpeed = 0.6;          // 旋转速度
            controls.minDistance = 200;          // 最小缩放距离
            controls.maxDistance = 2500;         // 最大缩放距离
            controls.target.set(0, 0, 0);        // 旋转中心固定在原点

            // --- 灯光 ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(500, 800, 600);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x58a6ff, 0.5, 2000);
            pointLight.position.set(-500, 300, -500);
            scene.add(pointLight);

            // --- 参考网格（地面） ---
            const grid = new THREE.GridHelper(2000, 40, 0x30363d, 0x21262d);
            grid.position.y = -400;
            scene.add(grid);

            // --- 射线检测器（用于节点拾取） ---
            raycaster = new THREE.Raycaster();
            raycaster.params.Points.threshold = config.nodeRadius * 2;
            mouse = new THREE.Vector2();

            // --- 拖拽平面（拖拽节点时鼠标投影到 3D 空间） ---
            dragPlane = new THREE.Plane();

            // --- 节点组（所有节点 Mesh 放入此 Group） ---
            nodeGroup = new THREE.Group();
            scene.add(nodeGroup);

            // --- 生成测试数据 ---
            generateTestData();

            // --- 创建 3D 对象 ---
            createNodes();
            createEdges();

            // --- 初始化物理引擎 ---
            initPhysics();

            // --- 绑定交互事件 ---
            setupInteraction();

            // --- 窗口尺寸自适应 ---
            window.addEventListener('resize', onResize);

            // --- 更新统计显示 ---
            document.getElementById('node-count').textContent = nodes.length;
            document.getElementById('link-count').textContent = links.length;
        }

        // ============================================================
        //  测试数据生成
        // ============================================================
        function generateTestData() {
            const nodeCount = 20;
            const linkCount = 35;
            const spread = config.initialSpread;

            // 生成节点，初始位置在 3D 空间随机散布
            for (let i = 0; i < nodeCount; i++) {
                nodes.push({
                    id: i,
                    label: `Node-${i}`,
                    // 初始 3D 位置（重要：必须有 z 坐标）
                    x: (Math.random() - 0.5) * spread,
                    y: (Math.random() - 0.5) * spread,
                    z: (Math.random() - 0.5) * spread,
                    vx: 0, vy: 0, vz: 0,
                    // 每个节点随机颜色（HSL 色彩空间）
                    color: new THREE.Color().setHSL(
                        i / nodeCount,  // 色相均匀分布
                        0.6 + Math.random() * 0.3,
                        0.4 + Math.random() * 0.3
                    ),
                    radius: config.nodeRadius + Math.random() * 6,
                });
            }

            // 生成连线（去重，避免重复边）
            const usedEdges = new Set();
            while (links.length < linkCount) {
                const s = Math.floor(Math.random() * nodeCount);
                const t = Math.floor(Math.random() * nodeCount);
                if (s === t) continue;

                const key = `${Math.min(s, t)}-${Math.max(s, t)}`;
                if (usedEdges.has(key)) continue;
                usedEdges.add(key);

                links.push({
                    source: s,             // 使用索引（与 d3-force 默认匹配）
                    target: t,
                    // 每条边独立弹簧参数（接口需求）
                    distance: config.springLength * (0.6 + Math.random() * 0.8),
                    strength: config.springStrength * (0.5 + Math.random() * 1.0),
                });
            }
        }

        // ============================================================
        //  创建节点 Mesh
        // ============================================================
        function createNodes() {
            const geometry = new THREE.SphereGeometry(
                config.nodeRadius,
                config.nodeSegments,
                config.nodeSegments
            );

            nodes.forEach((node) => {
                // 每个节点独立 Material（便于高亮变色）
                const material = new THREE.MeshPhongMaterial({
                    color: node.color,
                    shininess: 80,
                    transparent: true,
                    opacity: 0.92,
                    emissive: 0x000000,  // 初始无自发光
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(node.x, node.y, node.z);
                // 根据节点半径缩放
                const scale = node.radius / config.nodeRadius;
                mesh.scale.set(scale, scale, scale);
                // 存储 node 引用，射线检测时取出
                mesh.userData.node = node;

                node.mesh = mesh;
                nodeGroup.add(mesh);
            });
        }

        // ============================================================
        //  创建连线（LineSegments + BufferGeometry）
        // ============================================================
        function createEdges() {
            // 每条边 2 个端点，每端点 3 坐标（x,y,z）
            const positions = new Float32Array(links.length * 6);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: config.edgeColor,
                transparent: true,
                opacity: config.edgeOpacity,
            });

            edgeLine = new THREE.LineSegments(geometry, material);
            scene.add(edgeLine);

            // 立即更新一次连线位置
            updateEdgePositions();
        }

        // ============================================================
        //  初始化 d3-force-3d 物理引擎
        // ============================================================
        function initPhysics() {
            simulation = d3.forceSimulation(nodes)
                // 弹簧力：每条边是一个弹簧
                .force('link', d3.forceLink(links)
                    .distance(d => d.distance)
                    .strength(d => d.strength)
                )
                // 多体斥力：节点之间互相排斥（Barnes-Hut 优化）
                .force('charge', d3.forceManyBody()
                    .strength(config.repulsionStrength)
                    .theta(0.9)        // Barnes-Hut 近似阈值
                )
                // 中心引力：防止图漂走
                .force('center', d3.forceCenter(0, 0, 0)
                    .strength(config.centerStrength)
                )
                // 碰撞检测：节点不重叠
                .force('collide', d3.forceCollide()
                    .radius(d => d.radius + 4)
                    .strength(0.7)
                )
                // 速度衰减（阻尼）：velocityDecay 越大，运动停止越快
                .velocityDecay(config.velocityDecay)
                // alpha 衰减：控制模拟"冷却"速度
                .alphaDecay(0.02)
                .alphaMin(0.001)
                .on('tick', onPhysicsTick);
        }

        // ============================================================
        //  物理引擎 tick 回调：更新 3D 位置
        // ============================================================
        function onPhysicsTick() {
            // 更新节点位置
            nodes.forEach(node => {
                if (node.mesh) {
                    node.mesh.position.set(node.x, node.y, node.z);
                }
            });

            // 更新连线位置
            updateEdgePositions();

            // 更新 alpha 显示
            document.getElementById('alpha').textContent =
                simulation.alpha().toFixed(3);
        }

        function updateEdgePositions() {
            const positions = edgeLine.geometry.attributes.position.array;
            for (let i = 0; i < links.length; i++) {
                const link = links[i];
                // d3-force 会将 source/target 替换为节点对象
                const source = typeof link.source === 'object' ? link.source : nodes[link.source];
                const target = typeof link.target === 'object' ? link.target : nodes[link.target];

                const idx = i * 6;
                positions[idx]     = source.x;
                positions[idx + 1] = source.y;
                positions[idx + 2] = source.z;
                positions[idx + 3] = target.x;
                positions[idx + 4] = target.y;
                positions[idx + 5] = target.z;
            }
            edgeLine.geometry.attributes.position.needsUpdate = true;
        }

        // ============================================================
        //  交互事件
        // ============================================================
        function setupInteraction() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', onMouseDown, false);
            canvas.addEventListener('mousemove', onMouseMove, false);
            canvas.addEventListener('mouseup', onMouseUp, false);
            canvas.addEventListener('mouseleave', onMouseUp, false);

            // 触摸支持（移动端）
            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onMouseUp, false);
        }

        function onMouseDown(event) {
            updateMouseFromEvent(event);

            // 射线检测：是否点中了某个节点
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeGroup.children);

            if (hits.length > 0) {
                // --- 命中节点：开始拖拽 ---
                const mesh = hits[0].object;
                draggingNode = mesh.userData.node;

                // 禁用 OrbitControls 旋转，避免冲突
                controls.enabled = false;

                // 设置拖拽平面：垂直于相机视线，经过节点当前位置
                const cameraDir = new THREE.Vector3();
                camera.getWorldDirection(cameraDir);
                const nodePos = new THREE.Vector3(
                    draggingNode.x, draggingNode.y, draggingNode.z
                );
                dragPlane.setFromNormalAndCoplanarPoint(cameraDir, nodePos);

                // 重新加热物理引擎（alphaTarget > 0 让弹簧保持活跃）
                simulation.alphaTarget(config.dragAlphaTarget).restart();

                // 视觉高亮
                mesh.material.emissive.setHex(config.dragHighlightColor);
                mesh.material.emissiveIntensity = 0.6;

                // 更新光标
                container.classList.add('dragging-node');
            }
            // 未命中节点：OrbitControls 自动处理旋转
        }

        function onMouseMove(event) {
            if (!draggingNode) return;

            updateMouseFromEvent(event);
            raycaster.setFromCamera(mouse, camera);

            // 将鼠标射线投影到拖拽平面，得到 3D 坐标
            const intersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
                // 设置节点的固定位置（fx/fy/fz）
                // d3-force 会将 fx/fy/fz 视为"钉住"的位置，
                // 其他连接节点受弹簧力牵引向此位置移动
                draggingNode.fx = intersectPoint.x;
                draggingNode.fy = intersectPoint.y;
                draggingNode.fz = intersectPoint.z;
            }
        }

        function onMouseUp() {
            if (draggingNode) {
                // 释放节点：清除固定位置，弹簧回弹
                draggingNode.fx = null;
                draggingNode.fy = null;
                draggingNode.fz = null;

                // 恢复视觉
                if (draggingNode.mesh) {
                    draggingNode.mesh.material.emissive.setHex(0x000000);
                    draggingNode.mesh.material.emissiveIntensity = 0;
                }

                // 物理引擎逐渐冷却
                simulation.alphaTarget(0);

                draggingNode = null;

                // 恢复 OrbitControls
                controls.enabled = true;

                // 恢复光标
                container.classList.remove('dragging-node');
            }
        }

        // --- 触摸事件适配 ---
        function onTouchStart(event) {
            if (event.touches.length === 1) {
                event.preventDefault();
                const touch = event.touches[0];
                onMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
            }
        }

        function onTouchMove(event) {
            if (event.touches.length === 1 && draggingNode) {
                event.preventDefault();
                const touch = event.touches[0];
                onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
            }
        }

        function updateMouseFromEvent(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }

        // ============================================================
        //  窗口自适应
        // ============================================================
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================================
        //  渲染循环
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            // FPS 计算
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastFpsTime = now;
            }

            // OrbitControls 阻尼更新
            controls.update();

            // 渲染
            renderer.render(scene, camera);
        }

        // ============================================================
        //  暴露 API（方便外部调用）
        // ============================================================
        window.Graph3D = {
            // 更新数据
            updateData(newNodes, newLinks) {
                // 清除旧的
                while (nodeGroup.children.length > 0) {
                    const child = nodeGroup.children[0];
                    nodeGroup.remove(child);
                }
                scene.remove(edgeLine);

                nodes = newNodes;
                links = newLinks;

                createNodes();
                createEdges();
                initPhysics();

                document.getElementById('node-count').textContent = nodes.length;
                document.getElementById('link-count').textContent = links.length;
            },

            // 调整参数（运行时）
            setParam(name, value) {
                config[name] = value;
                // 根据参数名更新对应的力
                if (name === 'springStrength') {
                    simulation.force('link').strength(d => d.strength);
                } else if (name === 'repulsionStrength') {
                    simulation.force('charge').strength(value);
                } else if (name === 'centerStrength') {
                    simulation.force('center').strength(value);
                } else if (name === 'velocityDecay') {
                    simulation.velocityDecay(value);
                }
                simulation.alpha(0.5).restart();
            },

            // 重启模拟
            restart() {
                simulation.alpha(1).restart();
            },
        };
    </script>
</body>
</html>
